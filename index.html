<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1A24">
<title>Front Office — Dynasty Cap Manager</title>
<!-- build 2026-08-14-mascots-nfl -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1A24;          /* deep ink navy field */
  --ink-2:#16232F;        /* panel */
  --ink-3:#1D2E3D;        /* raised */
  --rule:#2A3F52;         /* hairline */
  --rule-soft:#213445;
  --bone:#E9EFF4;         /* primary text */
  --mute:#8CA3B6;         /* secondary text */
  --dim:#5F7387;          /* tertiary */
  --brass:#E5A13C;        /* money / primary accent */
  --brass-dim:#8A6A22;
  --signal:#FF5C39;       /* clock, over cap, danger */
  --sage:#5BC496;         /* under cap, paid, good */
  --chalk:#7FB2D9;        /* info / links */
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  --r:4px;
  --nav-w:232px;
  --disp:"Barlow Condensed", "Oswald", "Arial Narrow", sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--bone);
  font:400 15px/1.5 var(--body);
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
body::before{ /* ledger rule texture, very quiet */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.014) 0 1px, transparent 1px 34px);
}
a{color:var(--chalk);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}

/* ── type ─────────────────────────────────────────────── */
.eyebrow{font:600 12px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
h2{font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:16px;line-height:1.2;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass)}
.muted{color:var(--mute)}
.dim{color:var(--dim)}
.good{color:var(--sage)}
.bad{color:var(--signal)}
.tiny{font-size:12px}
.center{text-align:center}
.right{text-align:right}
.nowrap{white-space:nowrap}

/* ── layout ───────────────────────────────────────────── */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
#rail{
  width:var(--nav-w);flex:0 0 var(--nav-w);border-right:1px solid var(--rule);
  background:linear-gradient(180deg,#132030,#0F1A24 60%);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--rule)}
.brand .mark{display:flex;align-items:baseline;gap:8px}
.brand .mark b{font:700 22px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.brand .mark span{font:600 11px/1 var(--disp);letter-spacing:.2em;color:var(--brass);text-transform:uppercase}
.brand .leaguename{margin-top:8px;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railscroll{overflow-y:auto;flex:1;padding:8px 0 16px}
.navgroup{padding:12px 16px 4px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--mute);
  font-size:14px;border-left:2px solid transparent;
}
.nav a .ic{width:18px;text-align:center;font-size:14px;opacity:.85;flex:0 0 18px}
.nav a:hover{background:rgba(255,255,255,.035);color:var(--bone);text-decoration:none}
.nav a.on{color:var(--bone);background:rgba(229,161,60,.09);border-left-color:var(--brass)}
.nav a .badge{margin-left:auto}
.badge{
  font:500 11px/1 var(--mono);padding:3px 6px;border-radius:999px;
  background:var(--signal);color:#fff;
}
.badge.q{background:var(--rule);color:var(--mute)}
.railfoot{padding:12px 16px;border-top:1px solid var(--rule);font-size:12px;color:var(--dim)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 22px;border-bottom:1px solid var(--rule);
  background:rgba(15,26,36,.93);backdrop-filter:blur(10px);
}
#topbar .spacer{flex:1}
.capchip{display:flex;flex-direction:column;gap:2px;padding:2px 12px;border-left:1px solid var(--rule)}
.capchip .k{font:600 10px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.capchip .v{font:500 15px/1.1 var(--mono)}
#view{padding:22px;max-width:1480px;width:100%}
.section{margin-bottom:30px}
.section>header{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section>header .spacer{flex:1}
.hr{height:1px;background:var(--rule);margin:18px 0}

/* ── panels & grids ───────────────────────────────────── */
.panel{background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--rule-soft)}
.panel>.ph .spacer{flex:1}
.panel>.pb{padding:14px}
.panel>.pb.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

/* ── stat tiles ───────────────────────────────────────── */
.tile{background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);padding:13px 14px}
.tile .k{font:600 10px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tile .v{margin-top:7px;font:500 24px/1 var(--mono);letter-spacing:-.02em}
.tile .s{margin-top:6px;font-size:12px;color:var(--mute)}

/* ── controls ─────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 13px;border:1px solid var(--rule);background:var(--ink-3);color:var(--bone);
  border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:500;
  transition:background .12s,border-color .12s,transform .06s;white-space:nowrap;
}
.btn:hover{background:#25394B;border-color:#375168}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#231704;font-weight:600}
.btn.pri:hover{background:#F2AE49;border-color:#F2AE49}
.btn.danger{background:transparent;border-color:#5C3227;color:var(--signal)}
.btn.danger:hover{background:#3A1E17}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{border-color:var(--brass);color:var(--brass)}

label.f{display:block}
label.f>span, .flabel{
  display:block;margin-bottom:5px;
  font:600 10.5px/1 var(--disp);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],
input[type=tel],input[type=password],input[type=search],input[type=url],select,textarea{
  width:100%;padding:8px 10px;background:#101C27;border:1px solid var(--rule);
  border-radius:var(--r);color:var(--bone);
}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:1}
input[type=number],input.num,td input{font-family:var(--mono)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--brass);outline:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brass);margin:0}
.check{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;line-height:1.35}
.check input{margin-top:2px;flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{padding:6px 11px;background:transparent;border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:12.5px;color:var(--mute)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brass);color:#231704;font-weight:600}
.hint{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.45}

/* ── tables ───────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
th{
  font:600 10.5px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--ink-2);
}
td{padding:8px 10px;border-bottom:1px solid var(--rule-soft);font-size:13.5px;vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.022)}
tr.tot td{border-top:1px solid var(--rule);border-bottom:0;font-weight:600}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pos{
  display:inline-block;min-width:34px;text-align:center;padding:2px 5px;border-radius:3px;
  font:600 10.5px/1.5 var(--disp);letter-spacing:.09em;border:1px solid;
}
.pos.QB{color:#F27E7E;border-color:#5E2F2F;background:#2A1A1A}
.pos.RB{color:#7FD48F;border-color:#2E5537;background:#16281B}
.pos.WR{color:#78B6E8;border-color:#2C4A66;background:#152431}
.pos.TE{color:#E3B05E;border-color:#5C4526;background:#2A2113}
.pos.K{color:#B39CE0;border-color:#453963;background:#1F1B2C}
.pos.DEF,.pos.DST{color:#8FA3B6;border-color:#33475A;background:#1A2532}

/* ── cap ladder (signature) ───────────────────────────── */
.ladder{--yc:6;font-family:var(--mono)}
.ladder .lhead{display:grid;grid-template-columns:190px repeat(var(--yc),minmax(74px,1fr));gap:2px;position:sticky;top:0;background:var(--ink-2);z-index:2}
.ladder .lhead div{padding:8px 6px;font:600 11px/1 var(--disp);letter-spacing:.12em;color:var(--dim);text-align:center;border-bottom:1px solid var(--rule)}
.ladder .lhead div:first-child{text-align:left}
.ladder .lrow{display:grid;grid-template-columns:190px repeat(var(--yc),minmax(74px,1fr));gap:2px;align-items:stretch;border-bottom:1px solid var(--rule-soft)}
.ladder .lname{padding:7px 8px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.ladder .lname .pn{font:500 13px/1.15 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder .lname .pm{font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}
.cell{position:relative;display:flex;align-items:flex-end;padding:4px 3px;min-height:44px}
.cell .bar{
  width:100%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#E5A13C,#B87C22);
  position:relative;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.3,1);
}
.cell.void .bar{background:linear-gradient(180deg,#4A5F72,#33475A)}
.cell .amt{position:absolute;inset:auto 0 4px 0;text-align:center;font-size:10.5px;color:#231704;font-weight:600}
.cell.small .amt{color:var(--brass);bottom:auto;top:2px}
.cell.empty{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.022) 6px 12px)}
.capline{display:grid;grid-template-columns:190px repeat(var(--yc),minmax(74px,1fr));gap:2px;border-top:1px solid var(--rule);margin-top:2px}
.capline>div{padding:8px 6px;text-align:center;font-size:12px}
.capline>div:first-child{text-align:left;font:600 11px/1 var(--disp);letter-spacing:.12em;color:var(--dim);display:flex;align-items:center}
.meter{height:5px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--sage);border-radius:3px;transition:width .4s}
.meter i.over{background:var(--signal)}
.meter i.warn{background:var(--brass)}

/* ── structure sparkline ──────────────────────────────── */
.spark{display:flex;align-items:flex-end;gap:2px;height:26px}
.spark i{flex:1;background:var(--brass);opacity:.85;border-radius:1px 1px 0 0;min-height:2px}
.spark.back i{background:var(--chalk)}
.spark.even i{background:var(--sage)}

/* ── clock ────────────────────────────────────────────── */
.clock{font:600 26px/1 var(--mono);letter-spacing:.02em;color:var(--signal);font-variant-numeric:tabular-nums}
.clock.calm{color:var(--brass)}
.clock.paused{color:var(--dim);position:relative}
.clock.paused::after{content:"";position:absolute;left:0;right:0;top:52%;height:1px;background:repeating-linear-gradient(to right,var(--dim) 0 4px,transparent 4px 8px)}
.pauseflag{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;
  border:1px dashed var(--rule);color:var(--mute);font-size:11.5px;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--rule);font:600 10.5px/1.6 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
}
.pill.live{border-color:#5C3227;color:var(--signal)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal);animation:blink 1.4s infinite}
.pill.ok{border-color:#2E5537;color:var(--sage)}
.pill.warn{border-color:#5C4526;color:var(--brass)}
.pill.waiver{border-color:#4A5F72;color:#9DB4C8;background:#1A2532;letter-spacing:.1em;font-weight:700}
.pill.waiver.dim{opacity:.55}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── misc ─────────────────────────────────────────────── */
.assetbox{border:1px solid var(--rule-soft);border-radius:var(--r);padding:9px 11px;background:#101C27}
.assetbox+.assetbox{margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;background:var(--ink-3);border:1px solid var(--rule);border-radius:999px;font-size:12px;margin:2px 3px 2px 0}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.chip button:hover{color:var(--signal)}
.empty-state{padding:30px 18px;text-align:center;color:var(--dim)}
.empty-state h3{color:var(--mute);margin-bottom:8px}
.log{font-family:var(--mono);font-size:12px;color:var(--mute);max-height:230px;overflow-y:auto}
.log div{padding:4px 0;border-bottom:1px solid var(--rule-soft)}
.feed div{padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:13px}
.feed b{color:var(--bone);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right;font-family:var(--mono)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto;margin-bottom:16px}
.tabs button{
  padding:9px 14px;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--mute);cursor:pointer;font:600 12px/1 var(--disp);letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
}
.tabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.tabs button:hover{color:var(--bone)}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,11,16,.72)}
#modal.on{display:flex}
#modal .box{background:var(--ink-2);border:1px solid var(--rule);border-radius:6px;max-width:760px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
#modal .mh{position:sticky;top:0;background:var(--ink-2);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule);z-index:1}
#modal .mb{padding:16px}
#modal .mf{position:sticky;bottom:0;background:var(--ink-2);display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--rule)}

/* toast */
#toasts{position:fixed;z-index:200;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
.toast{
  background:var(--ink-3);border:1px solid var(--rule);border-left:3px solid var(--brass);
  border-radius:var(--r);padding:11px 13px;font-size:13.5px;box-shadow:var(--shadow);animation:tin .22s ease-out;
}
.toast.bad{border-left-color:var(--signal)}
.toast.good{border-left-color:var(--sage)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── mascot brawl ─────────────────────────────────────── */
.arena{position:relative;border-radius:var(--r);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 8%, #1E3145 0%, #14202C 55%, #0E1721 100%)}
.arena svg{display:block;width:100%;height:auto}
.arena .floor{fill:#0B131B}
.fo-anim{transform-box:fill-box;transform-origin:50% 100%}
/* The parent only carries the weight shift. Everything with character in it
   happens at the joints below, so the two never fight each other. */
.fo-idle{animation:foBob 3.4s ease-in-out infinite}
.fo-win{animation:foStrut 1.6s ease-in-out infinite}
.fo-lose{animation:foTrudge 4s ease-in-out infinite}
.fo-out{animation:foSag 4.5s ease-in-out infinite}
/* Week over, this mascot lost: flat on its back on the floor. */
.fo-ko{transform-box:view-box;transform-origin:60px 118px;animation:foKO 2.6s ease-out both}
@keyframes foKO{
  0%{transform:rotate(0deg) translateY(0)}
  35%{transform:rotate(-8deg) translateY(0)}
  70%{transform:rotate(88deg) translateY(30px)}
  85%{transform:rotate(84deg) translateY(30px)}
  100%{transform:rotate(86deg) translateY(30px)}
}
/* limbs go limp when knocked out */
.fo-ko .m-armL{transform:rotate(38deg)}
.fo-ko .m-armR{transform:rotate(-30deg)}
.fo-ko .m-legL{transform:rotate(-12deg)}
.fo-ko .m-legR{transform:rotate(10deg)}
.fo-ko .m-head{transform:rotate(-10deg)}
/* Injured (stage 2+): arms and shoulders stay DOWN where they start — the
   losing/out states otherwise rotate them up, which lifts the sling too. */
.fo-injured:not(.fo-ko) .m-armL,.fo-injured:not(.fo-ko) .m-armR{animation:none !important;transform:none !important}

@keyframes foBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes foStrut{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}}
@keyframes foTrudge{0%,100%{transform:translateY(1px)}50%{transform:translateY(3px)}}
@keyframes foSag{0%,100%{transform:translateY(4px)}50%{transform:translateY(6px)}}
/* Joints. Arms swing from the shoulder, legs from the hip, the torso folds at
   the waist and the head turns on the neck. */
.m-armL,.m-armR,.m-legL,.m-legR,.m-torso,.m-head{transform-box:fill-box}
.m-armL{transform-origin:100% 42%}
.m-armR{transform-origin:0% 42%}
.m-legL,.m-legR{transform-origin:50% 4%}
.m-torso{transform-origin:50% 100%}
.m-head{transform-origin:50% 96%}

/* breathing, so nobody stands like a shop dummy */
.fo-idle .m-torso{animation:brTorso 3.4s ease-in-out infinite}
.fo-idle .m-armL{animation:brArmL 3.4s ease-in-out infinite}
.fo-idle .m-armR{animation:brArmR 3.4s ease-in-out infinite}
.fo-idle .m-head{animation:brHead 5.2s ease-in-out infinite}
@keyframes brTorso{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes brArmL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}
@keyframes brArmR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes brHead{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}

/* winning: a bit of a strut, arms pumping */
.fo-win .m-armL{animation:winArmL 1.6s ease-in-out infinite}
.fo-win .m-armR{animation:winArmR 1.6s ease-in-out infinite}
.fo-win .m-legL{animation:winLegL 1.6s ease-in-out infinite}
.fo-win .m-legR{animation:winLegR 1.6s ease-in-out infinite}
.fo-win .m-head{animation:winHead 1.6s ease-in-out infinite}
@keyframes winArmL{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-42deg)}}
@keyframes winArmR{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(42deg)}}
@keyframes winLegL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg)}}
@keyframes winLegR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(9deg)}}
@keyframes winHead{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-5deg) translateY(-3px)}}

/* losing: shoulders drop, head hangs */
.fo-lose .m-torso{animation:loseTorso 4s ease-in-out infinite}
.fo-lose .m-head{animation:loseHead 4s ease-in-out infinite}
.fo-lose .m-armL{animation:loseArmL 4s ease-in-out infinite}
.fo-lose .m-armR{animation:loseArmR 4s ease-in-out infinite}
@keyframes loseTorso{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg) translateY(2px)}}
@keyframes loseHead{0%,100%{transform:rotate(6deg) translateY(2px)}50%{transform:rotate(10deg) translateY(4px)}}
@keyframes loseArmL{0%,100%{transform:rotate(14deg)}50%{transform:rotate(18deg)}}
@keyframes loseArmR{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-18deg)}}

/* out on his feet */
.fo-out .m-torso{animation:outTorso 4.5s ease-in-out infinite}
.fo-out .m-head{animation:outHead 4.5s ease-in-out infinite}
.fo-out .m-armL{transform:rotate(26deg)}
.fo-out .m-armR{transform:rotate(-26deg)}
.fo-out .m-legL{transform:rotate(-7deg)}
.fo-out .m-legR{transform:rotate(7deg)}
@keyframes outTorso{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-11deg) translateY(3px)}}
@keyframes outHead{0%,100%{transform:rotate(14deg) translateY(3px)}50%{transform:rotate(19deg) translateY(5px)}}

/* ── taunts, joint by joint ───────────────────────────────────────────── */

/* flex — both arms curl up, chest out, weight settles */
.fo-t-flex .m-armL{animation:flexAL 1.5s ease-in-out infinite}
.fo-t-flex .m-armR{animation:flexAR 1.5s ease-in-out infinite}
.fo-t-flex .m-torso{animation:flexT 1.5s ease-in-out infinite}
.fo-t-flex .m-head{animation:flexH 1.5s ease-in-out infinite}
@keyframes flexAL{0%,100%{transform:rotate(0deg)}35%,80%{transform:rotate(-128deg) translateX(6px)}}
@keyframes flexAR{0%,100%{transform:rotate(0deg)}35%,80%{transform:rotate(128deg) translateX(-6px)}}
@keyframes flexT{0%,100%{transform:scale(1,1)}35%,80%{transform:scale(1.1,.95)}}
@keyframes flexH{0%,100%{transform:rotate(0deg)}35%,80%{transform:rotate(-4deg) translateY(2px)}}

/* point — right arm out straight, body turns behind it */
.fo-t-point .m-armR{animation:ptAR 1.7s ease-in-out infinite}
.fo-t-point .m-armL{animation:ptAL 1.7s ease-in-out infinite}
.fo-t-point .m-torso{animation:ptT 1.7s ease-in-out infinite}
.fo-t-point .m-head{animation:ptH 1.7s ease-in-out infinite}
@keyframes ptAR{0%,100%{transform:rotate(0deg)}30%,75%{transform:rotate(-16deg) translateX(9px) scaleX(1.16)}}
@keyframes ptAL{0%,100%{transform:rotate(0deg)}30%,75%{transform:rotate(34deg)}}
@keyframes ptT{0%,100%{transform:rotate(0deg)}30%,75%{transform:rotate(-5deg) translateX(4px)}}
@keyframes ptH{0%,100%{transform:rotate(0deg)}30%,75%{transform:rotate(-7deg) translateX(3px)}}

/* roar — head back, arms flung wide, chest heaving */
.fo-t-roar .m-head{animation:roarH .7s ease-in-out infinite}
.fo-t-roar .m-armL{animation:roarAL .7s ease-in-out infinite}
.fo-t-roar .m-armR{animation:roarAR .7s ease-in-out infinite}
.fo-t-roar .m-torso{animation:roarT .7s ease-in-out infinite}
@keyframes roarH{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-15deg) translateY(-3px)}}
@keyframes roarAL{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-58deg) translateX(-5px)}}
@keyframes roarAR{0%,100%{transform:rotate(10deg)}50%{transform:rotate(58deg) translateX(5px)}}
@keyframes roarT{0%,100%{transform:scale(1)}50%{transform:scale(1.07,1.04)}}

/* beckon — the come-here curl, twice a cycle */
.fo-t-beckon .m-armR{animation:bkAR .85s ease-in-out infinite}
.fo-t-beckon .m-torso{animation:bkT 1.7s ease-in-out infinite}
.fo-t-beckon .m-head{animation:bkH 1.7s ease-in-out infinite}
@keyframes bkAR{0%,100%{transform:rotate(-52deg) translateX(2px)}50%{transform:rotate(-96deg) translateX(-6px)}}
@keyframes bkT{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
@keyframes bkH{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg)}}

/* dance — hips and shoulders out of phase, feet keeping time */
.fo-t-dance .m-torso{animation:dnT .62s ease-in-out infinite}
.fo-t-dance .m-armL{animation:dnAL .62s ease-in-out infinite}
.fo-t-dance .m-armR{animation:dnAR .62s ease-in-out infinite}
.fo-t-dance .m-legL{animation:dnLL .62s ease-in-out infinite}
.fo-t-dance .m-legR{animation:dnLR .62s ease-in-out infinite}
.fo-t-dance .m-head{animation:dnH .62s ease-in-out infinite}
@keyframes dnT{0%,100%{transform:rotate(-7deg) translateX(-3px)}50%{transform:rotate(7deg) translateX(3px)}}
@keyframes dnAL{0%,100%{transform:rotate(-64deg)}50%{transform:rotate(22deg)}}
@keyframes dnAR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(64deg)}}
@keyframes dnLL{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-6deg)}}
@keyframes dnLR{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(6deg)}}
@keyframes dnH{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}

/* bow — folds at the waist, arms swing forward under gravity */
.fo-t-bow .m-torso{animation:bwT 2.4s ease-in-out infinite}
.fo-t-bow .m-head{animation:bwH 2.4s ease-in-out infinite}
.fo-t-bow .m-armL{animation:bwAL 2.4s ease-in-out infinite}
.fo-t-bow .m-armR{animation:bwAR 2.4s ease-in-out infinite}
@keyframes bwT{0%,100%{transform:rotate(0deg)}40%,62%{transform:rotate(34deg) translateY(4px)}}
@keyframes bwH{0%,100%{transform:rotate(0deg)}40%,62%{transform:rotate(22deg) translateY(3px)}}
@keyframes bwAL{0%,100%{transform:rotate(0deg)}40%,62%{transform:rotate(-46deg) translateY(6px)}}
@keyframes bwAR{0%,100%{transform:rotate(0deg)}40%,62%{transform:rotate(46deg) translateY(6px)}}

/* facepalm — hand up to the face, head sinks into it */
.fo-t-facepalm .m-armR{animation:fpAR 2.6s ease-in-out infinite}
.fo-t-facepalm .m-head{animation:fpH 2.6s ease-in-out infinite}
.fo-t-facepalm .m-torso{animation:fpT 2.6s ease-in-out infinite}
@keyframes fpAR{0%,100%{transform:rotate(0deg)}32%,72%{transform:rotate(-152deg) translate(-14px,4px)}}
@keyframes fpH{0%,100%{transform:rotate(0deg)}32%,72%{transform:rotate(11deg) translateY(4px)}}
@keyframes fpT{0%,100%{transform:rotate(0deg)}32%,72%{transform:rotate(3deg) translateY(2px)}}

/* shrug — shoulders up, palms out, head tucked between them */
.fo-t-shrug .m-armL{animation:shAL 2s ease-in-out infinite}
.fo-t-shrug .m-armR{animation:shAR 2s ease-in-out infinite}
.fo-t-shrug .m-head{animation:shH 2s ease-in-out infinite}
.fo-t-shrug .m-torso{animation:shT 2s ease-in-out infinite}
@keyframes shAL{0%,100%{transform:rotate(0deg)}35%,70%{transform:rotate(-40deg) translateY(-5px)}}
@keyframes shAR{0%,100%{transform:rotate(0deg)}35%,70%{transform:rotate(40deg) translateY(-5px)}}
@keyframes shH{0%,100%{transform:translateY(0)}35%,70%{transform:translateY(5px) scaleY(.94)}}
@keyframes shT{0%,100%{transform:translateY(0)}35%,70%{transform:translateY(-2px)}}

/* spike — arm up, then everything comes down through the ball */
.fo-t-spike .m-armR{animation:spAR 1.3s cubic-bezier(.3,0,.2,1) infinite}
.fo-t-spike .m-torso{animation:spT 1.3s cubic-bezier(.3,0,.2,1) infinite}
.fo-t-spike .m-head{animation:spH 1.3s cubic-bezier(.3,0,.2,1) infinite}
.fo-t-spike .m-legL{animation:spLL 1.3s cubic-bezier(.3,0,.2,1) infinite}
.fo-t-spike .m-legR{animation:spLR 1.3s cubic-bezier(.3,0,.2,1) infinite}
.fo-t-spike .m-ball{transform-box:fill-box;transform-origin:50% 50%;animation:spBall 1.3s cubic-bezier(.3,0,.2,1) infinite}
@keyframes spAR{0%{transform:rotate(0deg)}30%{transform:rotate(148deg) translateY(-6px)}
  46%{transform:rotate(-34deg) translateY(8px)}70%,100%{transform:rotate(0deg)}}
@keyframes spT{0%{transform:rotate(0deg)}30%{transform:rotate(-8deg) translateY(-4px)}
  46%{transform:rotate(15deg) translateY(4px)}70%,100%{transform:rotate(0deg)}}
@keyframes spH{0%{transform:rotate(0deg)}30%{transform:rotate(-11deg)}46%{transform:rotate(17deg)}70%,100%{transform:rotate(0deg)}}
@keyframes spLL{0%{transform:rotate(0deg)}30%{transform:rotate(-13deg)}46%{transform:rotate(6deg)}70%,100%{transform:rotate(0deg)}}
@keyframes spLR{0%{transform:rotate(0deg)}30%{transform:rotate(9deg)}46%{transform:rotate(-6deg)}70%,100%{transform:rotate(0deg)}}
/* ball: rides the hand up (to ~30%), is flung to the ground by ~46%, bounces,
   then vanishes for the reset before the next throw. */
@keyframes spBall{
  /* starts IN the hand at rest */
  0%{transform:translate(0,0) rotate(0deg);opacity:1}
  10%{transform:translate(-4px,-6px) rotate(-24deg);opacity:1}
  /* rides UP with the hand on the wind-up (hand raised high behind the head) */
  30%{transform:translate(-30px,-34px) rotate(-150deg);opacity:1}
  /* thrown straight DOWN into the ground as the arm snaps through */
  44%{transform:translate(-42px,52px) rotate(60deg);opacity:1}
  /* one low bounce off the turf, then gone for the reset */
  52%{transform:translate(-44px,34px) rotate(120deg);opacity:1}
  60%{transform:translate(-46px,52px) rotate(180deg);opacity:.85}
  68%,100%{transform:translate(-46px,54px) rotate(180deg);opacity:0}
}

/* nap — knees give, torso sags, head lolls, arms dangle */
.fo-t-nap .m-torso{animation:npT 4.4s ease-in-out infinite}
.fo-t-nap .m-head{animation:npH 4.4s ease-in-out infinite}
.fo-t-nap .m-armL{animation:npAL 4.4s ease-in-out infinite}
.fo-t-nap .m-armR{animation:npAR 4.4s ease-in-out infinite}
.fo-t-nap .m-legL{transform:rotate(-5deg)}
.fo-t-nap .m-legR{transform:rotate(5deg)}
@keyframes npT{0%,100%{transform:rotate(-9deg) translateY(3px)}50%{transform:rotate(-12deg) translateY(6px)}}
@keyframes npH{0%,100%{transform:rotate(19deg) translateY(3px)}50%{transform:rotate(25deg) translateY(6px)}}
@keyframes npAL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(28deg)}}
@keyframes npAR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(-28deg)}}

const HOME_LEAGUE = {

  anonKey:  'sb_publishable_Zaf5KfMx01pZfKcNylmNoA_n25uVQuO',

/* The address is tied to a league as soon as we know where to connect; the

function homeLeagueOn(){
  return !!(HOME_LEAGUE.url && HOME_LEAGUE.anonKey);

/* No id baked in: ask the project which leagues exist. Exactly one means there
   is nothing to choose, so use it. */
async function findHomeLeague(){
  if(!homeLeagueOn() || (S.settings.supa && S.settings.supa.leagueId)) return;
  try{
    if(!Supa.client && !await Supa.init(false)) return;
    /* Best route first: a signed-in member's own row names their league, and
       security rules always allow reading your own membership. */
    if(Supa.user){
      const mine = await Supa.client.from('league_members')
        .select('league_id').eq('user_id', Supa.user.id).limit(1);
      const lid = mine && mine.data && mine.data[0] && mine.data[0].league_id;
      if(lid){
        S.settings.supa.leagueId = lid;
        S.meta.homeFound = lid; S.meta.homeTrouble = null;
        save(true);
        try{ await Supa.loadMember(); await Supa.pull(); Supa.listen(); }catch(e){}
        render();
        return;
      }
    }
    /* Next: try the likely names for this league by asking for each one. */
    for(const cand of (HOME_LEAGUE.tryIds||[])){
      try{
        const r = await Supa.client.from('leagues').select('id').eq('id', cand).maybeSingle();
        if(r && r.data && r.data.id){
          S.settings.supa.leagueId = r.data.id;
          S.meta.homeFound = r.data.id; S.meta.homeTrouble = null;
          save(true);
          try{ await Supa.loadMember(); await Supa.pull(); Supa.listen(); }catch(e){}
          render();
          return;
        }
      }catch(e){ /* blocked or absent — try the next */ }
    }
    /* Otherwise ask the project directly. Security rules often block this for a
       signed-out visitor, which is why it is the last resort. */
    const {data, error} = await Supa.client.from('leagues').select('id').limit(20);
    if(error) throw error;
    const ids = (data||[]).map(r=> r.id).filter(Boolean);
    if(ids.length===1){
      S.settings.supa.leagueId = ids[0];
      S.meta.homeFound = ids[0];
      save(true); render();
    } else {
      S.meta.homeTrouble = ids.length
        ? 'This project holds '+ids.length+' leagues ('+ids.slice(0,4).join(', ')+
          '). Put the right one in HOME_LEAGUE.leagueId.'
        : 'Could not work out which league this is. Open Supabase \u2192 Table Editor \u2192 leagues and read the id column, then put it in HOME_LEAGUE.leagueId at the top of index.html.';
      render();
    }
  }catch(e){
    S.meta.homeTrouble = 'Could not look the league up \u2014 '+e.message+
      '. Fill in HOME_LEAGUE.leagueId to skip the lookup.';
    render();
  }
}

'use strict';

/* ---------- storage adapter (artifact host → localStorage → memory) ---------- */
const MEM = {};
const Store = {
  /* Returns {ok, value}. "Nothing saved" and "could not read" are different
     things, and confusing them is how a league gets replaced by the demo. */
  async read(k){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(k);
        return {ok:true, value: (r && r.value) ? JSON.parse(r.value) : null};
      }
    }catch(e){ return {ok:false, value:null, err:e.message}; }
    try{
      const v = localStorage.getItem(k);
      if(v!=null) return {ok:true, value: JSON.parse(v)};
      return {ok:true, value: (MEM[k] ?? null)};
    }catch(e){ return {ok:false, value: (MEM[k] ?? null), err:e.message}; }
  },
  async get(k){ const r = await this.read(k); return r.value; },
  async set(k,v){
    const s = JSON.stringify(v); MEM[k]=v;
    try{ if(window.storage && window.storage.set){ await window.storage.set(k,s); return true; } }catch(e){}
    try{ localStorage.setItem(k,s); return true; }
    catch(e){
      /* Out of room. Saved copies are the first thing to give up — the live
         league and the sign-in token matter more. */
      try{
        for(let i=BAKS; i>=2; i--){
          try{ localStorage.removeItem(bakKey(i)); }catch(_){}
          try{ localStorage.setItem(k,s); return true; }catch(_){}
        }
        try{ localStorage.removeItem(bakKey(1)); }catch(_){}
        localStorage.setItem(k,s); return true;
      }catch(e2){ return false; }
    }
  },
  async del(k){
    delete MEM[k];
    try{ if(window.storage && window.storage.delete){ await window.storage.delete(k); return true; } }catch(e){}
    try{ localStorage.removeItem(k); return true; }catch(e){ return false; }
  }
};
const KEY = 'frontoffice.league.v1';
const BAKS = 24;              /* the most we will ever keep */
const BAK_BUDGET = 1600000;   /* about 1.6MB of copies, so the browser has room for everything else */
const bakKey = (i)=> KEY + '.bak' + i;

/* A rolling set of copies, kept every time the league is loaded and whenever
   anything drastic is about to happen. Nothing here is ever overwritten by an
   update, because updating only replaces the page, never the stored league. */
/* Keys that must never be cleared to make room: the sign-in session lives here,
   and losing it means signing in again after every deploy. */
function isProtectedKey(k){ return /auth-token|^sb-|supabase/i.test(String(k||'')); }
/* Roughly how much of the browser's allowance is in use, and what is taking it. */
function storageReport(){
  let total = 0, baks = 0, league = 0, auth = 0;
  try{
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      const n = (k||'').length + String(localStorage.getItem(k)||'').length;
      total += n;
      if(/bak/i.test(k)) baks += n;
      else if(isProtectedKey(k)) auth += n;
      else if(k===KEY) league += n;
    }
  }catch(e){}
  return {total, baks, league, auth};
}
/* How big one saved copy is, roughly. */
function bakSize(o){ try{ return JSON.stringify(o).length; }catch(e){ return 0; } }
/* Drop the oldest copies until the set fits the budget. Called before writing a
   new one, and again if the browser ever refuses a write. */
async function trimBackups(room){
  let total = 0, kept = [];
  for(let i=1; i<=BAKS; i++){
    const b = await Store.get(bakKey(i));
    if(b) kept.push({i, size:bakSize(b)});
  }
  kept.forEach(k=> total += k.size);
  const budget = Math.max(0, BAK_BUDGET - (room||0));
  for(let n = kept.length-1; n >= 0 && total > budget; n--){
    await Store.del(bakKey(kept[n].i));
    total -= kept[n].size;
  }
}
async function keepBackup(state, why){
  if(!state || !(state.teams||[]).length) return;
  const entry = {at:Date.now(), why:why||'', rev:state.rev||0, state};
  const size = bakSize(entry);
  /* A single league bigger than the whole budget is not worth keeping copies of
     — the live save matters more than the history. */
  if(size > BAK_BUDGET) return;
  try{
    await trimBackups(size);
    for(let i=BAKS-1; i>=1; i--){
      const prev = await Store.get(bakKey(i));
      if(prev) await Store.set(bakKey(i+1), prev);
    }
    const ok = await Store.set(bakKey(1), entry);
    if(!ok){ await trimBackups(size*2); await Store.set(bakKey(1), entry); }
  }catch(e){}
}
async function listBackups(){
  const out = [];
  for(let i=1;i<=BAKS;i++){
    try{
      const b = await Store.get(bakKey(i));
      if(b && b.state && (b.state.teams||[]).length){
        out.push({slot:i, at:b.at, why:b.why||'',
          league:(b.state.league||{}).name || '—',
          teams:(b.state.teams||[]).length,
          players:(b.state.players||[]).filter(p=>p.contract).length,
          season:(b.state.league||{}).season});
      }
    }catch(e){}
  }
  return out;
}

  if(centsOn()) return 2;

function money(n,opts){
  const d = decimals();
  const v = Number(n||0);
  const s = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
  return (v<0?'-':(opts&&opts.plus&&v>0?'+':'')) + S.settings.cap.symbol + s;
}
function roundInc(n){
  /* Keeping cents means never snapping a figure to the league's bid increment. */
  if(centsOn()) return +(+n||0).toFixed(2);
  const i = S.settings.cap.increment||1; return Math.round(n/i)*i;
}

function dstr(ms){ if(!ms) return '—'; const d=new Date(ms); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function dayOnly(s){ if(!s) return '—'; const d=new Date(s+'T12:00:00'); return isNaN(d)?s:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function hhmm(ms){
  const t = Math.max(0,Math.floor(ms/1000));
  const dd = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
  const p = (x)=> String(x).padStart(2,'0');
  return dd>0 ? dd+'d '+p(h)+':'+p(m)+':'+p(s) : p(h)+':'+p(m)+':'+p(s);
}

function slotsFromCodes(codes){
  const out=[], seen={};
  codes.forEach(c=>{
    const t = SLOT_TYPES[c]; if(!t) return;
    if(seen[c]!=null){ out[seen[c]].count++; return; }

    out.push({id:uid('s'), code:c, label:t.label, count:1, eligible:t.eligible.slice()});
  });
  return out;
}

/* ============================================================
   CONTRACT + CAP MATH
   ============================================================ */
function structById(id){ const a=S.settings.contracts.structures; return byId(a,id) || a[0]; }

/* May a deal of this size and length be front or back loaded? Returns null when
   it may, or the reason it may not. */
function loadingBlocked(total, years){
  const c = S.settings.contracts || {};
  const yrs = clamp(years|0, 1, 20);
  const flat = (c.flatYears||[]).map(Number);
  if(flat.indexOf(yrs) >= 0)
    return yrs+'-year deals are paid evenly in this league.';
  const min = +c.loadMinTotal || 0;
  if(min > 0 && +total < min)
    return 'Deals under '+money(min)+' are paid evenly — this one is '+money(total)+'.';
  return null;
}
/* Percentage of total value paid in each year of a contract. */
function structPct(st, years, total){
  /* A deal the league says must be flat ignores the chosen shape. */
  if(total!=null && loadingBlocked(total, years)) st = {mode:'even', ratio:1};
  return structPctRaw(st, years);
}
function structPctRaw(st, years){
  years = clamp(years|0, 1, 20);
  const ov = st.overrides && st.overrides[years];
  let w;
  if(ov && ov.length === years && sum(ov) > 0){ w = ov.map(x=> Math.max(0, +x||0)); }
  else{
    w = [];
    for(let i=0;i<years;i++){
      if(st.mode==='even') w.push(1);
      else if(st.mode==='front') w.push(Math.pow(st.ratio, years-1-i));
      else w.push(Math.pow(st.ratio, i));
    }
  }
  const t = sum(w) || 1;
  return w.map(x=> x/t*100);
}

/* Split a total into per-year salaries; largest-remainder keeps the sum exact. */
function salariesFor(total, years, structId){
  years = clamp(years|0, 1, 20);
  const p = structPct(structById(structId), years, total);
  const inc = centsOn() ? 0.01 : (+S.settings.cap.increment || 1);
  const rule = +S.settings.contracts.minSalary || 0;
  // The league minimum can't be honoured if the whole deal is worth less than
  // one minimum per year — in that case the total wins and the UI flags it.
  const min = total >= years*rule ? rule : 0;
  const raw = p.map(x=> total*x/100);
  const base = raw.map(x=> Math.max(min, Math.floor(x/inc+1e-9)*inc));
  let left = Math.round((total - sum(base))/inc);
  const order = raw.map((x,i)=>({i, r:x-base[i]})).sort((a,b)=> b.r-a.r);
  let k=0;
  while(left>0 && order.length){ base[order[k%order.length].i]+=inc; left--; k++; if(k>4000) break; }
  let guard=0;
  while(left<0 && guard++<4000){
    const big = base.map((v,i)=>({i,v})).sort((a,b)=> b.v-a.v);
    const hit = big.find(o=> base[o.i]-inc >= min);
    if(!hit) break;
    base[hit.i]-=inc; left++;
  }
  return base.map(fixInc);
}
function makeContract(teamId,total,years,structId,startYear){
  return { teamId, total:fixInc(total), years:clamp(years|0,1,20), structId,
           startYear:startYear|0, salaries:salariesFor(total,years,structId), signedAt:Date.now() };
}
/* Where a player is sitting. Taxi and practice squad are off the cap
   entirely; injured reserve is not, except for the part a season-ending
   designation gives back. */
function playerSlot(p){ return (p && p.slot) || 'active'; }
function onTaxi(p){ return playerSlot(p)==='taxi'; }
function onIR(p){ return playerSlot(p)==='ir'; }
function onPractice(p){ return playerSlot(p)==='practice'; }
/* Real-life NFL practice-squad status. There is no clean public API a static
   page can hit for this, so it is a flag: set by hand from the taxi row, or
   filled in from a Sleeper import when Sleeper reports it. */
function onNflPractice(p){ return !!(p && p.nflPractice); }
/* The free cut is only offered for someone parked on YOUR taxi squad who is on
   an NFL practice squad in real life — because he is not on a real active
   roster, letting him go should cost nothing. */
function canFreePracticeCut(p){ return !!(p && p.contract && onTaxi(p) && onNflPractice(p) && underPracticeCutMax(p)); }
/* If a dollar limit is set (non-zero), the free cut only applies to players at
   or under it — so a league can restrict it to genuinely cheap depth. */
function underPracticeCutMax(p){
  const cap = +((S.settings.roster||{}).practiceCutMax)||0;
  if(cap<=0) return true;
  return grossHit(p, S.league.season) <= cap;
}
/* The release-modal version: he need not be on your taxi squad here, only on an

function canFreePracticeCutHere(p){ return !!(p && p.contract && onNflPractice(p) && underPracticeCutMax(p)); }

function isRetired(p){ return !!(p && p.retired); }

function isOrphan(p){ return !!(p && p.contract && !p.contract.teamId); }
function orphanTag(p){

  return '<span class="pill warn" title="cut free — his deal runs to the end of '+y+
    ' and whoever signs him takes it as it is">on his deal</span>';
}
const SLOT_LABEL = {active:'Active', taxi:'Taxi', ir:'IR', practice:'Practice squad'};
function slotTag(p){

/* Weeks in the fantasy year, used to prorate a season-ending injury. */
function seasonWeeks(){ return clamp(+S.settings.roster.seasonWeeks||17, 1, 25); }
function weeksLeft(){ return clamp(seasonWeeks() - (+S.live.week||1) + 1, 0, seasonWeeks()); }
function irRelief(p, year){
  return (p && p.ir && p.ir.seasonEnding && p.ir.year===year) ? (+p.ir.relief||0) : 0;
}
/* What a season-ending designation would hand back, and the numbers behind it.
   Worked out once and used by both the confirmation screen and the commit, so
   the figure a manager agrees to is the figure they get.
     games — the share of the season he has not played. A player who has already
             missed time gets more back than the calendar alone would give.
     weeks — the share of the season still to come, whoever has played what.
     fixed — the same figure every time, capped at what he actually costs. */
function irBasis(p){
  const y = S.league.season, weeks = seasonWeeks();
  const gross = fixInc(Math.max(0, grossHit(p,y) - retainedOn(p,y)));
  const mode = (S.settings.ir||{}).mode || 'games';
  if(mode==='fixed'){
    const set = Math.max(0, +((S.settings.ir||{}).fixed)||0);
    return {mode, gross, weeks, played:null, left:null, pct:null,
            relief: fixInc(Math.min(gross, set)), set, capped: set>gross};
  }
  const played = mode==='weeks'
    ? clamp((+S.live.week||1)-1, 0, weeks)
    : clamp(gamesIn(p.id, y), 0, weeks);
  const left = Math.max(0, weeks - played);
  const pct = weeks ? left/weeks : 0;
  return {mode, gross, weeks, played, left, pct, relief: fixInc(gross*pct), capped:false};
}
function irModeLine(b){
  if(b.mode==='fixed') return 'A flat '+money(b.set)+' back on any season-ending injury'+
    (b.capped? ', trimmed to '+money(b.relief)+' because that is all he costs' : '');
  return b.mode==='weeks'
    ? b.left+' of '+b.weeks+' weeks still to play'
    : 'he has played '+b.played+' of '+b.weeks+' games';
}

/* What the deal is worth in that year before anyone eats any of it. */
function grossHit(p, year){
  const c = p && p.contract; if(!c) return 0;
  const i = year - c.startYear;
  const sal = c.salaries;
  return (Array.isArray(sal) && i>=0 && i<c.years) ? (+sal[i]||0) : 0;
}
/* Salary a former team agreed to keep paying, for a year. */
function retainedOn(p, year){
  const c = p && p.contract; if(!c || !c.retained) return 0;
  return fixInc(sum(c.retained.filter(r=> r.teamId !== c.teamId).map(r=> +((r.amounts||{})[year])||0)));
}
/* What the team that owns him now actually carries. */
function capHit(p, year){
  if(offCap(p)) return 0;
  return fixInc(Math.max(0, grossHit(p,year) - retainedOn(p,year) - irRelief(p,year)));
}
function teamRetained(teamId, year){
  let t = 0;
  S.players.forEach(p=>{
    const c = p.contract; if(!c || c.teamId===teamId || !c.retained) return;
    c.retained.forEach(r=>{ if(r.teamId===teamId) t += +((r.amounts||{})[year])||0; });
  });
  return fixInc(t);
}
function retainedList(teamId){
  const out = [];
  S.players.forEach(p=>{
    const c = p.contract; if(!c || c.teamId===teamId || !c.retained) return;
    c.retained.forEach(r=>{ if(r.teamId===teamId) out.push({player:p, r}); });
  });
  return out;
}
/* Eating salary: the sending team keeps a slice of every remaining year
   through the year they agreed to. */
function applyRetention(playerId, payerTeamId, pctOrAmt, throughYear, mode){
  const p = byId(S.players, playerId), c = p && p.contract;
  if(!c || !pctOrAmt) return;
  const amounts = {};
  for(let i=0;i<c.years;i++){
    const y = c.startYear+i;
    if(y < S.league.season || y > throughYear) continue;
    const gross = +c.salaries[i]||0;
    const amt = mode==='amt' ? Math.min(gross, +pctOrAmt||0) : gross*(+pctOrAmt||0)/100;
    if(amt>0) amounts[y] = fixInc(amt);
  }
  if(!Object.keys(amounts).length) return;
  c.retained = (c.retained||[]).filter(r=> r.teamId!==payerTeamId);
  c.retained.push({teamId:payerTeamId, pct:(mode==='amt'?null:+pctOrAmt), mode:mode||'pct', through:throughYear, amounts, at:Date.now()});
}
/* Pick the years yourself: {2027:4, 2029:2}. Anything not listed is untouched,
   so you can eat a lump in one season and nothing in the next. */
function applyRetentionYears(playerId, payerTeamId, byYear){
  const p = byId(S.players, playerId), c = p && p.contract;
  if(!c || !byYear) return;
  const amounts = {};
  for(let i=0;i<c.years;i++){
    const y = c.startYear+i;
    const want = +byYear[y]||0;
    if(want>0) amounts[y] = fixInc(Math.min(+c.salaries[i]||0, want));
  }
  c.retained = (c.retained||[]).filter(r=> r.teamId!==payerTeamId);
  if(!Object.keys(amounts).length) return;
  c.retained.push({teamId:payerTeamId, pct:null, mode:'years', through:null, amounts, at:Date.now()});
}
/* Every remaining year of a deal, for the retention editor. */
function contractYears(p){
  const c = p && p.contract; if(!c) return [];
  const out = [];
  for(let i=0;i<c.years;i++){
    const y = c.startYear+i;
    if(y >= S.league.season) out.push({year:y, salary:+c.salaries[i]||0});
  }
  return out;
}
function capForYear(year){
  const c = S.settings.cap;
  const ov = c.overrides && c.overrides[year];
  if(ov!=null && ov!=='' && !isNaN(+ov)) return fixInc(+ov);
  const n = Math.max(0, year - S.league.season);
  return fixInc(c.growthMode==='pct' ? c.base*Math.pow(1+(+c.growthValue||0)/100, n) : (+c.base||0) + (+c.growthValue||0)*n);
}
function teamPlayers(teamId){ return S.players.filter(p=> p.contract && p.contract.teamId===teamId); }
function slotPlayers(teamId, slot){ return teamPlayers(teamId).filter(p=> playerSlot(p)===slot); }
function activeCount(teamId){ return slotPlayers(teamId,'active').length; }
function slotRoom(teamId, slot){
  const cap = slot==='taxi' ? +S.settings.roster.taxi||0
            : slot==='ir' ? +S.settings.roster.ir||0
            : slot==='practice' ? +S.settings.roster.practice||0
            : +S.settings.roster.maxRoster||0;
  return cap - slotPlayers(teamId, slot).length;
}
function teamDead(teamId,year){ const t=byId(S.teams,teamId); return t? fixInc(sum((t.dead||[]).filter(d=>d.year===year).map(d=>d.amount))) : 0; }
function teamAdj(teamId,year){ const t=byId(S.teams,teamId); return t? fixCents(sum((t.adj||[]).filter(d=>d.year===year).map(d=>+d.amount||0))) : 0; }
/* Everything charged against the cap this year: the contracts plus any manual
   adjustments. This is what the meters and headline figures use, so they always
   agree with the space shown beside them. */
function teamCharged(teamId, year){
  return fixCents(teamCommitted(teamId, year) + teamAdj(teamId, year));
}
/* What the contracts on the books cost: players, dead money and salary this team
   is still paying on someone it traded away. Manual adjustments are NOT in here
   — they are shown on their own line, and taken off in capSpace(). */
function teamCommitted(teamId, year){
  return fixCents(sum(teamPlayers(teamId).map(p=> capHit(p,year)))

}
/* Unused cap can be carried forward, within whatever limit the league voted. */
let capCache = {}, dppCache = null;
function clearCapCache(){ capCache = {}; }
function rolloverInto(teamId, year){
  const c = S.settings.cap || {};
  const r = c.rollover;
  if(year <= S.league.season) return 0;
  const mult = Math.max(1, +c.overdraftPenalty || 1);
  const penaltyOn = Math.abs(+c.overdraft || 0) > 0;
  /* Nothing to work out if neither carrying spare room nor charging for a
     shortfall is switched on. */
  if((!r || !r.on) && !penaltyOn) return 0;
  const k = teamId+':'+year;
  if(capCache[k]!=null) return capCache[k];
  capCache[k] = 0;                                  // guards against a loop
  const prev = year-1;
  const unused = teamCapForYear(teamId, prev) - teamCommitted(teamId, prev) - teamAdj(teamId, prev);
  let out = 0;
  if(unused > 0 && r && r.on){
    const cap = capForYear(prev);
    const lim = r.mode==='all' ? unused : r.mode==='pct' ? cap*(+r.value||0)/100 : (+r.value||0);
    let carry = Math.min(unused, Math.max(0, lim));
    if(r.max!=='' && r.max!=null && !isNaN(+r.max)) carry = Math.min(carry, Math.max(0, +r.max));
    out = fixInc(carry);
  } else if(unused < 0 && penaltyOn){
    /* Finished the year in the red: the shortfall comes off next year's cap,
       multiplied. -9.5 at a multiplier of 2 costs 19 next year. */
    out = fixInc(unused * mult);
  }
  capCache[k] = out;
  return out;
}
function teamCapForYear(teamId, year){ return fixInc(capForYear(year) + rolloverInto(teamId, year)); }
/* Years in the league. Imports carry it; anything we were never told is
   unknown, and an unknown never blocks a move. */
function playerExp(p){
  const v = p && p.exp;

}
/* May this player sit on the taxi squad? Returns null when he may, or a reason
   when he may not. */
function taxiIneligible(p){
  const cap = (S.settings.taxi||{}).maxExp;
  if(cap==='' || cap==null) return null;          /* no limit set */
  const lim = +cap; if(isNaN(lim)) return null;
  const e = playerExp(p);
  if(e==null) return null;                         /* we do not know, so allow it */
  if(e <= lim) return null;
  return esc(p.name)+' has '+e+' year'+(e===1?'':'s')+' of experience; the taxi squad is for '+
    lim+' or fewer.';
}
function capSpace(teamId, year){
  return fixCents(teamCapForYear(teamId,year) - teamCommitted(teamId,year) - teamAdj(teamId,year));
}
/* How far below zero a team is allowed to sit in the current year. Held as a
   negative number, so -10 means you may run $10 in the red. */
function capFloor(){ return -Math.abs(+((S.settings.cap||{}).overdraft)||0); }
/* What a team can still take on this year before it breaks the rule. */
function capRoom(teamId, year){ return fixInc(capSpace(teamId, year) - capFloor()); }
/* Past the line — not merely negative, but below what the league allows. */
function overCapFloor(teamId, year){ return capSpace(teamId, year) < capFloor() - 1e-9; }
// A projection can never run past the longest contract the league allows —
// there would be nothing on the books to show.
function maxProjYears(){ return clamp(+S.settings.contracts.maxYears||10, 1, 10); }
function projYears(){
  const n = clamp(+S.settings.cap.projectYears||6, 1, maxProjYears()), out=[];
  for(let i=0;i<n;i++) out.push(S.league.season+i);
  return out;
}
function releasePlayer(pid, split){
  const p = byId(S.players,pid), c = p && p.contract; if(!c) return;
  const tm = byId(S.teams, c.teamId); if(!tm) { p.contract=null; return; }
  tm.dead = tm.dead||[];
  const rate = (+S.settings.cap.deadCapPct||0)/100;
  const y = S.league.season;
  const rows=[];
  for(let i=0;i<c.years;i++){ const yy=c.startYear+i; if(yy>=y) rows.push({y:yy, amt:+c.salaries[i]||0}); }
  if(!rows.length){ p.contract=null; return; }
  const totalDead = fixInc(sum(rows.map(r=>r.amt))*rate);
  /* 'split' halves the hit across this year and next; 'now' loads it all onto
     this year. With neither passed, keep the old behaviour so any other caller
     is unaffected: the league's spread-over-remaining-years setting, or all now. */
  if(split==='split'){
    /* Round the first half to the cap's precision, then give the SECOND year
       whatever is left of the (already rounded) total — so the two pieces sum
       to exactly the total even when it does not halve evenly. Rounding both
       independently would overcharge by up to one increment. */
    const first = fixInc(totalDead/2);
    const second = fixInc(totalDead - first);
    if(first>0)  tm.dead.push({year:y,   amount:first,  playerId:pid, name:p.name});
    if(second>0) tm.dead.push({year:y+1, amount:second, playerId:pid, name:p.name+' (split)'});
  } else if(split==='now'){
    if(totalDead>0) tm.dead.push({year:y, amount:totalDead, playerId:pid, name:p.name});
  } else if(S.settings.cap.deadCapSpread){
    rows.forEach(r=> { if(r.amt*rate>0) tm.dead.push({year:r.y, amount:fixInc(r.amt*rate), playerId:pid, name:p.name}); });
  } else {
    if(totalDead>0) tm.dead.push({year:y, amount:totalDead, playerId:pid, name:p.name});
  }
  p.contract = null;
  logIt(tm.name+' released '+p.name+' — '+money(totalDead)+' dead cap'+
    (split==='split'?', split over '+y+' and '+(y+1):split==='now'?', all on '+y:''),
    {type:'drop', teams:[tm.id], players:[pid]});
}

/* ============================================================
   CLOCK MATH — countdowns that stop during quiet hours
   ============================================================ */
function parseHM(s){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'')); return m ? (+m[1])*60 + (+m[2]) : 0; }
function fmtHM(s){
  const t=parseHM(s), h=Math.floor(t/60), m=t%60, ap=h>=12?'PM':'AM', h12=(h%12)||12;
  return h12+':'+String(m).padStart(2,'0')+' '+ap;
}
/* Milliseconds of *counting* time between two instants, excluding the nightly pause. */
function activeMsBetween(a, b, q){
  if(!q || !q.on || b<=a) return Math.max(0, b-a);
  const from=parseHM(q.from), to=parseHM(q.to);
  if(from===to) return Math.max(0, b-a);
  let quiet=0, guard=0;
  const start=new Date(a); start.setHours(0,0,0,0); start.setDate(start.getDate()-1);
  for(let d=new Date(start); d.getTime() <= b+86400000 && guard<1200; d.setDate(d.getDate()+1), guard++){
    const qs=new Date(d); qs.setHours(Math.floor(from/60), from%60, 0, 0);
    const qe=new Date(d); qe.setHours(Math.floor(to/60), to%60, 0, 0);
    let s=qs.getTime(), e=qe.getTime();
    if(e<=s) e += 86400000;
    quiet += Math.max(0, Math.min(b,e) - Math.max(a,s));
  }
  return Math.max(0, (b-a) - quiet);
}
/* The wall-clock instant reached after `activeMs` of counting time. */
function addActiveMs(from, activeMs, q){
  if(!q || !q.on) return from + activeMs;
  let lo = from, hi = from + activeMs*3 + 86400000*2;
  for(let i=0;i<52;i++){ const mid=(lo+hi)/2; if(activeMsBetween(from,mid,q) < activeMs) lo=mid; else hi=mid; }
  return Math.round(hi);
}
function isQuietNow(q){
  q = q || S.settings.trades.quiet;
  if(!q || !q.on) return false;
  const from=parseHM(q.from), to=parseHM(q.to); if(from===to) return false;
  const d=new Date(), m=d.getHours()*60+d.getMinutes();
  return from<to ? (m>=from && m<to) : (m>=from || m<to);
}
function quietResumesAt(){
  const q=S.settings.trades.quiet, to=parseHM(q.to), d=new Date();
  const r=new Date(d); r.setHours(Math.floor(to/60), to%60, 0, 0);
  if(r.getTime() <= d.getTime()) r.setDate(r.getDate()+1);
  return r.getTime();
}
function newClock(hours){ return { remain: Math.max(0, (+hours||0)*3600000), lastAt: Date.now() }; }
function tickClock(c){
  if(!c) return 0;
  const now = Date.now();
  if(now > c.lastAt) c.remain = Math.max(0, c.remain - activeMsBetween(c.lastAt, now, S.settings.trades.quiet));
  c.lastAt = now;
  return c.remain;
}
function clockEta(c){ return addActiveMs(Date.now(), c.remain, S.settings.trades.quiet); }
function snipeMs(v){ return (+v||0) * (S.settings.trades.antiSnipeUnit==='hr' ? 3600000 : 60000); }
function antiSnipe(c){
  const t = S.settings.trades;
  if(!t.antiSnipeOn || !c) return false;
  if(c.remain <= snipeMs(t.antiSnipeWithinMin)){
    c.remain = Math.max(c.remain, snipeMs(t.antiSnipeExtendMin));
    return true;
  }
  return false;
}
function snipeLabel(){ return S.settings.trades.antiSnipeExtendMin+' '+(S.settings.trades.antiSnipeUnit==='hr'?'hours':'minutes'); }

/* An empty league shell — no demo teams, no demo players. Used when this
   address belongs to a real league and we are waiting to connect and pull it. */
function blankLeague(){
  const st = defaultState();
  st.teams = []; st.players = [];
  st.live = st.live || {}; st.live.games = []; st.live.week = st.live.week || 1;
  return st;
}
function seedLeague(teamCount){
  const st = defaultState();
  const n = clamp(teamCount||10, 4, 20);
  st.teams = [];
  for(let i=0;i<n;i++){
    st.teams.push({
      id:'t'+(i+1), name:TEAM_NAMES[i%TEAM_NAMES.length] + (i>=TEAM_NAMES.length?' '+(i+1):''),
      abbr:(TEAM_NAMES[i%TEAM_NAMES.length].match(/\b[A-Z]/g)||['T','M']).join('').slice(0,3).toUpperCase(),
      owner:OWNERS[i%OWNERS.length], email:'', dead:[], adj:[],
      color:TEAM_COLORS[i%TEAM_COLORS.length], mascot:Object.keys(MASCOTS)[i%Object.keys(MASCOTS).length],
      dues:{paid:i%4!==1, paidOn:i%4!==1 ? Date.now()-86400000*(3+i) : null, amount:null, method:'', note:''}
    });
  }
  st.league.myTeamId = st.teams[0].id;
  st.league.commishTeamId = st.teams[0].id;

  const rows = SEED_PLAYERS.trim().split(';').map(s=>s.trim()).filter(Boolean);
  const posBase = {QB:38, RB:52, WR:56, TE:32, K:4, DEF:5};
  const seen = {};
  st.players = rows.map(r=>{
    const [name,pos,nfl,age] = r.split('|');
    seen[pos] = (seen[pos]||0);
    const val = Math.max(1, Math.round((posBase[pos]||10) * Math.pow(0.935, seen[pos])));
    seen[pos]++;
    return { id:uid('p'), name, pos, nfl, age:+age||0, value:val, contract:null };
  });

  // snake assignment by value
  const pool = st.players.slice().sort((a,b)=> b.value-a.value);
  let idx=0, dir=1, ti=0;
  const S0 = S; S = st; // math helpers read the live state
  pool.forEach(p=>{
    p.contract = makeContract(st.teams[ti].id, p.value, 1, 'ev', st.league.season);
    ti += dir; if(ti>=n){ ti=n-1; dir=-1; } else if(ti<0){ ti=0; dir=1; }
    idx++;
  });
  // give the contracts real length + structure, then scale so year one lands near 80% of cap
  const structs = st.settings.contracts.structures.map(s=>s.id);
  pool.forEach((p,i)=>{
    const yrs = p.pos==='K'||p.pos==='DEF' ? 1 : clamp(1 + Math.floor(Math.pow(Math.random(),1.6)*5) + (p.age && p.age<25 ? 1 : 0), 1, 7);
    const sid = p.pos==='K'||p.pos==='DEF' ? 'ev' : structs[Math.floor(Math.random()*structs.length)];
    const startBack = Math.random()<0.45 ? 1 : 0;
    p.contract = makeContract(p.contract.teamId, p.value*yrs, yrs, sid, st.league.season - startBack);
  });
  const y1 = st.league.season;
  st.teams.forEach((t,ti)=>{
    const mine = st.players.filter(p=> p.contract && p.contract.teamId===t.id);
    const spend = sum(mine.map(p=> capHit(p,y1))) || 1;
    const scale = (st.settings.cap.base*(0.74 + (ti%5)*0.03))/spend;
    mine.forEach(p=>{
      p.value = Math.max(1, Math.round(p.value*scale));
      p.contract = makeContract(t.id, Math.max(1, roundInc(p.contract.total*scale)), p.contract.years, p.contract.structId, p.contract.startYear);
    });
  });

  // draft picks, 3 future years x 4 rounds
  st.picks = [];
  for(let y=st.league.season+1; y<=st.league.season+3; y++)
    for(let r=1;r<=4;r++)
      st.teams.forEach(t=> st.picks.push({id:uid('pk'), year:y, round:r, ownerTeamId:t.id, originTeamId:t.id}));

  st.rules = [
    {id:uid('r'), title:'Salary cap', body:'Every roster must be cap compliant at the moment of any transaction. The cap rises each offseason by the growth rate set in Settings. Teams over the cap cannot add salary until they clear space.'},
    {id:uid('r'), title:'Contracts', body:'Contracts run 1 to 10 years. Choose a structure at signing: front loaded, even, or back loaded. The structure fixes the yearly percentages for the life of the deal and cannot be changed later.'},
    {id:uid('r'), title:'Releases and dead cap', body:'Releasing a player leaves dead cap equal to the percentage set in Settings, charged against the remaining years of the deal.'},
    {id:uid('r'), title:'Trade block auctions', body:'An owner may post a player with an asking price. The first team to meet the ask starts the clock. Competing offers must be accepted by the posting owner to take the lead. The leading offer at zero is processed.'},
    {id:uid('r'), title:'Trade review and counters', body:'Accepted trades sit in a review window before they process. Any other team may counter during that window. The clock stops overnight and picks back up in the morning.'},
    {id:uid('r'), title:'League dues', body:'Dues are payable before the season opener. Rosters are locked for teams with unpaid dues.'}
  ];
  st.log = [{at:Date.now(), type:'admin', teams:[], players:[],
    text:'League created with '+n+' teams and '+st.players.length+' players under contract'}];
  S = S0;
  return st;
}

/* Signs in without a password. The commonest reason a saved password is
   refused on a new device is that the account never had one — the first device
   has simply been riding a session that never expired.
   One implementation, called from the sign-in screen and from Settings ›
   Server, so the two can never drift apart. */
async function sendSignInLink(email){
  email = String(email||'').trim().toLowerCase();
  if(!/.+@.+\..+/.test(email)) return {ok:false, err:'Put your email address in first.'};
  const back = Supa.redirectUrl();
  if(!back) return {ok:false, err:'This only works from the address the app is published at, '+
    'not from a file on your computer.'};
  try{
    if(!Supa.client) await Supa.init(true);
    if(!Supa.client) return {ok:false, err:'Could not reach the league. Try again in a moment.'};
    const {error} = await Supa.client.auth.signInWithOtp({email, options:{emailRedirectTo:back}});
    if(error) return {ok:false, err: /redirect|not allowed|invalid/i.test(error.message)
      ? 'Supabase would not send it, because '+back+' is not on its allow-list. '+
        'Add it under Authentication → URL Configuration as the Site URL, and again under Redirect URLs with /** on the end.'
      : error.message};
    return {ok:true, email, back};
  }catch(e){ return {ok:false, err:e.message}; }
}

    'That is what makes the next device work.</div>'+

/* Phones add things. A keyboard suggestion or a paste can leave a space on
   either end of the password, and the account was almost certainly made
   without it. Try exactly what was typed first — a space really can be part of
   a password — and only then try it trimmed. */
async function signInTolerant(email, pw){
  let r = await Supa.client.auth.signInWithPassword({email, password:pw});
  if(!r.error) return r;
  const t = pw.trim();
  if(t && t!==pw && /Invalid login/i.test(r.error.message||'')){
    const r2 = await Supa.client.auth.signInWithPassword({email, password:t});
    if(!r2.error) return r2;
  }
  return r;
}
/* Supabase says the same thing whether the address is unknown or the password
   is wrong, so the only honest answer is to lay out what it can be. */
function badLoginHelp(email, pw){
  const bits = ['That email and password do not match.'];
  if(pw !== pw.trim()) bits.push('There is a space at the '+
    (pw!==pw.replace(/^\s+/,'') ? 'start' : 'end')+' of the password — a phone keyboard often adds one.');
  if(/[A-Z]/.test(pw.charAt(0))) bits.push('The first letter is a capital. '+
    'If you tapped the eye to check it, the phone may have capitalised it for you.');
  /* The common one: the account was made with a sign-in link, so it has no
     password at all. Nothing typed will ever match until one is set. */
  bits.push('If you have only ever got in with the emailed link, this account has no password yet — '+
    'that is the usual reason. Get in with the link, then Settings \u2192 Server \u2192 '+
    '"Change my password" to set one, and it will work from then on.');
  const dom = String(email||'').split('@')[1] || '';
  const likely = {'yahooo.com':'yahoo.com','gmial.com':'gmail.com','gmai.com':'gmail.com',
    'hotmial.com':'hotmail.com','outlok.com':'outlook.com','yaho.com':'yahoo.com'}[dom.toLowerCase()];
  if(likely) bits.push('Also check the address — "'+dom+'" looks like a slip for "'+likely+'".');
  bits.push('Otherwise there may be no account on '+email+' yet, in which case use "Make my account".');
  return bits.join(' ');
}
ACT.gateGo = async ()=>{
  const g = ui.tmp.gate = ui.tmp.gate || {};
  const pend0 = (S.meta && S.meta.pendingInvite) || null;
  gateRead();
  g.err = null;
  const code = String(g.code||'').trim().toUpperCase();
  const email = String(g.email||'').trim().toLowerCase();
  const pw = String(g.pw||'');
  const mode = g.mode || 'new';

  const wantTeam = (pend0 && pend0.teamId) || g.team || null;
  if(!/.+@.+\..+/.test(email)){ g.err = 'That does not look like an email address.'; return render(); }
  if(pw.length < 6){ g.err = 'Six characters or more for the password.'; return render(); }
  if(!holdForCommish() && !code && g.lobby && g.lobby.length && !wantTeam && mode!=='old'){
    g.err = 'Pick which team is yours.'; return render();
  }

  g.busy = true; render();
  try{
    if(!Supa.client) await Supa.init(true);
    if(!Supa.client) throw new Error('Could not reach the league. Try again in a moment.');

    if(!Supa.user){
      let r;
      if(mode==='old'){
        r = await signInTolerant(email, pw);
        if(r.error) throw new Error(/Invalid login/i.test(r.error.message)
          ? badLoginHelp(email, pw) : r.error.message);
      } else {
        r = await Supa.client.auth.signUp({email, password:pw});
        if(r.error && /already|registered/i.test(r.error.message)){
          r = await Supa.client.auth.signInWithPassword({email, password:pw});
          if(r.error) throw new Error('There is already an account on that email. '+
            'Switch to "I already have one" and use its password.');
        } else if(r.error) throw r.error;
        if(!r.data.session) throw new Error('Your commissioner needs to switch off "Confirm email" in Supabase, '+
          'under Authentication → Sign In / Providers → Email.');
      }
      Supa.user = (r.data.session && r.data.session.user) || r.data.user || null;
    }

    /* A code still works for anybody holding one, but it is no longer the way
       in — the link is. With an account made, claiming a team is one call. */
    if(code){
      const {data, error} = await rpcTry([['redeem_code',{p_code:code, p_label:null}],
                                          ['join_league',{p_code:code, p_label:(Supa.user||{}).email||null}],
                                          ['join_open',{p_league:Supa.cfg().leagueId, p_label:(Supa.user||{}).email||null}]]);
      if(error) throw error;
      S.settings.supa.leagueId = data.league_id;
    } else if(Supa.cfg().leagueId){
      const {data, error} = await Supa.client.rpc('join_with_password', {
        p_league: Supa.cfg().leagueId,
        p_password: g.leaguePw || '',
        p_team: holdForCommish() ? null : wantTeam,
        p_label: email });
      if(error) throw new Error(/league password/i.test(error.message)
        ? 'That is not the league password. Ask whoever runs it for the word.'
        : error.message);
      S.settings.supa.leagueId = data.league_id;
    }
    S.settings.supa.on = true;
    if(S.meta) delete S.meta.pendingInvite;
    save(true);
    await Supa.loadMember();
    await Supa.pull(true);
    /* The server is the authority on which team they got; the link's copy is
       only a fallback for showing a name before any of this has happened. */
    const mine = (Supa.member && Supa.member.team_id) || '';
    if(mine){
      S.league.myTeamId = mine;
      ui.tmp.actAs = null;
      Store.set(KEY, S);
    }
    Supa.listen();
    ui.tmp.gate = null;
    route = 'dash';
    render();
    toast(mine ? 'Welcome — you are '+teamName(mine)
               : 'You are in — waiting on a team', mine?'good':'warn');
  }catch(e){
    g.busy = false; g.err = e.message; render();
  }
}

    if(o[parts[i]]==null || typeof o[parts[i]]!=='object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = v;
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]');
  if(!t) return;
  // form controls carry data-a too, but they are driven by change/input —
  // swallowing their click would stop a select from opening at all
  if(/^(SELECT|INPUT|TEXTAREA|OPTION)$/.test(t.tagName)) return;
  const fn = ACT[t.dataset.a];
  if(fn){ e.preventDefault(); fn(t.dataset, t, e); }
});
document.addEventListener('change', e=>{
  const t = e.target.closest('[data-set]');
  if(!t) return;
  // comp overrides are keyed "round.index", which would otherwise be read as
  // two levels of nesting
  if(/^settings\.supa\.(url|anonKey|on)$/.test(t.dataset.set)){
    setPath(t.dataset.set, val(t));
    save();

      Supa.init(true).then(ok=>{ render(); if(ok) toast('Connected to Supabase','good'); });
    }
    render();

  }
  const m = /^settings\.comp\.overrides\.(\d+)\.(\d+)$/.exec(t.dataset.set);
  if(m){
    S.settings.comp.overrides = S.settings.comp.overrides || {};
    const v = val(t);
    if(v==='' || v==null) delete S.settings.comp.overrides[m[1]+'.'+m[2]];

  /* A date box reads empty until every segment is filled. While it still has
     focus that means "mid-typing", not "cleared" — leave the stored value be. */
  if(t.type==='date' && val(t)==='' && document.activeElement===t) return;
  setPath(t.dataset.set, val(t));
  save();
  if(t.dataset.norender===undefined) render();

/* ============================================================
   SORTABLE COLUMNS
   Every table names its columns once; clicking a heading sorts by it and
   clicking the same one again turns it round.
   ============================================================ */
function sortOf(tid){ return (ui.tmp.sorts||{})[tid] || null; }
function sortTh(tid, key, label, cls){
  const cur = sortOf(tid), on = cur && cur.key===key;
  return '<th class="sortable'+(cls?' '+cls:'')+(on?' sorted':'')+'" data-a="sortBy" data-t="'+esc(tid)+
    '" data-k="'+esc(key)+'">'+label+'<i class="sarr">'+(on ? (cur.dir>0?'▲':'▼') : '')+'</i></th>';
}
/* Blanks always sink, whichever way round the column is. */
function sortRows(tid, rows, cols, fallback){
  const cur = sortOf(tid) || fallback;
  if(!cur || !cols[cur.key]) return rows;
  const f = cols[cur.key], dir = cur.dir>0 ? 1 : -1;
  return rows.slice().sort((a,b)=>{
    const va = f(a), vb = f(b);
    const ea = (va==null || va==='' || (typeof va==='number' && isNaN(va)));
    const eb = (vb==null || vb==='' || (typeof vb==='number' && isNaN(vb)));
    if(ea && eb) return 0;
    if(ea) return 1;
    if(eb) return -1;
    if(typeof va==='number' && typeof vb==='number') return (va-vb)*dir;
    return String(va).localeCompare(String(vb), undefined, {numeric:true}) * dir;
  });
}
ACT.sortBy = (d)=>{
  ui.tmp.sorts = ui.tmp.sorts || {};
  const cur = ui.tmp.sorts[d.t];
  ui.tmp.sorts[d.t] = (cur && cur.key===d.k) ? {key:d.k, dir:-(cur.dir||1)} : {key:d.k, dir:1};
  render();
};
