function nflCodes(){ return Array.from(new Set(S.players.map(p=>p.nfl).filter(Boolean))).sort(); }
function rosterOf(code){ return S.players.filter(p=> p.nfl===code && p.pos!=='DEF'); }
function defOf(code){ return S.players.find(p=> p.pos==='DEF' && p.nfl===code); }
function stat(pid){ return (S.live.stats[pid] = S.live.stats[pid] || {}); }
function bump(pid,k,v){ const s=stat(pid); s[k]=Math.round(((s[k]||0)+v)*100)/100; }
function pickOne(a){ return a.length ? a[Math.floor(Math.random()*a.length)] : null; }
function weighted(list){
  const tot = sum(list.map(x=>x.w)); let r = Math.random()*tot;
  for(const x of list){ if((r-=x.w) <= 0) return x.v; }
  return list.length ? list[list.length-1].v : null;
}

/* The last week of the regular season — the one played on the table. */
function lastRegularWeek(){
  const start = +((S.settings.playoffs||{}).startWeek) || 0;
  return start > 1 ? start - 1 : seasonWeeks();
}
/* On that week the table decides who plays whom: first against second, third
   against fourth, and on down. */
function seededWeekMatchups(){
  const order = standings().map(x=> (x && x.t && x.t.id) || (x && x.id) || x).filter(Boolean);
  const m = [];
  for(let i=0; i+1 < order.length; i += 2) m.push({home:order[i], away:order[i+1]});
  return m;
}
/* The fixtures for one week, if the league has a schedule of its own. */
function fixturesFor(week){
  return (S.fixtures||[]).filter(g=> +g.week===+week && byId(S.teams,g.home) && byId(S.teams,g.away))
    .map(g=> ({home:g.home, away:g.away}));
}
/* Every week this league has fixtures for. */
function fixtureWeeks(){
  const w = {};
  (S.fixtures||[]).forEach(g=> w[+g.week]=true);
  return Object.keys(w).map(Number).sort((a,b)=>a-b);
}
function buildWeek(week){
  const ids = S.teams.map(t=>t.id).slice();
  if(ids.length % 2) ids.push(null);
  const n = ids.length, arr = ids.slice();
  for(let i=0; i<((week-1) % Math.max(1,n-1)); i++){ const fixed=arr.shift(); arr.unshift(arr.pop()); arr.unshift(fixed); arr.splice(1,0,arr.splice(1,1)[0]); }
  const rot = arr.slice(1); const shift = (week-1) % Math.max(1,rot.length);
  const ordered = [arr[0]].concat(rot.slice(shift), rot.slice(0,shift));
  const m=[];
  for(let i=0;i<n/2;i++){ const a=ordered[i], b=ordered[n-1-i]; if(a&&b) m.push({home:a, away:b}); }
  /* The table decides the last week before the playoffs; otherwise a schedule
     the league set beats the generated rotation. */
  const seeded = ((S.settings.playoffs||{}).seedLastWeek !== false) && +week === lastRegularWeek()
    ? seededWeekMatchups() : [];
  const set = fixturesFor(week);
  S.live.matchups = seeded.length ? seeded : (set.length ? set : m);

  const codes = nflCodes().slice();
  for(let i=codes.length-1;i>0;i--){ const j=(i*7+week*3)%(i+1); const t=codes[i]; codes[i]=codes[j]; codes[j]=t; }
  const g=[];
  for(let i=0;i+1<codes.length;i+=2)
    g.push({id:'g'+(i/2), home:codes[i+1], away:codes[i], hs:0, as:0, q:1, clock:900, status:'pre', poss:codes[i]});
  S.live.games=g; S.live.stats={}; S.live.feed=[]; S.live.week=week;
}
function addScore(g, side, pts){
  if(side==='home'){ g.hs+=pts; const d=defOf(g.away); if(d) bump(d.id,'pts_allow',pts); }
  else { g.as+=pts; const d=defOf(g.home); if(d) bump(d.id,'pts_allow',pts); }
}
function feed(g, text){
  S.live.feed.unshift({at:Date.now(), g:g.id, text});
  if(S.live.feed.length>90) S.live.feed.length=90;
  bigPlayCheck(text);
}
/* Notify on a big play by one of the user's starters. Scoring feed lines read
   like "<Name> 42-yd rushing TD"; we match a starter's name and, for a TD or a
   long play, push a notice (once — the feed line is unique per play). */
function bigPlayCheck(text){
  const pref = (S.settings.notify||{});
  if(!pref.bigPlays) return;
  if(!/TD|touchdown|field goal|pick six/i.test(text)) return;   /* scoring plays only */
  const L = lineupFor(S.league.myTeamId);
  if(!L || !L.slots) return;
  const mine = L.slots.filter(x=>x.p).map(x=>x.p);
  const hit = mine.find(pl=> pl && pl.name && text.indexOf(pl.name)===0);  /* line starts with the scorer */
  if(hit) notify('Big play — '+hit.name, text, 'good');
}
function playEvent(g){
  const off = g.poss, def = off===g.home ? g.away : g.home;
  const side = off===g.home ? 'home' : 'away';
  const R = rosterOf(off);
  const qb = pickOne(R.filter(p=>p.pos==='QB'));
  const rbs = R.filter(p=>p.pos==='RB'), tgts = R.filter(p=>p.pos==='WR'||p.pos==='TE');
  const k = pickOne(R.filter(p=>p.pos==='K'));
  const dst = defOf(def);
  const r = Math.random();

  if(r < .045 && qb){                                   // interception
    bump(qb.id,'pass_int',1); bump(qb.id,'pass_att',1); bump(qb.id,'pass_inc',1);
    if(dst) bump(dst.id,'int',1);
    if(Math.random()<.12 && dst){
      bump(dst.id,'def_td',1); bump(qb.id,'pass_int_td',1);
      addScore(g, side==='home'?'away':'home', 7); feed(g, dst.name+' pick six');
    } else feed(g, qb.name+' intercepted');
    g.poss = def; return;
  }
  if(r < .085){                                          // sack
    if(dst){ bump(dst.id,'sack',1); bump(dst.id,'sack_yd',3+Math.floor(Math.random()*7)); }
    if(qb) bump(qb.id,'pass_sack',1);
    if(qb && Math.random()<.14){
      bump(qb.id,'fum',1); bump(qb.id,'fum_lost',1);
      if(dst) bump(dst.id,'fum_rec',1);
      feed(g, qb.name+' strip-sacked'); g.poss=def;
    }
    return;
  }
  if(r < .12 && k){                                      // field goal
    const dist = 20+Math.floor(Math.random()*38);
    const band = dist>=50?'50p' : dist>=40?'40_49' : dist>=30?'30_39' : dist>=20?'20_29' : '0_19';
    if(Math.random() < (dist>50 ? .62 : dist>40 ? .8 : .93)){
      bump(k.id,'fgm_'+band,1); bump(k.id,'fgm',1);
      bump(k.id,'fgm_yds',dist); if(dist>30) bump(k.id,'fgm_yds_over_30',dist-30);
      addScore(g, side, 3); feed(g, k.name+' '+dist+'-yd field goal good');
    } else { bump(k.id,'fgmiss_'+band,1); bump(k.id,'fgmiss',1); feed(g, k.name+' misses from '+dist); }
    g.poss = def; return;
  }
  if(r < .42 && rbs.length){                             // run
    const rb = weighted(rbs.map((p,i)=>({v:p, w:Math.max(1, 10-i*4)})));
    const yd = Math.max(-4, Math.round((Math.random()*Math.random()*26) - 1));
    bump(rb.id,'rush_yd',yd); bump(rb.id,'rush_att',1);
    if(yd>=10) bump(rb.id,'rush_fd',1);
    if(yd>=40) bump(rb.id,'rush_40p',1);
    if(Math.random()<.055){
      bump(rb.id,'rush_td',1); if(yd>=40) bump(rb.id,'rush_td_40p',1);
      addScore(g, side, 7); if(k) bump(k.id,'xpm',1);
      feed(g, rb.name+' '+Math.max(1,yd)+'-yd rushing TD'); g.poss=def;
    } else if(Math.random()<.012){
      bump(rb.id,'fum',1); bump(rb.id,'fum_lost',1); if(dst) bump(dst.id,'fum_rec',1);
      feed(g, rb.name+' fumbles'); g.poss=def;
    }
    return;
  }
  if(qb && tgts.length){                                 // pass
    bump(qb.id,'pass_att',1);
    if(Math.random()<.32){ bump(qb.id,'pass_inc',1); return; }
    const tg = weighted(tgts.map((p,i)=>({v:p, w:Math.max(1, 12-i*3) * (p.pos==='TE'?.7:1)})));
    const yd = Math.max(-3, Math.round(Math.random()*Math.random()*44));
    bump(qb.id,'pass_yd',yd); bump(qb.id,'pass_cmp',1);
    bump(tg.id,'rec',1); bump(tg.id,'rec_yd',yd);
    const band = yd<5?'rec_0_4' : yd<10?'rec_5_9' : yd<20?'rec_10_19' : yd<30?'rec_20_29' : yd<40?'rec_30_39' : 'rec_40p';
    bump(tg.id, band, 1);
    if(yd>=10){ bump(qb.id,'pass_fd',1); bump(tg.id,'rec_fd',1); }
    if(yd>=40) bump(qb.id,'pass_cmp_40p',1);
    if(Math.random()<.062){
      bump(qb.id,'pass_td',1); bump(tg.id,'rec_td',1);
      if(yd>=40){ bump(qb.id,'pass_td_40p',1); bump(tg.id,'rec_td_40p',1); }
      addScore(g, side, 7); if(k) bump(k.id,'xpm',1);
      feed(g, qb.name+' → '+tg.name+' '+Math.max(1,yd)+'-yd TD');
      g.poss = def;
    }
    return;
  }
  g.poss = def;
}
function simTick(){
  const sp = clamp(+S.settings.live.speed||1, 1, 30);
  let changed=false;
  S.live.games.forEach(g=>{
    if(g.status==='final') return;
    if(g.status==='pre') g.status='live';
    for(let i=0;i<sp;i++){
      g.clock -= 16 + Math.random()*30;
      if(Math.random()<.6) playEvent(g);
      if(g.clock<=0){ g.clock=900; g.q++; if(g.q>4){ g.q=4; g.clock=0; g.status='final'; break; } }
    }
    changed=true;
  });
  S.live.lastTick=Date.now();
  return changed;
}
/* Points allowed and yards allowed are banded — a defense only ever collects
   from the one band it lands in. Same for the yardage game bonuses. */
function ptsAllowKey(pa){
  return pa<=0?'pts_allow_0' : pa<=6?'pts_allow_1_6' : pa<=13?'pts_allow_7_13' : pa<=20?'pts_allow_14_20'
       : pa<=27?'pts_allow_21_27' : pa<=34?'pts_allow_28_34' : 'pts_allow_35p';
}
function ydsAllowKey(y){
  return y<100?'yds_allow_0_100' : y<200?'yds_allow_100_199' : y<300?'yds_allow_200_299'
       : y<350?'yds_allow_300_349' : y<400?'yds_allow_350_399' : y<450?'yds_allow_400_449'
       : y<500?'yds_allow_450_499' : y<550?'yds_allow_500_549' : 'yds_allow_550p';
}
const BAND_KEYS = {};
['pts_allow_0','pts_allow_1_6','pts_allow_7_13','pts_allow_14_20','pts_allow_21_27','pts_allow_28_34','pts_allow_35p',
 'yds_allow_0_100','yds_allow_100_199','yds_allow_200_299','yds_allow_300_349','yds_allow_350_399',
 'yds_allow_400_449','yds_allow_450_499','yds_allow_500_549','yds_allow_550p',
 'bonus_pass_yd_300','bonus_pass_yd_400','bonus_rush_yd_100','bonus_rush_yd_200','bonus_rec_yd_100','bonus_rec_yd_200',
 'bonus_rush_rec_yd_100','bonus_rush_rec_yd_200','bonus_pass_cmp_25','bonus_rush_att_20',
 'bonus_rec_rb','bonus_rec_wr','bonus_rec_te'].forEach(k=> BAND_KEYS[k]=1);

function fpts(pid){
  const s = S.live.stats[pid]; if(!s) return 0;
  return scoreLine(s, byId(S.players,pid));
}
/* Score any stat line with this league's own settings — the live feed, a past
   week, or a projection. */
function scoreLine(s, p){
  if(!s) return 0;
  const c = S.settings.scoring;
  let t = 0;
  /* Straight rate categories: the stat and the setting share a name. */
  for(const k in c){
    if(BAND_KEYS[k]) continue;
    const rate = +c[k]||0; if(!rate) continue;
    const n = +s[k]||0; if(n) t += n*rate;
  }
  const has = (k)=> s[k]!=null;
  if(p && p.pos==='DEF'){
    if(has('pts_allow')) t += +c[ptsAllowKey(+s.pts_allow||0)]||0;
    if(has('yds_allow')) t += +c[ydsAllowKey(+s.yds_allow||0)]||0;
  }
  const py=+s.pass_yd||0, ry=+s.rush_yd||0, rey=+s.rec_yd||0;
  if(py>=400) t += +c.bonus_pass_yd_400||0; else if(py>=300) t += +c.bonus_pass_yd_300||0;
  if(ry>=200) t += +c.bonus_rush_yd_200||0; else if(ry>=100) t += +c.bonus_rush_yd_100||0;
  if(rey>=200) t += +c.bonus_rec_yd_200||0; else if(rey>=100) t += +c.bonus_rec_yd_100||0;
  if(ry+rey>=200) t += +c.bonus_rush_rec_yd_200||0; else if(ry+rey>=100) t += +c.bonus_rush_rec_yd_100||0;
  if((+s.pass_cmp||0)>=25) t += +c.bonus_pass_cmp_25||0;
  if((+s.rush_att||0)>=20) t += +c.bonus_rush_att_20||0;
  const recs = +s.rec||0;
  if(recs && p){
    if(p.pos==='RB') t += recs*(+c.bonus_rec_rb||0);
    else if(p.pos==='WR') t += recs*(+c.bonus_rec_wr||0);
    else if(p.pos==='TE') t += recs*(+c.bonus_rec_te||0);
  }
  return Math.round(t*100)/100;
}
const LINE_LABELS = [
  ['pass_yd','pass yd'],['pass_td','pass TD'],['pass_int','INT'],['pass_cmp','cmp'],
  ['rush_yd','rush yd'],['rush_td','rush TD'],['rush_att','car'],
  ['rec','rec'],['rec_yd','rec yd'],['rec_td','rec TD'],
  ['fum_lost','fum lost'],['xpm','XP'],
  ['sack','sack'],['int','INT'],['fum_rec','fum rec'],['def_td','def TD'],
  ['tkl','tkl'],['idp_tkl','tkl'],['idp_sack','sack'],['idp_int','INT']
];
function statLine(p){
  const s = S.live.stats[p.id]; if(!s) return '<span class="dim">—</span>';
  const bits = [];
  LINE_LABELS.forEach(([k,l])=>{ if(s[k]) bits.push(s[k]+' '+l); });
  const fg = (+s.fgm||0)+(+s.fgm_0_19||0)+(+s.fgm_20_29||0)+(+s.fgm_30_39||0)+(+s.fgm_40_49||0)+(+s.fgm_50p||0);
  if(fg) bits.splice(0,0, fg+' FG');
  if(p.pos==='DEF' && s.pts_allow!=null) bits.push((+s.pts_allow||0)+' allowed');
  return bits.length ? '<span class="muted tiny">'+esc(bits.join(' · '))+'</span>' : '<span class="dim">—</span>';
}
/* The NFL game a player is in this week, if any. */
function gameForPlayer(p){
  if(!p || !p.nfl) return null;
  const o = thisWeekOpponent(p.nfl);
  return o ? o.game : null;
}
/* Locked once that game is no longer 'pre'. A player on a bye has no game, so
   nothing to lock — they simply cannot be started. Commissioners are never
   locked, so a genuine mistake can still be fixed. */
function playerLocked(p){
  if(isCommish()) return false;
  const g = gameForPlayer(p);
  return !!g && g.status !== 'pre';
}
function lineupLockNote(){
  const games = S.live.games || [];
  const started = games.filter(g=> g.status!=='pre').length;
  if(!started) return '';
  const total = games.length;
  return started>=total ? 'Every game this week has kicked off — lineups are locked.'
    : started+' of '+total+' games have kicked off. Anyone whose game has started is locked.';
}
/* Fantasy points a whole NFL offense has produced per game this season.
   Built from season totals we already keep, so no new tracking. */
function offenseVal(code){
  const by = ((S.season||{}).byPlayer)||{};
  let pts = 0, gpMax = 0;
  S.players.filter(x=> x.nfl===code && x.pos!=='DEF').forEach(x=>{
    const l = by[x.id]; if(!l || !l.gp) return;
    pts += l.fpts||0;
    if(l.gp>gpMax) gpMax = l.gp;     // team games ≈ its busiest player's games
  });
  return gpMax ? pts/gpMax : null;
}
/* Rank an offense against all offenses, best first. So rank 1 = the strongest
   offense in the league = the toughest matchup for a defense across from it. */
function offenseRank(code){
  const codes = nflCodes();
  const rows = codes.map(c=>({c, v:offenseVal(c)})).filter(x=> x.v!=null).sort((a,b)=> b.v-a.v);
  if(rows.length < 3) return null;
  const i = rows.findIndex(x=> x.c===code);
  return i<0 ? null : {rank:i+1, of:rows.length, val:rows[i].v};
}
/* For a DEFENSE, difficulty runs the other way round from a hitter: facing a
   TOP offense (low rank) is the HARD week, so flip the percentile. */
function defStreamDifficulty(code){
  const r = offenseRank(code);
  if(!r) return null;
  /* offenseRank is best-first, so rank 1 is the strongest offense — the hardest
     week for a defense. That is exactly how the hitter percentile already runs
     (low rank = hard), so use it straight: rank/of, small = Brutal. */
  const pctile = r.rank / r.of;
  return { rank:r.rank, of:r.of, val:r.val, band: DIFF.find(d=> pctile <= d.max) || DIFF[2] };
}
/* Plain text — no markup — for a dropdown <option>, e.g. "vs CAR · Smash" or
   "@ SF · Brutal". A defense reads against the offense it faces. Empty on a bye
   or before there is enough data to rate it. */
function matchupTag(p){
  if(!p) return '';
  const o = thisWeekOpponent(p.nfl);
  if(!o) return 'bye';
  const face = (o.home?'@ ':'vs ')+o.code;
  if(p.pos==='DEF'){
    const ds = defStreamDifficulty(o.code);
    return ds ? face+' · '+ds.band.label : face;
  }
  const m = matchupFor(p);
  return (m && m.diff) ? face+' · '+m.diff.label : face;
}
function matchupLine(p){
  if(!p) return '';
  const o = thisWeekOpponent(p.nfl);
  if(!o){
    // no game this week — a bye, or an unmapped team
    return '<span class="tiny dim">on a bye — nothing this week</span>';
  }
  const face = (o.home?'@ ':'vs ')+esc(o.code);
  const started = o.game.status!=='pre';
  const when = o.game.status==='final' ? 'final' : o.game.status!=='pre' ? 'playing now' : '';

  if(p.pos==='DEF'){
    /* A defense's week is the offense across from it: an easy stream against a
       weak offense, a hard one against a strong offense. */
    const ds = defStreamDifficulty(o.code);
    const own = (S.dvp||{})[p.nfl];
    const form = (own && own.games) ? Math.round((sum(Object.values(own.pos).map(x=>x.f||0))/own.games)*10)/10 : null;
    if(!ds){
      return '<span class="pill" title="not enough games on that offense yet">'+face+'</span>'+
        (when?' <span class="tiny '+(o.game.status==='final'?'dim':'live')+'">'+when+'</span>':'')+
        (form!=null?' <span class="tiny dim" title="fantasy points this defense gives up per game">gives up '+form+'/gm</span>':'')+
        ' <span class="tiny dim">offense data still thin</span>';
    }
    const cls = ds.band.cls==='bad'?'live':ds.band.cls==='good'?'ok':'';
    return '<span class="pill '+cls+'">'+face+' · '+esc(ds.band.label)+'</span>'+
      (when?' <span class="tiny '+(o.game.status==='final'?'dim':'live')+'">'+when+'</span>':'')+
      ' <span class="tiny dim" title="how that offense ranks in fantasy points scored, best first">'+
        esc(o.code)+' offense '+ds.rank+' of '+ds.of+'</span>'+
      (form!=null?' <span class="tiny dim">· gives up '+form+'/gm</span>':'');
  }

  const m = matchupFor(p);
  if(!m || !m.diff){
    return '<span class="pill" title="not enough games on this defense yet">'+face+'</span>'+
      (when?' <span class="tiny '+(o.game.status==='final'?'dim':'live')+'">'+when+'</span>':'')+
      ' <span class="tiny dim">matchup data still thin</span>';
  }
  const cls = m.diff.cls==='bad'?'live':m.diff.cls==='good'?'ok':'';
  const posBit = m.byPos ? m.byPos.rank+' of '+m.byPos.of+' vs '+p.pos : '';
  const splitBit = m.bySplit ? m.bySplit.rank+' of '+m.bySplit.of+' vs the '+m.kind : '';
  return '<span class="pill '+cls+'">'+face+' · '+esc(m.diff.label)+'</span>'+
    (when?' <span class="tiny '+(o.game.status==='final'?'dim':'live')+'">'+when+'</span>':'')+
    (posBit?' <span class="tiny dim">'+esc(posBit)+'</span>':'')+
    (splitBit?' <span class="tiny dim">· '+esc(splitBit)+'</span>':'');
}
function bestLineup(teamId){
  const pool = teamPlayers(teamId).map(p=>({p, pts:fpts(p.id)})).sort((a,b)=> b.pts-a.pts);
  const used = {}, starters=[];
  S.settings.roster.slots.forEach(sl=>{
    for(let i=0;i<sl.count;i++){
      const c = pool.find(x=> !used[x.p.id] && sl.eligible.indexOf(x.p.pos)>=0);
      starters.push({slot:sl.label, p:c?c.p:null, pts:c?c.pts:0});
      if(c) used[c.p.id]=1;
    }
  });
  return { starters, total:Math.round(sum(starters.map(s=>s.pts))*100)/100, bench:pool.filter(x=>!used[x.p.id]) };
}

/* ---- Live from Sleeper -----------------------------------------------------

   on a timer. Projections come down the same way and refresh when the week
   changes, so nobody has to press anything. */
let lastSleeperStats = 0, lastProjWeek = null, sleeperBusy = false;
async function pollSleeperStats(){
  if(sleeperBusy) return;
  const season = S.league.season, week = S.live.week || 1;
  sleeperBusy = true;
  try{
    const j = await getJSON(SLEEPER+'/stats/nfl/regular/'+season+'/'+week);
    if(j && typeof j==='object'){
      let n = 0;
      S.players.forEach(p=>{

        if(!line) return;

        n++;
      });

        S.live.statsAt = Date.now();
        if(route==='live') render();

}
/* Projections for the current week, fetched once per week automatically. */
async function autoProjections(){
  const week = S.live.week || 1;
  if(lastProjWeek === week) return;
  const st = projStore();
  if(st.week === week && st.byPlayer && Object.keys(st.byPlayer).length){ lastProjWeek = week; return; }
  lastProjWeek = week;                       /* only one attempt per week */

}
async function pollEndpoint(){
  const u = statsUrl();
  if(S.settings.live.mode!=='endpoint' || !u) return;
  try{
    const r = await fetch(u, {headers:{accept:'application/json'}});
    if(!r.ok) throw new Error('server said '+r.status);

function applyFeed(j){
  if(!j || typeof j!=='object') throw new Error('expected a JSON object');
  if(Array.isArray(j.games)) S.live.games = j.games;
  if(j.stats && typeof j.stats==='object'){
    Object.keys(j.stats).forEach(k=>{
      const p = byId(S.players,k) || S.players.find(x=> x.name.toLowerCase()===String(k).toLowerCase());
      if(p) S.live.stats[p.id] = Object.assign({}, S.live.stats[p.id], j.stats[k]);
    });
  }
  S.live.lastTick = Date.now(); save(); render();
}

const TEAM_COLORS = ['#E5A13C','#5BC496','#7FB2D9','#FF5C39','#B39CE0','#E3B05E','#78B6E8','#F27E7E','#7FD48F','#8FA3B6','#D98CC0','#6FD3C7'];
function teamPaint(t){
  const main = (t && t.color) || TEAM_COLORS[Math.abs(hashStr((t&&t.id)||'x')) % TEAM_COLORS.length];
  return { main, dark: shade(main,-32), light: shade(main,34), accent: shade(main,-12) };

/* The uniform worn over the body. An explicit t.uniform wins; otherwise it is
   derived from the body colour so every mascot is dressed. */
function teamUniform(t){
  const u = t && t.uniform;
  if(u && u.jersey) return {jersey:u.jersey, pants:u.pants||shade(u.jersey,-28), trim:u.trim||'#FFFFFF'};
  const main = (t && t.color) || TEAM_COLORS[Math.abs(hashStr((t&&t.id)||'x')) % TEAM_COLORS.length];
  return {jersey:main, pants:shade(main,-34), trim:shade(main,40)};

function hashStr(x){ let h=0; for(let i=0;i<String(x).length;i++) h=(h*31 + String(x).charCodeAt(i))|0; return h; }
function shade(hex, d){

/* Every colour a club wears, each usable as EITHER jersey or pants, crossed
   completely — so a club with five colours gives twenty-five looks, including
   the mono kits (all-white, all-black) teams actually wear. */
function nflPalette(code){
  const t = NFL_TEAMS[code]; if(!t) return {};
  const pal = {};
  Object.keys(t.jerseys||{}).forEach(n=> pal[n] = t.jerseys[n]);
  Object.keys(t.pants||{}).forEach(n=> pal[n] = t.pants[n]);
  Object.keys(t.extra||{}).forEach(n=> pal[n] = t.extra[n]);
  /* the club's own body and trim colours belong in the mix too */
  if(t.body && !Object.values(pal).includes(t.body)) pal[t.bodyName||'Team'] = t.body;
  if(t.trim && !Object.values(pal).includes(t.trim)) pal[t.trimName||'Trim'] = t.trim;
  if(!Object.values(pal).includes('#FFFFFF')) pal.White = '#FFFFFF';
  return pal;
}
function nflCombos(code){
  const t = NFL_TEAMS[code]; if(!t) return [];
  const pal = nflPalette(code);
  const names = Object.keys(pal);
  const out = [];
  names.forEach(jn=> names.forEach(pn=>{
    out.push({ name: jn+' / '+pn, jersey:pal[jn], pants:pal[pn], trim:t.trim });
  }));
  return out;
}

const TAUNTS = {
  flex:     {name:'Flex',     line:'Look at this.'},
  point:    {name:'Point',    line:'You. Yeah, you.'},
  roar:     {name:'Roar',     line:"LET'S GOOOO."},

  nap:      {name:'Nap',      line:'Wake me if it gets close.'}

const TAUNT_MS = 9000;
function activeTaunt(teamId){
  const t = S.live.taunt;
  if(!t || t.teamId!==teamId) return null;
  return (Date.now() - t.at < TAUNT_MS) ? t.key : null;
}
function foFootball(){
  /* Brown ball with laces. Its own group so the spike animation can throw it
     independently of the arm. Sits just past the right hand at rest. */
  return '<g class="m-ball">'+
    '<ellipse cx="100" cy="52" rx="9" ry="6" fill="#7A3B1E" stroke="#5A2A12" stroke-width="1.5"/>'+
    '<path d="M95 52h10" stroke="#F2E6D8" stroke-width="1.6" stroke-linecap="round"/>'+
    '<path d="M97 50v4M100 49.4v5.2M103 50v4" stroke="#F2E6D8" stroke-width="1.3" stroke-linecap="round"/>'+
  '</g>';
}
function mascotSVG(key, paint, stage, cls, kit, uni){
  const m = MASCOTS[key] || MASCOTS.wolf;
  const k = kit || {};
  const u = uni || {jersey:paint.main, pants:paint.dark, trim:paint.light};
  const spiking = /\bfo-t-spike\b/.test(cls||'');
  const eyes = (typeof MASCOT_EYES==='object' && MASCOT_EYES[key]) || [[53,23],[67,23]];
  const slung = stage>=3;   /* an arm in a sling at the worst stage */
  const part = (which)=> Object.keys(KIT)
    .filter(x=> k[x] && (KIT[x].part||'head')===which)
    .map(x=> KIT[x].draw(paint)).join('');
  const injured = stage>=2 ? ' fo-injured' : '';
  return '<g class="fo-anim '+(cls||'')+injured+'">'+
    part('back')+
    foLegs(paint, u)+
    foArmL(paint, u)+
    foTorso(paint, part('torso'), u)+
    '<g class="m-head">'+m.head(paint)+foEyes(stage, key)+foMouth(key, stage)+part('head')+'</g>'+
    foArmR(paint, u, slung)+
    (spiking ? foFootball() : '')+
    foDamage(stage, eyes)+
  '</g>';
}
/* Damage is read off the deficit, not the health bar, so the steps land where
   a fantasy manager expects them: a touchdown behind stings, five is a mauling. */
function brawlSide(pts, oppPts){
  const behind = Math.max(0, oppPts - pts);
  return {
    hp: clamp(Math.round(100 - behind*2.4), 3, 100),
    stage: behind < 8 ? 0 : behind < 20 ? 1 : behind < 35 ? 2 : 3,
    ahead: pts > oppPts,
    behind
  };
}
function hpColor(hp){ return hp>60 ? 'var(--sage)' : hp>30 ? 'var(--brass)' : 'var(--signal)'; }
function lastTalk(teamId){
  return (S.live.talk||[]).filter(t=> t.teamId===teamId)[0] || null;
}
/* Shown when there is no matchup this week. Everything the brawl gives you
   except an opponent to swing at — so the mascots are never unreachable. */
function soloMascotPanel(t){
  if(!t) return '';
  const paint = teamPaint(t), uni = teamUniform(t);
  const ta = activeTaunt(t.id);
  return `
  <div class="panel" style="margin-top:14px">
    <div class="ph"><h3>Your mascot</h3><div class="spacer"></div>
      <span class="tiny dim">no matchup this week</span>
      <button class="btn ghost sm" data-a="pickMascot">Customise</button></div>
    <div class="pb">
      <div class="brawlstage" style="text-align:center">
        <svg viewBox="0 0 240 190" style="max-width:260px">
          <g transform="translate(60,40)">${mascotSVG(t.mascot||'wolf', paint, 0, ta?'fo-t-'+ta:'fo-idle', t.kit, uni)}</g>
        </svg>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">
        ${Object.keys(TAUNTS).map(k=>`<button class="btn sm ${ta===k?'on':''}" data-a="taunt" data-k="${k}"
          title="${esc(TAUNTS[k].line)}">${esc(TAUNTS[k].name)}</button>`).join('')}
      </div>
      <div class="hint">Once a schedule is running this turns into the mascot brawl against your opponent.</div>
    </div>
  </div>`;
}
function brawlPanel(myId, oppId, myPts, oppPts){
  const A = byId(S.teams,myId), B = byId(S.teams,oppId);
  if(!A || !B) return '';
  const pa = teamPaint(A), pb = teamPaint(B);
  const sa = brawlSide(myPts, oppPts), sb = brawlSide(oppPts, myPts);
  const cls = (side, other, team)=>{
    /* If the week is closed and this team lost, it is knocked out on the floor
       until the next kickoff — that beats any taunt or live state. */
    if((S.live.koLosers||{})[team.id]) return 'fo-ko';
    const t = activeTaunt(team.id);
    if(t) return 'fo-t-'+t;
    return side.hp<=8 ? 'fo-out' : side.ahead ? 'fo-win' : (other.ahead ? 'fo-lose' : 'fo-idle');
  };
  const margin = Math.abs(myPts-oppPts);
  const ta = lastTalk(myId), tb = lastTalk(oppId);
  const blurb = margin<3 ? 'Nobody has landed anything yet.'
    : margin<10 ? esc((myPts>oppPts?A:B).name)+' is getting the better of it.'
    : margin<25 ? esc((myPts>oppPts?A:B).name)+' is winning this on points.'
    : margin<45 ? 'Somebody should stop this.'
    : 'It is over and nobody told the loser.';

  return `<div class="panel" style="margin-bottom:14px">
    <div class="ph"><h3>Mascot brawl</h3><div class="spacer"></div>
      <span class="tiny muted hide-xs">${blurb}</span>
      <button class="btn ghost sm" data-a="pickMascot">Customise</button></div>
    <div class="pb">
      <div class="row" style="gap:14px;align-items:flex-start;margin-bottom:10px">
        <div class="corner"><div class="who"><b style="color:${pa.main}">${esc(A.name)}</b><span class="num">${myPts.toFixed(1)}</span></div>
          <div class="hpbar"><i style="width:${sa.hp}%;background:${hpColor(sa.hp)}"></i></div></div>
        <div class="corner r"><div class="who"><b style="color:${pb.main}">${esc(B.name)}</b><span class="num">${oppPts.toFixed(1)}</span></div>
          <div class="hpbar"><i style="width:${sb.hp}%;background:${hpColor(sb.hp)}"></i></div></div>
      </div>
      <div class="bubs">
        ${ta?`<div class="bub l"><span class="who">${esc(A.mascotName||A.name)}</span>${esc(ta.text)}</div>`:''}
        ${tb?`<div class="bub r"><span class="who">${esc(B.mascotName||B.name)}</span>${esc(tb.text)}</div>`:''}
      </div>
      <div class="arena">
        <svg viewBox="0 0 460 200" role="img" aria-label="${esc(A.name)} versus ${esc(B.name)}">
          <rect class="floor" x="0" y="168" width="460" height="32"/>
          <ellipse cx="90" cy="170" rx="46" ry="7" fill="#000" opacity=".35"/>
          <ellipse cx="370" cy="170" rx="46" ry="7" fill="#000" opacity=".35"/>
          <g transform="translate(30,55)">${mascotSVG(A.mascot||'wolf', pa, (S.live.koLosers||{})[A.id]?3:sa.stage, cls(sa,sb,A), A.kit, teamUniform(A))}</g>
          <g transform="translate(430,55) scale(-1,1)">${mascotSVG(B.mascot||'bear', pb, (S.live.koLosers||{})[B.id]?3:sb.stage, cls(sb,sa,B), B.kit, teamUniform(B))}</g>
          ${margin>=6?`<g class="pow" transform="translate(230,95)">
            <path d="M0-26 7-9 25-13 13 1 26 14 8 12 4 30-4 13-22 17-11 2-24-12-6-9z" fill="var(--brass)"/>
            <text x="0" y="6" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700"
              font-size="15" fill="#231704">${margin>=45?'DONE':margin>=25?'CRUNCH':'POW'}</text></g>`:''}
        </svg>
      </div>
      <div class="row" style="margin-top:10px;gap:5px">
        ${Object.keys(TAUNTS).map(k=>`<button class="btn sm ${activeTaunt(myId)===k?'on':''}" data-a="taunt" data-k="${k}"
          title="${esc(TAUNTS[k].line)}">${esc(TAUNTS[k].name)}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="talkbox" data-k="talkbox" maxlength="140" placeholder="Say something to ${esc(B.name)}" style="flex:1;min-width:150px">
        <button class="btn pri" data-a="sendTalk">Send it</button>
      </div>
      ${(S.live.talk||[]).length?`<div class="log" style="margin-top:10px;max-height:130px">
        ${(S.live.talk||[]).slice(0,10).map(t=>'<div><span class="dim">'+dstr(t.at)+'</span> <b style="color:'+teamPaint(byId(S.teams,t.teamId)).main+'">'+esc(teamName(t.teamId))+'</b> — '+esc(t.text)+'</div>').join('')}
      </div>`:''}
    </div></div>`;
}
ACT.sendTalk = ()=>{
  const el = $('#talkbox'); if(!el || !el.value.trim()) return;
  S.live.talk = S.live.talk || [];
  S.live.talk.unshift({id:uid('tk'), at:Date.now(), teamId:actingTeam(), text:el.value.trim().slice(0,140)});
  if(S.live.talk.length>40) S.live.talk.length=40;
  el.value='';
  save(); render(); toast('Sent');
};
/* Each manager's own notification switches. Writes to the acting team so a
   commissioner setting these while acting-as another team sets THAT team's. */
ACT.notifyToggle = (d, el)=>{
  const t = myTeam(); if(!t) return;      /* your own prefs, not a team you are acting-as */
  t.notify = Object.assign({}, NOTIFY_DEFAULT, t.notify||{});
  t.notify[d.k] = el ? !!el.checked : !t.notify[d.k];
  save();
};
ACT.taunt = (d)=>{
  const me = actingTeam();
  S.live.taunt = {teamId:me, key:d.k, at:Date.now()};
  S.live.talk = S.live.talk || [];
  S.live.talk.unshift({id:uid('tk'), at:Date.now(), teamId:me, text:TAUNTS[d.k].line, taunt:d.k});
  if(S.live.talk.length>40) S.live.talk.length=40;
  /* If this taunt is aimed at the user by THEIR opponent this week, and they
     asked to hear about it, drop a notification. */
  const mm = (S.live.matchups||[]).find(m=> m.home===S.league.myTeamId || m.away===S.league.myTeamId);
  if(mm){
    const oppId = mm.home===S.league.myTeamId ? mm.away : mm.home;
    if(me===oppId && me!==S.league.myTeamId)
      maybeNotify('oppTaunts', 'Your opponent is talking', teamName(me)+': “'+TAUNTS[d.k].line+'”', 'warn');
  }
  save(); render();
};
ACT.pickMascot = ()=>{

    '<div class="hr"></div>'+
    '<label class="f"><span>What the crowd calls him</span>'+

            '<span class="kitsw">'+

              '<span style="background:'+c.pants+'"></span>'+
            '</span><small>'+esc(c.name)+'</small></button>';
        }).join('')+'</div>';
    })() : '')+
    '<div class="flabel" style="margin-top:12px">Body colour <span class="dim">— an NFL club sets this for you</span></div>'+
    '<div class="row" style="margin-bottom:12px">'+TEAM_COLORS.map(c=>
      '<button class="btn sm '+(t.color===c?'on':'')+'" data-a="setColor" data-c="'+c+'" style="background:'+c+';border-color:'+(t.color===c?'#E9EFF4':c)+';width:34px;height:28px"></button>').join('')+'</div>'+
    '<div class="flabel">Kit</div><div class="row">'+Object.keys(KIT).map(k=>
      '<button class="btn sm '+(t.kit[k]?'on':'')+'" data-a="toggleKit" data-k="'+k+'">'+esc(KIT[k].name)+'</button>').join('')+'</div>'+
    '<div class="hr"></div><div class="flabel">Taunts</div>'+
    '<div class="row">'+Object.keys(TAUNTS).map(k=>
      '<button class="btn sm" data-a="taunt" data-k="'+k+'">'+esc(TAUNTS[k].name)+'</button>').join('')+'</div>'+
    '<div class="hint">Ten of them. Each plays on your mascot for everyone watching and drops its line into the feed.</div>');
};
ACT.setMascot = (d)=>{ const t=myTeam(); if(t){ t.mascot=d.m; save(); ACT.pickMascot(); render(); } };
/* Pick an NFL team: adopt its mascot shape and dress it in that team's Home
   uniform by default. Clearing it goes back to an original (body-colour) look. */
ACT.setNflTeam = (d, el)=>{
  const t=myTeam(); if(!t) return;
  const code = (el && el.value) || d.v || '';
  if(!code){ t.nflTeam=null; t.uniform=null; t.uniformName=null; t.color=null; save(); ACT.pickMascot(); render(); return; }
  const team = NFL_TEAMS[code]; if(!team) return;
  const first = nflCombos(code)[0];
  t.nflTeam = code;
  t.mascot = team.mascot;             /* the club's own mascot, not a stand-in */
  t.uniformName = first.name;
  t.uniform = {jersey:first.jersey, pants:first.pants, trim:first.trim};
  t.color = team.body;                /* overrides whatever colour was picked before */
  save(); ACT.pickMascot(); render();
};
ACT.setNflVariant = (d)=>{
  const t=myTeam(); if(!t || !t.nflTeam) return;
  const c = nflCombos(t.nflTeam).find(x=> x.name===d.v); if(!c) return;
  t.uniformName = c.name;
  t.uniform = {jersey:c.jersey, pants:c.pants, trim:c.trim};
  save(); ACT.pickMascot(); render();
};
ACT.setColor = (d)=>{ const t=myTeam(); if(t){ t.color=d.c; save(); ACT.pickMascot(); render(); } };
ACT.toggleKit = (d)=>{ const t=myTeam(); if(t){ t.kit=t.kit||{}; t.kit[d.k]=!t.kit[d.k]; save(); ACT.pickMascot(); render(); } };
document.addEventListener('input', e=>{

  if(el){ const t=myTeam(); if(t){ t.mascotName = el.value; save(); } }
});

VIEWS.live = function(){
  const t = myTeam(); if(!t) return '<div class="empty-state"><h3>No league loaded</h3></div>';
  const cfg = S.settings.live;
  const myGame = S.live.matchups.find(m=> m.home===t.id || m.away===t.id);
  /* You can open any game in the league; yours is what you get by default. */
  const watchId = ui.tmp.watch;
  const watched = watchId ? S.live.matchups.find(m=> m.home===watchId || m.away===watchId) : null;
  const mine = watched || myGame;
  const away = !!watched && (!myGame || (watched.home!==t.id && watched.away!==t.id));
  /* Whose side of the table we read as "ours" on this screen. */
  const meId = away ? (watched.home===watchId ? watched.home : watched.away) : t.id;
  const oppId = mine ? (mine.home===meId ? mine.away : mine.home) : null;
  /* What each side actually has starting — the saved lineup, or the best one
     if nobody set it. lineupFor() already resolves that. */
  const A = lineupFor(meId), B = oppId ? lineupFor(oppId) : null;
  const live = S.live.games.filter(g=>g.status==='live').length;

  const lineupRows = A.slots.map((s,i)=>{
    const o = B ? B.slots[i] : null;
    return `<tr>
      <td style="width:38%">${s.p?`<div style="font-weight:500"><a href="#" data-a="playerCard" data-id="${s.p.id}" style="color:inherit">${esc(s.p.name)}</a>
        ${injuryTag(s.p)} ${matchupChip(s.p)}</div>${statLine(s.p)}`:'<span class="dim">empty</span>'}</td>
      <td class="right num" style="width:10%">${s.p?s.pts.toFixed(1):'—'}</td>
      <td class="center" style="width:12%"><span class="eyebrow">${esc(s.slot)}</span></td>
      <td class="right num" style="width:10%">${o&&o.p?o.pts.toFixed(1):'—'}</td>
      <td class="right" style="width:38%">${o&&o.p?`<div style="font-weight:500">${matchupChip(o.p)} ${esc(o.p.name)}</div>${statLine(o.p)}`:'<span class="dim">empty</span>'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="section">
    <header>
      <div><div class="eyebrow">Week ${S.live.week} · ${cfg.mode==='demo'?'Simulated feed':cfg.mode==='sleeper'?'Live from Sleeper':cfg.mode==='endpoint'?'Live endpoint':'Manual entry'}</div>
      <h1>Live scoring</h1></div>
      <div class="spacer"></div>
      ${live?'<span class="pill live">'+live+' games in progress</span>':''}
      <button class="btn ghost" data-a="go" data-r="schedule">Schedule</button>
      <button class="btn" data-a="editLineup" data-team="${t.id}" data-w="${+S.live.week||1}">Set lineup</button>
      ${cfg.mode==='demo' ? `<button class="btn ${cfg.running?'':'pri'}" data-a="simToggle">${cfg.running?'Pause feed':'Start feed'}</button>
        <button class="btn ghost" data-a="simReset">New week</button>` :
        `<button class="btn pri" data-a="pollNow">Refresh now</button>
         <button class="btn ghost" data-a="closeWeek">Close out week ${S.live.week}</button>`}
    </header>

    ${(()=>{
      /* Your game, big, then everyone else's along a strip you can slide. */
      const all = (S.live.matchups||[]).map(mm=>{
        const hp = (lineupFor(mm.home)||{}).total||0, ap = (lineupFor(mm.away)||{}).total||0;
        return {home:mm.home, away:mm.away, hp, ap, mine: mm.home===t.id || mm.away===t.id};
      });
      const you = all.find(g=> g.home===meId || g.away===meId);
      const rest = all.filter(g=> g!==you);
      const side = (id, pts, lead)=>{
        const pr = teamProjected(id);
        return '<div class="scoreside"><div class="scorename'+(lead?' win':'')+'">'+esc(teamName(id))+'</div>'+
        '<div class="scorepts'+(lead?' win':'')+'">'+pts.toFixed(1)+'</div>'+
        (pr!=null? '<div class="tiny dim">'+pr.toFixed(1)+' projected</div>' : '')+'</div>';
      };
      const head = you ? '<div class="panel scorecard"><div class="pb">'+
          '<div class="scorerow">'+
            side(you.home===meId?you.home:you.away, you.home===meId?you.hp:you.ap,
                 (you.home===meId?you.hp:you.ap) > (you.home===meId?you.ap:you.hp))+
            '<div class="scorevs">'+(Math.abs(you.hp-you.ap)).toFixed(1)+'<div class="tiny dim">'+
              ((you.home===meId?you.hp:you.ap) >= (you.home===meId?you.ap:you.hp) ? 'ahead' : 'behind')+'</div></div>'+
            side(you.home===meId?you.away:you.home, you.home===meId?you.ap:you.hp,
                 (you.home===meId?you.ap:you.hp) > (you.home===meId?you.hp:you.ap))+
          '</div></div></div>' : '';
      const banner = away
        ? '<div class="panel" style="margin-bottom:10px;border-color:var(--brass)"><div class="pb" '+
          'style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
          '<div>You are watching <b>'+esc(teamName(mine.home))+'</b> against <b>'+esc(teamName(mine.away))+'</b>.</div>'+
          '<div class="spacer"></div>'+
          '<button class="btn sm pri" data-a="watchMine">Back to my matchup</button></div></div>'
        : '';
      const strip = rest.length ? '<div class="tickerwrap"><div class="ticker">'+
        rest.map(g=>'<div class="tickgame'+(g.mine?' mine':'')+'" data-a="watchGame" data-id="'+g.home+'" title="Open this matchup">'+
          '<div class="tickrow'+(g.hp>g.ap?' win':'')+'"><span class="tickname">'+esc(teamName(g.home))+'</span>'+
            '<span class="tickpts">'+g.hp.toFixed(1)+'</span></div>'+
          '<div class="tickrow'+(g.ap>g.hp?' win':'')+'"><span class="tickname">'+esc(teamName(g.away))+'</span>'+
            '<span class="tickpts">'+g.ap.toFixed(1)+'</span></div>'+
        '</div>').join('')+'</div></div>' : '';
      return banner + head + strip;
    })()}

    ${mine ? `<div class="panel" style="margin-bottom:14px">
      <div class="ph"><div style="flex:1"><div class="eyebrow">Your matchup</div>
        <div style="font:700 19px/1.2 var(--disp);text-transform:uppercase;letter-spacing:.04em">${esc(t.name)} <span class="money" style="font-family:var(--mono)">${A.total.toFixed(1)}</span>
        <span class="dim" style="font-size:14px"> vs </span> ${esc(teamName(oppId))} <span class="num">${B?B.total.toFixed(1):'0.0'}</span></div></div></div>
      <div class="pb tight scrollx"><table><tbody>${lineupRows}</tbody>
        <tfoot><tr class="tot"><td class="right">Total</td><td class="right money">${A.total.toFixed(1)}</td><td></td>
          <td class="right num">${B?B.total.toFixed(1):'0.0'}</td><td></td></tr></tfoot></table></div>
    </div>`:''}

    ${mine ? brawlPanel(t.id, oppId, A.total, B?B.total:0) : soloMascotPanel(t)}

    ${(()=>{
      const mine = teamPlayers(t.id).filter(p=> p.pos!=='DEF' && thisWeekOpponent(p.nfl));
      const book = Object.keys(S.dvp||{}).length;
      const posOrder = ['QB','RB','WR','TE','K'];
      const defs = Object.keys(S.dvp||{}).filter(c=> (S.dvp[c].games||0)>0);
      return `<div class="split" style="margin-bottom:14px">
      <div class="panel"><div class="ph"><h3>This week's matchups</h3><div class="spacer"></div>
        <span class="tiny dim">${book?book+' defenses on the book':'no games logged yet'}</span></div>
        <div class="pb tight scrollx"><table>
        <thead><tr><th>Player</th><th>Pos</th><th>Facing</th><th class="right">Rank vs pos</th>
          <th class="right hide-xs">Vs the run</th><th class="right hide-xs">Vs the pass</th><th class="right">Week</th></tr></thead><tbody>
        ${mine.sort((a,b)=> (matchupFor(b)&&matchupFor(b).byPos?matchupFor(b).byPos.rank:0)-(matchupFor(a)&&matchupFor(a).byPos?matchupFor(a).byPos.rank:0))
          .map(p=>{
          const m = matchupFor(p); if(!m) return '';
          const r = m.byPos, run = dvpRank(m.opp.code,null,'rush'), pass = dvpRank(m.opp.code,null,'pass');
          const strong = primaryKind(p.pos);
          return `<tr><td>${esc(p.name)}</td><td>${posTag(p.pos)}</td>
            <td class="num">${m.opp.home?'@':'vs'} ${esc(m.opp.code)}</td>
            <td class="right num">${r? r.rank+' <span class="dim">of '+r.of+'</span>' : '<span class="dim">—</span>'}</td>
            <td class="right num hide-xs ${strong==='rush'?'':'dim'}">${run? run.rank : '—'}</td>
            <td class="right num hide-xs ${strong==='pass'?'':'dim'}">${pass? pass.rank : '—'}</td>
            <td class="right">${m.diff?'<span class="pill '+(m.diff.cls==='bad'?'live':m.diff.cls==='good'?'ok':'')+'">'+m.diff.label+'</span>':'<span class="dim tiny">no book</span>'}</td></tr>`;
        }).join('') || '<tr><td colspan="7" class="dim center" style="padding:20px">Nobody on your roster is playing this week.</td></tr>'}
        </tbody></table></div>
        <div class="pb"><div class="hint">Rank one gives up the least, so a low number is a hard week.
          Backs are judged on the run column, everyone else on the pass. The book fills in as weeks are closed out — the first couple of weeks will read thin.</div></div>
      </div>
      <div class="panel"><div class="ph"><h3>Defenses</h3></div><div class="pb tight scrollx">
        <table><thead><tr><th>Unit</th><th class="right">G</th>
          ${posOrder.map(x=>'<th class="right">'+x+'</th>').join('')}<th class="right">Run</th><th class="right">Pass</th></tr></thead><tbody>
        ${defs.map(c=>({c, r:dvpRank(c,null,'pass')})).sort((a,b)=>(a.r?a.r.rank:99)-(b.r?b.r.rank:99)).map(x=>{
          const c = x.c;
          return `<tr><td class="num">${esc(c)}</td><td class="right num dim">${S.dvp[c].games}</td>
            ${posOrder.map(ps=>{ const r=dvpRank(c,ps,null); const d=difficultyOf(r);
              return '<td class="right num '+(d?(d.cls==='bad'?'bad':d.cls==='good'?'good':''):'dim')+'">'+(r?r.rank:'—')+'</td>'; }).join('')}
            ${['rush','pass'].map(k=>{ const r=dvpRank(c,null,k); const d=difficultyOf(r);
              return '<td class="right num '+(d?(d.cls==='bad'?'bad':d.cls==='good'?'good':''):'dim')+'">'+(r?r.rank:'—')+'</td>'; }).join('')}
          </tr>`;
        }).join('') || '<tr><td colspan="9" class="dim center" style="padding:20px">Close out a week and the rankings start filling in.</td></tr>'}
        </tbody></table></div>
        <div class="pb"><div class="hint">Red is a unit that shuts a position down. Green is one that has been handing points out.</div></div>
      </div></div>`;
    })()}

    <div class="split">
      <div class="stack">
        <div class="panel"><div class="ph"><h3>League scoreboard</h3></div><div class="pb tight scrollx">
          <table><tbody>${S.live.matchups.map(m=>{
            const x=bestLineup(m.home), y=bestLineup(m.away);
            return `<tr><td>${esc(teamName(m.away))}</td><td class="right num ${y.total>x.total?'good':''}">${y.total.toFixed(1)}</td>
              <td class="center dim tiny">at</td><td class="right num ${x.total>y.total?'good':''}">${x.total.toFixed(1)}</td><td>${esc(teamName(m.home))}</td></tr>`;
          }).join('')||'<tr><td class="dim">No matchups yet.</td></tr>'}</tbody></table></div></div>

        <div class="panel"><div class="ph"><h3>Games</h3></div><div class="pb tight scrollx">
          <table><thead><tr><th>Matchup</th><th class="right">Score</th><th class="right">Status</th></tr></thead><tbody>
          ${S.live.games.map(g=>`<tr><td class="num">${esc(g.away)} @ ${esc(g.home)}</td>
            <td class="right num">${g.as}–${g.hs}</td>
            <td class="right tiny ${g.status==='live'?'bad':'dim'}">${g.status==='final'?'Final':g.status==='pre'?'Kickoff pending':'Q'+g.q+' '+Math.floor(Math.max(0,g.clock)/60)+':'+String(Math.floor(Math.max(0,g.clock)%60)).padStart(2,'0')}</td></tr>`).join('')
            ||'<tr><td class="dim">No games scheduled. Start the feed.</td></tr>'}
          </tbody></table></div></div>
      </div>

      <div class="stack">
        <div class="panel"><div class="ph"><h3>Play feed</h3></div><div class="pb"><div class="feed" style="max-height:280px;overflow:auto">
          ${S.live.feed.slice(0,40).map(f=>'<div><span class="dim tiny">'+new Date(f.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+'</span> '+esc(f.text)+'</div>').join('')
            || '<div class="dim">Quiet out there.</div>'}
        </div></div></div>

        <div class="panel"><div class="ph"><h3>Feed source</h3></div><div class="pb stack">
          <div class="seg">
            <button class="${cfg.mode==='sleeper'?'on':''}" data-a="setLiveMode" data-m="sleeper">Sleeper (live)</button>
            <button class="${cfg.mode==='demo'?'on':''}" data-a="setLiveMode" data-m="demo">Simulated</button>
            <button class="${cfg.mode==='endpoint'?'on':''}" data-a="setLiveMode" data-m="endpoint">League server</button>
            <button class="${cfg.mode==='manual'?'on':''}" data-a="setLiveMode" data-m="manual">Paste JSON</button>
          </div>
          ${cfg.mode==='sleeper'?`
            <div class="hint">Real scores are pulled from Sleeper every ${Math.max(15,+cfg.pollSec||30)} seconds
              and scored with your settings. Projections come down on their own when the week changes.
              ${S.live.statsAt?'Last updated '+dstr(S.live.statsAt)+'.':'Waiting for the first update…'}</div>
            <label class="f"><span>How often to check (seconds)</span>
              <input type="number" min="15" max="300" data-set="settings.live.pollSec" value="${+cfg.pollSec||30}"></label>
            <div class="hint">Players are matched by their Sleeper id, so run a Sleeper import first if you have
              not already.</div>`:''}
          ${cfg.mode==='demo'?`<label class="f"><span>Simulation speed</span>
            <input type="number" min="1" max="30" data-set="settings.live.speed" value="${cfg.speed}"></label>
            <div class="hint">The simulator generates plays from your own player pool and scores them with your scoring settings. It is here so the screen works out of the box — swap it for a real feed on the other two tabs.</div>`:''}
          ${cfg.mode==='endpoint'?`
            <div class="assetbox"><div class="tiny dim">Pulling from</div>
              <div class="num tiny" style="word-break:break-all;margin-top:4px">${statsUrl()?esc(statsUrl()):'<span class="bad">nothing yet — set the server address under Settings › Server</span>'}</div></div>
            <label class="f"><span>Override the stats URL</span>
              <input type="text" data-set="settings.live.endpoint" value="${esc(cfg.endpoint)}" placeholder="leave blank to use your league server"></label>
            <label class="f"><span>Poll every (seconds)</span><input type="number" min="10" data-set="settings.live.pollSec" value="${cfg.pollSec}"></label>
            <div class="hint">Your server does the talking to the stats provider and hands this page a clean payload. That is where the API key lives — never in this file, which anyone can read.</div>`:''}
          ${cfg.mode==='manual'?`<label class="f"><span>Paste a stats payload</span>
            <textarea data-k="feedpaste" id="feedpaste" placeholder='{"stats":{"Josh Allen":{"py":312,"pt":3}}}'></textarea></label>
            <button class="btn pri" data-a="applyPaste">Apply payload</button>`:''}
          <details><summary class="tiny muted" style="cursor:pointer">Feed format</summary>
            <pre class="tiny" style="overflow:auto;color:var(--mute);background:#101C27;padding:10px;border-radius:4px;border:1px solid var(--rule-soft)">{
  "games":[{"id":"g1","home":"KC","away":"BUF","hs":21,"as":17,"q":3,"clock":420,"status":"live"}],
  "stats":{
    "Josh Allen":{"py":312,"pt":3,"pi":1,"ry":44,"rt":1},
    "Ja'Marr Chase":{"rec":9,"rey":141,"ret":1}
  }
}</pre>
            <div class="hint">Keys: py/pt/pi pass, ry/rt rush, rec/rey/ret receiving, fum, fg39/fg49/fg50/fgx/xpm kicking, sk/dint/dfum/dtd/saf/pa defense. Match players by name or by their id in this app.</div>
          </details>
        </div></div>
      </div>
    </div>
  </div>`;
};
ACT.simToggle = ()=>{
  if(!S.live.games.length) buildWeek(S.live.week||1);
  S.settings.live.running = !S.settings.live.running; save(); render();
};
ACT.simReset = ()=>{
  recordWeek(); foldWeekIntoSeason(); foldWeekIntoDvp();
  buildWeek((S.live.week||1)+1);
  S.live.koLosers = {}; S.live.koWeek = null;   /* new week: losers get up off the floor */
  const myLu = ((S.lineups||{})[S.live.week]||{})[S.league.myTeamId];
  if(!myLu || !myLu.length)
    maybeNotify('unsetLineup', 'Set your lineup', 'Week '+S.live.week+' has kicked off and your lineup is not set yet.', 'warn');
  S.settings.live.running=true; save(); render();
  toast('Week '+S.live.week+' kicked off — last week is in the books');
};
ACT.setLiveMode = (d)=>{ S.settings.live.mode=d.m; S.settings.live.running=false; save(); render(); };
ACT.pollNow = ()=> pollEndpoint();
ACT.closeWeek = ()=>{
  /* Work out the loser of each matchup first, so the brawl can lay that mascot
     out on the floor until the next kickoff. */
  const losers = {};
  (S.live.matchups||[]).forEach(mm=>{
    const hp = (lineupFor(mm.home)||{}).total||0, ap = (lineupFor(mm.away)||{}).total||0;
    if(hp===ap) return;
    losers[hp<ap ? mm.home : mm.away] = true;
  });
  S.live.koLosers = losers;
  S.live.koWeek = S.live.week;
  recordWeek(); foldWeekIntoSeason(); foldWeekIntoDvp();
  const done = Object.keys((S.season||{}).byPlayer||{}).length;
  S.live.week = (S.live.week||1)+1;
  S.live.stats = {}; S.live.feed = [];
  buildWeek(S.live.week);
  logIt('Week '+(S.live.week-1)+' closed out — '+done+' players have season totals', {type:'admin'});
  save(); render(); toast('Week '+(S.live.week-1)+' is in the books','good');
};
ACT.applyPaste = ()=>{
  try{ applyFeed(JSON.parse($('#feedpaste').value)); toast('Stats applied','good'); }
  catch(e){ toast('Could not read that payload — '+e.message,'bad'); }
};

function faRows(list){
  const q = (ui.tmp.faq||'').toLowerCase();
  const f = list.filter(p=> !q || p.name.toLowerCase().includes(q) || p.pos.toLowerCase()===q || (p.nfl||'').toLowerCase()===q).slice(0,60);
  const wv = waiverDeadlinePassed();
  const sorted = sortRows('fa', f, {
    name:p=>p.name, pos:p=>p.pos, nfl:p=>p.nfl||'', age:p=>+p.age||0,
    price:p=> wv ? (+S.settings.waivers.salary||0) : marketPrice(p,0)
  }, {key:'price',dir:-1});
  /* Anyone the rest of the world is picking up goes to the top, busiest first.
     Only when the list is in its usual order — if you have sorted a column
     yourself, that is what you asked for and it is left alone. */
  const rows = (ui.tmp.sort && ui.tmp.sort.fa) ? sorted : sorted.slice().sort((a,b)=>{
    const ta = trendFor(a), tb = trendFor(b);
    const ua = ta && ta.dir==='up' ? ta.count : 0;
    const ub = tb && tb.dir==='up' ? tb.count : 0;
    return ub - ua;
  });
  return rows.map(p=>`<tr><td><a href="#" data-a="playerCard" data-id="${p.id}" style="color:inherit">${esc(p.name)}</a>
    ${trendTag(p)} ${injuryTag(p)} ${waiverTag(p)} ${orphanTag(p)}</td><td>${posTag(p.pos)}</td><td class="hide-xs num">${esc(p.nfl||'')}</td>
    <td class="right num">${p.age||'—'}</td>
    <td class="right money">${isOrphan(p) ? money(grossHit(p,S.league.season))
      : wv ? money(S.settings.waivers.salary) : money(marketPrice(p,0))}
      ${isOrphan(p)?'<div class="tiny dim">'+p.contract.years+'yr, fixed</div>':''}</td>
    <td class="right"><button class="btn sm" data-a="editContract" data-id="${p.id}">${
      isOrphan(p)?'Take him on' : wv?'Claim':'Sign'}</button></td></tr>`).join('')
    || '<tr><td colspan="6" class="dim center" style="padding:20px">Nobody matches that.</td></tr>';
}

/* The lineup editor. Slot by slot, only players who can actually play there,

function lineupForm(teamId, week){
  const L = lineupFor(teamId, week);
  const pool = teamPlayers(teamId).filter(p=> !offCap(p) || playerSlot(p)==='active');
  const chosen = {}; L.slots.forEach(x=>{ if(x.p) chosen[x.p.id]=1; });
  const boss = lineupBoss(teamId, week);
  return `
    ${boss!==teamId?`<div class="hint warn">You are setting this because you hold ${esc(teamName(teamId))}'s
      ${S.league.season+1} first-round pick, and the ${esc(loserName())} decides who takes the first pick.</div>`:''}
    ${(()=>{ const n = lineupLockNote(); return n? '<div class="hint warn">'+esc(n)+'</div>':''; })()}
    <div class="stack" style="margin:10px 0">
      ${L.slots.map((x,i)=>{
        const elig = x.eligible || [];
        const heldLocked = x.p && playerLocked(x.p);   // the starter here has already played
        const opts = pool.filter(p=> elig.indexOf(p.pos)>=0)
          .sort((a,b)=> fpts(b.id)-fpts(a.id))
          .map(p=>{
            const locked = playerLocked(p);
            // a locked player can only stay where they already are, never be moved in
            const disable = (chosen[p.id] && (!x.p||x.p.id!==p.id)) || (locked && (!x.p||x.p.id!==p.id));
            const started = gameForPlayer(p);
            const tail = started ? (started.status==='final'?' · final':' · playing') : '';
            const mt = matchupTag(p);
            return '<option value="'+p.id+'"'+(x.p&&x.p.id===p.id?' selected':'')+(disable?' disabled':'')+'>'+
              esc(p.name)+' · '+posTag(p.pos).replace(/<[^>]+>/g,'')+' · '+fpts(p.id).toFixed(1)+
              (mt?' · '+esc(mt):'')+tail+'</option>';
          }).join('');
        return `<div style="border-bottom:1px solid var(--line);padding:6px 0">
          <div class="row" style="gap:8px">
          <span class="tiny dim" style="width:56px">${esc(x.slot)}</span>
          <select data-oninput="luSet" data-team="${teamId}" data-w="${week}" data-i="${i}" ${heldLocked?'disabled':''} style="flex:1;min-width:150px">
            <option value="">— empty —</option>
            ${opts}
          </select>
          <span class="tiny num" style="width:56px;text-align:right">${heldLocked?'<span class="dim">🔒 </span>':''}${x.pts.toFixed(1)}</span>
          </div>
          ${x.p?'<div style="margin:3px 0 0 64px">'+matchupLine(x.p)+'</div>':''}
        </div>`;
      }).join('')}
    </div>
    <div class="row"><span class="tiny dim">${L.saved?'Set by hand':'Nothing saved — this is the best lineup'}</span>
      <div class="spacer"></div><b>${L.total.toFixed(1)}</b></div>
    <div class="hint">Anything you leave empty scores nothing. Clear the lot and it goes back to picking
      the best lineup for you — locked players stay put.${isCommish()?' As commissioner you are not locked, so you can still fix a genuine mistake.':''}</div>`;
}

ACT.luSet = (d, el)=>{
  const tid = d.team, w = +d.w, i = +d.i;
  if(!canSetLineup(tid, w)) return toast('Not your lineup to set','bad');
  const cur = lineupFor(tid, w);
  const arr = cur.slots.map(x=> x.p ? x.p.id : '');
  const val = el.value || '';
  /* Refuse a move that touches a player whose game has started — the greying
     out is a courtesy, this is the guard. Only the current week can lock;
     editing a past or future week is unaffected. */
  if(w === (+S.live.week||1)){
    const outgoing = arr[i] ? byId(S.players, arr[i]) : null;
    const incoming = val ? byId(S.players, val) : null;
    if(outgoing && playerLocked(outgoing)){ el.value = arr[i]||''; return toast('That game has started — '+outgoing.name+' is locked in','bad'); }
    if(incoming && playerLocked(incoming)){ el.value = arr[i]||''; return toast(incoming.name+"'s game has already started",'bad'); }
  }
  S.lineups = S.lineups || {};
  S.lineups[w] = S.lineups[w] || {};
  const dup = arr.indexOf(val);
  if(val && dup>=0 && dup!==i) arr[dup] = '';    // nobody plays two positions
  arr[i] = val;
  S.lineups[w][tid] = arr;
  save();
  $('#modalBox .mb').innerHTML = lineupForm(tid, w);
};

/* Every week this player has a line for, this season or a past one. */
function playerLog(p, year){
  const y = year || S.league.season;
  const src = (y===S.league.season ? (S.season||{}).byPlayer : ((S.history||{})[y]||{})) || {};
  const line = src[p.id];
  if(!line || !line.weeks) return [];
  return Object.keys(line.weeks).map(Number).sort((a,b)=>a-b)
    .map(w=> ({week:w, fpts:line.weeks[w].fpts, stats:line.weeks[w].stats}));
}
/* Which seasons we hold anything for. */
function playerYears(p){
  const ys = [];
  if(((S.season||{}).byPlayer||{})[p.id]) ys.push(S.league.season);
  Object.keys(S.history||{}).forEach(y=>{ if((S.history[y]||{})[p.id]) ys.push(+y); });
  return ys.sort((a,b)=>b-a);
}

/* What a team's set starters are projected to score this week. */
function teamProjected(teamId, week){
  const L = lineupFor(teamId); if(!L || !L.slots) return null;
  let any = false, tot = 0;
  L.slots.forEach(x=>{ if(!x.p) return; const v = projFor(x.p, week); if(v!=null){ any = true; tot += v; } });
  return any ? Math.round(tot*10)/10 : null;
}
/* ---- Projections --------------------------------------------------------
   Sleeper publishes a projected stat line per player per week. We score those
   raw stats with THIS league's settings, so the number reflects your rules
   rather than somebody else's. Where there is no projection we fall back to
   what the player has actually averaged here. */
function projStore(){
  S.proj = S.proj || {season:S.league.season, week:0, byPlayer:{}, at:0, source:''};
  return S.proj;
}
/* What we think he will score this week. */
function projFor(p, week){
  const w = week || S.live.week || 1;
  const st = projStore();
  if(st.week===w && st.byPlayer && st.byPlayer[p.id]!=null) return +st.byPlayer[p.id];
  return projFromForm(p);
}
/* No projection to hand: use his own average here, which is honest about what
   it is rather than inventing a number. */
function projFromForm(p){
  const log = playerLog(p);
  if(!log.length) return null;
  const recent = log.slice(-4);
  const avg = recent.reduce((n,w)=> n + (+w.fpts||0), 0) / recent.length;
  return Math.round(avg*10)/10;
}
function projLabel(p, week){
  const v = projFor(p, week);
  if(v==null) return '—';
  return v.toFixed(1);
}
/* Where a shown projection came from, so nobody mistakes a guess for a forecast. */
function projSource(p, week){
  const w = week || S.live.week || 1, st = projStore();
  if(st.week===w && st.byPlayer && st.byPlayer[p.id]!=null) return 'projected';
  return projFromForm(p)!=null ? 'his average here' : null;
}
ACT.projPull = async ()=>{
  ui.tmp.projBusy = true; ui.tmp.projErr = null; render();
  const season = S.league.season, week = S.live.week || 1;
  const tries = [
    SLEEPER+'/projections/nfl/regular/'+season+'/'+week,
    'https://api.sleeper.app/projections/nfl/'+season+'/'+week+'?season_type=regular'
  ];
  try{
    let raw = null, used = '';
    for(const u of tries){
      try{
        impProgress('Asking for week '+week+' projections\u2026', 40);
        const j = await getJSON(u);
        if(j && (Array.isArray(j) ? j.length : Object.keys(j).length)){ raw = j; used = u; break; }
      }catch(e){ /* try the next shape */ }
    }
    if(!raw) throw new Error('no projections came back for week '+week);

    /* Sleeper returns either a map keyed by player id, or a list of rows. */
    const byId = {};
    if(Array.isArray(raw)) raw.forEach(r=>{ const k = r.player_id || (r.player||{}).player_id; if(k) byId[String(k)] = r.stats || r; });
    else Object.keys(raw).forEach(k=>{ byId[String(k)] = raw[k] && raw[k].stats ? raw[k].stats : raw[k]; });

    const st = projStore();
    st.season = season; st.week = week; st.byPlayer = {}; st.at = Date.now(); st.source = used;
    let n = 0;
    S.players.forEach(p=>{
      const line = p.sleeperId ? byId[String(p.sleeperId)] : null;
      if(!line) return;
      st.byPlayer[p.id] = Math.round(scoreLine(line, p)*10)/10;
      n++;
    });
    impProgress('', 100);
    ui.tmp.projBusy = false;
    logIt('Projections pulled for week '+week+' — '+n+' players, scored on this league\u2019s settings', {type:'admin'});
    save(); render();
    toast(n? n+' players projected for week '+week : 'Nothing matched — are the Sleeper ids in?', n?'good':'warn');
  }catch(e){
    ui.tmp.projBusy = false; ui.tmp.projErr = e.message; impProgress('', 0); render();
    toast('Could not get projections — '+e.message,'bad');
  }
};
/* ---- Trending, from Sleeper ------------------------------------------------
   Sleeper publishes how many leagues added or dropped a player in the last day.
   A player can appear on both lists; whichever side is bigger is the direction
   we show. */
function trendStore(){
  S.trend = S.trend || {at:0, up:{}, down:{}};
  return S.trend;
}
/* null, or {dir:'up'|'down', count:n} for this player. */
function trendFor(p){
  if(!p || !p.sleeperId) return null;
  const t = trendStore();
  const up = +t.up[String(p.sleeperId)] || 0;
  const dn = +t.down[String(p.sleeperId)] || 0;
  if(!up && !dn) return null;
  return up >= dn ? {dir:'up', count:up} : {dir:'down', count:dn};
}
function trendTag(p){
  const t = trendFor(p);
  if(!t) return '';
  const n = t.count>=1000 ? Math.round(t.count/1000)+'k' : t.count;
  return t.dir==='up'
    ? '<span class="trend up" title="added in '+t.count+' leagues in the last day">\u25B2 '+n+'</span>'

}

function sleeperLeague(){ return (S.settings.live||{}).sleeperLeagueId || ''; }
function teamByRoster(rosters){

/* Put the starters Sleeper has into our lineup for the week. */
async function pullSleeperLineups(week, quiet){
  const id = sleeperLeague(); if(!id) return 0;
  const w = week || S.live.week || 1;
  const [rosters, ms] = await Promise.all([
    getJSON(SLEEPER+'/league/'+id+'/rosters'),
    getJSON(SLEEPER+'/league/'+id+'/matchups/'+w)
  ]);
  const tm = teamByRoster(rosters), byId2 = playersBySleeperId();
  S.lineups = S.lineups || {}; S.lineups[w] = S.lineups[w] || {};
  let n = 0;
  (ms||[]).forEach(row=>{
    const teamId = tm[row.roster_id]; if(!teamId) return;
    const starters = row.starters || [];
    /* Their starters, in their order, mapped onto our players. A spot we cannot
       match is left empty rather than guessed at. */
    const arr = starters.map(sid=>{
      const p = sid && sid!=='0' ? byId2[String(sid)] : null;
      return p && p.contract && p.contract.teamId===teamId ? p.id : '';
    });
    if(arr.some(Boolean)){ S.lineups[w][teamId] = arr; n++; }
  });
  if(n){ save(); if(!quiet) render(); }
  return n;
}
/* Match taxi and injured reserve to Sleeper. */
async function pullSleeperSlots(quiet){
  const id = sleeperLeague(); if(!id) return 0;
  const cfg = S.settings.live || {};
  if(!cfg.pullTaxi && !cfg.pullIR) return 0;
  const rosters = await getJSON(SLEEPER+'/league/'+id+'/rosters');
  const tm = teamByRoster(rosters), byId2 = playersBySleeperId();
  let n = 0;
  (rosters||[]).forEach(r=>{
    const teamId = tm[r.roster_id]; if(!teamId) return;
    const taxi = cfg.pullTaxi ? (r.taxi||[]) : null;
    const ir   = cfg.pullIR   ? (r.reserve||[]) : null;
    /* Clear only the kinds we are mirroring, so a slot this site manages on its
       own is left where it is. */
    teamPlayers(teamId).forEach(p=>{
      if(taxi && playerSlot(p)==='taxi') p.slot = 'active';
      if(ir   && playerSlot(p)==='ir')   p.slot = 'active';
    });
    (taxi||[]).forEach(sid=>{ const p = byId2[String(sid)];
      if(p && p.contract && p.contract.teamId===teamId){ p.slot='taxi'; n++; } });
    (ir||[]).forEach(sid=>{ const p = byId2[String(sid)];
      if(p && p.contract && p.contract.teamId===teamId){ p.slot='ir'; n++; } });
  });
  if(n){ clearCapCache(); save(); if(!quiet) render(); }
  return n;
}

    try{ traded = await getJSON(SLEEPER+'/league/'+id+'/traded_picks') || []; }catch(e){}

    const tm = teamByRoster(rosters);
    const first = S.league.season + 1, last = S.league.season + 3;

    /* Start clean for the seasons we are about to describe, so running this
       twice does not double everything up. */
    S.picks = (S.picks||[]).filter(k=> +k.year < first || +k.year > last);
    const made = {};
    for(let y=first; y<=last; y++){
      for(let rd=1; rd<=rounds; rd++){
        (rosters||[]).forEach(r=>{
          const t = tm[r.roster_id]; if(!t) return;
          const pk = {id:uid('pk'), year:y, round:rd, ownerTeamId:t, originTeamId:t};
          S.picks.push(pk);
          made[y+'|'+rd+'|'+r.roster_id] = pk;
        });
      }
    }
    /* Now hand over the ones that have been traded. */
    let moved = 0;
    (traded||[]).forEach(tp=>{
      const y = +tp.season, rd = +tp.round;
      if(y < first || y > last) return;
      const pk = made[y+'|'+rd+'|'+tp.roster_id];
      const to = tm[tp.owner_id];
      if(pk && to && pk.ownerTeamId !== to){ pk.ownerTeamId = to; moved++; }
    });

    impProgress('', 100);
    ui.tmp.pkBusy = false;
    const total = (rosters||[]).length * rounds * (last-first+1);
    logIt('Draft picks brought in from Sleeper — '+total+' picks, '+moved+' already traded', {type:'admin'});
    save(); render();
    toast(total+' picks for '+first+'\u2013'+last+', '+moved+' already traded','good');
  }catch(e){
    ui.tmp.pkBusy = false; ui.tmp.pkErr = e.message; impProgress('', 0); render();
    toast('Could not read that league — '+e.message,'bad');
  }
};

/* ============================================================
   TAXI CLAIMS
   Anyone can put a claim on somebody else's taxi player. The owner has a
   window to promote him or work a trade; let it run out and the claim lands
   for nothing.
   ============================================================ */
function openClaimFor(playerId){ return (S.taxiClaims||[]).find(c=> c.playerId===playerId && c.status==='open'); }
/* Who has been raiding whom. Only worth showing once somebody has actually
   tried something, or it is a table of zeroes. */
function taxiStealBoard(){
  const any = (S.taxiClaims||[]).length;
  if(!any && !taxiLimitOn()) return '';
  const t = S.settings.taxi;
  const rows = S.teams.map(tm=>({tm, n:taxiStealCount(tm.id), left:taxiStealsLeft(tm.id)}))
    .filter(r=> r.n.attempts>0 || taxiLimitOn())
    .sort((a,b)=> b.n.landed-a.n.landed || b.n.attempts-a.n.attempts);
  if(!rows.length) return '';
  return `<div class="hr"></div>
    <div class="ph"><h3 style="font-size:15px">Taxi claims this season</h3><div class="spacer"></div>
      <span class="tiny dim">${taxiLimitOn()
        ? (t.limitMode==='landed' ? 'up to '+t.limitMax+' can land per team' : t.limitMax+' attempts each')
        : 'no limit set'}</span></div>
    <div class="pb tight scrollx"><table>
      <thead><tr><th>Team</th><th class="right">Tried</th><th class="right">Landed</th>
        <th class="right">Running</th><th class="right">Saw them off</th>
        ${taxiLimitOn()?'<th class="right">Left</th>':''}</tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${esc(r.tm.name)}</td>
        <td class="right num ${r.n.attempts?'':'dim'}">${r.n.attempts}</td>
        <td class="right num ${r.n.landed?'good':'dim'}">${r.n.landed}</td>
        <td class="right num ${r.n.inFlight?'':'dim'}">${r.n.inFlight}</td>
        <td class="right num dim">${taxiStolenFrom(r.tm.id)}</td>
        ${taxiLimitOn()?'<td class="right num '+(r.left<=0?'bad':'')+'">'+r.left+'</td>':''}
      </tr>`).join('')}</tbody></table></div>
    <div class="pb"><div class="hint">Counts start over when the season rolls over.
      <b>Tried</b> is every claim put in, <b>Landed</b> is the ones that stuck, and
      <b>Saw them off</b> is how many times that team kept a player somebody came for.</div></div>`;
}
/* How many times this team had somebody taken off their own taxi squad. */
function taxiStolenFrom(teamId){
  return (S.taxiClaims||[]).filter(c=> c.fromTeam===teamId && c.status==='awarded').length;
}
/* ---- how many a team has taken off other people's taxi squads ----
   S.taxiClaims is emptied when the season rolls over, so all of this is
   per-season without anything having to be reset by hand. */
function taxiStealCount(teamId){
  const mine = (S.taxiClaims||[]).filter(c=> c.toTeam===teamId);
  return {
    attempts: mine.length,
    landed:   mine.filter(c=> c.status==='awarded').length,
    inFlight: mine.filter(c=> c.status==='open').length,
    failed:   mine.filter(c=> c.status==='defended' || c.status==='withdrawn').length
  };
}
/* Two ways to read a limit, and they answer different questions.
   "attempts" — every claim you put in burns one, however it ends. Pulling it
   does not give it back, or a team could tie up half the league and pull out
   at the last second.
   "landed"  — only claims that actually stick count, but ones still running
   are counted too, since they might yet stick. A claim that gets defended or
   lapses hands the slot back and you can go again. */
function taxiStealsUsed(teamId){
  const n = taxiStealCount(teamId);
  return S.settings.taxi.limitMode==='landed' ? n.landed + n.inFlight : n.attempts;
}
function taxiLimitOn(){
  const t = S.settings.taxi;
  return t.limitMode && t.limitMode!=='off' && +t.limitMax>0;
}
function taxiStealsLeft(teamId){
  if(!taxiLimitOn()) return null;
  return Math.max(0, (+S.settings.taxi.limitMax) - taxiStealsUsed(teamId));
}
/* Why this team cannot claim anybody right now, or null if they can. */
function taxiLimitBlock(teamId){
  if(!taxiLimitOn()) return null;
  if(taxiStealsLeft(teamId) > 0) return null;
  const t = S.settings.taxi, n = +t.limitMax, s = n===1?'':'s';
  return t.limitMode==='landed'
    ? 'they are already down for '+n+' taxi claim'+s+' this season'
    : 'they have used all '+n+' of their taxi claims this season';
}
function claimBlocked(c){
  const p = byId(S.players, c.playerId);
  if(!p || !p.contract) return 'he is no longer under contract';
  if(p.contract.teamId !== c.fromTeam) return 'he has already been traded';
  if(!onTaxi(p)) return 'he was promoted to the active roster';
  const pending = S.trades.some(t=> (t.status==='proposed' || t.status==='review') &&
    [].concat(t.a.players||[], t.b.players||[]).indexOf(p.id) >= 0);
  if(pending) return 'there is a trade on the table for him';
  return null;
}
function claimCanLand(c){
  const p = byId(S.players, c.playerId);
  if(slotRoom(c.toTeam,'active') <= 0) return 'no room on the active roster';
  const hit = fixInc(Math.max(0, grossHit(p, S.league.season) - retainedOn(p, S.league.season)));
  if(S.settings.trades.capMustBeLegal && hit > capRoomAfterPending(c.toTeam, S.league.season))
    return 'cannot fit the '+money(hit)+' salary under the cap';
  return null;
}
function settleTaxiClaim(c){
  if(c.status!=='open') return;
  const p = byId(S.players, c.playerId);
  const blocked = claimBlocked(c);
  if(blocked){
    c.status='defended'; c.reason=blocked;
    c.log.unshift({at:Date.now(), text:'Claim failed — '+blocked});
    notify('Claim defended', teamName(c.fromTeam)+' kept '+playerName(c.playerId)+' — '+blocked+'.');
    return;
  }
  /* Checked again here, not just when the claim went in: another of this
     team's claims may have landed in the meantime and used up the allowance. */
  if(S.settings.taxi.limitMode==='landed' && taxiLimitOn()){
    const landed = taxiStealCount(c.toTeam).landed;
    if(landed >= +S.settings.taxi.limitMax){
      c.status='withdrawn'; c.reason='they had already taken their '+S.settings.taxi.limitMax+' for the season';
      c.log.unshift({at:Date.now(), text:'Claim lapsed — '+teamName(c.toTeam)+' had already taken their '+S.settings.taxi.limitMax+' this season'});
      notify('Claim lapsed', teamName(c.toTeam)+' is at their taxi claim limit, so '+playerName(c.playerId)+' stays put.','bad');
      return;
    }
  }
  const cannot = claimCanLand(c);
  if(cannot){
    c.status='withdrawn'; c.reason=cannot;
    c.log.unshift({at:Date.now(), text:'Claim lapsed — '+teamName(c.toTeam)+' '+cannot});
    notify('Claim lapsed', teamName(c.toTeam)+' could not take '+playerName(c.playerId)+' — '+cannot+'.','bad');
    return;
  }
  p.contract.teamId = c.toTeam;
  p.slot = 'active';
  c.status='awarded'; c.at2=Date.now();
  c.log.unshift({at:Date.now(), text:teamName(c.toTeam)+' takes him, straight onto the active roster'});
  logIt(teamName(c.toTeam)+' claimed '+p.name+' off '+teamName(c.fromTeam)+"'s taxi squad — "+
    money(capHit(p,S.league.season))+' now counts', {type:'add', teams:[c.toTeam, c.fromTeam], players:[p.id]});
  notify('Taxi claim awarded', p.name+' goes to '+teamName(c.toTeam)+' for nothing.','good');
}
ACT.taxiClaim = (d)=>{
  const p = byId(S.players, d.id), me = actingTeam();
  if(!p || !p.contract || !onTaxi(p)) return toast('He is not on a taxi squad','bad');

ACT.cdField = (d, el)=>{
  const cd = ui.tmp.cd, f = d.f;
  let v = el.value;
  /* Spread a figure evenly across the years and show it in the year boxes.
     Without this, a deal set year by year ignored anything typed into Total or
     Each year — you could type and save and nothing moved. */
  const spread = ()=>{
    if(!cd.byYear) return;
    const n = Math.max(1, cd.years);
    const per = fixCents(cd.total / n);
    cd.byYear = Array.from({length:n}, ()=> per);
    const drift = fixCents(cd.total - per*n);
    if(drift) cd.byYear[n-1] = fixCents(per + drift);
    cd.byYear.forEach((val,i)=>{ const b = $('[data-k="cdy'+i+'"]'); if(b) b.value = val; });
  };
  if(f==='perYear'){
    /* Say what he is on a year and the deal follows. Never writes back into
       this box, so a figure can be typed in full. */
    cd.total = fixCents((+v||0) * Math.max(1, cd.years));
    spread();
    const t = $('[data-k="cdtotal"]'); if(t) t.value = cd.total;
    const el3 = $('#cdPreview'); if(el3) el3.innerHTML = contractPreview();
    return;
  }
  if(f==='total'){
    v = +v||0;
    cd.total = v;
    spread();
    const pv0 = $('[data-k="cdper"]'); if(pv0) pv0.value = fixCents(cd.total/Math.max(1,cd.years));
    const el4 = $('#cdPreview'); if(el4) el4.innerHTML = contractPreview();
    return;
  }
  if(f==='years') v = clamp(+v||1, S.settings.contracts.minYears, S.settings.contracts.maxYears);
  if(f==='startYear') v = +v || S.league.season;
  cd[f] = v;
  if(f==='years' && cd.byYear){
    /* Grow the row when the deal gets longer, but never cut it short —
       cdSalaries() only ever reads the first cd.years of it. Truncating here
       threw away figures somebody had typed the moment they backspaced the
       length, and typing "12" passes through "1" on the way. */
    while(cd.byYear.length < cd.years) cd.byYear.push(cd.byYear[cd.byYear.length-1] || 0);
    cd.total = fixInc(sum(cdSalaries()));
  }
  if(f!=='total'){ const t = $('[data-k="cdtotal"]'); if(t && cd.byYear) t.value = cd.total; }
  if(f!=='perYear'){ const pv = $('[data-k="cdper"]'); if(pv) pv.value = fixInc(cd.total/Math.max(1,cd.years)); }
  const el2 = $('#cdPreview'); if(el2) el2.innerHTML = contractPreview();
};

/* What the deal actually pays, whichever way it was built. */
function cdSalaries(){
  const cd = ui.tmp.cd;
  if(cd.byYear){
    const out = cd.byYear.slice(0, cd.years);
    while(out.length < cd.years) out.push(0);
    return out.map(v=> roundInc(+v||0));
  }
  return salariesFor(cd.total, cd.years, cd.structId);
}
/* The share of the deal each year carries, whatever shape it is in. Used to
   work out how big a contract could get before it stops fitting. */
function cdShares(){
  const cd = ui.tmp.cd;
  if(cd.byYear){
    const v = cdSalaries().map(x=> Math.max(0,+x||0));
    const tot = sum(v);
    if(tot > 0) return v.map(x=> x/tot);
    return v.map(()=> 1/Math.max(1,cd.years));
  }
  return structPct(structById(cd.structId), cd.years, cd.total).map(x=> x/100);
}
/* The most this deal could be worth and still leave the team level or better
   in every year it runs. Null when nothing binds it. */
function cdMaxTotal(){
  const cd = ui.tmp.cd;
  const other = S.players.filter(x=> x.contract && x.contract.teamId===cd.teamId && x.id!==cd.pid);
  const shares = cdShares();
  let max = Infinity;
  for(let i=0;i<cd.years;i++){
    const yy = cd.startYear + i;
    if(yy < S.league.season) continue;
    const share = shares[i] || 0;
    if(share <= 0) continue;
    const committed = sum(other.map(x=>capHit(x,yy))) + teamDead(cd.teamId,yy)
      + teamAdj(cd.teamId,yy) + teamRetained(cd.teamId,yy);
    const room = teamCapForYear(cd.teamId,yy) - committed;
    max = Math.min(max, room/share);
  }
  return max===Infinity ? null : fixInc(Math.max(0, max));
}
