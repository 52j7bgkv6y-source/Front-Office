  cape:    {name:'Cape',      part:'back',  draw:c=>'<path d="M40 40c-15 12-19 42-15 62h70c4-20 0-50-15-62z" fill="'+c.dark+'" opacity=".8"/>'},
  paint:   {name:'War paint', part:'head',  draw:c=>'<path d="M48 30l-6 11M72 30l6 11" stroke="'+c.light+'" stroke-width="3.5" stroke-linecap="round"/>'}
};
const TAUNTS = {
  flex:     {name:'Flex',     line:'Look at this.'},
  point:    {name:'Point',    line:'You. Yeah, you.'},
  roar:     {name:'Roar',     line:"LET'S GOOOO."},
  beckon:   {name:'Beckon',   line:'Come on then.'},
  dance:    {name:'Dance',    line:'Cannot hear you over this.'},
  bow:      {name:'Bow',      line:'Thank you, thank you.'},
  facepalm: {name:'Facepalm', line:'I cannot watch this.'},
  shrug:    {name:'Shrug',    line:'Not my fault you set that lineup.'},
  spike:    {name:'Spike',    line:'Put it in the ground.'},
  nap:      {name:'Nap',      line:'Wake me if it gets close.'}
};
const TAUNT_MS = 9000;
function activeTaunt(teamId){
  const t = S.live.taunt;
  if(!t || t.teamId!==teamId) return null;
  return (Date.now() - t.at < TAUNT_MS) ? t.key : null;
}
function mascotSVG(key, paint, stage, cls, kit){
  const m = MASCOTS[key] || MASCOTS.wolf;
  const k = kit || {};
  const part = (which)=> Object.keys(KIT)
    .filter(x=> k[x] && (KIT[x].part||'head')===which)
    .map(x=> KIT[x].draw(paint)).join('');
  return '<g class="fo-anim '+(cls||'')+'">'+
    part('back')+
    foLegs(paint)+
    foArmL(paint)+
    foTorso(paint, part('torso'))+
    '<g class="m-head">'+m.head(paint)+foEyes(stage)+part('head')+'</g>'+
    foArmR(paint)+
    foDamage(stage)+
  '</g>';
}
/* Damage is read off the deficit, not the health bar, so the steps land where
   a fantasy manager expects them: a touchdown behind stings, five is a mauling. */
function brawlSide(pts, oppPts){
  const behind = Math.max(0, oppPts - pts);
  return {
    hp: clamp(Math.round(100 - behind*2.4), 3, 100),
    stage: behind < 8 ? 0 : behind < 20 ? 1 : behind < 35 ? 2 : 3,
    ahead: pts > oppPts,
    behind
  };
}
function hpColor(hp){ return hp>60 ? 'var(--sage)' : hp>30 ? 'var(--brass)' : 'var(--signal)'; }
function lastTalk(teamId){
  return (S.live.talk||[]).filter(t=> t.teamId===teamId)[0] || null;
}
function brawlPanel(myId, oppId, myPts, oppPts){
  const A = byId(S.teams,myId), B = byId(S.teams,oppId);
  if(!A || !B) return '';
  const pa = teamPaint(A), pb = teamPaint(B);
  const sa = brawlSide(myPts, oppPts), sb = brawlSide(oppPts, myPts);
  const cls = (side, other, team)=>{
    const t = activeTaunt(team.id);
    if(t) return 'fo-t-'+t;
    return side.hp<=8 ? 'fo-out' : side.ahead ? 'fo-win' : (other.ahead ? 'fo-lose' : 'fo-idle');
  };
  const margin = Math.abs(myPts-oppPts);
  const ta = lastTalk(myId), tb = lastTalk(oppId);
  const blurb = margin<3 ? 'Nobody has landed anything yet.'
    : margin<10 ? esc((myPts>oppPts?A:B).name)+' is getting the better of it.'
    : margin<25 ? esc((myPts>oppPts?A:B).name)+' is winning this on points.'
    : margin<45 ? 'Somebody should stop this.'
    : 'It is over and nobody told the loser.';

  return `<div class="panel" style="margin-bottom:14px">
    <div class="ph"><h3>Mascot brawl</h3><div class="spacer"></div>
      <span class="tiny muted hide-xs">${blurb}</span>
      <button class="btn ghost sm" data-a="pickMascot">Customise</button></div>
    <div class="pb">
      <div class="row" style="gap:14px;align-items:flex-start;margin-bottom:10px">
        <div class="corner"><div class="who"><b style="color:${pa.main}">${esc(A.name)}</b><span class="num">${myPts.toFixed(1)}</span></div>
          <div class="hpbar"><i style="width:${sa.hp}%;background:${hpColor(sa.hp)}"></i></div></div>
        <div class="corner r"><div class="who"><b style="color:${pb.main}">${esc(B.name)}</b><span class="num">${oppPts.toFixed(1)}</span></div>
          <div class="hpbar"><i style="width:${sb.hp}%;background:${hpColor(sb.hp)}"></i></div></div>
      </div>
      <div class="bubs">
        ${ta?`<div class="bub l"><span class="who">${esc(A.mascotName||A.name)}</span>${esc(ta.text)}</div>`:''}
        ${tb?`<div class="bub r"><span class="who">${esc(B.mascotName||B.name)}</span>${esc(tb.text)}</div>`:''}
      </div>
      <div class="arena">
        <svg viewBox="0 0 460 200" role="img" aria-label="${esc(A.name)} versus ${esc(B.name)}">
          <rect class="floor" x="0" y="168" width="460" height="32"/>
          <ellipse cx="90" cy="170" rx="46" ry="7" fill="#000" opacity=".35"/>
          <ellipse cx="370" cy="170" rx="46" ry="7" fill="#000" opacity=".35"/>
          <g transform="translate(30,55)">${mascotSVG(A.mascot||'wolf', pa, sa.stage, cls(sa,sb,A), A.kit)}</g>
          <g transform="translate(430,55) scale(-1,1)">${mascotSVG(B.mascot||'bear', pb, sb.stage, cls(sb,sa,B), B.kit)}</g>
          ${margin>=6?`<g class="pow" transform="translate(230,95)">
            <path d="M0-26 7-9 25-13 13 1 26 14 8 12 4 30-4 13-22 17-11 2-24-12-6-9z" fill="var(--brass)"/>
            <text x="0" y="6" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700"
              font-size="15" fill="#231704">${margin>=45?'DONE':margin>=25?'CRUNCH':'POW'}</text></g>`:''}
        </svg>
      </div>
      <div class="row" style="margin-top:10px;gap:5px">
        ${Object.keys(TAUNTS).map(k=>`<button class="btn sm ${activeTaunt(myId)===k?'on':''}" data-a="taunt" data-k="${k}"
          title="${esc(TAUNTS[k].line)}">${esc(TAUNTS[k].name)}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="talkbox" data-k="talkbox" maxlength="140" placeholder="Say something to ${esc(B.name)}" style="flex:1;min-width:150px">
        <button class="btn pri" data-a="sendTalk">Send it</button>
      </div>
      ${(S.live.talk||[]).length?`<div class="log" style="margin-top:10px;max-height:130px">
        ${(S.live.talk||[]).slice(0,10).map(t=>'<div><span class="dim">'+dstr(t.at)+'</span> <b style="color:'+teamPaint(byId(S.teams,t.teamId)).main+'">'+esc(teamName(t.teamId))+'</b> — '+esc(t.text)+'</div>').join('')}
      </div>`:''}
    </div></div>`;
}
ACT.sendTalk = ()=>{
  const el = $('#talkbox'); if(!el || !el.value.trim()) return;
  S.live.talk = S.live.talk || [];
  S.live.talk.unshift({id:uid('tk'), at:Date.now(), teamId:actingTeam(), text:el.value.trim().slice(0,140)});
  if(S.live.talk.length>40) S.live.talk.length=40;
  el.value='';
  save(); render(); toast('Sent');
};
ACT.taunt = (d)=>{
  const me = actingTeam();
  S.live.taunt = {teamId:me, key:d.k, at:Date.now()};
  S.live.talk = S.live.talk || [];
  S.live.talk.unshift({id:uid('tk'), at:Date.now(), teamId:me, text:TAUNTS[d.k].line, taunt:d.k});
  if(S.live.talk.length>40) S.live.talk.length=40;
  save(); render();
};
ACT.pickMascot = ()=>{
  const t = myTeam(); if(!t) return;
  t.kit = t.kit || {};
  const paint = teamPaint(t);
  modal('Customise the '+(t.mascotName || t.name)+' mascot',
    '<div class="mascotpick">'+Object.keys(MASCOTS).map(k=>
      '<button data-a="setMascot" data-m="'+k+'" class="'+(t.mascot===k?'on':'')+'">'+
      '<svg viewBox="10 -10 104 134">'+mascotSVG(k, paint, 0, '', t.kit)+'</svg><span>'+esc(MASCOTS[k].name)+'</span></button>').join('')+'</div>'+
    '<div class="hr"></div>'+
    '<label class="f"><span>What the crowd calls him</span>'+
      '<input type="text" data-a="mascotName" data-k="mname" value="'+esc(t.mascotName||'')+'" placeholder="'+esc(t.name)+'"></label>'+
    '<div class="flabel" style="margin-top:12px">Body colour</div>'+
    '<div class="row" style="margin-bottom:12px">'+TEAM_COLORS.map(c=>
      '<button class="btn sm '+(t.color===c?'on':'')+'" data-a="setColor" data-c="'+c+'" style="background:'+c+';border-color:'+(t.color===c?'#E9EFF4':c)+';width:34px;height:28px"></button>').join('')+'</div>'+
    '<div class="flabel">Kit</div><div class="row">'+Object.keys(KIT).map(k=>
      '<button class="btn sm '+(t.kit[k]?'on':'')+'" data-a="toggleKit" data-k="'+k+'">'+esc(KIT[k].name)+'</button>').join('')+'</div>'+
    '<div class="hr"></div><div class="flabel">Taunts</div>'+
    '<div class="row">'+Object.keys(TAUNTS).map(k=>
      '<button class="btn sm" data-a="taunt" data-k="'+k+'">'+esc(TAUNTS[k].name)+'</button>').join('')+'</div>'+
    '<div class="hint">Ten of them. Each plays on your mascot for everyone watching and drops its line into the feed.</div>');
};
ACT.setMascot = (d)=>{ const t=myTeam(); if(t){ t.mascot=d.m; save(); ACT.pickMascot(); render(); } };
ACT.setColor = (d)=>{ const t=myTeam(); if(t){ t.color=d.c; save(); ACT.pickMascot(); render(); } };
ACT.toggleKit = (d)=>{ const t=myTeam(); if(t){ t.kit=t.kit||{}; t.kit[d.k]=!t.kit[d.k]; save(); ACT.pickMascot(); render(); } };
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-a="mascotName"]');
  if(el){ const t=myTeam(); if(t){ t.mascotName = el.value; save(); } }
});

VIEWS.live = function(){
  const t = myTeam(); if(!t) return '<div class="empty-state"><h3>No league loaded</h3></div>';
  const cfg = S.settings.live;
  const mine = S.live.matchups.find(m=> m.home===t.id || m.away===t.id);
  const oppId = mine ? (mine.home===t.id ? mine.away : mine.home) : null;
  const A = bestLineup(t.id), B = oppId ? bestLineup(oppId) : null;
  const live = S.live.games.filter(g=>g.status==='live').length;

  const lineupRows = A.starters.map((s,i)=>{
    const o = B ? B.starters[i] : null;
    return `<tr>
      <td style="width:38%">${s.p?`<div style="font-weight:500"><a href="#" data-a="playerCard" data-id="${s.p.id}" style="color:inherit">${esc(s.p.name)}</a>
        ${injuryTag(s.p)} ${matchupChip(s.p)}</div>${statLine(s.p)}`:'<span class="dim">empty</span>'}</td>
      <td class="right num" style="width:10%">${s.p?s.pts.toFixed(1):'—'}</td>
      <td class="center" style="width:12%"><span class="eyebrow">${esc(s.slot)}</span></td>
      <td class="right num" style="width:10%">${o&&o.p?o.pts.toFixed(1):'—'}</td>
      <td class="right" style="width:38%">${o&&o.p?`<div style="font-weight:500">${matchupChip(o.p)} ${esc(o.p.name)}</div>${statLine(o.p)}`:'<span class="dim">empty</span>'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="section">
    <header>
      <div><div class="eyebrow">Week ${S.live.week} · ${cfg.mode==='demo'?'Simulated feed':cfg.mode==='endpoint'?'Live endpoint':'Manual entry'}</div>
      <h1>Live scoring</h1></div>
      <div class="spacer"></div>
      ${live?'<span class="pill live">'+live+' games in progress</span>':''}
      ${cfg.mode==='demo' ? `<button class="btn ${cfg.running?'':'pri'}" data-a="simToggle">${cfg.running?'Pause feed':'Start feed'}</button>
        <button class="btn ghost" data-a="simReset">New week</button>` :
        `<button class="btn pri" data-a="pollNow">Refresh now</button>
         <button class="btn ghost" data-a="closeWeek">Close out week ${S.live.week}</button>`}
    </header>

    ${mine ? `<div class="panel" style="margin-bottom:14px">
      <div class="ph"><div style="flex:1"><div class="eyebrow">Your matchup</div>
        <div style="font:700 19px/1.2 var(--disp);text-transform:uppercase;letter-spacing:.04em">${esc(t.name)} <span class="money" style="font-family:var(--mono)">${A.total.toFixed(1)}</span>
        <span class="dim" style="font-size:14px"> vs </span> ${esc(teamName(oppId))} <span class="num">${B?B.total.toFixed(1):'0.0'}</span></div></div></div>
      <div class="pb tight scrollx"><table><tbody>${lineupRows}</tbody>
        <tfoot><tr class="tot"><td class="right">Total</td><td class="right money">${A.total.toFixed(1)}</td><td></td>
          <td class="right num">${B?B.total.toFixed(1):'0.0'}</td><td></td></tr></tfoot></table></div>
    </div>`:''}

    ${mine ? brawlPanel(t.id, oppId, A.total, B?B.total:0) : ''}

    ${(()=>{
      const mine = teamPlayers(t.id).filter(p=> p.pos!=='DEF' && thisWeekOpponent(p.nfl));
      const book = Object.keys(S.dvp||{}).length;
      const posOrder = ['QB','RB','WR','TE','K'];
      const defs = Object.keys(S.dvp||{}).filter(c=> (S.dvp[c].games||0)>0);
      return `<div class="split" style="margin-bottom:14px">
      <div class="panel"><div class="ph"><h3>This week's matchups</h3><div class="spacer"></div>
        <span class="tiny dim">${book?book+' defenses on the book':'no games logged yet'}</span></div>
        <div class="pb tight scrollx"><table>
        <thead><tr><th>Player</th><th>Pos</th><th>Facing</th><th class="right">Rank vs pos</th>
          <th class="right hide-xs">Vs the run</th><th class="right hide-xs">Vs the pass</th><th class="right">Week</th></tr></thead><tbody>
        ${mine.sort((a,b)=> (matchupFor(b)&&matchupFor(b).byPos?matchupFor(b).byPos.rank:0)-(matchupFor(a)&&matchupFor(a).byPos?matchupFor(a).byPos.rank:0))
          .map(p=>{
          const m = matchupFor(p); if(!m) return '';
          const r = m.byPos, run = dvpRank(m.opp.code,null,'rush'), pass = dvpRank(m.opp.code,null,'pass');
          const strong = primaryKind(p.pos);
          return `<tr><td>${esc(p.name)}</td><td>${posTag(p.pos)}</td>
            <td class="num">${m.opp.home?'@':'vs'} ${esc(m.opp.code)}</td>
            <td class="right num">${r? r.rank+' <span class="dim">of '+r.of+'</span>' : '<span class="dim">—</span>'}</td>
            <td class="right num hide-xs ${strong==='rush'?'':'dim'}">${run? run.rank : '—'}</td>
            <td class="right num hide-xs ${strong==='pass'?'':'dim'}">${pass? pass.rank : '—'}</td>
            <td class="right">${m.diff?'<span class="pill '+(m.diff.cls==='bad'?'live':m.diff.cls==='good'?'ok':'')+'">'+m.diff.label+'</span>':'<span class="dim tiny">no book</span>'}</td></tr>`;
        }).join('') || '<tr><td colspan="7" class="dim center" style="padding:20px">Nobody on your roster is playing this week.</td></tr>'}
        </tbody></table></div>
        <div class="pb"><div class="hint">Rank one gives up the least, so a low number is a hard week.
          Backs are judged on the run column, everyone else on the pass. The book fills in as weeks are closed out — the first couple of weeks will read thin.</div></div>
      </div>
      <div class="panel"><div class="ph"><h3>Defenses</h3></div><div class="pb tight scrollx">
        <table><thead><tr><th>Unit</th><th class="right">G</th>
          ${posOrder.map(x=>'<th class="right">'+x+'</th>').join('')}<th class="right">Run</th><th class="right">Pass</th></tr></thead><tbody>
        ${defs.map(c=>({c, r:dvpRank(c,null,'pass')})).sort((a,b)=>(a.r?a.r.rank:99)-(b.r?b.r.rank:99)).map(x=>{
          const c = x.c;

ACT.simToggle = ()=>{
  if(!S.live.games.length) buildWeek(S.live.week||1);
  S.settings.live.running = !S.settings.live.running; save(); render();
};
ACT.simReset = ()=>{
  recordWeek(); foldWeekIntoSeason(); foldWeekIntoDvp();
  buildWeek((S.live.week||1)+1);
  S.settings.live.running=true; save(); render();
  toast('Week '+S.live.week+' kicked off — last week is in the books');
};
ACT.setLiveMode = (d)=>{ S.settings.live.mode=d.m; S.settings.live.running=false; save(); render(); };
ACT.pollNow = ()=> pollEndpoint();
ACT.closeWeek = ()=>{
  recordWeek(); foldWeekIntoSeason(); foldWeekIntoDvp();
  const done = Object.keys((S.season||{}).byPlayer||{}).length;
  S.live.week = (S.live.week||1)+1;
  S.live.stats = {}; S.live.feed = [];
  buildWeek(S.live.week);
  logIt('Week '+(S.live.week-1)+' closed out — '+done+' players have season totals', {type:'admin'});
  save(); render(); toast('Week '+(S.live.week-1)+' is in the books','good');
};
ACT.applyPaste = ()=>{
  try{ applyFeed(JSON.parse($('#feedpaste').value)); toast('Stats applied','good'); }
  catch(e){ toast('Could not read that payload — '+e.message,'bad'); }
};

function lineupForm(teamId, week){
  const L = lineupFor(teamId, week);

  const chosen = {}; L.slots.forEach(x=>{ if(x.p) chosen[x.p.id]=1; });
  const boss = lineupBoss(teamId, week);
  return `
    ${boss!==teamId?`<div class="hint warn">You are setting this because you hold ${esc(teamName(teamId))}'s
      ${S.league.season+1} first-round pick, and the ${esc(loserName())} decides who takes the first pick.</div>`:''}

      ${L.slots.map((x,i)=>{
        const elig = x.eligible || [];
        return `<div class="row" style="gap:8px">
          <span class="tiny dim" style="width:56px">${esc(x.slot)}</span>
          <select data-oninput="luSet" data-team="${teamId}" data-w="${week}" data-i="${i}" style="flex:1;min-width:150px">
            <option value="">— empty —</option>
            ${pool.filter(p=> elig.indexOf(p.pos)>=0)
              .sort((a,b)=> fpts(b.id)-fpts(a.id))
              .map(p=>'<option value="'+p.id+'"'+(x.p&&x.p.id===p.id?' selected':'')+
                (chosen[p.id]&&(!x.p||x.p.id!==p.id)?' disabled':'')+'>'+

ACT.phantom = (d)=>{
  if(!isCommish()) return toast('Commissioner only','bad');
  const t = byId(S.teams, d.id); if(!t) return;
  const was = phantomWins(t);
  t.phantomW = Math.max(0, was + (+d.n||0));
  if(t.phantomW===was) return;
  const up = t.phantomW > was;
  logIt(teamName(t.id)+(up?' given a phantom win':' had a phantom win taken back')+
    ' — now on '+t.phantomW+' for draft order, record unchanged at '+teamRecord(t).w+'-'+teamRecord(t).l,
    {type:'admin', teams:[t.id]});

ACT.setSlot = (d)=>{
  const p = byId(S.players, d.id), slot = d.s;
  if(!p || !p.contract) return;
  const tid = p.contract.teamId;
  if(slot!=='active' && slotRoom(tid, slot) <= 0)
    return toast('No '+SLOT_LABEL[slot].toLowerCase()+' room left','bad');
  if(slot==='active'){
    if(p.ir && p.ir.seasonEnding && p.ir.year===S.league.season && !isCommish())
      return toast('Season-ending IR holds until the year turns over','bad');
    const was = playerSlot(p);
    p.slot = 'active'; delete p.ir;
    if(S.settings.trades.capMustBeLegal && capSpace(tid, S.league.season) < 0){
      p.slot = was; return toast('His salary does not fit under the cap','bad');
    }
    if(slotRoom(tid,'active') < 0){ p.slot = was; return toast('No room on the active roster','bad'); }
    logIt(teamName(tid)+' activated '+p.name+(was==='taxi'?' off the taxi squad — '+money(capHit(p,S.league.season))+' now counts':''),
      {type:'admin', teams:[tid], players:[p.id]});
  } else {
    p.slot = slot;
    if(slot!=='ir') delete p.ir;
    logIt(teamName(tid)+' moved '+p.name+' to '+SLOT_LABEL[slot].toLowerCase(), {type:'admin', teams:[tid], players:[p.id]});
  }
  save(); render();
};

      {type:'drop', teams:[from].filter(Boolean), players:[p.id]});
    notify('Cut free', p.name+' is available, and whoever takes him takes the contract as it stands.');
  }
  closeModal(); save(); render(); toast('Done','good');
};

/* ============================================================
   TAXI CLAIMS
   Anyone can put a claim on somebody else's taxi player. The owner has a
   window to promote him or work a trade; let it run out and the claim lands
   for nothing.
   ============================================================ */
function openClaimFor(playerId){ return (S.taxiClaims||[]).find(c=> c.playerId===playerId && c.status==='open'); }
/* Who has been raiding whom. Only worth showing once somebody has actually
   tried something, or it is a table of zeroes. */
function taxiStealBoard(){
  const any = (S.taxiClaims||[]).length;
  if(!any && !taxiLimitOn()) return '';
  const t = S.settings.taxi;
  const rows = S.teams.map(tm=>({tm, n:taxiStealCount(tm.id), left:taxiStealsLeft(tm.id)}))
    .filter(r=> r.n.attempts>0 || taxiLimitOn())
    .sort((a,b)=> b.n.landed-a.n.landed || b.n.attempts-a.n.attempts);
  if(!rows.length) return '';
  return `<div class="hr"></div>
    <div class="ph"><h3 style="font-size:15px">Taxi claims this season</h3><div class="spacer"></div>
      <span class="tiny dim">${taxiLimitOn()
        ? (t.limitMode==='landed' ? 'up to '+t.limitMax+' can land per team' : t.limitMax+' attempts each')
        : 'no limit set'}</span></div>
    <div class="pb tight scrollx"><table>
      <thead><tr><th>Team</th><th class="right">Tried</th><th class="right">Landed</th>
        <th class="right">Running</th><th class="right">Saw them off</th>
        ${taxiLimitOn()?'<th class="right">Left</th>':''}</tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${esc(r.tm.name)}</td>
        <td class="right num ${r.n.attempts?'':'dim'}">${r.n.attempts}</td>
        <td class="right num ${r.n.landed?'good':'dim'}">${r.n.landed}</td>
        <td class="right num ${r.n.inFlight?'':'dim'}">${r.n.inFlight}</td>
        <td class="right num dim">${taxiStolenFrom(r.tm.id)}</td>
        ${taxiLimitOn()?'<td class="right num '+(r.left<=0?'bad':'')+'">'+r.left+'</td>':''}
      </tr>`).join('')}</tbody></table></div>
    <div class="pb"><div class="hint">Counts start over when the season rolls over.
      <b>Tried</b> is every claim put in, <b>Landed</b> is the ones that stuck, and
      <b>Saw them off</b> is how many times that team kept a player somebody came for.</div></div>`;
}
/* How many times this team had somebody taken off their own taxi squad. */
function taxiStolenFrom(teamId){
  return (S.taxiClaims||[]).filter(c=> c.fromTeam===teamId && c.status==='awarded').length;
}
/* ---- how many a team has taken off other people's taxi squads ----
   S.taxiClaims is emptied when the season rolls over, so all of this is
   per-season without anything having to be reset by hand. */
function taxiStealCount(teamId){
  const mine = (S.taxiClaims||[]).filter(c=> c.toTeam===teamId);
  return {
    attempts: mine.length,
    landed:   mine.filter(c=> c.status==='awarded').length,
    inFlight: mine.filter(c=> c.status==='open').length,
    failed:   mine.filter(c=> c.status==='defended' || c.status==='withdrawn').length
  };
}
/* Two ways to read a limit, and they answer different questions.
   "attempts" — every claim you put in burns one, however it ends. Pulling it
   does not give it back, or a team could tie up half the league and pull out
   at the last second.
   "landed"  — only claims that actually stick count, but ones still running
   are counted too, since they might yet stick. A claim that gets defended or
   lapses hands the slot back and you can go again. */
function taxiStealsUsed(teamId){
  const n = taxiStealCount(teamId);
  return S.settings.taxi.limitMode==='landed' ? n.landed + n.inFlight : n.attempts;
}
function taxiLimitOn(){
  const t = S.settings.taxi;
  return t.limitMode && t.limitMode!=='off' && +t.limitMax>0;
}
function taxiStealsLeft(teamId){
  if(!taxiLimitOn()) return null;
  return Math.max(0, (+S.settings.taxi.limitMax) - taxiStealsUsed(teamId));
}
/* Why this team cannot claim anybody right now, or null if they can. */
function taxiLimitBlock(teamId){
  if(!taxiLimitOn()) return null;
  if(taxiStealsLeft(teamId) > 0) return null;
  const t = S.settings.taxi, n = +t.limitMax, s = n===1?'':'s';
  return t.limitMode==='landed'
    ? 'they are already down for '+n+' taxi claim'+s+' this season'
    : 'they have used all '+n+' of their taxi claims this season';
}
function claimBlocked(c){
  const p = byId(S.players, c.playerId);
  if(!p || !p.contract) return 'he is no longer under contract';
  if(p.contract.teamId !== c.fromTeam) return 'he has already been traded';
  if(!onTaxi(p)) return 'he was promoted to the active roster';
  const pending = S.trades.some(t=> (t.status==='proposed' || t.status==='review') &&
    [].concat(t.a.players||[], t.b.players||[]).indexOf(p.id) >= 0);
  if(pending) return 'there is a trade on the table for him';
  return null;
}
function claimCanLand(c){
  const p = byId(S.players, c.playerId);
  if(slotRoom(c.toTeam,'active') <= 0) return 'no room on the active roster';
  const hit = fixInc(Math.max(0, grossHit(p, S.league.season) - retainedOn(p, S.league.season)));
  if(S.settings.trades.capMustBeLegal && hit > capSpace(c.toTeam, S.league.season))
    return 'cannot fit the '+money(hit)+' salary under the cap';
  return null;
}
function settleTaxiClaim(c){
  if(c.status!=='open') return;
  const p = byId(S.players, c.playerId);
  const blocked = claimBlocked(c);
  if(blocked){
    c.status='defended'; c.reason=blocked;
    c.log.unshift({at:Date.now(), text:'Claim failed — '+blocked});
    notify('Claim defended', teamName(c.fromTeam)+' kept '+playerName(c.playerId)+' — '+blocked+'.');
    return;
  }
  /* Checked again here, not just when the claim went in: another of this
     team's claims may have landed in the meantime and used up the allowance. */
  if(S.settings.taxi.limitMode==='landed' && taxiLimitOn()){
    const landed = taxiStealCount(c.toTeam).landed;
    if(landed >= +S.settings.taxi.limitMax){
      c.status='withdrawn'; c.reason='they had already taken their '+S.settings.taxi.limitMax+' for the season';
      c.log.unshift({at:Date.now(), text:'Claim lapsed — '+teamName(c.toTeam)+' had already taken their '+S.settings.taxi.limitMax+' this season'});
      notify('Claim lapsed', teamName(c.toTeam)+' is at their taxi claim limit, so '+playerName(c.playerId)+' stays put.','bad');
      return;
    }
  }
  const cannot = claimCanLand(c);
  if(cannot){
    c.status='withdrawn'; c.reason=cannot;
    c.log.unshift({at:Date.now(), text:'Claim lapsed — '+teamName(c.toTeam)+' '+cannot});
    notify('Claim lapsed', teamName(c.toTeam)+' could not take '+playerName(c.playerId)+' — '+cannot+'.','bad');
    return;
  }
  p.contract.teamId = c.toTeam;
  p.slot = 'active';
  c.status='awarded'; c.at2=Date.now();
  c.log.unshift({at:Date.now(), text:teamName(c.toTeam)+' takes him, straight onto the active roster'});
  logIt(teamName(c.toTeam)+' claimed '+p.name+' off '+teamName(c.fromTeam)+"'s taxi squad — "+
    money(capHit(p,S.league.season))+' now counts', {type:'add', teams:[c.toTeam, c.fromTeam], players:[p.id]});
  notify('Taxi claim awarded', p.name+' goes to '+teamName(c.toTeam)+' for nothing.','good');
}

ACT.cdFlat = ()=>{

/* What the deal actually pays, whichever way it was built. */
function cdSalaries(){
  const cd = ui.tmp.cd;
  if(cd.byYear){
    const out = cd.byYear.slice(0, cd.years);
    while(out.length < cd.years) out.push(0);
    return out.map(v=> roundInc(+v||0));
  }
  return salariesFor(cd.total, cd.years, cd.structId);
}
function contractPreview(){

    <div class="scrollx"><table><thead><tr><th>Year</th>${sal.map((_,i)=>'<th class="right">'+(cd.startYear+i)+'</th>').join('')}</tr></thead>

ACT.claimOrphan = (d)=>{
  const p = byId(S.players,d.id), tid = currentTeamId(), y = S.league.season;
  if(!isOrphan(p)) return;
  const hit = grossHit(p, y);
  const cheap = hit <= (+S.settings.waivers.salary||1);
  p.contract.teamId = tid;
  delete p.contract.freedBy; delete p.contract.freedAt; delete p.contract.freedYear;
  if(cheap) p.contract.waiver = true;               // a dollar deal is a waiver deal
  p.lastTeam = null;
  logIt(teamName(tid)+' picked up '+p.name+' on his existing deal — '+money(hit)+' for '+y+
    (cheap?', as a waiver player':''), {type:'add', teams:[tid], players:[p.id]});
  notify('Picked up', p.name+' goes to '+teamName(tid)+' on the deal he was cut with.','good');
  closeModal(); save(); render(); toast('Signed','good');
};

ACT.liftWaiver = (d)=>{

ACT.saveContract = ()=>{
  const cd = ui.tmp.cd, p = byId(S.players,cd.pid);
  if(cd.total<=0) return toast('Give the deal a value','bad');
  const lp = limitProblemFor('signings', cd.teamId, cd.years, p.id);
  if(lp) return toast(teamName(cd.teamId)+' already has '+lp.have+' deals of '+lp.length+' years or longer and is allowed '+lp.allow,'bad');
  const c = makeContract(cd.teamId, cd.total, cd.years, cd.structId, cd.startYear);
  if(cd.byYear){                       // exact figures beat any structure
    c.salaries = cdSalaries();
    c.total = fixInc(sum(c.salaries));
    c.byYear = true;
  }
  const before = p.contract; p.contract = c;
  if(S.settings.trades.capMustBeLegal){
    const bad = projYears().find(y=> capSpace(cd.teamId,y) < 0);
    if(bad){ p.contract = before; return toast('That puts '+teamName(cd.teamId)+' over the cap in '+bad,'bad'); }
  }
  logIt(teamName(cd.teamId)+' signed '+p.name+' — '+money(c.total)+' over '+c.years+' yr ('+
    (c.byYear?'set year by year':structById(c.structId).name)+')',
    {type: before?'admin':'add', teams:[cd.teamId], players:[p.id]});
  closeModal(); save(); render(); toast('Contract saved','good');
};
function applyExtension(p, addYears, aav, structId){
  const c = p.contract;
  const ext = salariesFor(roundInc(aav*addYears), addYears, structId);
  c.salaries = c.salaries.concat(ext);
  c.years += addYears;
  c.total = fixInc(sum(c.salaries));
  c.extensions = (c.extensions||[]).concat([{at:Date.now(), years:addYears, aav:fixInc(aav), structId}]);
}

function ladderQuote(p){
  const g = canExtend(p);

  return {price: ladderPrice(p.pos, g.rank.rank), gate:g,
          work: ladderWorking(p.pos, g.rank.rank)};
}

function pickValue(pk){
  const base = (+S.settings.cap.base||250)/250;
  return Math.round(({1:25,2:12,3:6,4:3}[(pk&&pk.round)||0]||2)*base);
}
/* A want that names a shape rather than a name: "a WR", "a 2027 first". */
function specLabel(sp){
  if(sp.kind==='pos') return 'any ' + sp.pos + (sp.min ? ' worth ' + money(sp.min) + '+' : '');
  if(sp.kind==='pick') return (sp.year||'any year') + ' ' + (sp.round ? 'round ' + sp.round : 'any round');
  return '?';
}
function specValue(sp){
  if(sp.kind==='pos') return +sp.min||0;
  if(sp.kind==='pick') return pickValue({round:+sp.round||3});
  return 0;
}
function askValue(ask){ return fixInc(assetValue(ask) + sum((ask.specs||[]).map(specValue))); }
/* Does an offer actually contain the shapes that were asked for? */
function meetsSpecs(offer, ask){
  const specs = (ask && ask.specs) || [];
  if(!specs.length) return true;
  const players = (offer.players||[]).map(id=>byId(S.players,id)).filter(Boolean);
  const picks = (offer.picks||[]).map(id=>byId(S.picks,id)).filter(Boolean);
  const usedP = {}, usedK = {};
  return specs.every(sp=>{
    if(sp.kind==='pos'){
      const hit = players.find(x=> !usedP[x.id] && x.pos===sp.pos && (!sp.min || (x.value||0) >= +sp.min));
      if(hit){ usedP[hit.id]=1; return true; }
      return false;
    }
    if(sp.kind==='pick'){
      const hit = picks.find(k=> !usedK[k.id] && (!sp.round || k.round===+sp.round) && (!sp.year || k.year===+sp.year));
      if(hit){ usedK[hit.id]=1; return true; }
      return false;
    }
    return true;
  });
}
function assetValue(o){
  return fixInc(
    sum((o.players||[]).map(id=>{ const p=byId(S.players,id); return p ? (p.value || (p.contract&&p.contract.total) || 1) : 0; })) +
    sum((o.picks||[]).map(id=>{ const k=byId(S.picks,id); return k ? pickValue(k) : 0; })) + (+o.cash||0));
}
function specChips(ask, rm){
  return ((ask.specs)||[]).map((sp,i)=>'<span class="chip" style="border-style:dashed">'+esc(specLabel(sp))+
    (rm?'<button data-a="'+rm+'" data-i="'+i+'">×</button>':'')+'</span>').join('');
}
function assetChips(o, opts){
  const rm = opts && opts.rm;
  const bits = (o.players||[]).map(id=>{ const p=byId(S.players,id); return p?'<span class="chip">'+posTag(p.pos)+' '+esc(p.name)+(rm?'<button data-a="'+rm+'" data-kind="players" data-id="'+id+'" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>':''; })
    .concat((o.picks||[]).map(id=>{ const k=byId(S.picks,id); return k?'<span class="chip">'+esc(pickLabel(k))+(rm?'<button data-a="'+rm+'" data-kind="picks" data-id="'+id+'" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>':''; }))
    .filter(Boolean);
  if(+o.cash) bits.push('<span class="chip money">'+money(+o.cash)+' cap'+
    (rm?'<button data-a="'+rm+'" data-kind="cash" data-id="cash" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>');
  return bits.join('') || '<span class="dim tiny">nothing yet</span>';
}
/* A trade with more than two teams in it is just a list of hand-overs. */
function legTeams(tr){
  const set = {};
  (tr.legs||[]).forEach(l=>{ if(l.from) set[l.from]=1; if(l.to) set[l.to]=1; });
  return Object.keys(set);
}
function legValue(l){ return assetValue({players:l.players, picks:l.picks, cash:l.cash}); }
/* How much cap ROOM each team gains or loses if the whole thing goes through.
   Room, not committed money — the two move in opposite directions, and both
   callers add this straight onto capSpace(). Sending a salary away frees room;
   taking one on eats it. This was once written in committed terms, which made
   the board show every team's after figure backwards. */
function tradeCapDelta(tr, teamId, year){
  let d = 0;
  (tr.legs||[]).forEach(l=>{
    (l.players||[]).forEach(pid=>{
      const p = byId(S.players,pid); if(!p || !p.contract) return;
      const gross = fixInc(Math.max(0, grossHit(p,year) - retainedOn(p,year)));
      const keep  = Math.min(gross, fixInc(+(((l.retain||{})[pid]||{}).byYear||{})[year] || 0));
      if(l.from===teamId) d += (gross - keep);   // frees up his salary, less the part you keep paying
      if(l.to===teamId)   d -= (gross - keep);   // costs them his salary, less the part you keep paying
    });
    const cash = +l.cash||0;                     // sending cap dollars leaves you poorer, them richer
    if(cash){ if(l.from===teamId) d -= cash; if(l.to===teamId) d += cash; }
  });
  return fixInc(d);
}
/* Trades are usually let through, but the roster still ought to say plainly
   that it has gone past what the league would normally allow. */
function limitAfterTrade(tr){
  const notes = [];
  (tr.legs||[]).forEach(l=>{
    (l.players||[]).forEach(pid=>{
      const p = byId(S.players,pid); if(!p || !p.contract) return;
      const lp = limitProblem(l.to, p.contract.years, null);
      if(lp) notes.push({team:l.to, player:p.name, length:lp.length, have:lp.have, allow:lp.allow});
    });
  });
  return notes;
}
function multiLegal(tr){
  const bad = [];
  legTeams(tr).forEach(t=>{
    projYears().forEach(y=>{
      const after = capSpace(t, y) + tradeCapDelta(tr, t, y);
      if(after < 0) bad.push({team:t, year:y, over:fixInc(-after)});
    });
  });
  return bad;
}
/* Hand everything over. Used both for real and for the dry run below, so the
   two can never drift apart. */
function applyMultiLegs(tr){
  (tr.legs||[]).forEach(l=>{
    (l.players||[]).forEach(pid=>{
      const p = byId(S.players,pid); if(!p || !p.contract) return;
      p.contract.teamId = l.to;
      const r = (l.retain||{})[pid];
      if(r && r.byYear && Object.keys(r.byYear).length) applyRetentionYears(pid, l.from, r.byYear);
    });
    (l.picks||[]).forEach(kid=>{ const k = byId(S.picks,kid); if(k) k.ownerTeamId = l.to; });
    const cash = +l.cash||0;
    if(cash){
      const f = byId(S.teams,l.from), t = byId(S.teams,l.to);
      if(f){ f.adj=f.adj||[]; f.adj.push({year:S.league.season, amount:cash, note:'Cap sent to '+teamName(l.to)}); }
      if(t){ t.adj=t.adj||[]; t.adj.push({year:S.league.season, amount:-cash, note:'Cap from '+teamName(l.from)}); }
    }
  });
}
/* Would anybody be over once this lands? Measured, not calculated — we hand
   the assets over for real, read everybody's books, then put it all back. The
   arithmetic version of this ran with its signs reversed for months without
   anyone noticing, which is survivable in a table and is not in a gate.
   Same year as the two-team check, so a three-way is held to the same standard
   as the two-way it could otherwise be split into. */
function multiCapProblem(tr){
  const snap = tradeSnapshot(tr);
  applyMultiLegs(tr);
  let worst = null;
  legTeams(tr).forEach(t=>{
    const sp = capSpace(t, S.league.season);
    if(sp < 0 && (!worst || sp < worst.space)) worst = {team:t, space:sp, over:fixInc(-sp)};
  });
  restoreSnapshot(snap);
  return worst;
}
function processMulti(tr){
  if(tr.status!=='review') return;
  if(limitBinds('trades')){
    const lim = limitAfterTrade(tr);
    if(lim.length){
      tr.status='rejected';
      tr.reason = teamName(lim[0].team)+' would be past the contract length limits';
      tr.log.unshift({at:Date.now(), text:'Blocked — '+tr.reason});
      notify('Trade blocked', teamName(lim[0].team)+' cannot hold that many long deals.','bad');
      logIt('Multi-team trade rejected — '+tr.reason, {type:'trade', teams:legTeams(tr)});
      return;
    }
  }
  if(S.settings.trades.capMustBeLegal){
    const bad = multiCapProblem(tr);
    if(bad){
      tr.status='rejected';
      tr.reason = 'Would put '+teamName(bad.team)+' '+money(bad.over)+' over the '+S.league.season+' cap';
      tr.log.unshift({at:Date.now(), text:'Blocked — '+tr.reason});
      notify('Trade blocked', tr.reason, 'bad');
      logIt('Multi-team trade rejected — '+tr.reason, {type:'trade', teams:legTeams(tr)});
      return;
    }
  }
  tr.undo = tradeSnapshot(tr);
  applyMultiLegs(tr);
  tr.status='approved'; tr.processedAt=Date.now();
  tr.log.unshift({at:Date.now(), text:'Processed'});
  logIt('Multi-team trade processed — '+legTeams(tr).map(teamName).join(', '),
    {type:'trade', teams:legTeams(tr), players:[].concat.apply([], (tr.legs||[]).map(l=>l.players||[]))});
  notify('Trade processed', legTeams(tr).length+' teams, '+
    (tr.legs||[]).reduce((a,l)=>a+(l.players||[]).length+(l.picks||[]).length,0)+' assets.','good');
}
function moveAssets(fromTeam, toTeam, o){
  (o.players||[]).forEach(id=>{
    const p=byId(S.players,id); if(!p || !p.contract) return;
    p.contract.teamId = toTeam;
    const r = (o.retain||{})[id];
    if(isOldRetain(r)) applyRetention(id, fromTeam, +r.pct, +r.through||S.league.season, 'pct');
    else if(r && r.byYear && Object.keys(r.byYear).length) applyRetentionYears(id, fromTeam, r.byYear);
  });
  (o.picks||[]).forEach(id=>{ const k=byId(S.picks,id); if(k) k.ownerTeamId=toTeam; });
  const cash = +o.cash||0;
  if(cash){
    const f=byId(S.teams,fromTeam), t=byId(S.teams,toTeam);
    if(f){ f.adj=f.adj||[]; f.adj.push({year:S.league.season, amount:cash, note:'Cap sent to '+teamName(toTeam)}); }
    if(t){ t.adj=t.adj||[]; t.adj.push({year:S.league.season, amount:-cash, note:'Cap from '+teamName(fromTeam)}); }
    logIt(money(cash)+' of cap moved from '+teamName(fromTeam)+' to '+teamName(toTeam),
      {type:'cap', teams:[fromTeam,toTeam]});
  }
}

/* ============================================================
   FREE AGENT AUCTIONS
   A bid is not play money. Whatever you win at becomes the man's salary,
   it comes off your cap, and it comes out of the budget you get for the year.
   ============================================================ */
/* 'cap' means there is no separate pot at all — you bid against the room you
   actually have, and winning simply spends it. */
function faBudget(teamId){
  const f = S.settings.fa;
  if(f.budgetMode==='cap') return fixInc(Math.max(0, capSpace(teamId, S.league.season)));
  return f.budgetMode==='pct'
    ? roundInc(capForYear(S.league.season) * (+f.budget||0)/100)
    : fixInc(+f.budget||0);
}
/* Auction bids call it `aav`, draft bids call it `amount`. Same money either
   way, and getting this wrong silently prices everything at zero. */
function faYearOne(bid){
  if(!bid) return 0;
  const perYear = +(bid.aav != null ? bid.aav : bid.amount) || 0;
  const years = clamp(+bid.years || 1, 1, 20);
  return salariesFor(roundInc(perYear*years), years, bid.structId)[0] || 0;
}
function faSpent(teamId){ const t = byId(S.teams,teamId); return fixInc(+((t||{}).faSpent) || 0); }
function faCommitted(teamId, exceptId){
  return fixInc(sum((S.faAuctions||[])
    .filter(a=> a.status==='open' && a.id!==exceptId && a.leading && a.leading.teamId===teamId)
    .map(a=> faYearOne(a.leading))));
}
function faLeft(teamId, exceptId){
  // Bidding on the cap, what has already been spent is off the books — taking
  // it off again would charge for the same signing twice.
  if(S.settings.fa.budgetMode==='cap')
    return fixInc(faBudget(teamId) - faCommitted(teamId, exceptId));
  return fixInc(faBudget(teamId) - faSpent(teamId) - faCommitted(teamId, exceptId));
}
function faOpenFor(playerId){ return (S.faAuctions||[]).find(a=> a.playerId===playerId && a.status==='open'); }
function settleFA(a){
  if(a.status!=='open') return;
  if(!a.leading){
    a.status='cancelled';
    a.log.unshift({at:Date.now(), text:'Closed with nobody in'});
    return;
  }
  const p = byId(S.players, a.playerId), b = a.leading;
  if(!p) { a.status='cancelled'; return; }
  const acc = willAccept(p, b.teamId, b.aav, b.years);
  if(!acc.ok){
    a.status='refused'; a.settledAt=Date.now();
    a.log.unshift({at:Date.now(), text:p.name+' will not sign for '+money(b.aav)+' — he wants '+money(acc.want)});
    logIt(p.name+' refused '+money(b.aav)+' a year from '+teamName(b.teamId)+' and stayed a free agent',
      {type:'admin', teams:[b.teamId], players:[p.id]});
    notify('Refused', p.name+' turned down '+teamName(b.teamId)+' and is back in the pool.','warn');
    return;
  }
  recordSigning(p.id, b.teamId, b.aav, 'free agent auction');
  awardContract(p.id, b.teamId, b.aav, {years:b.years, maxYears:S.settings.fa.maxYears,
    structId:b.structId, source:'free agent auction'});
  const t = byId(S.teams, b.teamId);
  if(t) t.faSpent = fixInc(faSpent(b.teamId) + faYearOne(b));
  a.status='signed'; a.settledAt=Date.now();
  a.log.unshift({at:Date.now(), text:teamName(b.teamId)+' wins him at '+money(b.aav)+' a year for '+b.years});
  logIt(teamName(b.teamId)+' signed '+p.name+' out of the auction — '+money(b.aav)+' a year for '+b.years+
    ' ('+money(faYearOne(b))+' of budget)', {type:'add', teams:[b.teamId], players:[p.id]});
  notify('Free agent signed', p.name+' goes to '+teamName(b.teamId)+' at '+money(b.aav)+' a year.','good');
}

/* ============================================================
   BLIND BID DRAFT
   Everyone bids at once and nobody sees anything. When the round closes it
   all reveals together and the board settles in one pass.
   ============================================================ */
function bbdMode(){
  const b = S.settings.bbd;
  if(b.budgetMode) return b.budgetMode;
  return b.separateBudget ? 'own' : 'fa';        // older leagues used a tickbox
}
function bbdBudget(teamId){
  const m = bbdMode();
  if(m==='cap') return fixInc(Math.max(0, capSpace(teamId, S.league.season)));
  if(m==='own') return fixInc(+S.settings.bbd.budget||0);
  return faBudget(teamId);
}
function bbdSpent(teamId){
  if(bbdMode()==='cap') return 0;                // the cap has already taken it
  if(bbdMode()==='fa') return faSpent(teamId);
  return fixInc(sum((S.bbd.rounds||[]).map(r=>
    sum((r.awards||[]).filter(a=> a.teamId===teamId).map(a=> +a.yearOne||0)))));
}
function bbdLeft(teamId){ return fixInc(bbdBudget(teamId) - bbdSpent(teamId)); }
function myBids(teamId){ return (S.bbd.bids||[]).filter(b=> b.teamId===teamId).sort((a,b)=> a.rank-b.rank); }
function bbdExposure(teamId){ return fixInc(sum(myBids(teamId).map(faYearOne))); }
function bbdOrder(){
  const tie = S.settings.bbd.tiebreak;
  return (x,y)=> (y.amount - x.amount)
    || (tie==='leastSpent' ? (bbdSpent(x.teamId) - bbdSpent(y.teamId)) : (x.at - y.at))
    || (x.rank - y.rank);
}
/* Highest live bid on the board is settled first, then the next, because one
   award can put the team behind it out of money. */
function resolveRound(){
  const cmp = bbdOrder();
  const byPlayer = {};
  (S.bbd.bids||[]).forEach(b=>{ (byPlayer[b.playerId] = byPlayer[b.playerId] || []).push(b); });
  Object.keys(byPlayer).forEach(k=> byPlayer[k].sort(cmp));

  const awards = [], spent = {}, won = {}, settled = {}, refused = [];
  const cap = +S.settings.bbd.maxPerRound || 0;
  const left = (t)=> bbdLeft(t) - (spent[t]||0);
  const room = (t)=> (teamPlayers(t).length + (won[t]||0)) < (+S.settings.roster.maxRoster||999);
  const under = (t)=> !cap || (won[t]||0) < cap;

  let guard = 0;
  while(guard++ < 3000){
    let best = null;
    Object.keys(byPlayer).forEach(pid=>{
      if(settled[pid]) return;
      for(const b of byPlayer[pid]){
        const y1 = faYearOne(b);
        if(y1 > left(b.teamId) || !room(b.teamId) || !under(b.teamId)) continue;
        if(!best || cmp(b, best.bid) < 0) best = {pid, bid:b, y1};
        break;                                   // only a player's top live bid competes
      }
    });
    if(!best) break;
    const pl = byId(S.players, best.pid);
    const acc = willAccept(pl, best.bid.teamId, best.bid.amount, best.bid.years);
    if(!acc.ok){
      // He will not sign it. Drop that bid and let the next in line have a go.
      byPlayer[best.pid] = byPlayer[best.pid].filter(x=> x!==best.bid);
      refused.push({playerId:best.pid, teamId:best.bid.teamId, amount:best.bid.amount, want:acc.want});
      if(!byPlayer[best.pid].length) settled[best.pid] = true;
      continue;
    }
    settled[best.pid] = true;
    spent[best.bid.teamId] = (spent[best.bid.teamId]||0) + best.y1;
    won[best.bid.teamId] = (won[best.bid.teamId]||0) + 1;
    awards.push({playerId:best.pid, teamId:best.bid.teamId, amount:best.bid.amount,
                 years:best.bid.years, structId:best.bid.structId, yearOne:best.y1});
  }

  awards.forEach(a=>{
    const p = byId(S.players, a.playerId); if(!p) return;
    recordSigning(p.id, a.teamId, a.amount, 'blind bid draft');
    awardContract(p.id, a.teamId, a.amount, {years:a.years, maxYears:S.settings.bbd.maxYears,
      structId:a.structId, source:'blind bid draft'});
    if(!S.settings.bbd.separateBudget){
      const t = byId(S.teams, a.teamId);
      if(t) t.faSpent = fixInc(faSpent(a.teamId) + a.yearOne);
    }
    logIt(teamName(a.teamId)+' won '+p.name+' on a blind bid — '+money(a.amount)+' a year for '+a.years,
      {type:'add', teams:[a.teamId], players:[p.id]});
  });

  const board = Object.keys(byPlayer).map(pid=>({
    playerId: pid,
    bids: byPlayer[pid].map(b=>({teamId:b.teamId, amount:b.amount, years:b.years})),
    winner: (awards.find(a=> a.playerId===pid) || null)
  })).sort((a,b)=> (b.bids[0]?b.bids[0].amount:0) - (a.bids[0]?a.bids[0].amount:0));

  S.bbd.rounds.unshift({ round:S.bbd.round, at:Date.now(), awards, board, refused,
    bidders: Array.from(new Set((S.bbd.bids||[]).map(b=>b.teamId))).length });
  refused.forEach(r=> logIt(playerName(r.playerId)+' refused '+money(r.amount)+' from '+teamName(r.teamId),
    {type:'admin', teams:[r.teamId], players:[r.playerId]}));
  S.bbd.bids = [];
  S.bbd.status = 'revealed';
  S.bbd.clock = null;
  notify('Round '+S.bbd.round+' is open', awards.length+' player'+(awards.length===1?'':'s')+' went. Every bid is on the board.','good');
  logIt('Blind bid round '+S.bbd.round+' resolved — '+awards.length+' signed', {type:'admin'});
  return awards;
}

ACT.bbPick = (d)=>{

    ui.tmp.bb.amount = Math.max(+S.settings.bbd.minBid||1, marketPrice(p,0));

};
ACT.bbField = (d,el)=>{
  const v = ui.tmp.bb;
  if(d.f==='amount') v.amount = Math.max(0, +el.value||0);
  else if(d.f==='years') v.years = clamp(+el.value||1, 1, +S.settings.bbd.maxYears||1);

  else v.structId = el.value;

};
ACT.bbSave = ()=>{
  const v = ui.tmp.bb, me = actingTeam();
  if(!v.playerId) return;
  if(v.amount < (+S.settings.bbd.minBid||0)) return toast('The floor is '+money(S.settings.bbd.minBid),'bad');
  S.bbd.bids.push({id:uid('bb'), teamId:me, playerId:v.playerId, amount:fixInc(v.amount),

ACT.bbRm = (d)=>{
  S.bbd.bids = S.bbd.bids.filter(x=> x.id!==d.id);
  myBids(actingTeam()).forEach((x,i)=> x.rank=i+1);
  save(); render();

ACT.bbMove = (d)=>{
  const mine = myBids(actingTeam()), i = mine.findIndex(x=>x.id===d.id), j = i + (+d.d);
  if(i<0 || j<0 || j>=mine.length) return;
  const a = mine[i].rank; mine[i].rank = mine[j].rank; mine[j].rank = a;
  save(); render();
};

/* ============================================================
   STANDARD TRADES + THIRD-PARTY COUNTERS
   ============================================================ */
function txMeta(tr){
  if(tr.type==='multi') return {type:'trade', teams:tr.teams||[],
    players:[].concat.apply([], (tr.legs||[]).map(l=>l.players||[]))};
  const cash = (+tr.a.cash||0) + (+tr.b.cash||0);
  const players = [].concat(tr.a.players||[], tr.b.players||[]);
  return { type: (cash && !players.length) ? 'cap' : 'trade',
           teams:[tr.a.teamId, tr.b.teamId], players, cash: cash>0 };
}
/* Trades come in two shapes now, so nothing may reach for .a or .b directly. */
function tradeTeams(tr){
  return tr.type==='multi' ? (tr.teams||[]) : [tr.a && tr.a.teamId, tr.b && tr.b.teamId].filter(Boolean);
}
function tradeAwaits(tr, teamId){
  if(tr.status!=='proposed') return false;
  return tr.type==='multi'
    ? (tr.teams||[]).indexOf(teamId)>=0 && (tr.accepted||[]).indexOf(teamId)<0
    : !!(tr.b && tr.b.teamId===teamId);
}
/* Retention is easy to miss on a trade card, and it is the whole difference
   between a deal that fits and one that does not. */
function retainNote(o){
  const kept = Object.keys(o.retain||{}).filter(pid=>{
    const r = o.retain[pid];
    return isOldRetain(r) || (r && r.byYear && Object.keys(r.byYear).some(y=> +r.byYear[y]>0));
  });
  if(!kept.length) return '';
  return '<div class="tiny good" style="margin-top:5px">'+ kept.map(pid=>{
    const r = o.retain[pid];
    return esc(teamName(o.teamId))+' keeps paying '+ (isOldRetain(r)
      ? r.pct+'% of '+esc(playerName(pid))+' through '+r.through
      : money(sum(Object.keys(r.byYear).map(y=> +r.byYear[y]||0)))+' of '+esc(playerName(pid)));
  }).join(' · ') +'</div>';
}
function tradeLine(tr){
  if(tr.type==='multi') return (tr.teams||[]).map(teamName).join(' ⇄ ');
  const l = (o)=> ((o.players||[]).map(playerName).concat((o.picks||[]).map(id=>{const k=byId(S.picks,id);return k?pickLabel(k):'';})).filter(Boolean).join(', ') || 'nothing') + ((+o.cash)?' + '+money(o.cash):'');
  return esc(teamName(tr.a.teamId)+' sends '+l(tr.a)+' · '+teamName(tr.b.teamId)+' sends '+l(tr.b));
}
function originalAssets(tr){
  const s = {};
  [].concat(tr.a.players, tr.b.players, tr.a.picks, tr.b.picks).forEach(id=> s[id]=1);
  return s;
}
function sideAssetsAfter(tr, side){
  const other = side==='a' ? 'b' : 'a', teamId = tr[side].teamId;
  const out = {}; tr[side].players.forEach(id=>out[id]=1); tr[side].picks.forEach(id=>out[id]=1);
  return {
    players: teamPlayers(teamId).filter(p=>!out[p.id]).map(p=>p.id).concat(tr[other].players),
    picks: S.picks.filter(k=>k.ownerTeamId===teamId && !out[k.id]).map(k=>k.id).concat(tr[other].picks)
  };
}
/* Enough of a snapshot to put a trade back the way it was. */
function tradeSnapshot(tr){
  const ids = {}, kids = {};
  const ct = (tr.counters||[]).find(c=> c.status==='accepted' || c.status==='processed');
  if(tr.type==='multi'){
    (tr.legs||[]).forEach(l=>{ (l.players||[]).forEach(i=>ids[i]=1); (l.picks||[]).forEach(i=>kids[i]=1); });
  } else
  [tr.a, tr.b].forEach(sd=>{ (sd.players||[]).forEach(i=>ids[i]=1); (sd.picks||[]).forEach(i=>kids[i]=1); });
  if(ct) [ct.wants, ct.gives].forEach(sd=>{ (sd.players||[]).forEach(i=>ids[i]=1); (sd.picks||[]).forEach(i=>kids[i]=1); });
  return {
    players: Object.keys(ids).map(id=>{ const p=byId(S.players,id); return p&&p.contract ? {id, t:p.contract.teamId, r:deep(p.contract.retained||[])} : null; }).filter(Boolean),
    picks: Object.keys(kids).map(id=>{ const k=byId(S.picks,id); return k ? {id, t:k.ownerTeamId} : null; }).filter(Boolean),
    adj: S.teams.map(t=>({id:t.id, n:(t.adj||[]).length}))
  };
}
function restoreSnapshot(sn){
  if(!sn) return false;
  (sn.players||[]).forEach(x=>{ const p=byId(S.players,x.id); if(p&&p.contract){ p.contract.teamId=x.t; p.contract.retained=deep(x.r||[]); }});
  (sn.picks||[]).forEach(x=>{ const k=byId(S.picks,x.id); if(k) k.ownerTeamId=x.t; });
  (sn.adj||[]).forEach(x=>{ const t=byId(S.teams,x.id); if(t&&t.adj&&t.adj.length>x.n) t.adj.length=x.n; });
  return true;
}
function undoWindowLeft(tr){
  const h = +S.settings.trades.undoHours||0;
  if(!h || tr.status!=='approved' || !tr.processedAt) return 0;
  return Math.max(0, tr.processedAt + h*3600000 - Date.now());
}
function processTrade(tr){
  if(tr.type==='multi') return processMulti(tr);
  if(tr.status!=='review') return;
  if(S.settings.trades.capMustBeLegal){
    const test = ()=>{
      const snap = deep({p:S.players.map(p=>p.contract?{id:p.id,t:p.contract.teamId}:null), k:S.picks.map(k=>({id:k.id,t:k.ownerTeamId}))});
      moveAssets(tr.a.teamId, tr.b.teamId, {players:tr.a.players, picks:tr.a.picks});
      moveAssets(tr.b.teamId, tr.a.teamId, {players:tr.b.players, picks:tr.b.picks});
      const bad = [tr.a.teamId, tr.b.teamId].find(id=> capSpace(id, S.league.season) < 0);
      snap.p.forEach(x=>{ if(x){ const p=byId(S.players,x.id); if(p&&p.contract) p.contract.teamId=x.t; }});
      snap.k.forEach(x=>{ const k=byId(S.picks,x.id); if(k) k.ownerTeamId=x.t; });
      return bad;
    };
    const bad = test();
    if(bad){
      tr.status='rejected'; tr.reason='Would put '+teamName(bad)+' over the '+S.league.season+' cap';
      notify('Trade rejected', tr.reason, 'bad'); logIt('Trade rejected — '+tr.reason); return;
    }
  }
  tr.undo = tradeSnapshot(tr);
  moveAssets(tr.a.teamId, tr.b.teamId, tr.a);
  moveAssets(tr.b.teamId, tr.a.teamId, tr.b);
  tr.status='approved'; tr.processedAt=Date.now();
  logIt('Trade processed — '+tradeLine(tr), txMeta(tr));
  notify('Trade processed', teamName(tr.a.teamId)+' and '+teamName(tr.b.teamId)+' are done.','good');
  const ch = (tr.counters||[]).find(c=> c.status==='accepted');
  if(ch){
    const target = tr[ch.side].teamId;
    moveAssets(ch.byTeamId, target, ch.gives);
    moveAssets(target, ch.byTeamId, ch.wants);
    ch.status='processed';
    logIt('Follow-on counter processed — '+teamName(ch.byTeamId)+' ⇄ '+teamName(target),
      {type:'trade', teams:[ch.byTeamId, target], players:[].concat(ch.wants.players||[], ch.gives.players||[])});
    notify('Counter processed', teamName(ch.byTeamId)+' picked up assets out of that trade.','good');
  }
}

/* Whatever is on the workbench right now, in the shape the cap board wants. */
function builderTrade(){
  if(ui.tmp.multi) return ui.tmp.multi;
  const a = ui.tmp.tb.a, b = ui.tmp.tb.b;
  return {legs:[
    {from:a.teamId, to:b.teamId, players:a.players, picks:a.picks, cash:a.cash, retain:retainToYears(a)},
    {from:b.teamId, to:a.teamId, players:b.players, picks:b.picks, cash:b.cash, retain:retainToYears(b)}]};
}

  ${S.settings.trades.counters.on?'during which any other team can counter it':''}${S.settings.trades.quiet.on?'. The window stops counting overnight':''}.</div>`;

/* Both builders now keep per-year figures. Anything proposed before that change
   still carries {pct, through} and has to keep working — an old shape is one
   with no byYear on it at all. */
function isOldRetain(r){ return !!(r && !r.byYear && +r.pct); }
function retainToYears(side){
  const out = {};
  Object.keys(side.retain||{}).forEach(pid=>{
    const r = side.retain[pid]; if(!r) return;
    const p = byId(S.players,pid); if(!p || !p.contract) return;
    if(isOldRetain(r)){
      const byYear = {};
      contractYears(p).forEach(x=>{ if(x.year <= (+r.through||S.league.season)) byYear[x.year] = fixInc(x.salary*(+r.pct||0)/100); });
      out[pid] = {byYear};
      return;
    }
    const byYear = {};
    Object.keys(r.byYear||{}).forEach(y=>{ if(+r.byYear[y]>0) byYear[y] = fixInc(+r.byYear[y]); });
    if(Object.keys(byYear).length) out[pid] = {byYear};
  });
  return out;
}

  if(!teams.length) return '';

      <tr><th></th>${yrs.map(()=>'<th class="right tiny dim">now</th><th class="right tiny dim">after</th>').join('')}</tr></thead>
    <tbody>${teams.map(t=>`<tr><td>${esc(teamName(t))}</td>
      ${yrs.map(y=>{
        const now = capSpace(t,y), after = fixInc(now + tradeCapDelta(tr,t,y));
        const moved = Math.abs(after-now) > 0.004;

/* Cap dollars are one figure per side, not a list — so this always REPLACES
   what is there rather than adding to it. Typing 0 clears it, same as the ×
   on the chip. An empty box is treated as "changed my mind", not as zero. */
function setCashFrom(sel, put, form){
  const box = $(sel); if(!box) return;
  const raw = String(box.value==null?'':box.value).trim();
  if(raw==='') return;
  put(Math.max(0, fixInc(+raw||0)));
  $('#modalBox .mb').innerHTML = (form||tradeForm)();
}
/* Redraw a modal without throwing the cursor out of whatever box is being
   typed in. The main view has done this since forever inside render(); modals
   never got it, which is why a percentage could not be typed past its first
   digit — the redraw after "1" destroyed the input before "00" arrived.
   Fields opt in by carrying a data-k. */
/* Replaces the board and nothing else. Rebuilding the whole form on every
   keystroke is what made these fields untypeable: an <input type="number">
   does not support setSelectionRange, so once the element is destroyed the
   caret cannot be put back and the next digit lands somewhere else — or
   nowhere. The percentage box has always worked precisely because it redraws
   nothing. Now none of them do. */
function refreshCapBoard(){
  const box = $('#capBoardBox');
  if(box) box.innerHTML = capBoard(builderTrade());
  else remodal(tradeForm());
}
function remodal(html){
  const box = $('#modalBox .mb'); if(!box) return;
  const ae = document.activeElement;
  const k = ae && ae.dataset ? (ae.dataset.k || null) : null;
  let ss=null, se=null;
  try{ ss = ae.selectionStart; se = ae.selectionEnd; }catch(e){}
  box.innerHTML = html;
  if(!k) return;
  const el = $('#modalBox .mb [data-k="'+k+'"]');
  if(el){ el.focus(); try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} }
}
/* "12." and "-" are half-typed, not numbers. Redrawing on them rewrites the box

ACT.ctAdd = (d)=>{
  if(d.kind==='cash') return setCashFrom('#ctgc', v=>{ ui.tmp.ct.gives.cash = v; }, counterForm);
  const map = {'wants-players':'#ctwp','wants-picks':'#ctwk','gives-players':'#ctgp','gives-picks':'#ctgk'};
  const sel = $(map[d.side+'-'+d.kind]); if(!sel||!sel.value) return;
  const arr = ui.tmp.ct[d.side][d.kind]; if(arr.indexOf(sel.value)<0) arr.push(sel.value);
  $('#modalBox .mb').innerHTML = counterForm();
};
ACT.ctRm = (d)=>{
  if(d.kind==='cash'){ ui.tmp.ct.gives.cash = 0; $('#modalBox .mb').innerHTML=counterForm(); return; }
  const arr=ui.tmp.ct[d.side][d.kind]; const i=arr.indexOf(d.id); if(i>=0) arr.splice(i,1); $('#modalBox .mb').innerHTML=counterForm(); };
ACT.sendCounter = ()=>{
  const ct = ui.tmp.ct, tr = byId(S.trades,ct.tradeId), c = S.settings.trades.counters, orig = originalAssets(tr);
  if(!ct.wants.players.length && !ct.wants.picks.length) return toast('Ask for something','bad');
  const hits = [].concat(ct.wants.players, ct.wants.picks).filter(id=> orig[id]).length;
  if(c.mustIncludeOriginal && !hits) return toast('Your counter has to include a piece of the original trade','bad');
  if(c.outcome==='replace'){
    const incoming = tr[ct.side==='a'?'b':'a'];
    const bad = [].concat(ct.wants.players, ct.wants.picks).some(id=> incoming.players.indexOf(id)>=0 || incoming.picks.indexOf(id)>=0);
    if(bad) return toast('That asset only arrives if the original trade goes through — switch counters to follow-on mode in Settings','bad');
  }
  tr.counters.unshift({id:uid('c'), byTeamId:actingTeam(), side:ct.side, wants:deep(ct.wants), gives:deep(ct.gives), at:Date.now(), status:'pending'});
  tr.log.unshift({at:Date.now(), text:teamName(actingTeam())+' countered '+teamName(tr[ct.side].teamId)});
  notify('Counter filed', teamName(actingTeam())+' is trying to break into the '+teamName(tr.a.teamId)+'/'+teamName(tr.b.teamId)+' trade.','warn');
  closeModal(); save(); render(); toast('Counter filed','good');
};
ACT.acceptCounter = (d)=>{
  const tr = byId(S.trades,d.id), ct = byId(tr.counters,d.cid), c = S.settings.trades.counters;
  ct.status='accepted'; tr.counters.forEach(x=>{ if(x!==ct && x.status==='pending') x.status='declined'; });
  if(c.outcome==='replace'){
    tr.status='replaced'; tr.log.unshift({at:Date.now(), text:'Voided — replaced by '+teamName(ct.byTeamId)+"'s counter"});
    const nt = {id:uid('tr'), type:'standard',
      a:{teamId:ct.byTeamId, players:ct.gives.players, picks:ct.gives.picks, cash:ct.gives.cash||0},
      b:{teamId:tr[ct.side].teamId, players:ct.wants.players, picks:ct.wants.picks, cash:0},
      status:'review', createdAt:Date.now(), acceptedAt:Date.now(), clock:newClock(S.settings.trades.reviewHours), counters:[],
      log:[{at:Date.now(), text:'Created from a counter that replaced an earlier trade'}]};
    S.trades.unshift(nt);
    notify('Trade replaced', teamName(ct.byTeamId)+' stepped in. New review window open.','warn');
  } else {
    tr.log.unshift({at:Date.now(), text:'Counter from '+teamName(ct.byTeamId)+' accepted — it processes right after the original'});
    antiSnipe(tr.clock);
    notify('Counter accepted', 'It will process immediately after the original trade clears.','warn');
  }
  save(); render(); toast('Counter accepted','good');
};
ACT.declineCounter = (d)=>{ const tr=byId(S.trades,d.id); byId(tr.counters,d.cid).status='declined'; save(); render(); };
