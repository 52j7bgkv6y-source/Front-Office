/* ============================================================
   VALUATION — what a player is worth, on the field and on the box score
   ============================================================ */
function seasonLine(pid){ return ((S.season||{}).byPlayer||{})[pid] || null; }
function foldWeekIntoSeason(){
  if(!S.season || S.season.year!==S.league.season) S.season = {year:S.league.season, byPlayer:{}};
  const stats = S.live.stats||{};
  Object.keys(stats).forEach(pid=>{
    const src = stats[pid]; let any=false;
    Object.keys(src).forEach(k=>{ if(+src[k]) any=true; });
    if(!any) return;
    const line = S.season.byPlayer[pid] = S.season.byPlayer[pid] || {gp:0, fpts:0, stats:{}};
    Object.keys(src).forEach(k=>{ if(+src[k]) line.stats[k] = Math.round(((line.stats[k]||0) + +src[k])*100)/100; });
    line.gp++;
    line.fpts = Math.round((line.fpts + fpts(pid))*100)/100;
  });
}
/* Every week folded away also lands on the defense that gave it up, so the
   book on each unit builds itself as the season runs. */
function foldWeekIntoDvp(){
  S.dvp = S.dvp || {};
  (S.live.games||[]).forEach(g=>{
    if(g.status==='pre') return;
    [[g.home, g.away],[g.away, g.home]].forEach(pair=>{
      const off = pair[0], def = pair[1];
      const d = S.dvp[def] = S.dvp[def] || {games:0, pos:{}, rush_yd:0, rush_td:0, pass_yd:0, pass_td:0, rec_yd:0, rec_td:0};
      d.games++;
      S.players.filter(p=> p.nfl===off && p.pos!=='DEF').forEach(p=>{
        const st = (S.live.stats||{})[p.id]; if(!st) return;
        const f = fpts(p.id);
        if(f){ const e = d.pos[p.pos] = d.pos[p.pos] || {f:0}; e.f = Math.round((e.f + f)*100)/100; }
        d.rush_yd += +st.rush_yd||0; d.rush_td += +st.rush_td||0;
        d.pass_yd += +st.pass_yd||0; d.pass_td += +st.pass_td||0;
        d.rec_yd  += +st.rec_yd||0;  d.rec_td  += +st.rec_td||0;
      });
    });
  });
}
function dvpPerGame(code, pos){
  const d = (S.dvp||{})[code];
  if(!d || !d.games) return null;
  return ((d.pos[pos]||{}).f || 0) / d.games;
}
function dvpSplit(code, kind){
  const d = (S.dvp||{})[code];
  if(!d || !d.games) return null;
  return kind==='rush' ? (d.rush_yd + d.rush_td*20)/d.games
                       : (d.pass_yd + d.pass_td*20)/d.games;
}
/* Rank 1 gives up the least, so a low rank is a hard week. */
function dvpRank(code, pos, kind){
  const all = Object.keys(S.dvp||{});
  const val = (c)=> kind ? dvpSplit(c, kind) : dvpPerGame(c, pos);
  const rows = all.map(c=>({c, v:val(c)})).filter(x=> x.v!=null).sort((a,b)=> a.v-b.v);
  if(rows.length < 3) return null;
  const i = rows.findIndex(x=> x.c===code);
  return i<0 ? null : {rank:i+1, of:rows.length, val:rows[i].v};
}
const DIFF = [
  {max:0.20, label:'Brutal', cls:'bad',  note:'one of the toughest units in the league'},
  {max:0.40, label:'Tough',  cls:'bad',  note:'a hard week on paper'},
  {max:0.60, label:'Even',   cls:'',     note:'nothing much either way'},
  {max:0.80, label:'Good',   cls:'good', note:'a unit that has been giving this up'},
  {max:1.01, label:'Smash',  cls:'good', note:'the softest kind of week there is'}
];
function difficultyOf(r){
  if(!r) return null;
  const pctile = r.rank / r.of;
  return DIFF.find(d=> pctile <= d.max) || DIFF[2];
}
/* Backs live on the ground, everyone else through the air. */
function primaryKind(pos){ return pos==='RB' ? 'rush' : 'pass'; }
function thisWeekOpponent(nfl){
  const g = (S.live.games||[]).find(x=> x.home===nfl || x.away===nfl);
  if(!g) return null;
  return { code: g.home===nfl ? g.away : g.home, home: g.home===nfl, game:g };
}
function matchupFor(p){
  const opp = thisWeekOpponent(p.nfl);
  if(!opp) return null;
  const byPos = dvpRank(opp.code, p.pos, null);
  const kind = primaryKind(p.pos);
  const bySplit = dvpRank(opp.code, null, kind);
  const lead = byPos || bySplit;
  return { opp, byPos, bySplit, kind, diff: difficultyOf(lead) };
}
function matchupChip(p, opts){
  const m = matchupFor(p);
  if(!m) return '';
  const face = (m.opp.home?'@ ':'vs ') + m.opp.code;
  if(!m.diff) return '<span class="pill" title="not enough games on this defense yet">'+esc(face)+'</span>';
  return '<span class="pill '+(m.diff.cls==='bad'?'live':m.diff.cls==='good'?'ok':'')+'" title="'+
    esc(m.opp.code+' ranks '+(m.byPos?m.byPos.rank+' of '+m.byPos.of+' against '+p.pos:'—')+
        ', '+(m.bySplit?m.bySplit.rank+' of '+m.bySplit.of+' against the '+m.kind:'—')+' — '+m.diff.note)+'">'+
    esc(face)+' · '+m.diff.label+(opts&&opts.rank&&m.byPos?' '+m.byPos.rank:'')+'</span>';
}

/* Fantasy side: points per game under this league's own scoring. */
function fantasyPPG(p){
  if(p.projPPG!=null) return +p.projPPG;
  const l = seasonLine(p.id);
  if(l && l.gp) return l.fpts / l.gp;
  const live = fpts(p.id);
  return live ? live : null;
}
/* Real-life side: the counting stats, scored the way a scout would, not a
   fantasy manager — yards and touchdowns and takeaways, no PPR thumb. */
function realFromStats(s, gp){
  if(!s || !gp) return null;
  const yds = (+s.pass_yd||0)*0.42 + (+s.rush_yd||0) + (+s.rec_yd||0) + (+s.int_ret_yd||0);
  const tds = (+s.pass_td||0)*0.65 + (+s.rush_td||0) + (+s.rec_td||0) + (+s.def_td||0);
  const vol = (+s.rush_att||0)*1.6 + (+s.rec||0)*2.2 + (+s.pass_att||0)*0.4;
  const neg = (+s.pass_int||0)*22 + (+s.fum_lost||0)*20;
  const def = (+s.sack||0)*16 + (+s.int||0)*30 + (+s.fum_rec||0)*18 + (+s.tkl||0)*1.5;
  const kick = (+s.fgm||0)*14 + (+s.xpm||0)*4 + (+s.fgm_yds_over_30||0)*0.6;
  return (yds + tds*38 + vol + def + kick - neg) / gp;
}
function realPPG(p){
  const l = seasonLine(p.id);
  const src = (l && l.gp) ? l.stats : (S.live.stats||{})[p.id];
  const gp = (l && l.gp) ? l.gp : ((S.live.stats||{})[p.id] ? 1 : 0);
  return realFromStats(src, gp);
}
function pctRank(v, arr){
  if(v==null || !arr.length) return 0.5;
  const below = arr.filter(x=> x < v).length, same = arr.filter(x=> x===v).length;
  return clamp((below + same/2) / arr.length, 0, 1);
}
/* Blend the two, with the league deciding how much each side counts. */
function formIndex(p){
  const w = clamp(+S.settings.value.realWeight||0, 0, 100)/100;
  const peers = S.players.filter(x=> x.pos===p.pos);
  const fVals = peers.map(fantasyPPG).filter(v=> v!=null);
  const rVals = peers.map(realPPG).filter(v=> v!=null);
  const f = fantasyPPG(p), r = realPPG(p);
  if(f==null && r==null) return pctRank(p.value||0, peers.map(x=> x.value||0));
  const fi = f==null ? 0.5 : pctRank(f, fVals);
  const ri = r==null ? 0.5 : pctRank(r, rVals);
  return clamp(w*ri + (1-w)*fi, 0, 1);
}
const AGE_PEAK = {QB:28, RB:25, WR:26, TE:27};
const AGE_DECL = {QB:0.05, RB:0.13, WR:0.07, TE:0.06};
function curveAt(pos, age){
  if(!age || pos==='K' || pos==='DEF') return 1;
  const peak = AGE_PEAK[pos] || 27, d = AGE_DECL[pos] || 0.07;
  if(age <= peak) return Math.max(0.55, 1 - (peak-age)*0.045);
  return Math.max(0.12, Math.pow(1-d, age-peak));
}
function ageMult(p, yearsOut){
  if(!p.age) return 1;
  const now = curveAt(p.pos, p.age);
  return now>0 ? curveAt(p.pos, p.age + (yearsOut||0)) / now : 1;
}
/* Value points, then dollars. Points are league-relative so the numbers
   always add up to roughly one league's worth of cap. */
function valuePoints(p, yearsOut){
  const w = (S.settings.value.posWeights||{})[p.pos];
  const posW = w==null ? 1 : +w;
  const reg = clamp(+S.settings.value.regress||0, 0, 100)/100;
  const idx = formIndex(p)*(1-reg) + 0.5*reg;        // pull extremes toward the middle
  return Math.max(0, idx * posW * ageMult(p, yearsOut||0));
}
function dollarPerPoint(){
  if(dppCache!=null) return dppCache;
  const share = clamp(+S.settings.value.spendShare||88, 10, 100)/100;
  const spend = S.teams.length * (+S.settings.cap.base||0) * share;
  const V = sum(S.players.filter(p=> p.contract).map(p=> valuePoints(p,0)));
  dppCache = V>0 ? spend/V : 1;
  return dppCache;
}
function marketPrice(p, yearsOut){
  return Math.max(+S.settings.contracts.minSalary||0, roundInc(valuePoints(p, yearsOut)*dollarPerPoint()));
}
/* An extension is priced off the years it actually covers, so a 31-year-old
   back on a five-year deal is quoted against his decline, not his last season. */
function extensionQuote(p, years, startOffset){
  const yrs = [];
  for(let i=0;i<years;i++) yrs.push(marketPrice(p, (startOffset||0)+i));
  const prem = 1 + (clamp(+S.settings.value.termPremium||0,0,25)/100)*Math.max(0, years-1);
  const aav = Math.max(+S.settings.contracts.minSalary||0, roundInc(sum(yrs)/years*prem));
  return { perYear:yrs, aav, total:roundInc(aav*years), prem };
}
function valueBreakdown(p){
  const peers = S.players.filter(x=> x.pos===p.pos);
  return {
    fantasy: fantasyPPG(p), real: realPPG(p),
    fRank: pctRank(fantasyPPG(p), peers.map(fantasyPPG).filter(v=>v!=null)),
    rRank: pctRank(realPPG(p), peers.map(realPPG).filter(v=>v!=null)),
    index: formIndex(p), gp: (seasonLine(p.id)||{}).gp||0
  };
}

/* ============================================================
   WHAT A PLAYER WILL SIGN FOR
   His number comes off the same blend as everything else — part what he did
   on the field, part what he scored for you — plus a stable quirk so the same
   man is not re-rolled every time somebody asks.
   ============================================================ */
function playerQuirk(p){
  // Deterministic, so re-offering the same money gets the same answer.
  const h = Math.abs(hashStr(String(p.id)+':'+S.league.season));
  return ((h % 2001) / 1000) - 1;                  // −1 to +1
}
/* What he is holding out for, at that length. */
function demandFor(p, years){
  const cfg = S.settings.players;
  const yrs = clamp(+years||1, 1, 20);
  const base = sum(Array.from({length:yrs},(_,i)=> marketPrice(p,i))) / yrs;
  const firm = clamp(+cfg.firmness||0, 0, 100)/100;
  const quirk = 1 + playerQuirk(p) * 0.18 * firm;  // ±18% at full firmness
  const term = 1 + (clamp(+cfg.termBonusPct||0, 0, 40)/100) * Math.max(0, yrs-1) / 4;
  return Math.max(+S.settings.contracts.minSalary||0, roundInc(base * quirk * term));
}
/* Staying put is worth something, so his own team gets a small discount. */
function demandFrom(p, teamId, years){
  const d = demandFor(p, years);
  const own = p.contract && p.contract.teamId===teamId;
  const loyal = clamp(+S.settings.players.loyalty||0, 0, 40)/100;
  return own ? Math.max(+S.settings.contracts.minSalary||0, roundInc(d * (1-loyal))) : d;
}
function willAccept(p, teamId, aav, years){
  if(!S.settings.players.on) return {ok:true, want:0, gap:0};
  const want = demandFrom(p, teamId, years);
  const ok = fixInc(aav) >= want - 0.0001;
  return {ok, want, gap: fixInc(Math.max(0, want - aav))};
}
/* How the ask is shown — a hard number, a band, or nothing at all. */
function askLabel(p, teamId, years){
  const mode = S.settings.players.showAsk;
  if(!S.settings.players.on || mode==='hidden') return '';
  const want = demandFrom(p, teamId, years);
  if(mode==='exact') return 'He wants '+money(want)+' a year.';
  const lo = roundInc(want*0.93), hi = roundInc(want*1.07);
  return 'He is looking for somewhere around '+money(lo)+'–'+money(hi)+' a year.';
}
function askChip(p, teamId, years){
  if(!S.settings.players.on) return '';
  const want = demandFrom(p, teamId, years||1);
  return '<span class="pill" title="what he will sign for">asks '+money(want)+'</span>';
}

/* ============================================================
   THE EXTENSION LADDER
   With players not given a say, an extension is worth what the position pays
   at that rank. Bands sit in groups: the top of each group is priced off one
   specific salary, and everybody below it off the group as a whole.
   ============================================================ */
const LADDER_DEFAULT = {
  QB:  [[1,5,1],[6,10,1],[11,20,1],[21,32,1],[33,40,0],[41,null,0]],
  RB:  [[1,5,1],[6,10,1],[11,20,1],[21,32,1],[33,50,0],[51,75,0],[76,null,0]],
  WR:  [[1,5,1],[6,10,1],[11,20,1],[21,32,1],[33,50,0],[51,75,0],[76,115,0],[116,null,0]],
  TE:  [[1,5,1],[6,10,1],[11,20,1],[21,32,1],[33,50,0],[51,null,0]],
  K:   [[1,5,1],[6,10,0],[11,null,0]],
  DEF: [[1,5,1],[6,10,0],[11,null,0]],
  DL:  [[1,5,1],[6,10,0],[11,null,0]],
  LB:  [[1,5,1],[6,10,0],[11,null,0]],
  DB:  [[1,5,1],[6,10,0],[11,null,0]]
};
function ladderFor(pos){
  const custom = (S.settings.contracts.ladder||{}).bands;
  const raw = (custom && custom[pos]) || LADDER_DEFAULT[pos] || LADDER_DEFAULT.QB;
  return raw.map(b=> ({from:+b[0], to:(b[1]==null?null:+b[1]), leader:!!+b[2]}));
}
function ladderRound(v){
  return S.settings.contracts.ladder.roundWhole ? Math.round(v) : roundInc(v);
}
/* Every salary being paid at a position, biggest first. */
function aavTable(pos){
  return S.players
    .filter(x=> x.pos===pos && x.contract && !x.contract.waiver)
    .map(aavOf).filter(v=> v>0).sort((a,b)=> b-a);
}
function nthAav(pos, n){
  const t = aavTable(pos);
  if(!t.length) return +S.settings.contracts.minSalary||1;
  return t[clamp(n,1,t.length)-1];
}
function median(arr){
  if(!arr.length) return 0;
  const a = arr.slice().sort((x,y)=> x-y), m = a.length>>1;
  return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
}
/* The salaries sitting in a band of the table. */
function bandSlice(pos, from, to){
  const t = aavTable(pos);
  return t.slice(Math.max(0, from-1), to==null ? t.length : to);
}
function bandFor(pos, rank){
  const bands = ladderFor(pos);
  return bands.find(b=> rank >= b.from && (b.to==null || rank <= b.to)) || bands[bands.length-1];
}
function ladderPrice(pos, rank){
  const floor = +S.settings.contracts.minSalary||1;
  const t = aavTable(pos);
  if(!t.length) return ladderRound(floor);
  const b = bandFor(pos, rank);
  if(b.leader && rank === b.from){
    const v = b.from===1
      ? t[0] * (clamp(+S.settings.contracts.ladder.topMult||100, 1, 400)/100)
      : nthAav(pos, b.from);
    return Math.max(ladderRound(floor), ladderRound(v));
  }
  const slice = bandSlice(pos, b.from, b.to);
  if(!slice.length) return Math.max(ladderRound(floor), ladderRound(t[t.length-1]));
  const avg = sum(slice)/slice.length;
  return Math.max(ladderRound(floor), ladderRound(Math.max(avg, median(slice))));
}
/* Shown alongside the number so nobody has to take it on trust. */
function ladderWorking(pos, rank){
  const b = bandFor(pos, rank), t = aavTable(pos);
  const label = b.to==null ? b.from+' and below' : b.from+'–'+b.to;
  if(b.leader && rank===b.from){
    return b.from===1
      ? {band:label, how:'the top '+pos+' salary of '+money(t[0]||0)+' times '+
          (clamp(+S.settings.contracts.ladder.topMult||100,1,400)/100), avg:null, med:null}
      : {band:label, how:'the '+ord(b.from)+' highest '+pos+' salary', avg:null, med:null};
  }
  const slice = bandSlice(pos, b.from, b.to);
  const avg = slice.length ? sum(slice)/slice.length : 0;
  const med = median(slice);
  return {band:label, how:'the greater of the average and the median of ranks '+label,
          avg, med, n:slice.length};
}
function ord(n){
  const s = ['th','st','nd','rd'], v = n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* ============================================================
   GAMES PLAYED, AND WHICH SEASON TO RANK HIM ON
   ============================================================ */
function minGames(){ return clamp(+S.settings.contracts.minGames||0, 0, 25); }
function lineIn(pid, year){
  if(year === (S.season||{}).year) return (S.season.byPlayer||{})[pid] || null;
  return ((S.history||{})[year] || {})[pid] || null;
}
function gamesIn(pid, year){ const l = lineIn(pid, year); return l ? (+l.gp||0) : 0; }
/* This season if he has played enough, otherwise the most recent one he did. */
function rankBasisYear(p){
  const need = minGames();
  if(gamesIn(p.id, S.league.season) >= need && need>0) return S.league.season;
  if(need<=0) return S.league.season;
  const years = Object.keys(S.history||{}).map(Number).filter(y=> !isNaN(y)).sort((a,b)=> b-a);
  for(const y of years){ if(gamesIn(p.id, y) >= need) return y; }
  return null;
}
/* Score a player off one particular season's line. */
function scoreIn(p, year){
  const l = lineIn(p.id, year);
  if(!l || !l.gp) return null;
  const w = clamp(+S.settings.value.realWeight||0, 0, 100)/100;
  const real = realFromStats(l.stats, l.gp);
  const fant = l.fpts / l.gp;
  return {real, fant, blend:null, gp:l.gp};
}
/* Where he finished at his position that year, on the same blend as everything
   else — part what he did on the field, part what he scored for you. */
function positionRank(p, year){
  if(year==null) return null;
  const w = clamp(+S.settings.value.realWeight||0, 0, 100)/100;
  const peers = S.players.filter(x=> x.pos===p.pos && lineIn(x.id, year) && lineIn(x.id, year).gp);
  if(!peers.length) return null;
  const reals = [], fants = [];
  peers.forEach(x=>{
    const l = lineIn(x.id, year);
    const r = realFromStats(l.stats, l.gp);
    if(r!=null) reals.push(r);
    fants.push(l.fpts / l.gp);
  });
  const scored = peers.map(x=>{
    const l = lineIn(x.id, year);
    const r = realFromStats(l.stats, l.gp);
    const f = l.fpts / l.gp;
    const ri = r==null ? 0.5 : pctRank(r, reals);
    const fi = pctRank(f, fants);
    return {id:x.id, v: w*ri + (1-w)*fi};
  }).sort((a,b)=> b.v - a.v);
  const i = scored.findIndex(x=> x.id===p.id);
  return i<0 ? null : {rank:i+1, of:scored.length, year};
}
function canExtend(p){
  const need = minGames();
  if(need<=0) return {ok:true, basis:null, rank:null};
  const here = gamesIn(p.id, S.league.season);
  if(here >= need){
    const r = positionRank(p, S.league.season);
    return {ok:true, basis:S.league.season, rank:r, games:here, current:true};
  }
  const y = rankBasisYear(p);
  if(y==null) return {ok:false, basis:null, rank:null, games:here,
    why: p.name+' has played '+here+' game'+(here===1?'':'s')+' and needs '+need+
         '. There is no earlier season with '+need+' either, so there is nothing to price him off.'};
  const r = positionRank(p, y);
  return {ok:true, basis:y, rank:r, games:here, current:false,
    note:'Priced off '+y+', the last season he played '+need+' games.'};
}

/* ============================================================
   FRANCHISE TAG
   Priced off the going rate at his position, and only for as long as the
   league keeps the window open.
   ============================================================ */
function aavOf(p){
  const c = p && p.contract;
  return c ? fixInc(c.total / Math.max(1, c.years)) : 0;
}
function tagCount(pos){
  const n = (S.settings.tag.counts||{})[pos];
  return clamp(+n||0, 1, 40);
}
/* The average of the top N deals at that position, league-wide. */
function tagPrice(pos){
  const n = tagCount(pos);
  const paid = S.players.filter(x=> x.pos===pos && x.contract && !x.contract.waiver)
    .map(aavOf).filter(v=> v>0).sort((a,b)=> b-a).slice(0, n);
  if(!paid.length) return roundInc(+S.settings.contracts.minSalary||1);
  const avg = sum(paid)/paid.length;
  return roundInc(avg * (1 + (clamp(+S.settings.tag.raisePct||0, 0, 100)/100)));
}
/* The real rule: the going rate, or a rise on what he is already earning. */
function tagPriceFor(p){
  const going = tagPrice(p.pos);
  const bump = aavOf(p) * (clamp(+S.settings.contracts.tagPct||100, 100, 300)/100);
  return roundInc(Math.max(going, bump));
}
function isTagged(p){ return !!(p && p.tag && p.tag.year===S.league.season+1); }
function tagsUsed(teamId){
  return S.players.filter(x=> isTagged(x) && x.contract && x.contract.teamId===teamId).length;
}
function tagTag(p){
  return isTagged(p) ? '<span class="pill warn" title="franchise tagged for '+p.tag.year+' at '+money(p.tag.price)+'">TAG</span>' : '';
}

/* ============================================================
   WAIVERS — cheap, flagged, and gone at the turn of the year
   ============================================================ */
function waiverDeadlinePassed(){
  const w = S.settings.waivers;
  if(!w || !w.on || !w.deadline) return false;
  return Date.now() > new Date(w.deadline+'T23:59:59').getTime();
}
function isWaiver(p){ return !!(p && p.contract && p.contract.waiver); }
function waiverTag(p){
  if(isWaiver(p)) return '<span class="pill waiver" title="Waiver pickup — '+money(S.settings.waivers.salary)+', no extension, gone at the turn of the year">W</span>';
  if(!p.contract && waiverDeadlinePassed()) return '<span class="pill waiver dim" title="Past the waiver deadline — anyone added now comes in as a waiver player">W</span>';
  return '';
}
function makeWaiverContract(teamId){
  const amt = +S.settings.waivers.salary||1;
  const c = makeContract(teamId, amt, 1, 'ev', S.league.season);
  c.waiver = true;
  return c;
}

/* ============================================================
   PRISING A TAGGED PLAYER LOOSE
   Two firsts, and a second for every year those firsts sit in the future.
   A first in this draft costs nothing extra; one two drafts away costs two
   seconds on top, because making somebody wait is worth something.
   ============================================================ */
function draftBaseYear(){ return S.league.season; }
function yearsOut(pk){ return Math.max(0, (+pk.year||0) - draftBaseYear()); }
/* Earliest year first, then the better slot; comp picks rank below the rest. */
function pickRank(a, b){
  return (a.year - b.year) || ((isComp(a)?1:0) - (isComp(b)?1:0)) || (pickSlot(a) - pickSlot(b));
}
/* Named apart from ownedPicks() on purpose. This one is round-specific and is
   only for pricing a tag steal; the general one lists everything a team holds.
   They were both called ownedPicks once, the later declaration won, and every
   pick dropdown in the app came back empty. */
function ownedPicksInRound(teamId, round){
  return S.picks.filter(k=> k.ownerTeamId===teamId && k.round===round && k.year>=draftBaseYear())
    .slice().sort(pickRank);
}
function stealCost(teamId){
  const need = clamp(+S.settings.tag.requireFirsts||2, 1, 5);
  const firsts = ownedPicksInRound(teamId, 1).slice(0, need);
  const secondsNeeded = sum(firsts.map(yearsOut));
  const seconds = ownedPicksInRound(teamId, 2).slice(0, secondsNeeded);
  return {
    firsts, seconds, need, secondsNeeded,
    shortFirsts: Math.max(0, need - firsts.length),
    shortSeconds: Math.max(0, secondsNeeded - seconds.length),
    ok: firsts.length===need && seconds.length===secondsNeeded,
    picks: firsts.concat(seconds)
  };
}
function stealCostLabel(c){
  const bits = [];
  if(c.firsts.length) bits.push(c.firsts.map(k=> k.year+' first'+(isComp(k)?' (comp)':'')).join(' and '));
  if(c.seconds.length) bits.push(c.seconds.map(k=> k.year+' second').join(' and '));
  return bits.join(', plus ') || 'nothing on the board';
}
function settleTagOffer(o){
  if(o.status!=='open') return;
  const p = byId(S.players, o.playerId);
  if(!p || !p.contract || !isTagged(p) || p.contract.teamId!==o.fromTeam){
    o.status='void'; o.log.unshift({at:Date.now(), text:'He is no longer there to be had'});
    return;
  }
  const picks = o.picks.map(id=> byId(S.picks,id)).filter(k=> k && k.ownerTeamId===o.toTeam);
  if(picks.length !== o.picks.length){
    o.status='void'; o.reason='the picks were traded away';
    o.log.unshift({at:Date.now(), text:'Offer fell over — those picks are no longer there'});
    notify('Offer lapsed', teamName(o.toTeam)+' no longer holds the picks for '+p.name+'.','bad');
    return;
  }
  if(S.settings.trades.capMustBeLegal && p.tag.price > capSpace(o.toTeam, S.league.season+1)){
    o.status='void'; o.reason='no cap room';
    o.log.unshift({at:Date.now(), text:'Offer lapsed — '+teamName(o.toTeam)+' cannot fit the salary'});
    return;
  }
  picks.forEach(k=> k.ownerTeamId = o.fromTeam);
  p.contract = makeContract(o.toTeam, p.tag.price, 1, S.settings.contracts.defaultStruct, S.league.season+1);
  p.contract.tagged = true;
  o.status='taken'; o.at2=Date.now();
  o.log.unshift({at:Date.now(), text:teamName(o.toTeam)+' takes him'});
  logIt(teamName(o.toTeam)+' prised '+p.name+' off the tag — '+teamName(o.fromTeam)+' gets '+picks.length+' picks',
    {type:'trade', teams:[o.toTeam, o.fromTeam], players:[p.id]});
  notify('Tagged player gone', p.name+' goes to '+teamName(o.toTeam)+'.','warn');
}

/* ============================================================
   BACK-LOADING, SETTLED UP
   A deal that pays little early and a lot late is a discount taken on credit.
   If the player goes before the expensive years arrive, the discount has to be
   handed back: for every year already paid, the gap between what was actually
   charged and what an even deal would have charged.
   ============================================================ */
function backloadOwed(p, atYear){
  const c = p && p.contract;
  if(!c || !c.years) return {owed:0, rows:[], even:0, raw:0};
  const cfg = S.settings.cap.backload || {};
  const upTo = atYear==null ? S.league.season : atYear;
  const even = c.total / c.years;
  const rows = [];
  let raw = 0;
  for(let i=0;i<c.years;i++){
    const y = c.startYear + i;
    if(y > upTo) break;                       // not paid yet, so nothing owed on it
    const paid = fixInc(+c.salaries[i]||0);
    const diff = fixInc(even - paid);         // positive means it was charged light
    rows.push({year:y, paid, even:fixInc(even), diff});
    raw += diff;
  }
  raw = fixInc(raw);
  let owed = fixInc(raw * (clamp(+cfg.pct||0, 0, 200)/100));
  if(owed < 0 && !cfg.credit) owed = 0;       // front-loaded deals earn nothing back unless the league says so
  return {owed, rows, even:fixInc(even), raw, years:rows.length};
}
/* Charge it, either all to this season or spread over what was left to run. */
function applyBackload(p, teamId){
  const cfg = S.settings.cap.backload || {};
  if(!cfg.on) return 0;
  const b = backloadOwed(p);
  if(!b.owed) return 0;
  const t = byId(S.teams, teamId); if(!t) return 0;
  t.dead = t.dead || [];
  const c = p.contract;
  const leftYears = [];
  for(let i=0;i<c.years;i++){ const y=c.startYear+i; if(y > S.league.season) leftYears.push(y); }
  if(cfg.when==='spread' && leftYears.length){
    // Round each year but make the last one carry the remainder, so the pieces
    // add up to exactly what was owed rather than drifting a dollar.
    let left = b.owed;
    leftYears.forEach((y,i)=>{
      const amt = (i===leftYears.length-1) ? fixInc(left) : fixInc(b.owed/leftYears.length);
      left = fixInc(left - amt);
      t.dead.push({name:p.name+' — back-loading settled', year:y, amt});
    });
  } else {
    t.dead.push({name:p.name+' — back-loading settled', year:S.league.season, amt:b.owed});
  }
  return b.owed;
}

/* ============================================================
   CONTRACT LENGTH LIMITS
   Slots are spent from the top down: a long slot can be filled by a shorter
   deal, never the other way round. Anything longer than the league maximum —
   an extension, say — sits in the top bucket.
   ============================================================ */
function lengthBucket(years){ return Math.min(+years||1, +S.settings.contracts.maxYears||10); }
function lengthCounts(teamId, excludePid, addYears){
  const out = {};
  teamPlayers(teamId).forEach(p=>{
    if(p.id===excludePid || isWaiver(p)) return;
    const b = lengthBucket(p.contract.years);
    out[b] = (out[b]||0)+1;
  });
  if(addYears){ const b = lengthBucket(addYears); out[b] = (out[b]||0)+1; }
  return out;
}
/* Returns null when it fits, or the bucket that overflows. */
/* The same limit, applied or waived depending on how the deal came about. */
function limitBinds(where){
  const e = S.settings.contracts.limitEnforce || {};
  return e[where] !== false;
}
function limitProblemFor(where, teamId, addYears, excludePid){
  return limitBinds(where) ? limitProblem(teamId, addYears, excludePid) : null;
}
function limitProblem(teamId, addYears, excludePid){
  const lim = S.settings.contracts.limits || {};
  if(!Object.keys(lim).some(k=> lim[k]!=='' && lim[k]!=null)) return null;
  const counts = lengthCounts(teamId, excludePid, addYears);
  const max = +S.settings.contracts.maxYears||10;
  let cum = 0, allow = 0;
  for(let L=max; L>=1; L--){
    cum += counts[L]||0;
    const v = lim[L];
    if(v==='' || v==null) continue;                 // this length has no ceiling of its own
    allow += (+v||0);
    if(cum > allow) return {length:L, have:cum, allow};
  }
  return null;
}
function limitNote(teamId){
  const lim = S.settings.contracts.limits||{}, max = +S.settings.contracts.maxYears||10;
  const counts = lengthCounts(teamId);
  const rows = [];
  let cum=0, allow=0;
  for(let L=max; L>=1; L--){
    cum += counts[L]||0;
    const v = lim[L];
    if(v===''||v==null) continue;
    allow += (+v||0);
    rows.push({L, have:cum, allow});
  }
  return rows;
}

/* ============================================================
   DEFERRED TERMS
   You won him and you know what he costs per year. How long the deal runs and
   how it is shaped can wait — up to whatever the league allows, capped at a
   week, because a contract nobody has settled is a contract nobody can trade.
   ============================================================ */
function decideMs(){ return clamp(+S.settings.contracts.decideHours||0, 0, 168) * 3600000; }
function pendingFor(teamId){ return (S.pending||[]).filter(x=> x.status==='open' && x.teamId===teamId); }
function pendingOn(playerId){ return (S.pending||[]).find(x=> x.status==='open' && x.playerId===playerId); }
function isPending(p){ return !!pendingOn(p && p.id); }
function pendingTag(p){
  const q = pendingOn(p && p.id);
  return q ? '<span class="pill warn" title="terms not settled — '+hhmm(q.clock.remain)+' left">terms due</span>' : '';
}
/* Everything that hands a player a contract comes through here. With no
   deferral window it just signs him, exactly as before. */
function awardContract(playerId, teamId, aav, opts){
  const o = opts || {};
  const p = byId(S.players, playerId);
  if(!p) return null;
  const maxY = clamp(+o.maxYears || +S.settings.contracts.maxYears || 1, 1, +S.settings.contracts.maxYears||10);
  const defY = clamp(+o.years || +S.settings.contracts.defaultYears || 1, 1, maxY);
  if(decideMs() <= 0 || o.now){
    p.contract = makeContract(teamId, roundInc(aav*defY), defY, o.structId || S.settings.contracts.defaultStruct, S.league.season);
    if(o.waiver) p.contract.waiver = true;
    return p.contract;
  }
  // Park him on the roster at the agreed money, one year, until it is settled.
  p.contract = makeContract(teamId, roundInc(aav), 1, o.structId || S.settings.contracts.defaultStruct, S.league.season);
  if(o.waiver) p.contract.waiver = true;
  p.contract.provisional = true;
  S.pending.unshift({ id:uid('pd'), playerId, teamId, aav:fixInc(aav), maxYears:maxY,
    years:defY, structId:o.structId || S.settings.contracts.defaultStruct,
    source:o.source||'signing', status:'open', at:Date.now(), clock:newClock(S.settings.contracts.decideHours),
    log:[{at:Date.now(), text:'Won at '+money(aav)+' a year — terms to be settled'}] });
  notify('Terms to settle', teamName(teamId)+' has '+p.name+' at '+money(aav)+
    ' a year and '+S.settings.contracts.decideHours+' hours to choose the length.','warn');
  return p.contract;
}
function applyTerms(q, silent){
  const p = byId(S.players, q.playerId);
  if(!p){ q.status='void'; return; }
  const yrs = clamp(+q.years||1, 1, q.maxYears);
  const lp = limitProblemFor(q.source==='blind bid draft' ? 'draft' : 'auctions', q.teamId, yrs, p.id);
  const useY = lp ? 1 : yrs;                        // never settle into an illegal roster
  const keepWaiver = p.contract && p.contract.waiver;
  p.contract = makeContract(q.teamId, roundInc(q.aav*useY), useY, q.structId, S.league.season);
  if(keepWaiver) p.contract.waiver = true;
  q.status = 'settled'; q.settledAt = Date.now(); q.years = useY;
  if(lp) q.note = 'shortened to one year — '+q.teamId+' was over the limit for '+yrs+'-year deals';
  logIt(teamName(q.teamId)+' settled '+p.name+' — '+money(q.aav)+' a year for '+useY+
    ' ('+structById(q.structId).name+')'+(lp?', cut to one year by the length limits':''),
    {type:'admin', teams:[q.teamId], players:[p.id]});
  if(!silent) notify('Terms settled', p.name+' — '+useY+' year'+(useY>1?'s':'')+' at '+money(q.aav)+'.','good');
}
function settlePending(q){
  if(q.status!=='open') return;
  q.log.unshift({at:Date.now(), text:'Window closed — the league default was applied'});
  applyTerms(q, true);
  notify('Terms defaulted', playerName(q.playerId)+' settled at '+q.years+' year'+(q.years>1?'s':'')+
    ' because nobody chose.','warn');
}
ACT.decideTerms = (d)=>{

  modal('Settle the terms — '+p.name, `

        <select data-oninput="dtField" data-f="structId">${S.settings.contracts.structures.map(x=>

    </div>

    </div>

ACT.dtField = (d,el)=>{

/* ============================================================
   ROOKIE SCALE
   Every slot has a price, the whole scale lifts a set percentage each year,
   and any single slot can be overruled by hand.
   ============================================================ */
function rookieRounds(){ return clamp(+S.settings.rookie.rounds||4, 1, 10); }
/* Auction and blind-bid drafts run as long as the league wants them to. */
function bbdMaxRounds(){ const n = +S.settings.bbd.maxRounds||0; return n>0 ? n : Infinity; }
function slotKey(round, slot){ return round+'.'+String(slot).padStart(2,'0'); }
function rookiePrice(round, slot, year){
  const r = S.settings.rookie, n = Math.max(1, S.teams.length);
  const ov = (r.overrides||{})[slotKey(round,slot)];
  const overall = (round-1)*n + slot;
  const base = (ov!=null && ov!=='' && !isNaN(+ov)) ? +ov
             : (+r.top||0) * Math.pow(+r.decay||1, overall-1);
  const lift = Math.max(0, (year||S.league.season) - (+r.baseSeason||S.league.season));
  return Math.max(+r.minSalary||0, roundInc(base * Math.pow(1 + (+r.growthPct||0)/100, lift)));
}
function rookieYears(round){
  const y = (S.settings.rookie.roundYears||{})[round];
  return clamp(+y||1, 1, +S.settings.contracts.maxYears||10);
}
function rookieDeal(round, slot, teamId, year){
  const aav = rookiePrice(round, slot, year), yrs = rookieYears(round);
  return makeContract(teamId, roundInc(aav*yrs), yrs, S.settings.rookie.structId, year||S.league.season);
}
/* Year one of the deal, which is what actually eats this season's room. */
function rookieFirstYear(round, slot, year){
  const c = rookieDeal(round, slot, (S.teams[0]||{}).id, year);
  return +c.salaries[0] || 0;
}
function pickFirstYearOf(pk){
  const aav = pickCost(pk); if(!aav) return 0;
  const yrs = rookieYears(pk.round);
  return +salariesFor(roundInc(aav*yrs), yrs, S.settings.rookie.structId)[0] || 0;
}

/* ============================================================
   COMPENSATORY PICKS
   You lose a player to somebody else's money, you get something back — unless
   you spent the same way yourself. Value is half what he was paid and half
   what he actually did on the field.
   ============================================================ */
function compYear(){ return S.league.season; }
/* Every auction and draft signing goes in the book, along with who lost him. */
function recordSigning(playerId, toTeam, aav, source, opts){
  const p = byId(S.players, playerId); if(!p) return;
  // A waiver pickup is not a signing anybody should be compensated for.
  if((opts && opts.waiver) || source==='waiver') return;
  const from = p.lastTeam || null;
  S.signings = S.signings || [];
  S.signings.unshift({ id:uid('sg'), year:compYear(), playerId, toTeam,
    fromTeam: (from && from!==toTeam) ? from : null, aav:fixInc(aav), source, at:Date.now() });
  if(S.signings.length > 400) S.signings.length = 400;
}
function signingsIn(year){ return (S.signings||[]).filter(x=> x.year===(year||compYear())); }
/* Score out of 100: what he was paid, and how he actually played. */
function compScore(sg, pool){
  const cfg = S.settings.comp;
  const money = pool.map(x=> x.aav);
  const mRank = pctRank(sg.aav, money);
  const p = byId(S.players, sg.playerId);
  const peers = p ? S.players.filter(x=> x.pos===p.pos) : [];
  const rVals = peers.map(realPPG).filter(v=> v!=null);
  const r = p ? realPPG(p) : null;
  const pRank = (r==null || !rVals.length) ? (p? formIndex(p) : 0.5) : pctRank(r, rVals);
  const mw = clamp(+cfg.moneyWeight||0, 0, 100)/100;
  const pw = clamp(+cfg.prodWeight||0, 0, 100)/100;
  const tot = (mw + pw) || 1;
  return Math.round(((mRank*mw + pRank*pw)/tot) * 1000)/10;
}
function compRoundFor(score){
  const tiers = S.settings.comp.tiers || {};
  const keys = Object.keys(tiers).map(Number).filter(n=> !isNaN(n)).sort((a,b)=> a-b);
  for(const r of keys){
    const need = +tiers[r];
    if(!isNaN(need) && score >= need) return r;
  }
  return null;
}
/* Losses are offset by signings of your own, biggest against biggest, the way
   the real thing works. What is left over earns a pick. */
function compFor(year){
  const cfg = S.settings.comp;
  const all = signingsIn(year).filter(x=>{
    if(x.aav < (+cfg.minAav||0)) return false;
    if(x.waiver) return false;
    const p = byId(S.players, x.playerId);
    return !(p && p.contract && p.contract.waiver);      // still on a waiver deal
  });
  const pool = all.slice();
  const byTeam = {};
  S.teams.forEach(t=> byTeam[t.id] = {lost:[], gained:[]});
  all.forEach(sg=>{
    const score = compScore(sg, pool);
    const row = {sg, score, round:compRoundFor(score), player:byId(S.players,sg.playerId)};
    if(sg.fromTeam && byTeam[sg.fromTeam]) byTeam[sg.fromTeam].lost.push(row);
    if(byTeam[sg.toTeam]) byTeam[sg.toTeam].gained.push(row);
  });
  const out = {};
  S.teams.forEach(t=>{
    const b = byTeam[t.id];
    b.lost.sort((x,y)=> y.score-x.score);
    b.gained.sort((x,y)=> y.score-x.score);
    const cancelled = cfg.offset ? Math.min(b.lost.length, b.gained.length) : 0;
    const net = b.lost.slice(cancelled).filter(r=> r.round!=null);
    out[t.id] = { lost:b.lost, gained:b.gained, cancelled,
                  awards: net.slice(0, Math.max(0, +cfg.maxPerTeam||0) || net.length) };
  });
  // A league-wide ceiling takes the weakest claims off the board first.
  const cap = +cfg.maxTotal||0;
  if(cap > 0){
    const flat = [];
    Object.keys(out).forEach(tid=> out[tid].awards.forEach(a=> flat.push({tid, a})));
    flat.sort((x,y)=> y.a.score - x.a.score);
    const keep = new Set(flat.slice(0, cap).map(x=> x.a));
    Object.keys(out).forEach(tid=> out[tid].awards = out[tid].awards.filter(a=> keep.has(a)));
  }
  return out;
}
/* Comp picks sit after the last natural slot in their round. */
function compPrice(round, index, year){
  const cfg = S.settings.comp;
  const key = round+'.'+index;
  const ov = (cfg.overrides||{})[key];
  let base;
  if(ov!=null && ov!=='' && !isNaN(+ov)) base = +ov;
  else if(cfg.priceMode==='fixed'){
    const v = (cfg.byRound||{})[round];
    base = (v!=null && v!=='' && !isNaN(+v)) ? +v : rookiePrice(round, S.teams.length, cfg.baseSeason);
  } else {
    const last = rookiePrice(round, S.teams.length, cfg.baseSeason);
    base = last * (clamp(+cfg.pctOfLast||100, 1, 200)/100);
  }
  const lift = Math.max(0, (year||S.league.season) - (+cfg.baseSeason||S.league.season));
  return Math.max(+S.settings.rookie.minSalary||0,
    roundInc(base * Math.pow(1 + (+cfg.growthPct||0)/100, lift)));
}
function isComp(pk){ return !!(pk && pk.comp); }
function compPicksFor(year){ return S.picks.filter(k=> isComp(k) && k.year===year); }
/* Turn the working-out into actual picks on the board. */
function awardCompPicks(year){
  const table = compFor(compYear());
  S.picks = S.picks.filter(k=> !(isComp(k) && k.year===year));
  let made = 0;
  const perRound = {};
  Object.keys(table).forEach(tid=>{
    table[tid].awards.forEach(a=>{
      const rd = a.round;
      perRound[rd] = (perRound[rd]||0) + 1;
      const pk = {id:uid('pk'), year, round:rd, ownerTeamId:tid, originTeamId:tid,
        comp:{index:perRound[rd], score:a.score, forPlayer:a.sg.playerId, lostTo:a.sg.toTeam}};
      S.picks.push(pk);
      made++;
    });
  });
  logIt('Compensatory picks worked out for '+year+' — '+made+' awarded', {type:'admin'});
  return made;
}
ACT.runComp = ()=>{
  const year = S.league.season+1;
  const table = compFor(compYear());
  const rows = Object.keys(table).filter(tid=> table[tid].awards.length);
  modal('Work out the '+year+' compensatory picks',
    '<p>Every auction and draft signing this year is weighed on what the player was paid and how he actually played. '+
    (S.settings.comp.offset?'Teams that signed as many as they lost get nothing.':'Offsetting is switched off, so losses count on their own.')+'</p>'+
    (rows.length
      ? '<div class="scrollx"><table><thead><tr><th>Team</th><th>For losing</th><th class="right">Score</th><th class="right">Round</th></tr></thead><tbody>'+
        rows.map(tid=> table[tid].awards.map(a=>
          '<tr><td>'+esc(teamName(tid))+'</td><td class="tiny muted">'+esc(playerName(a.sg.playerId))+
          ' → '+esc(teamName(a.sg.toTeam))+' at '+money(a.sg.aav)+'</td>'+
          '<td class="right num">'+a.score.toFixed(1)+'</td><td class="right num">'+a.round+'</td></tr>').join('')).join('')+
        '</tbody></table></div>'
      : '<p class="muted">Nobody qualifies. Either nothing changed hands at auction, or every team replaced what it lost.</p>')+
    '<div class="hint">This replaces any comp picks already on the '+year+' board.</div>',
    '<button class="btn ghost" data-a="closeModal">Cancel</button>'+
    '<button class="btn pri" data-a="runCompGo" data-y="'+year+'">Put them on the board</button>');
};
ACT.runCompGo = (d)=>{
  const n = awardCompPicks(+d.y);
  notify('Compensatory picks', n+' awarded for '+d.y+'.','good');
  closeModal(); save(); render(); toast(n+' comp picks awarded','good');
};

/* ============================================================
   STANDINGS AND DRAFT ORDER
   ============================================================ */
/* Head-to-head is kept as it happens, so a tie can be read straight off. */
function h2hAdd(aId, bId, aPts, bPts){
  S.h2h = S.h2h || {};
  const rec = (x,y)=> ((S.h2h[x] = S.h2h[x]||{})[y] = S.h2h[x][y] || {w:0,l:0,t:0});
  const A = rec(aId,bId), B = rec(bId,aId);
  if(aPts > bPts){ A.w++; B.l++; }
  else if(bPts > aPts){ B.w++; A.l++; }
  else { A.t++; B.t++; }
}
/* Takes a team or an id, because both are natural at the call sites. */
function h2hVs(team, group){
  const aId = (team && team.id) ? team.id : team;
  const src = (S.h2h||{})[aId] || {};
  let w=0,l=0,t=0;
  (group||[]).forEach(g=>{
    const gId = (g && g.id) ? g.id : g;
    if(gId===aId) return;
    const r = src[gId]; if(!r) return;
    w+=r.w; l+=r.l; t+=r.t;
  });
  const n = w+l+t;
  return {w,l,t,n, pct: n ? (w + t*0.5)/n : null};
}
/* "Opponent points" — every team you have played, weighted by how they have
   done. A hard schedule counts for something when three teams are level. */
function oppPoints(t){
  const played = (S.schedule||[]).filter(g=> g.home===t.id || g.away===t.id);
  if(!played.length) return 0;
  return Math.round(played.reduce((acc,g)=>{
    const oppId = g.home===t.id ? g.away : g.home;
    const o = byId(S.teams, oppId);
    if(!o) return acc;
    const r = teamRecord(o);
    return acc + (r.w + r.t*0.5);
  }, 0) * 100)/100;
}
/* How close a team got to its own best possible score, averaged. */
function efficiency(t){
  const e = (t && t.eff) || null;
  return (e && e.weeks) ? Math.round(e.got/e.best*10000)/100 : null;
}
const TIEBREAKS = {
  h2h:  {label:'Head to head',        val:null},
  opp:  {label:'Opponent points',     val:oppPoints},
  pf:   {label:'Points for',          val:(t)=> teamRecord(t).pf||0},
  pa:   {label:'Fewest points against', val:(t)=> -(teamRecord(t).pa||0)},
  eff:  {label:'Lineup efficiency',   val:(t)=> efficiency(t)==null ? -1 : efficiency(t)}
};
function tiebreakChain(){
  const c = S.settings.playoffs.chain;
  return (Array.isArray(c) && c.length) ? c.filter(k=> TIEBREAKS[k]) : ['h2h','opp','pf','eff'];
}
function teamRecord(t){
  if(!t) return {w:0,l:0,t:0,pf:0,pa:0};
  t.record = t.record || {w:0,l:0,t:0,pf:0,pa:0};
  return t.record;
}
function winPct(t){
  const r = teamRecord(t), g = r.w + r.l + r.t;
  return g ? (r.w + r.t*0.5)/g : 0;
}
/* A commissioner-awarded win that does not help anybody make the playoffs but
   does count for draft order. Because worst record picks first, a phantom win
   pushes a team DOWN the board — so of two teams level on the field, the one
   without it takes the better pick. */
function phantomWins(t){ return Math.max(0, +((t||{}).phantomW) || 0); }
function anyPhantom(){ return S.teams.some(t=> phantomWins(t)>0); }
/* Sort on record, then walk the tiebreak chain within each level group.
   Head to head only counts when it actually separates the whole group — a
   three-way tie where everyone went 1-1 proves nothing and falls through. */
function standings(withWhy){ return rankTeams((t)=>{ const r=teamRecord(t); return r.w + r.t*0.5; }, withWhy); }
/* The same ladder, with phantom wins folded in. Draft order only. */
function draftStandings(withWhy){
  return rankTeams((t)=>{ const r=teamRecord(t); return r.w + r.t*0.5 + phantomWins(t); }, withWhy);
}
function rankTeams(score, withWhy){
  const chain = tiebreakChain();
  const groups = {};
  S.teams.forEach(t=>{ const k = score(t).toFixed(1); (groups[k] = groups[k]||[]).push(t); });
  const out = [];
  Object.keys(groups).sort((a,b)=> +b - +a).forEach(k=>{
    const g = groups[k];
    if(g.length === 1){ out.push(g[0]); return; }
    const why = {};
    const ranked = g.slice().sort((a,b)=>{
      for(const step of chain){
        if(step==='h2h'){
          const ha = h2hVs(a,g), hb = h2hVs(b,g);
          if(ha.pct!=null && hb.pct!=null && ha.pct!==hb.pct){
            why[a.id]=why[a.id]||'head to head'; why[b.id]=why[b.id]||'head to head';
            return hb.pct - ha.pct;
          }
          continue;
        }
        const f = TIEBREAKS[step].val;
        const va = f(a), vb = f(b);
        if(va!==vb){
          why[a.id]=why[a.id]||TIEBREAKS[step].label; why[b.id]=why[b.id]||TIEBREAKS[step].label;
          return vb - va;
        }
      }
      return String(a.name).localeCompare(String(b.name));
    });
    ranked.forEach(t=>{ if(withWhy) t._why = why[t.id] || (g.length>1?'coin toss':''); out.push(t); });
  });
  return out;
}
/* Worst record picks first. A traded pick keeps the slot of whoever it came
   from. Phantom wins count here and nowhere else.
   If the league hands the loser bracket's winner the first pick, that team is
   lifted to the top and everybody else keeps their order behind them. */
function draftOrder(){
  const base = draftStandings().slice().reverse();
  if(!loserPrizeOn()) return base;
  const champ = loserChampion();
  if(!champ) return base;
  const i = base.findIndex(t=> t.id===champ);
  if(i <= 0) return base;
  const out = base.slice();
  out.unshift(out.splice(i,1)[0]);
  return out;
}
function draftSlot(teamId){
  const i = draftOrder().findIndex(t=> t.id===teamId);
  return i < 0 ? S.teams.length : i+1;
}
function pickSlot(pk){
  if(isComp(pk)) return S.teams.length + (pk.comp.index||1);
  return draftSlot(pk.originTeamId || pk.ownerTeamId);
}
function pickCost(pk){
  if(pk.round > rookieRounds()) return 0;
  return isComp(pk) ? compPrice(pk.round, pk.comp.index||1, pk.year)
                    : rookiePrice(pk.round, pickSlot(pk), pk.year);
}
function pickFirstYear(pk){ return pickFirstYearOf(pk); }
function rookieBill(teamId, year){
  return fixInc(sum(S.picks.filter(k=> k.ownerTeamId===teamId && k.year===(year||S.league.season+1))
    .map(pickFirstYear)));
}
/* What a team actually fielded. With no saved lineup that is the best one,
   so efficiency reads 100 until somebody starts setting them by hand. */
function fieldedTotal(teamId){
  const saved = ((S.lineups||{})[S.live.week]||{})[teamId];
  const best = bestLineup(teamId);
  if(!saved || !saved.length) return {got:best.total, best:best.total};
  const got = sum(saved.map(pid=> fpts(pid)));
  return {got: Math.round(got*100)/100, best: best.total};
}
function recordWeek(){
  S.schedule = S.schedule || [];
  (S.live.matchups||[]).forEach(m=>{
    const H = fieldedTotal(m.home), A = fieldedTotal(m.away);
    const h = H.got, a = A.got;
    const th = byId(S.teams,m.home), ta = byId(S.teams,m.away);
    const rh = teamRecord(th), ra = teamRecord(ta);
    rh.pf = Math.round((rh.pf + h)*100)/100; rh.pa = Math.round((rh.pa + a)*100)/100;
    ra.pf = Math.round((ra.pf + a)*100)/100; ra.pa = Math.round((ra.pa + h)*100)/100;
    if(h > a){ rh.w++; ra.l++; } else if(a > h){ ra.w++; rh.l++; } else { rh.t++; ra.t++; }
    h2hAdd(m.home, m.away, h, a);
    S.schedule.push({week:S.live.week, home:m.home, away:m.away, hp:h, ap:a});
    [[th,H],[ta,A]].forEach(([t,x])=>{
      t.eff = t.eff || {weeks:0, got:0, best:0};
      t.eff.weeks++; t.eff.got = Math.round((t.eff.got + x.got)*100)/100;
      t.eff.best = Math.round((t.eff.best + Math.max(x.best, x.got))*100)/100;
    });
  });
}

/* ============================================================
   PLAYOFFS
   ============================================================ */
function playoffField(){
  const p = S.settings.playoffs;
  return standings().slice(0, clamp(+p.teams||0, 0, S.teams.length));
}
/* Top seed against bottom seed, round by round, until one is left. Used by
   both brackets — the loser bracket is the same ladder with a different field
   and, if you want it, the loser of each game going through instead. */
/* What a team actually put up in a given week, out of the books. */
function weekPointsFor(teamId, week){
  const g = (S.schedule||[]).find(x=> x.week===week && (x.home===teamId || x.away===teamId));
  if(!g) return null;
  const v = g.home===teamId ? g.hp : g.ap;
  return (v==null || isNaN(+v)) ? null : +v;
}
function buildBracket(seeds, o){
  o = o || {};
  if(!seeds || seeds.length < 2) return [];
  const byes = clamp(+o.byes||0, 0, Math.max(0, seeds.length-2));
  const mark = o.advance==='loser' ? 'L' : 'W';
  const results = o.results || {};
  const seedOf = {}; seeds.forEach((t,i)=> seedOf[t.id] = i+1);
  const rounds = [];
  const alive = seeds.map((t,i)=> ({seed:i+1, team:t}));
  let waiting = alive.slice(0, byes);
  let playing = alive.slice(byes);
  let week = +o.startWeek||15;
  let r = 1;
  while(playing.length + waiting.length > 1 && r < 8){
    const games = [];
    for(let i=0; i<Math.floor(playing.length/2); i++)
      games.push({a: playing[i], b: playing[playing.length-1-i], key:'r'+r+'g'+i, week});
    const odd = playing.length % 2 ? [playing[Math.floor(playing.length/2)]] : [];
    /* Only the final when this one game settles it — nobody on a bye, and
       nobody getting a free pass because the number playing was odd. The old
       code checked neither: it tested the bye list after clearing it, and
       ignored the odd team entirely, so a bracket could show two rounds both
       labelled Final and count an extra week for each. */
    const isFinal = games.length===1 && waiting.length===0 && odd.length===0;
    /* Settle this round before pairing the next one. A commissioner's call
       always wins; otherwise it comes off what the two teams actually scored
       that week, and stays open while the week is unplayed or tied. */
    games.forEach(g=>{
      if(!g.a.team || !g.b.team) return;
      const said = results[g.key];
      if(said && (said===g.a.team.id || said===g.b.team.id)){ g.through = said; g.byHand = true; return; }
      const ap = weekPointsFor(g.a.team.id, week), bp = weekPointsFor(g.b.team.id, week);
      if(ap==null || bp==null) return;
      g.ap = ap; g.bp = bp;
      if(ap===bp) return;                       // a tie settles nothing
      const higher = ap>bp ? g.a.team.id : g.b.team.id;
      const lower  = ap>bp ? g.b.team.id : g.a.team.id;
      g.through = o.advance==='loser' ? lower : higher;
    });
    rounds.push({round:r, week, games, byes: waiting.slice(), final:isFinal, mark});
    const advancing = games.map(g=>{
      const t = g.through ? byId(S.teams, g.through) : null;
      return {seed: t ? (seedOf[t.id] || mark) : mark, team:t, from:g};
    }).concat(odd);
    playing = waiting.concat(advancing);
    /* Reseeding needs to know who actually got through, so it only bites once
       the round is settled. It used to be `playing.slice()`, which copies the
       array and reorders nothing — the setting has never done anything. */
    if(o.reseed && playing.every(x=> typeof x.seed === 'number'))
      playing = playing.slice().sort((a,b)=> a.seed - b.seed);
    waiting = [];
    week += (isFinal && o.twoWeekFinal) ? 2 : 1;
    r++;
    if(playing.length <= 1) break;
  }
  /* The two beaten semi-finalists, played alongside the final. */
  if(o.thirdPlace && rounds.length >= 2){
    const last = rounds[rounds.length-1], semi = rounds[rounds.length-2];
    if(last.final && semi.games.length >= 2) last.third = true;
  }
  return rounds;
}
/* The team left standing, or null while it is still being played out. */
function bracketChampion(rounds){
  if(!rounds.length) return null;
  const last = rounds[rounds.length-1];
  if(!last.final || last.games.length!==1) return null;
  return last.games[0].through || null;
}
function bracketWeeks(rounds, twoWeekFinal){
  return rounds.length + (twoWeekFinal ? 1 : 0);
}
function bracketResults(which){
  S.bracketResults = S.bracketResults || {playoff:{}, loser:{}};
  S.bracketResults[which] = S.bracketResults[which] || {};
  return S.bracketResults[which];
}
function playoffBracket(){
  const p = S.settings.playoffs;
  return buildBracket(playoffField(), {byes:p.byes, startWeek:p.startWeek, reseed:p.reseed,
    twoWeekFinal:p.twoWeekFinal, thirdPlace:p.thirdPlace, advance:'winner',
    results:bracketResults('playoff')});
}
function playoffWeeks(){ return bracketWeeks(playoffBracket(), S.settings.playoffs.twoWeekFinal); }
/* ---- the loser bracket ----
   Who is in it, how they are seeded, and whether winning or losing puts you
   through are all separate questions, so they are separate settings. */
function loserSettings(){ return S.settings.loser || {}; }
function loserOn(){ return !!loserSettings().on; }
function loserField(){
  const L = loserSettings();
  const inPlayoffs = {};
  playoffField().forEach(t=> inPlayoffs[t.id] = 1);
  let rest = standings().filter(t=> !inPlayoffs[t.id]);   // best of the rest first
  if(L.who === 'bottom'){
    const n = clamp(+L.teams||0, 0, rest.length);
    rest = rest.slice(rest.length - n);                   // the worst n of them
  }
  return L.seedBy === 'best' ? rest : rest.slice().reverse();
}
function loserBracket(){
  if(!loserOn()) return [];
  const L = loserSettings();
  return buildBracket(loserField(), {byes:L.byes, startWeek:L.startWeek, reseed:L.reseed,
    twoWeekFinal:L.twoWeekFinal, thirdPlace:L.thirdPlace, advance:L.advance,
    results:bracketResults('loser')});
}
/* Whoever comes out of the loser bracket, once it has actually been settled. */
function loserChampion(){ return loserOn() ? bracketChampion(loserBracket()) : null; }
function loserPrizeOn(){ return loserOn() && loserSettings().prize !== false; }
function loserWeeks(){ return bracketWeeks(loserBracket(), loserSettings().twoWeekFinal); }
function loserName(){ return String(loserSettings().name || 'Toilet bowl'); }
/* ---- who may set whose lineup ----
   A team sets its own, always. But once the loser bracket decides the first
   pick, the owner sitting on somebody's first-rounder has more riding on that
   team's week than its own owner does — who is already out and may not care.
   So for the weeks the bracket runs, control passes to whoever holds the pick. */
function loserWeekRange(){
  const lb = loserBracket();
  if(!lb.length) return null;
  const last = lb[lb.length-1];
  return {from: lb[0].week, to: last.week + (loserSettings().twoWeekFinal ? 1 : 0)};
}
function inLoserWeeks(week){
  const r = loserWeekRange();
  return !!r && week >= r.from && week <= r.to;
}
function inLoserBracket(teamId){ return loserField().some(t=> t.id===teamId); }
/* The next draft's first-rounder that started life with this team. */
function firstRounderOf(teamId){
  const y = S.league.season + 1;
  return S.picks.find(k=> !isComp(k) && k.round===1 && k.year===y && k.originTeamId===teamId) || null;
}
function pickHolderFor(teamId){
  const k = firstRounderOf(teamId);
  return (k && k.ownerTeamId && k.ownerTeamId!==teamId) ? k.ownerTeamId : null;
}
/* Whose call it is this week. */
function lineupBoss(teamId, week){
  const L = loserSettings();
  if(L.on && L.pickControl!==false && loserPrizeOn() &&
     inLoserWeeks(week==null ? (+S.live.week||1) : week) && inLoserBracket(teamId)){
    const holder = pickHolderFor(teamId);
    if(holder) return holder;
  }

}
function canSetLineup(teamId, week){
  return isCommish() || actingTeam() === lineupBoss(teamId, week);
}
/* The lineup as it stands: what was saved, or the best one if nothing was. */
function lineupFor(teamId, week){
  const w = week==null ? (+S.live.week||1) : week;
  const saved = ((S.lineups||{})[w]||{})[teamId];
  /* One row per starting spot, in the order the league has them. */
  const spots = [];
  S.settings.roster.slots.forEach(sl=>{ for(let n=0;n<sl.count;n++) spots.push(sl); });
  if(!saved || !saved.length){
    const best = bestLineup(teamId);
    return {slots: best.starters.map((x,i)=> ({slot:x.slot, p:x.p, pts:x.pts,
              eligible:(spots[i]||{}).eligible||[]})), saved:false, total:best.total};
  }
  const pool = teamPlayers(teamId), used = {};
  const slots = spots.map((sl,i)=>{
    const pid = saved[i];
    const p = pid ? pool.find(x=> x.id===pid && !used[x.id]) : null;
    if(p) used[p.id] = 1;
    return {slot:sl.label, p:p||null, pts:p?fpts(p.id):0, eligible:sl.eligible};
  });
  return {slots, saved:true, total:Math.round(sum(slots.map(x=>x.pts))*100)/100};
}
/* Draws either bracket. The placeholder reads "loser" rather than "winner"

/* ============================================================
   PLAYER NEWS
   ============================================================ */
function newsUrl(){
  const b = Sync.base();
  if(b) return b + '/news';
  return 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=50';
}
const ESPN_NEWS = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=50';
function newsShape(raw){
  return (raw||[]).slice(0,80).map(a=>({
    headline: a.headline || a.title || '',
    description: a.description || (a.story ? String(a.story).slice(0,300) : ''),
    published: a.published || a.lastModified || '',
    link: (a.links && a.links.web && a.links.web.href) || a.link || ''
  })).filter(x=> x.headline);
}
/* Try the league server first, since that is where a key would live, then ESPN
   direct. A server that is unwell should not mean no news at all. */
async function pullNews(loud){
  const tries = [];
  const viaServer = newsUrl();
  if(viaServer) tries.push({url:viaServer, what:'your league server'});
  if(viaServer !== ESPN_NEWS) tries.push({url:ESPN_NEWS, what:'ESPN directly'});

  const trouble = [];
  for(const t of tries){
    try{
      const r = await fetch(t.url, {headers:{accept:'application/json'}});
      const text = await r.text();
      let j = null;
      try{ j = JSON.parse(text); }catch(e){}

      if(!r.ok){
        // The server says why in the body; use that rather than a bare number.
        const why = (j && (j.error || j.note)) || (text||'').slice(0,120) || ('it answered '+r.status);
        trouble.push(t.what+': '+why);
        continue;
      }
      if(j && j.ok === false && !(j.items||[]).length){
        trouble.push(t.what+': '+(j.note || 'nothing came back'));
        continue;
      }
      const items = newsShape(j && (j.items || j.articles));
      if(!items.length){ trouble.push(t.what+': no stories in the answer'); continue; }

      S.news = {at:Date.now(), items, from:t.what};
      S.meta.newsTrouble = null;
      save(); render();
      if(loud) toast(items.length+' stories in','good');
      return;
    }catch(e){
      trouble.push(t.what+': '+(e.message||'could not be reached'));
    }
  }

  S.meta.newsTrouble = trouble.join(' · ');
  render();
  if(loud){
    modal('No news came through',
      '<div class="hint bad">'+esc(trouble.join('<br>')||'nothing to report')+'</div>'+
      '<div class="hint">The wire is public and unofficial, so it does go quiet sometimes. '+
      'The rest of the app does not depend on it.</div>'+
      (viaServer && viaServer!==ESPN_NEWS
        ? '<div class="hint">It tried your league server first and then ESPN directly. If only the server failed, '+
          'its <span class="num">/news</span> route may need redeploying — the newest league-server.js answers '+
          'politely instead of erroring.</div>' : ''),
      '<button class="btn ghost" data-a="closeModal">Close</button>'+
      '<button class="btn pri" data-a="pullNews">Try again</button>');
  }
}
/* Headline matching, not a per-player feed. Surname plus first initial keeps
   the Smiths apart without missing "J. Smith" style references. */
function playerNews(p){
  const items = (S.news && S.news.items) || [];
  if(!items.length || !p || !p.name) return [];
  const bits = String(p.name).split(/\s+/);
  const last = bits[bits.length-1], first = bits[0] || '';
  if(!last || last.length < 3) return [];
  const full = new RegExp('\\b'+first.replace(/[^\w]/g,'')+'\\W+'+last.replace(/[^\w]/g,'')+'\\b','i');
  const surname = new RegExp('\\b'+last.replace(/[^\w]/g,'')+'\\b','i');
  return items.filter(x=>{
    const hay = x.headline + ' ' + x.description;
    return full.test(hay) || (surname.test(hay) && (new RegExp('\\b'+first[0]+'\\.','i')).test(hay));
  }).slice(0,6);
}
/* Which players in this league a story is actually about. */
function newsTouches(item){
  return S.players.filter(p=> playerNews(p).indexOf(item) >= 0);
}
function newsIndex(item){ return (S.news.items||[]).indexOf(item); }
ACT.readNews = (d)=>{
  const item = (S.news.items||[])[+d.i];
  if(!item) return;
  const hits = newsTouches(item);
  const when = item.published ? new Date(item.published).getTime() : 0;
  modal(item.headline, `
    ${item.description?`<p style="font-size:15px;line-height:1.6">${esc(item.description)}</p>`:''}
    <div class="row" style="margin:10px 0">
      ${when?'<span class="tiny dim">'+dstr(when)+'</span>':''}
      <div class="spacer"></div>
      ${item.link?'<a class="btn sm" href="'+esc(item.link)+'" target="_blank" rel="noopener">Read the full story at the source</a>':''}
    </div>
    <div class="hr"></div>
    <div class="flabel">Why this landed in your feed</div>

function txFilter(){
  const f = ui.tmp.tx = ui.tmp.tx || {types:{}, teams:{}, q:''};
  f.types = f.types||{}; f.teams = f.teams||{};

}
function txMatches(l, f){
  const anyType = Object.keys(f.types).some(k=>f.types[k]);

  if(anyType && !f.types[l.type||'admin']) return false;
  if(anyTeam && !(l.teams||[]).some(t=> f.teams[t])) return false;
  if(f.q && !String(l.text).toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}

/* ============================================================
   VIEW · IMPORT A LEAGUE  (from a CSV or JSON export)
   ============================================================ */
function parseCSV(text){
  const delim = (text.split('\n')[0]||'').split('\t').length > (text.split('\n')[0]||'').split(',').length ? '\t' : ',';
  const rows=[]; let cur=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ cur.push(f); f=''; }
    else if(c==='\n'){ cur.push(f); rows.push(cur); cur=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f.length||cur.length){ cur.push(f); rows.push(cur); }
  return rows.filter(r=> r.some(x=> String(x).trim()!==''));
}
function parseAny(text){
  const t = text.trim();
  if(t.startsWith('[') || t.startsWith('{')){
    let j = JSON.parse(t);
    if(!Array.isArray(j)) j = j.players || j.rosters || j.data || j.teams || [];
    const heads = []; j.forEach(o=> Object.keys(o||{}).forEach(k=>{ if(heads.indexOf(k)<0) heads.push(k); }));
    return {headers:heads, rows:j.map(o=> heads.map(h=> o[h]==null?'':String(o[h])))};
  }
  const rows = parseCSV(t);
  return {headers:(rows[0]||[]).map(h=>String(h).trim()), rows:rows.slice(1)};
}
const MAP_FIELDS = [
  ['name','Player name', /^(player|name|full.?name|player.?name)$/i],
  ['pos','Position', /^(pos|position|slot)$/i],
  ['nfl','NFL team', /^(nfl|pro.?team|team.?abbr|nfl.?team|proteam)$/i],
  ['team','Fantasy team', /^(fantasy.?team|owner.?team|roster|team.?name|team)$/i],
  ['owner','Owner name', /^(owner|manager|user|display.?name)$/i],
  ['age','Age', /^(age|yrs|years.?old)$/i],
  ['salary','Salary / price', /^(salary|price|cost|contract|amount|cap.?hit|aav|bid)$/i],
  ['years','Contract years', /^(years|term|length|contract.?years|yrs.?left)$/i]
];
function autoMap(headers){
  const m = {};
  MAP_FIELDS.forEach(([k,,re])=>{ const h = headers.find(x=> re.test(String(x).trim())); if(h) m[k]=h; });
  return m;
}
/* A spreadsheet exported from another league usually has a column per season.
   If those are there, use them verbatim rather than guessing at a shape. */
function yearColumns(headers){
  const now = S.league.season;
  return (headers||[]).map((h,i)=>{
    const m = /(20\d\d)/.exec(String(h||''));
    if(!m) return null;
    const y = +m[1];
    return (y >= now-1 && y <= now+15) ? {i, year:y, head:h} : null;
  }).filter(Boolean).sort((a,b)=> a.year-b.year);
}
/* ============================================================
   MATCHING A PRICE LIST AGAINST THE LEAGUE YOU ALREADY HAVE
   Spreadsheets spell names every which way, so matching is done on a
   flattened form and then, failing that, on initial-plus-surname.
   ============================================================ */
const NAME_SUFFIX = /\b(jr|sr|ii|iii|iv|v)\b/g;
function flatName(n){
  return String(n||'').toLowerCase()
    .replace(/[.'`’]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(NAME_SUFFIX,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function initialKey(n){
  const parts = flatName(n).split(' ').filter(Boolean);
  if(parts.length < 2) return '';
  return parts[0][0] + ' ' + parts[parts.length-1];
}
/* Build the lookup once per run rather than per row. */
function nameIndex(){
  const full = {}, init = {};
  S.players.forEach(p=>{
    const f = flatName(p.name);
    if(f){ (full[f] = full[f] || []).push(p); }
    const i = initialKey(p.name);
    if(i){ (init[i] = init[i] || []).push(p); }
  });
  return {full, init};
}
function matchOne(idx, name, pos){
  const f = flatName(name);
  let hits = idx.full[f] || [];
  let how = 'name';
  if(!hits.length){ hits = idx.init[initialKey(name)] || []; how = 'initial'; }
  if(!hits.length) return {p:null, how:'none', ambiguous:false};
  if(hits.length > 1 && pos){
    const byPos = hits.filter(x=> x.pos === String(pos).toUpperCase());
    if(byPos.length === 1) return {p:byPos[0], how:how+' and position', ambiguous:false};
  }
  return {p:hits[0], how, ambiguous:hits.length>1};
}
/* Work out what the file is proposing for everyone, without changing anything. */
function pricePlan(){
  const m = ui.tmp.match; if(!m || !m.rows.length) return null;
  // map holds column positions, not header names, so index straight in.
  const H = m.headers, get = (r,k)=> m.map[k]!=null ? String(r[m.map[k]]||'').trim() : '';
  const idx = nameIndex();
  const cols = m.useYearCols ? yearColumns(H) : [];
  const rows = [], missed = [], seen = {};

  m.rows.forEach(r=>{
    const nm = get(r,'name'); if(!nm) return;
    const money = parseFloat(String(get(r,'price')).replace(/[^0-9.\-]/g,''));
    const perYear = cols.map(c=>{
      const v = parseFloat(String(r[c.i]==null?'':r[c.i]).replace(/[^0-9.\-]/g,''));
      return isNaN(v) ? 0 : v;
    });
    while(perYear.length && !perYear[perYear.length-1]) perYear.pop();
    if(isNaN(money) && !perYear.length) return;

    const hit = matchOne(idx, nm, get(r,'pos'));
    if(!hit.p){ missed.push(nm); return; }
    if(seen[hit.p.id]) return;                 // first mention of a player wins
    seen[hit.p.id] = 1;

    const now = hit.p.contract ? capHit(hit.p, S.league.season) : null;
    rows.push({
      p:hit.p, file:nm, how:hit.how, ambiguous:hit.ambiguous,
      want: isNaN(money) ? (perYear.length ? perYear[0] : 0) : money,
      perYear, now
    });
  });

  const untouched = S.players.filter(x=> x.contract && !seen[x.id]);
  return {rows, missed, untouched};
}
function impDefault(){
  return { text:'', headers:[], rows:[], map:{}, replace:true,
    salaryIs:'annual', yearsMode:'file', yearsFixed:1, structId:S.settings.contracts.defaultStruct,
    priceMode:'file', flat:5, targetPct:80, ready:false, useYearCols:true };
}
/* ============================================================
   SLEEPER IMPORT
   Everything here is public — no login, no token. The scoring keys are
   Sleeper's own, which is why they drop straight in with no translation.
   ============================================================ */
const SLEEPER = 'https://api.sleeper.app/v1';
let SLEEPER_PLAYERS = null;                       // ~5MB, fetched once per session

function sleeperLeagueId(raw){
  const m = /(\d{6,})/.exec(String(raw||'').trim());   // works on a bare id or a pasted URL
  return m ? m[1] : '';
}
function impProgress(text, pct){
  const el = $('#slProg');
  if(el) el.innerHTML = text ? ('<div class="hint">'+esc(text)+'</div>'+
    (pct!=null?'<div class="meter"><i style="width:'+clamp(pct,0,100)+'%"></i></div>':'')) : '';
}
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(url.split('/v1/')[1]+' came back '+r.status);
  return r.json();
}
async function sleeperPlayerMap(){
  if(SLEEPER_PLAYERS) return SLEEPER_PLAYERS;
  impProgress('Fetching the player list. About five megabytes, and only once.', 40);
  SLEEPER_PLAYERS = await getJSON(SLEEPER+'/players/nfl');
  return SLEEPER_PLAYERS;
}
/* Sleeper lists bench, IR and taxi slots inline with the starters. */
function slotsFromSleeper(positions){
  const starters = [], extra = {bench:0, ir:0, taxi:0};
  (positions||[]).forEach(code=>{
    if(code==='BN') extra.bench++;
    else if(code==='IR') extra.ir++;
    else if(code==='TAXI') extra.taxi++;
    else if(SLOT_TYPES[code]) starters.push(code);
  });
  return { slots: slotsFromCodes(starters), extra,
           unknown: (positions||[]).filter(c=> c!=='BN' && c!=='IR' && c!=='TAXI' && !SLOT_TYPES[c]) };
}
function sleeperName(pl, id){
  if(!pl) return String(id);
  const pos = pl.position || (pl.fantasy_positions||[])[0];
  if(pos==='DEF') return (pl.last_name || pl.team || id) + ' D/ST';
  return pl.full_name || [pl.first_name, pl.last_name].filter(Boolean).join(' ') || String(id);
}
ACT.sleeperGo = async ()=>{
  const id = sleeperLeagueId(($('#slId')||{}).value);
  if(!id) return toast('Paste your league id, or the sleeper.com address','bad');
  ui.tmp.slIdVal = ($('#slId')||{}).value || '';
  ui.tmp.slErr = null; ui.tmp.slBusy = true; render();
  try{
    impProgress('Reading the league…', 10);
    const league = await getJSON(SLEEPER+'/league/'+id);
    impProgress('Reading the owners…', 20);
    const users = await getJSON(SLEEPER+'/league/'+id+'/users');
    impProgress('Reading the rosters…', 30);
    const rosters = await getJSON(SLEEPER+'/league/'+id+'/rosters');
    const players = await sleeperPlayerMap();
    impProgress('Putting it together…', 85);

    const o = ui.tmp.slOpts || {scoring:true, roster:true, teams:true};
    const season = parseInt(league.season,10) || S.league.season;

    if(o.teams){
      keepBackup(S, 'before the Sleeper import');
      const byUser = {};
      users.forEach(u=> byUser[u.user_id] = u);
      S.teams=[]; S.players=[]; S.picks=[]; S.auctions=[]; S.faAuctions=[]; S.trades=[];
      S.live = {week:1, games:[], stats:{}, feed:[], matchups:[], talk:[], lastTick:0};
      S.dvp = {}; S.season = {year:season, byPlayer:{}};
      const mk = Object.keys(MASCOTS);
      rosters.forEach((r,i)=>{
        const u = byUser[r.owner_id] || {};
        const name = (u.metadata && u.metadata.team_name) || u.display_name || ('Team '+(i+1));
        const t = {id:'t'+r.roster_id, name, abbr:name.slice(0,3).toUpperCase(),
          owner:u.display_name||'', email:'', dead:[], adj:[], faSpent:0,
          color:TEAM_COLORS[i%TEAM_COLORS.length], mascot:mk[i%mk.length],
          dues:{paid:false, paidOn:null, amount:null, method:'', note:''}};
        S.teams.push(t);
        [].concat(r.players||[], r.taxi||[], r.reserve||[])
          .filter((v,j,a)=> v && a.indexOf(v)===j)
          .forEach(pid=>{
            const pl = players[pid];
            const raw = (pl && (pl.position || (pl.fantasy_positions||[])[0])) || 'WR';
            const p = {id:uid('p'), sleeperId:pid, name:sleeperName(pl,pid),
              pos: /^(QB|RB|WR|TE|K|DEF|DL|LB|DB)$/.test(raw) ? raw : 'WR',
              nfl:(pl && pl.team) || '', age:(pl && +pl.age) || 0, value:1, contract:null};
            if(pl && pl.injury_status) p.injury = {status:pl.injury_status, body:pl.injury_body_part||'', at:Date.now()};
            p.contract = makeContract(t.id, +S.settings.contracts.minSalary||1, 1, 'ev', season);
            S.players.push(p);
          });
      });
      S.league.name = league.name || S.league.name;
      S.league.season = season;
      if(S.teams[0]){ S.league.myTeamId = S.teams[0].id; S.league.commishTeamId = S.teams[0].id; }
      for(let y=season+1; y<=season+3; y++) for(let rd=1; rd<=4; rd++)
        S.teams.forEach(t=> S.picks.push({id:uid('pk'), year:y, round:rd, ownerTeamId:t.id, originTeamId:t.id}));
    }

    let scored = 0, unknownSlots = [];
    if(o.scoring && league.scoring_settings){
      const target = S.settings.scoring;
      Object.keys(league.scoring_settings).forEach(k=>{
        if(k in target){ target[k] = +league.scoring_settings[k]||0; scored++; }
      });
    }
    if(o.roster && league.roster_positions){
      const built = slotsFromSleeper(league.roster_positions);
      if(built.slots.length) S.settings.roster.slots = built.slots;
      S.settings.roster.bench = built.extra.bench || S.settings.roster.bench;
      const ls = league.settings || {};
      S.settings.roster.ir = ls.reserve_slots!=null ? +ls.reserve_slots : (built.extra.ir || S.settings.roster.ir);
      S.settings.roster.taxi = ls.taxi_slots!=null ? +ls.taxi_slots : (built.extra.taxi || S.settings.roster.taxi);
      S.settings.roster.maxRoster = sum(S.settings.roster.slots.map(x=>+x.count||0))
        + (+S.settings.roster.bench||0) + (+S.settings.roster.ir||0) + (+S.settings.roster.taxi||0);
      unknownSlots = built.unknown;
    }

    logIt('Imported "'+(league.name||id)+'" from Sleeper — '+S.teams.length+' teams, '+
      S.players.length+' players, '+scored+' scoring categories', {type:'admin'});
    ui.tmp.slBusy = false;
    ui.tmp.slDone = {name:league.name, teams:S.teams.length, players:S.players.length, scored, unknownSlots, season};
    ui.sub = 'price';
    save(true); render();
    toast('Sleeper league imported','good');
  }catch(e){
    ui.tmp.slBusy = false; ui.tmp.slErr = e.message;
    render(); toast('Could not read that league — '+e.message,'bad');
  }
};

};

/* A Google Sheets link, turned into something fetchable. The gviz endpoint
   answers with CSV and, unlike the download link, allows a browser to read it.
   gid is the tab: it is in the address bar when that tab is open. */
function sheetUrl(link, gid){
  const t = String(link||'').trim();
  const id = (/\/spreadsheets\/d\/(?:e\/)?([a-zA-Z0-9-_]+)/.exec(t)||[])[1];
  if(!id) return null;
  const g = String(gid==null?'':gid).trim() ||
            (/[#&?]gid=([0-9]+)/.exec(t)||[])[1] || '0';
  return {id, gid:g,
    csv:'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&gid='+encodeURIComponent(g)};
}
/* Real sheets often have a title above the headings. Find the row that looks
   most like a heading row rather than assuming it is the first. */
function guessHeaderRow(grid){
  const wanted = ['player','name','price','salary','pos','team','cap','value','aav','cost'];
  let best = 0, bestScore = -1;
  grid.slice(0, 12).forEach((row, i)=>{
    const cells = row.map(c=> String(c||'').trim().toLowerCase());
    const filled = cells.filter(Boolean).length;
    if(filled < 2) return;
    const hits = cells.filter(c=> wanted.some(w=> c.includes(w))).length;
    const numeric = cells.filter(c=> c && !isNaN(parseFloat(c))).length;
    const score = hits*3 + filled - numeric*2;   // headings are words, not numbers
    if(score > bestScore){ bestScore = score; best = i; }
  });
  return best;
}
function matchDefault(text, headerRow){
  let grid;
  const t = String(text||'').trim();
  if(t.startsWith('[') || t.startsWith('{')){
    let parsed;
    try{ parsed = parseAny(t); }catch(e){ return null; }
    grid = [parsed.headers].concat(parsed.rows||[]);
  } else {
    try{ grid = parseCSV(t); }catch(e){ return null; }
  }
  grid = (grid||[]).filter(r=> r.some(c=> String(c||'').trim()));
  if(grid.length < 2) return null;

  const hr = (headerRow==null) ? guessHeaderRow(grid) : clamp(+headerRow, 0, grid.length-2);
  return remap({grid, headerRow:hr, onlyDiff:true, mode:'aav', doFA:true});
}
/* Re-read the grid against whichever row is being treated as the headings. */
function remap(m, keepMap){
  const hr = m.headerRow;
  m.headers = (m.grid[hr]||[]).map(h=> String(h||'').trim());
  m.rows = m.grid.slice(hr+1).filter(r=> r.some(c=> String(c||'').trim()));
  const find = (...words)=>{
    for(let i=0;i<m.headers.length;i++){
      const h = m.headers[i].toLowerCase();
      if(h && words.some(w=> h.includes(w))) return i;
    }
    return null;
  };
  if(!keepMap){
    m.map = { name:find('player','name'), pos:find('pos'),
              price:find('price','salary','cap','value','aav','cost','$') };
    // Nothing obvious in the headings? Guess from the shape of the data.
    if(m.map.name==null) m.map = Object.assign(m.map, {name:guessNameCol(m)});
    if(m.map.price==null) m.map.price = guessMoneyCol(m, m.map.name);
  }
  m.useYearCols = yearColumns(m.headers).length>0;
  return m;
}
/* The column with the most two-word text in it is almost certainly the names. */
function guessNameCol(m){
  let best=null, bestScore=0;
  const n = Math.max.apply(null, m.rows.slice(0,40).map(r=>r.length).concat([0]));
  for(let c=0;c<n;c++){
    let score=0;
    m.rows.slice(0,40).forEach(r=>{
      const v = String(r[c]||'').trim();
      if(v && isNaN(parseFloat(v)) && v.split(/\s+/).length>=2) score++;
    });
    if(score>bestScore){ bestScore=score; best=c; }
  }
  return bestScore>2 ? best : null;
}
function guessMoneyCol(m, skip){
  let best=null, bestScore=0;
  const n = Math.max.apply(null, m.rows.slice(0,40).map(r=>r.length).concat([0]));
  for(let c=0;c<n;c++){
    if(c===skip) continue;
    let score=0;
    m.rows.slice(0,40).forEach(r=>{
      const v = String(r[c]||'').replace(/[$,]/g,'').trim();
      if(v && !isNaN(parseFloat(v))) score++;
    });
    if(score>bestScore){ bestScore=score; best=c; }
  }
  return bestScore>2 ? best : null;
}
/* A few real values from a column, so nobody has to guess what they picked. */
function colTaste(m, i){
  if(i==null) return '';
  const vals = m.rows.slice(0,4).map(r=> String(r[i]||'').trim()).filter(Boolean);
  return vals.length ? vals.join(' · ') : 'nothing in it';
}
