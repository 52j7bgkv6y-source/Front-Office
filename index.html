/* ============================================================
   VIEW · IMPORT A LEAGUE  (from a CSV or JSON export)
   ============================================================ */
function parseCSV(text){
  const delim = (text.split('\n')[0]||'').split('\t').length > (text.split('\n')[0]||'').split(',').length ? '\t' : ',';
  const rows=[]; let cur=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ cur.push(f); f=''; }
    else if(c==='\n'){ cur.push(f); rows.push(cur); cur=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f.length||cur.length){ cur.push(f); rows.push(cur); }
  return rows.filter(r=> r.some(x=> String(x).trim()!==''));
}
/* A, B, C ... AA for a column with no heading, the way a spreadsheet labels them. */
function colName(i){
  let n = i, out = '';
  do { out = String.fromCharCode(65 + (n % 26)) + out; n = Math.floor(n/26) - 1; } while(n >= 0);
  return out;
}
function parseAny(text){
  const t = text.trim();
  if(t.startsWith('[') || t.startsWith('{')){
    let j = JSON.parse(t);
    if(!Array.isArray(j)) j = j.players || j.rosters || j.data || j.teams || [];
    const heads = []; j.forEach(o=> Object.keys(o||{}).forEach(k=>{ if(heads.indexOf(k)<0) heads.push(k); }));
    return {headers:heads, rows:j.map(o=> heads.map(h=> o[h]==null?'':String(o[h])))};
  }
  const rows = parseCSV(t);
  const raw = (rows[0]||[]).map(h=> String(h==null?'':h).trim());
  const seen = {};
  const headers = raw.map((h,i)=>{
    let name = h || ('Column '+colName(i));       /* a blank heading is still a column */
    if(seen[name]!=null){ seen[name]++; name = name+' ('+seen[name]+')'; }  /* keep repeats apart */
    else seen[name] = 1;
    return name;
  });
  return {headers, rows:rows.slice(1)};
}
const MAP_FIELDS = [
  ['name','Player name', /^(player|name|full.?name|player.?name)$/i],
  ['pos','Position', /^(pos|position|slot)$/i],
  ['nfl','NFL team', /^(nfl|pro.?team|team.?abbr|nfl.?team|proteam)$/i],
  ['team','Fantasy team', /^(fantasy.?team|owner.?team|roster|team.?name|team)$/i],
  ['owner','Owner name', /^(owner|manager|user|display.?name)$/i],
  ['age','Age', /^(age|yrs|years.?old)$/i],
  ['salary','Salary / price', /^(salary|price|cost|contract|amount|cap.?hit|aav|bid)$/i],
  ['years','Contract years', /^(years|term|length|contract.?years|yrs.?left)$/i],
  ['total','Total contract value', /^(total|total.?value|total.?contract|contract.?total|deal.?total|guaranteed|gtd)$/i]
];
function autoMap(headers){
  const m = {};
  MAP_FIELDS.forEach(([k,,re])=>{ const h = headers.find(x=> re.test(String(x).trim())); if(h) m[k]=h; });
  return m;
}
/* A spreadsheet exported from another league usually has a column per season.
   If those are there, use them verbatim rather than guessing at a shape. */
function yearColumns(headers){
  const now = S.league.season;
  return (headers||[]).map((h,i)=>{
    const m = /(20\d\d)/.exec(String(h||''));
    if(!m) return null;
    const y = +m[1];
    return (y >= now-1 && y <= now+15) ? {i, year:y, head:h} : null;
  }).filter(Boolean).sort((a,b)=> a.year-b.year);
}
/* ============================================================
   MATCHING A PRICE LIST AGAINST THE LEAGUE YOU ALREADY HAVE
   Spreadsheets spell names every which way, so matching is done on a
   flattened form and then, failing that, on initial-plus-surname.
   ============================================================ */
const NAME_SUFFIX = /\b(jr|sr|ii|iii|iv|v)\b/g;
function flatName(n){
  return String(n||'').toLowerCase()
    .replace(/[.'`’]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(NAME_SUFFIX,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function initialKey(n){
  const parts = flatName(n).split(' ').filter(Boolean);
  if(parts.length < 2) return '';
  return parts[0][0] + ' ' + parts[parts.length-1];
}
/* Build the lookup once per run rather than per row. */
function nameIndex(){
  const full = {}, init = {};
  S.players.forEach(p=>{
    const f = flatName(p.name);
    if(f){ (full[f] = full[f] || []).push(p); }
    const i = initialKey(p.name);
    if(i){ (init[i] = init[i] || []).push(p); }
  });
  return {full, init};
}
function matchOne(idx, name, pos){
  const f = flatName(name);
  let hits = idx.full[f] || [];
  let how = 'name';
  if(!hits.length){ hits = idx.init[initialKey(name)] || []; how = 'initial'; }
  if(!hits.length) return {p:null, how:'none', ambiguous:false};
  if(hits.length > 1 && pos){
    const byPos = hits.filter(x=> x.pos === String(pos).toUpperCase());
    if(byPos.length === 1) return {p:byPos[0], how:how+' and position', ambiguous:false};
  }
  return {p:hits[0], how, ambiguous:hits.length>1};
}
/* Work out what the file is proposing for everyone, without changing anything. */
function pricePlan(){
  const m = ui.tmp.match; if(!m || !m.rows.length) return null;
  // map holds column positions, not header names, so index straight in.
  const H = m.headers, get = (r,k)=> m.map[k]!=null ? String(r[m.map[k]]||'').trim() : '';
  const idx = nameIndex();
  const cols = m.useYearCols ? yearColumns(H) : [];
  const rows = [], missed = [], seen = {};

  m.rows.forEach(r=>{
    const nm = get(r,'name'); if(!nm) return;
    const money = parseFloat(String(get(r,'price')).replace(/[^0-9.\-]/g,''));
    const perYear = cols.map(c=>{
      const v = parseFloat(String(r[c.i]==null?'':r[c.i]).replace(/[^0-9.\-]/g,''));
      return isNaN(v) ? 0 : v;
    });
    while(perYear.length && !perYear[perYear.length-1]) perYear.pop();
    /* Leading blanks mean the deal has not started yet — begin at the first
       season that actually carries money. */
    let lead = 0;
    while(lead < perYear.length && !perYear[lead]) lead++;
    if(lead) perYear.splice(0, lead);
    const startsAt = perYear.length && cols.length ? cols[Math.min(lead, cols.length-1)].year : null;
    /* The sheet's own total and years, so the seasons can be checked against them. */
    const sheetTotal = parseFloat(String(get(r,'total')).replace(/[^0-9.\-]/g,''));
    const sheetYears = parseInt(String(get(r,'years')).replace(/[^0-9]/g,''), 10);
    if(isNaN(money) && !perYear.length && isNaN(sheetYears)) return;

    const hit = matchOne(idx, nm, get(r,'pos'));
    if(!hit.p){ missed.push(nm); return; }
    if(seen[hit.p.id]) return;                 // first mention of a player wins
    seen[hit.p.id] = 1;

    const now = hit.p.contract ? capHit(hit.p, S.league.season) : null;
    /* THE RULE
       - Base Salary is what an even year costs.
       - A season column overrides the base for that year.
       - Total contract years says how long the deal runs; if it is missing we
         take the length from the seasons that carry money.
       - The seasons then have to add up to the total column, and their count to
         the years column, or the row is flagged. */
    const base = isNaN(money) ? null : money;
    const seasons = {};                      /* year -> figure from the sheet */
    cols.forEach((c,i)=>{
      const v = parseFloat(String(r[c.i]==null?'':r[c.i]).replace(/[^0-9.\-]/g,''));
      if(!isNaN(v) && v!==0) seasons[c.year] = v;
    });
    const seasonYears = Object.keys(seasons).map(Number).sort((a,b)=>a-b);
    const firstYear = seasonYears.length ? seasonYears[0] : S.league.season;
    let years = !isNaN(sheetYears) && sheetYears>0 ? sheetYears
              : (seasonYears.length ? (seasonYears[seasonYears.length-1] - firstYear + 1) : null);
    if(!years) years = hit.p.contract ? hit.p.contract.years : 1;
    const built = [];
    for(let i=0;i<years;i++){
      const y = firstYear + i;
      built.push(fixCents(seasons[y]!=null ? seasons[y] : (base!=null ? base : 0)));
    }
    const builtTotal = fixCents(sum(built));
    rows.push({
      p:hit.p, file:nm, how:hit.how, ambiguous:hit.ambiguous,
      want: builtTotal, base, years, firstYear, built,
      perYear, now, startsAt, sheetTotal, sheetYears
    });
  });

  const untouched = S.players.filter(x=> x.contract && !seen[x.id]);
  return {rows, missed, untouched};
}
function impDefault(){
  return { text:'', headers:[], rows:[], map:{}, replace:true,
    salaryIs:'annual', yearsMode:'file', yearsFixed:1, structId:S.settings.contracts.defaultStruct,
    priceMode:'file', flat:5, targetPct:80, ready:false, useYearCols:true };
}
/* ============================================================
   SLEEPER IMPORT
   Everything here is public — no login, no token. The scoring keys are
   Sleeper's own, which is why they drop straight in with no translation.
   ============================================================ */
const SLEEPER = 'https://api.sleeper.app/v1';
let SLEEPER_PLAYERS = null;                       // ~5MB, fetched once per session

function sleeperLeagueId(raw){
  const m = /(\d{6,})/.exec(String(raw||'').trim());   // works on a bare id or a pasted URL
  return m ? m[1] : '';
}
function impProgress(text, pct){
  const el = $('#slProg');
  if(el) el.innerHTML = text ? ('<div class="hint">'+esc(text)+'</div>'+
    (pct!=null?'<div class="meter"><i style="width:'+clamp(pct,0,100)+'%"></i></div>':'')) : '';
}
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(url.split('/v1/')[1]+' came back '+r.status);
  return r.json();
}
async function sleeperPlayerMap(){
  if(SLEEPER_PLAYERS) return SLEEPER_PLAYERS;
  impProgress('Fetching the player list. About five megabytes, and only once.', 40);
  SLEEPER_PLAYERS = await getJSON(SLEEPER+'/players/nfl');
  return SLEEPER_PLAYERS;
}
/* Sleeper lists bench, IR and taxi slots inline with the starters. */
function slotsFromSleeper(positions){
  const starters = [], extra = {bench:0, ir:0, taxi:0};
  (positions||[]).forEach(code=>{
    if(code==='BN') extra.bench++;
    else if(code==='IR') extra.ir++;
    else if(code==='TAXI') extra.taxi++;
    else if(SLOT_TYPES[code]) starters.push(code);
  });
  return { slots: slotsFromCodes(starters), extra,
           unknown: (positions||[]).filter(c=> c!=='BN' && c!=='IR' && c!=='TAXI' && !SLOT_TYPES[c]) };
}
function sleeperName(pl, id){
  if(!pl) return String(id);
  const pos = pl.position || (pl.fantasy_positions||[])[0];
  if(pos==='DEF') return (pl.last_name || pl.team || id) + ' D/ST';
  return pl.full_name || [pl.first_name, pl.last_name].filter(Boolean).join(' ') || String(id);
}
/* ---- Top up free agents from Sleeper ---------------------------------------
   Adds anyone Sleeper knows about who is not already in this league, as a free
   agent. Existing teams, rosters and contracts are left exactly as they are.
   Where a player sits on a roster here but is a free agent in Sleeper, we ask
   rather than decide. */
function faSleeperMatchKey(name, pos){
  return String(name||'').toLowerCase().replace(/[^a-z]/g,'')+'|'+String(pos||'').toUpperCase();
}
function faIndexHere(){
  const byId = {}, byName = {};
  S.players.forEach(p=>{
    if(p.sleeperId) byId[String(p.sleeperId)] = p;
    byName[faSleeperMatchKey(p.name, p.pos)] = p;
  });
  return {byId, byName};
}
/* Bring the season's fixtures across from Sleeper. Only the schedule is
   touched — rosters, contracts, teams and settings are left alone. */
ACT.schedPullGo = async ()=>{
  if(!isCommish()) return toast('Commissioners only','bad');
  const id = sleeperLeagueId(($('#schedSlId')||{}).value || ui.tmp.schedSlId || '');
  if(!id) return toast('Paste your Sleeper league id, or the address','bad');
  ui.tmp.schedSlId = ($('#schedSlId')||{}).value || ui.tmp.schedSlId || '';
  ui.tmp.schedBusy = true; ui.tmp.schedErr = null; render();
  try{
    impProgress('Reading the rosters\u2026', 10);
    const rosters = await getJSON(SLEEPER+'/league/'+id+'/rosters');
    /* Sleeper roster_id -> a team here. The main import names teams t<roster_id>,
       so that lines up; fall back to the order they come in. */
    const teamFor = {};
    rosters.forEach((r,i)=>{
      teamFor[r.roster_id] = (byId(S.teams,'t'+r.roster_id) || S.teams[i] || {}).id || null;
    });
    const weeks = seasonWeeks();
    const out = [];
    for(let w=1; w<=weeks; w++){
      impProgress('Week '+w+' of '+weeks+'\u2026', Math.round(10 + (w/weeks)*85));
      let ms;
      try{ ms = await getJSON(SLEEPER+'/league/'+id+'/matchups/'+w); }
      catch(e){ break; }                      /* past the end of their season */
      if(!ms || !ms.length) continue;
      /* Two rosters sharing a matchup_id are playing each other. */
      const pair = {};
      ms.forEach(m=>{
        if(m.matchup_id==null) return;
        (pair[m.matchup_id] = pair[m.matchup_id] || []).push(m.roster_id);
      });
      Object.keys(pair).forEach(k=>{
        const [a,b] = pair[k];
        const ha = teamFor[a], aw = teamFor[b];
        if(ha && aw) out.push({week:w, home:ha, away:aw});
      });
    }
    impProgress('', 100);
    ui.tmp.schedBusy = false;
    if(!out.length){
      ui.tmp.schedErr = 'That league did not return any fixtures.';
      render(); return toast('No fixtures found','bad');
    }
    S.fixtures = out;                          /* the only thing written */
    if(S.live && S.live.week) buildWeek(S.live.week);
    const wks = fixtureWeeks();
    logIt('Schedule brought in from Sleeper — '+out.length+' games across '+wks.length+' weeks', {type:'admin'});
    save(); render();
    toast(out.length+' games across '+wks.length+' weeks','good');
  }catch(e){
    ui.tmp.schedBusy = false; ui.tmp.schedErr = e.message; impProgress('', 0); render();
    toast('Could not read that league — '+e.message,'bad');
  }
};
ACT.schedClear = ()=>{
  if(!isCommish()) return toast('Commissioners only','bad');

  if(S.live && S.live.week) buildWeek(S.live.week);

ACT.faPullGo = async ()=>{
  const id = sleeperLeagueId(($('#faSlId')||{}).value || ui.tmp.faSlId || '');
  if(!id) return toast('Paste your Sleeper league id, or the address','bad');
  ui.tmp.faSlId = ($('#faSlId')||{}).value || '';
  ui.tmp.faBusy = true; ui.tmp.faErr = null; render();
  try{
    impProgress('Reading the rosters\u2026', 20);
    const rosters = await getJSON(SLEEPER+'/league/'+id+'/rosters');
    impProgress('Reading the player list\u2026', 50);
    const players = await sleeperPlayerMap();
    impProgress('Working out who is free\u2026', 80);

    /* Everyone on a Sleeper roster. Anyone else Sleeper lists is free. */
    const rostered = {};
    rosters.forEach(r=> [].concat(r.players||[], r.taxi||[], r.reserve||[])
      .forEach(pid=>{ if(pid) rostered[String(pid)] = true; }));

    const idx = faIndexHere();
    const added = [], conflicts = [];
    const minSal = +S.settings.contracts.minSalary || 1;

    Object.keys(players).forEach(pid=>{
      const pl = players[pid];
      if(!pl) return;
      const raw = pl.position || (pl.fantasy_positions||[])[0];
      if(!/^(QB|RB|WR|TE|K|DEF|DL|LB|DB)$/.test(String(raw||''))) return;
      if(!pl.team && raw!=='DEF') return;                 /* not on an NFL club */
      const isFreeInSleeper = !rostered[String(pid)];
      const here = idx.byId[String(pid)] || idx.byName[faSleeperMatchKey(sleeperName(pl,pid), raw)];

      if(!here){
        if(!isFreeInSleeper) return;                      /* on a roster there, not here: leave it alone */
        added.push({pid, pl, pos:raw});
        return;
      }
      /* Known here already. Only interesting when he is free in Sleeper but on
         somebody's roster here. */
      if(isFreeInSleeper && here.contract && here.contract.teamId && byId(S.teams, here.contract.teamId)){
        conflicts.push({playerId:here.id, name:here.name, pos:here.pos,
          teamId:here.contract.teamId, keep:true});
      }
    });

    /* Bring the genuinely new free agents in. */
    added.forEach(a=>{
      const pl = a.pl;
      const p = {id:uid('p'), sleeperId:a.pid, name:sleeperName(pl,a.pid), pos:a.pos,
        nfl:pl.team||'', age:+pl.age||0, value:1,
        exp:(pl.years_exp!=null) ? (+pl.years_exp||0) : null,
        contract: makeContract(null, minSal, 1, 'ev', S.league.season)};
      if(pl.injury_status) p.injury = {status:pl.injury_status, body:pl.injury_body_part||'', at:Date.now()};
      const st = String(pl.status||pl.roster_status||'').toLowerCase();
      if(st.indexOf('practice')>=0 || st==='ps') p.nflPractice = true;
      S.players.push(p);
    });

    /* Anyone already here with no deal at all gets the minimum, so the pool is
       priced. Existing contracts are never touched. */
    let priced = 0;
    S.players.forEach(p=>{
      if(!p.contract){
        p.contract = makeContract(null, minSal, 1, 'ev', S.league.season);
        priced++;
      }
    });

    impProgress('', 100);
    ui.tmp.faBusy = false;
    ui.tmp.faConflicts = conflicts;
    logIt('Pulled '+added.length+' free agent'+(added.length===1?'':'s')+' in from Sleeper', {type:'admin'});
    save(); render();

    if(conflicts.length) ACT.faReview();
    else toast(added.length+' free agents added'+(priced?', '+priced+' priced at '+money(minSal):''),'good');
  }catch(e){
    ui.tmp.faBusy = false; ui.tmp.faErr = e.message; impProgress('', 0); render();
    toast('Could not read that league — '+e.message,'bad');
  }
};
/* Ask about each player who is free in Sleeper but rostered here. */
ACT.faReview = ()=>{
  const list = ui.tmp.faConflicts || [];
  if(!list.length) return toast('Nothing to review','good');
  modal(list.length+' player'+(list.length===1?' is':'s are')+' free in Sleeper but on a roster here',
    '<p class="muted" style="margin:0 0 8px">Tick the ones you want to keep on their team. Anything left '+
    'unticked is moved to free agency, keeping whatever deal it already has.</p>'+
    '<div class="scrollx" style="max-height:300px;overflow:auto"><table><tbody>'+
    list.map((c,i)=>'<tr><td><label class="check"><input type="checkbox" data-a="faKeep" data-i="'+i+'"'+
      (c.keep?' checked':'')+'><span>'+esc(c.name)+' <span class="dim">'+esc(c.pos)+'</span></span></label></td>'+
      '<td class="dim tiny">on '+esc(teamName(c.teamId))+'</td></tr>').join('')+
    '</tbody></table></div>',
    '<button class="btn ghost" data-a="faKeepAll">Keep them all</button>'+
    '<button class="btn pri" data-a="faReviewGo">Apply</button>');
};
ACT.faKeep = (d, el)=>{

ACT.faKeepAll = ()=>{ (ui.tmp.faConflicts||[]).forEach(c=> c.keep = true); ACT.faReviewGo(); };
ACT.faReviewGo = ()=>{
  const list = ui.tmp.faConflicts || [];

    if(c.keep) return;
    const p = byId(S.players, c.playerId); if(!p || !p.contract) return;

  ui.tmp.faConflicts = [];

  toast(freed? freed+' moved to free agency' : 'Everyone kept where they were','good');
};
ACT.sleeperGo = async ()=>{
  const id = sleeperLeagueId(($('#slId')||{}).value);
  if(!id) return toast('Paste your league id, or the sleeper.com address','bad');
  ui.tmp.slIdVal = ($('#slId')||{}).value || '';
  ui.tmp.slErr = null; ui.tmp.slBusy = true; render();
  try{
    impProgress('Reading the league…', 10);
    const league = await getJSON(SLEEPER+'/league/'+id);
    impProgress('Reading the owners…', 20);
    const users = await getJSON(SLEEPER+'/league/'+id+'/users');
    impProgress('Reading the rosters…', 30);
    const rosters = await getJSON(SLEEPER+'/league/'+id+'/rosters');
    const players = await sleeperPlayerMap();
    impProgress('Putting it together…', 85);

    const o = ui.tmp.slOpts || {scoring:true, roster:true, teams:true, freeAgents:true, schedule:true, depth:true};
    const season = parseInt(league.season,10) || S.league.season;

    if(o.teams){
      keepBackup(S, 'before the Sleeper import');
      const byUser = {};
      users.forEach(u=> byUser[u.user_id] = u);
      /* Keep every deal that already exists. Sleeper decides WHERE a player
         sits; it does not get to change what he is paid. Matched on the Sleeper
         id first, then on name and position for anything added by hand. */
      const keyOf = (n,ps)=> String(n||'').toLowerCase().replace(/[^a-z]/g,'')+'|'+String(ps||'').toUpperCase();
      const oldDeals = {}, oldById = {};
      S.players.forEach(op=>{
        if(!op.contract) return;
        const keep = {c:deep(op.contract), slot:op.slot||null, exp:op.exp, nflPractice:op.nflPractice};
        if(op.sleeperId) oldById[String(op.sleeperId)] = keep;
        oldDeals[keyOf(op.name, op.pos)] = keep;
      });
      let kept = 0, freshDeals = 0;
      const reuse = (p, teamId)=>{
        const had = (p.sleeperId && oldById[String(p.sleeperId)]) || oldDeals[keyOf(p.name, p.pos)];
        if(had){
          p.contract = had.c;
          p.contract.teamId = teamId;          /* moved, terms untouched */
          if(had.slot) p.slot = had.slot;
          if(p.exp==null && had.exp!=null) p.exp = had.exp;
          if(had.nflPractice) p.nflPractice = true;
          kept++;
        } else {
          p.contract = makeContract(teamId, +S.settings.contracts.minSalary||1, 1, 'ev', season);
          freshDeals++;
        }
      };
      S.teams=[]; S.players=[]; S.picks=[]; S.auctions=[]; S.faAuctions=[]; S.trades=[];
      S.live = {week:1, games:[], stats:{}, feed:[], matchups:[], talk:[], lastTick:0};
      S.dvp = {}; S.season = {year:season, byPlayer:{}};
      const mk = Object.keys(MASCOTS);
      rosters.forEach((r,i)=>{
        const u = byUser[r.owner_id] || {};
        const name = (u.metadata && u.metadata.team_name) || u.display_name || ('Team '+(i+1));
        const t = {id:'t'+r.roster_id, name, abbr:name.slice(0,3).toUpperCase(),
          owner:u.display_name||'', email:'', dead:[], adj:[], faSpent:0,
          color:TEAM_COLORS[i%TEAM_COLORS.length], mascot:mk[i%mk.length],
          dues:{paid:false, paidOn:null, amount:null, method:'', note:''}};
        S.teams.push(t);
        [].concat(r.players||[], r.taxi||[], r.reserve||[])
          .filter((v,j,a)=> v && a.indexOf(v)===j)
          .forEach(pid=>{
            const pl = players[pid];
            const raw = (pl && (pl.position || (pl.fantasy_positions||[])[0])) || 'WR';
            const p = {id:uid('p'), sleeperId:pid, name:sleeperName(pl,pid),
              pos: /^(QB|RB|WR|TE|K|DEF|DL|LB|DB)$/.test(raw) ? raw : 'WR',
              nfl:(pl && pl.team) || '', age:(pl && +pl.age) || 0, value:1, contract:null,
              exp:(pl && pl.years_exp!=null) ? (+pl.years_exp||0) : null};
            if(pl && pl.injury_status) p.injury = {status:pl.injury_status, body:pl.injury_body_part||'', at:Date.now()};
            /* Sleeper reports a roster status; "PS"/"Practice Squad" sets our flag
               so a taxi player on a real practice squad can be cut free without
               anyone marking it by hand. */
            if(pl){ const st = String(pl.status||pl.roster_status||'').toLowerCase();
              if(st.indexOf('practice')>=0 || st==='ps') p.nflPractice = true; }
            reuse(p, t.id);
            S.players.push(p);
          });
      });
      /* Free agents: anyone Sleeper knows who is not on a roster in that league. */
      const taken = {};
      S.players.forEach(x=>{ if(x.sleeperId) taken[String(x.sleeperId)] = true; });
      let fa = 0;
      Object.keys(o.freeAgents ? players : {}).forEach(pid=>{
        if(taken[String(pid)]) return;
        const pl = players[pid]; if(!pl) return;
        const raw = pl.position || (pl.fantasy_positions||[])[0];
        if(!/^(QB|RB|WR|TE|K|DEF|DL|LB|DB)$/.test(String(raw||''))) return;
        if(!pl.team && raw!=='DEF') return;              /* not on an NFL club */
        const p = {id:uid('p'), sleeperId:pid, name:sleeperName(pl,pid), pos:raw,
          nfl:pl.team||'', age:+pl.age||0, value:1, contract:null,
          exp:(pl.years_exp!=null) ? (+pl.years_exp||0) : null};
        if(pl.injury_status) p.injury = {status:pl.injury_status, body:pl.injury_body_part||'', at:Date.now()};
        const st = String(pl.status||pl.roster_status||'').toLowerCase();
        if(st.indexOf('practice')>=0 || st==='ps') p.nflPractice = true;
        reuse(p, null);                                   /* free agent, deal kept if he had one */
        S.players.push(p);
        fa++;
      });
      /* Depth charts — only the ordering is written. */
      let depthSet = 0;
      if(o.depth){
        impProgress('Depth charts\u2026', 90);
        S.players.forEach(pl=>{
          const src = pl.sleeperId ? players[String(pl.sleeperId)] : null;
          if(src && src.depth_chart_order!=null){ pl.depth = +src.depth_chart_order||0; depthSet++; }
        });
      }
      /* The schedule — fixtures only, nothing else touched. */
      let fixtures = 0;
      if(o.schedule){
        const teamForRoster = {};
        rosters.forEach((r,i)=>{ teamForRoster[r.roster_id] = (byId(S.teams,'t'+r.roster_id) || S.teams[i] || {}).id || null; });
        const weeks = seasonWeeks(), out = [];
        for(let w=1; w<=weeks; w++){
          impProgress('Schedule, week '+w+'\u2026', 92);
          let ms; try{ ms = await getJSON(SLEEPER+'/league/'+id+'/matchups/'+w); }catch(e){ break; }
          if(!ms || !ms.length) continue;
          const pair = {};
          ms.forEach(mm=>{ if(mm.matchup_id==null) return;
            (pair[mm.matchup_id] = pair[mm.matchup_id] || []).push(mm.roster_id); });
          Object.keys(pair).forEach(k=>{
            const a = teamForRoster[pair[k][0]], b = teamForRoster[pair[k][1]];
            if(a && b) out.push({week:w, home:a, away:b});
          });
        }
        if(out.length){ S.fixtures = out; fixtures = out.length; }
      }
      ui.tmp.slKept = kept; ui.tmp.slFresh = freshDeals; ui.tmp.slFA = fa;
      ui.tmp.slDepth = depthSet; ui.tmp.slFixtures = fixtures;
      S.league.name = league.name || S.league.name;
      S.league.season = season;
      if(S.teams[0]){ S.league.myTeamId = S.teams[0].id; S.league.commishTeamId = S.teams[0].id; }
      if(o.picks !== false){
        /* Every pick for the next three seasons, then the ones Sleeper says have
           already changed hands. */
        let rounds = 4;
        const dr = league && league.settings && (league.settings.draft_rounds || league.settings.rounds);
        if(+dr > 0) rounds = +dr;
        let traded = [];
        try{ traded = await getJSON(SLEEPER+'/league/'+id+'/traded_picks') || []; }catch(e){}
        const rmap = teamByRoster(rosters), made = {};
        for(let y=season+1; y<=season+3; y++) for(let rd=1; rd<=rounds; rd++){
          (rosters||[]).forEach(r=>{
            const t = rmap[r.roster_id]; if(!t) return;
            const pk = {id:uid('pk'), year:y, round:rd, ownerTeamId:t, originTeamId:t};
            S.picks.push(pk); made[y+'|'+rd+'|'+r.roster_id] = pk;
          });
        }
        (traded||[]).forEach(tp=>{
          const pk = made[(+tp.season)+'|'+(+tp.round)+'|'+tp.roster_id];
          const to = rmap[tp.owner_id];
          if(pk && to) pk.ownerTeamId = to;
        });
        ui.tmp.slPicks = S.picks.length;
      } else {
        for(let y=season+1; y<=season+3; y++) for(let rd=1; rd<=4; rd++)
          S.teams.forEach(t=> S.picks.push({id:uid('pk'), year:y, round:rd, ownerTeamId:t.id, originTeamId:t.id}));
      }
    }

    let scored = 0, unknownSlots = [];
    if(o.scoring && league.scoring_settings){
      const target = S.settings.scoring;
      Object.keys(league.scoring_settings).forEach(k=>{
        if(k in target){ target[k] = +league.scoring_settings[k]||0; scored++; }
      });
    }
    if(o.roster && league.roster_positions){
      const built = slotsFromSleeper(league.roster_positions);
      if(built.slots.length) S.settings.roster.slots = built.slots;
      S.settings.roster.bench = built.extra.bench || S.settings.roster.bench;
      const ls = league.settings || {};
      S.settings.roster.ir = ls.reserve_slots!=null ? +ls.reserve_slots : (built.extra.ir || S.settings.roster.ir);
      S.settings.roster.taxi = ls.taxi_slots!=null ? +ls.taxi_slots : (built.extra.taxi || S.settings.roster.taxi);
      S.settings.roster.maxRoster = sum(S.settings.roster.slots.map(x=>+x.count||0))
        + (+S.settings.roster.bench||0) + (+S.settings.roster.ir||0) + (+S.settings.roster.taxi||0);
      unknownSlots = built.unknown;
    }

    logIt('Imported "'+(league.name||id)+'" from Sleeper — '+S.teams.length+' teams, '+
      S.players.length+' players, '+scored+' scoring categories', {type:'admin'});
    ui.tmp.slBusy = false;
    ui.tmp.slDone = {name:league.name, teams:S.teams.length, players:S.players.length, scored, unknownSlots, season,
      kept:ui.tmp.slKept||0, fresh:ui.tmp.slFresh||0, freeAgents:ui.tmp.slFA||0,
      depth:ui.tmp.slDepth||0, fixtures:ui.tmp.slFixtures||0};
    ui.sub = 'price';
    save(true); render();
    toast('Sleeper league imported','good');
  }catch(e){
    ui.tmp.slBusy = false; ui.tmp.slErr = e.message;
    render(); toast('Could not read that league — '+e.message,'bad');
  }
};

        <div class="hr"></div>
        <div class="flabel">Just the depth charts</div>

        <div class="hr"></div>

        <div class="hr"></div>

        <button class="btn" data-a="picksPull" ${ui.tmp.pkBusy?'disabled':''}>${ui.tmp.pkBusy?'Working…':'Pull in the draft picks'}</button>
        ${(S.picks||[]).length?`<div class="hint ok">${(S.picks||[]).length} picks on the books.</div>`:''}
        ${ui.tmp.pkErr?`<div class="hint bad">${esc(ui.tmp.pkErr)}</div>`:''}
        <div class="hr"></div>
        <div class="flabel">Just the free agents</div>
        <p class="muted tiny" style="margin:0">Adds anyone in Sleeper who is not in this league yet, as a free
          agent. Your teams, rosters and contracts are left alone — nothing is replaced.</p>
        <label class="f"><span>League id, or just paste the address</span>
          <input type="text" id="faSlId" data-k="faSlId" placeholder="1234567890123456789"
            value="${esc(ui.tmp.faSlId||ui.tmp.slIdVal||'')}"></label>
        <button class="btn wide" data-a="faPullGo" ${ui.tmp.faBusy?'disabled':''}>${ui.tmp.faBusy?'Working…':'Pull in the free agents'}</button>
        <div class="hint">Free agents come in on ${money(+S.settings.contracts.minSalary||1)} for one year. Anyone who
          already has a deal keeps it exactly as it is. If someone is free in Sleeper but on a roster here, you will be
          asked whether to keep him or let him go.</div>
        ${ui.tmp.faErr?`<div class="hint bad">${esc(ui.tmp.faErr)}</div>`:''}
        ${(ui.tmp.faConflicts||[]).length?`<button class="btn sm" data-a="faReview">Review ${(ui.tmp.faConflicts||[]).length} still to decide</button>`:''}
      </div></div>
      <div class="panel"><div class="ph"><h3>${done?'What came across':'What this does'}</h3></div><div class="pb">
        ${done?`<div class="kv">
            <dt>League</dt><dd>${esc(done.name||'—')}</dd><dt>Season</dt><dd>${done.season}</dd>
            <dt>Teams</dt><dd>${done.teams}</dd><dt>Players</dt><dd>${done.players}</dd>
            <dt>Free agents</dt><dd>${done.freeAgents||0}</dd>
            <dt>Schedule</dt><dd>${done.fixtures?done.fixtures+' games':'<span class="dim">not brought across</span>'}</dd>
            <dt>Depth charts</dt><dd>${done.depth?done.depth+' players':'<span class="dim">not brought across</span>'}</dd>

          <button class="btn pri wide" data-a="sub" data-s="price" style="margin-top:10px">Go and set the prices</button>`
        :`<ol class="muted" style="line-height:1.9;padding-left:18px;margin:0">
            <li>Your teams, owners and full rosters come over</li>
            <li>Every scoring category is copied exactly — all ${Object.keys(defaultScoring()).length} of them</li>
            <li>Your lineup, bench, IR and taxi sizes are matched</li>
            <li>Everyone arrives on a ${money(S.settings.contracts.minSalary)} one-year deal for you to price up</li>
          </ol>
          <div class="hr"></div>
          <div class="hint">Sleeper holds no contracts or salaries, so that part is yours to set — which is the whole
            reason for moving here. The player list is a five megabyte download the first time, then it is cached.</div>`}
      </div></div>
    </div>`;
    })():''}

    ${sub==='match'?(()=>{
      const m = ui.tmp.match;
      if(!m) return `<div class="panel"><div class="ph"><h3>Match a price list to your league</h3></div><div class="pb">
        <p class="muted" style="margin-top:0">This does not import anybody. It takes a list of names and prices, finds
          those players on the teams you already have, and puts the money right.</p>
        <div class="flabel" style="margin-top:14px">What the file needs</div>
        <p class="muted tiny">One row per player, a column of names, and a column of prices. A header row on top.
          Anything else in the file is ignored. If you have a column per season — headed
          <span class="num">${S.league.season}</span>, <span class="num">${S.league.season+1}</span> and so on —
          those are used instead and the contract is set year by year.</p>
        <div class="hr"></div>
        <div class="flabel">Straight from Google Sheets</div>
        <label class="f"><span>Paste the link to your sheet</span>
          <input type="text" id="sheetLink" placeholder="https://docs.google.com/spreadsheets/d/…"
            value="${esc((ui.tmp.sheet||{}).link||'')}"></label>
        <div class="grid g2">
          <label class="f"><span>Which tab <span class="dim">(the gid in the address)</span></span>
            <input type="text" id="sheetGid" placeholder="0" value="${esc((ui.tmp.sheet||{}).gid||'')}"></label>
          <div style="align-self:end"><button class="btn pri wide" data-a="sheetFetch">Fetch it</button></div>
        </div>
        <div class="hint">The sheet has to be shared — <b>Share → General access → Anyone with the link</b>, viewer is
          enough. Open the tab you want and the address ends in <span class="num">#gid=123456</span>; that number goes
          in the box. Leave it blank for the first tab.</div>
        ${(ui.tmp.sheet||{}).err?'<div class="hint bad">'+esc(ui.tmp.sheet.err)+'</div>':''}

        <div class="or" style="margin:12px 0"><span>or from a file</span></div>
        <label class="f"><span>Choose a CSV</span><input type="file" accept=".csv,.tsv,.txt" data-a="matchFile"></label>
        <div class="hint">In Sheets: click the tab you want, then <b>File → Download → Comma-separated values</b>.

        <div class="or" style="margin:12px 0"><span>or paste the rows</span></div>
        <label class="f"><textarea rows="6" id="matchPaste"
          placeholder="Player,Price&#10;Josh Allen,44&#10;Bijan Robinson,38"></textarea></label>
        <button class="btn" data-a="matchPaste">Read it</button>
        <div class="hint">Selecting cells in Sheets and copying works — it arrives tab-separated and is understood.</div>
      </div></div>`;

      const plan = pricePlan();
      /* Years shown across the preview: this season out to the last one anybody
         in the file is paid for. */
      const previewYears = (()=>{
        let last = S.league.season + 5;
        (plan? plan.rows : []).forEach(r=>{
          const end = (r.firstYear||S.league.season) + (r.years||1) - 1;
          if(end > last) last = end;
          const c = r.p.contract; if(c) { const ce = c.startYear + c.years - 1; if(ce > last) last = ce; }
        });
        const out = []; for(let y=S.league.season; y<=last; y++) out.push(y);
        return out;
      })();
      /* What a player is on today, year by year. */
      const nowFor = (p, y)=>{
        const c = p.contract; if(!c) return null;
        const i = y - c.startYear;
        return (i>=0 && i<c.years) ? fixCents(+((c.salaries||[])[i])||0) : null;
      };
      /* What the file would make him, year by year. */
      const newFor = (r, y)=>{
        const i = y - (r.firstYear||S.league.season);
        return (i>=0 && i<(r.years||0)) ? fixCents(r.built[i]) : null;
      };
      /* Different only if some year actually moves. */
      const rowDiffers = (r)=> previewYears.some(y=>{
        const a = nowFor(r.p, y), b = newFor(r, y);
        if(a==null && b==null) return false;
        if(a==null || b==null) return true;
        return Math.abs(a-b) > 0.004;
      });
      const changed = plan ? plan.rows.filter(rowDiffers) : [];
      return `
      <div class="panel" style="margin-bottom:14px"><div class="ph"><h3>Which row holds the headings</h3><div class="spacer"></div>
        <button class="btn ghost sm" data-a="matchReset">Start again</button></div>
        <div class="pb">
          <div class="scrollx" style="max-height:26vh;overflow:auto"><table><tbody>
          ${(m.grid||[]).slice(0, 12).map((row,i)=>`<tr style="${i===m.headerRow?'background:var(--ink-3)':''}">

              <button class="btn sm ${i===m.headerRow?'on':'ghost'}" data-a="matchHeaderRow" data-i="${i}">
                ${i===m.headerRow?'headings':'row '+(i+1)}</button></td>
            ${row.slice(0,10).map(c=>'<td class="tiny '+(i===m.headerRow?'':'dim')+'">'+esc(String(c||'').slice(0,28))+'</td>').join('')}
          </tr>`).join('')}
          </tbody></table></div>
          <div class="hint">Sheets often have a title or a blank line on top. Press the row that has your column names
            in it — everything above is thrown away.</div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:14px"><div class="ph"><h3>Which column is which</h3></div>
        <div class="pb grid g3">
          ${[['name','Player name'],['pos','Position <span class="dim">(optional)</span>'],
             ['price','Base salary <span class="dim">(what an even year costs)</span>'],
             ['total','Total contract <span class="dim">(checked)</span>'],
             ['years','Total contract years <span class="dim">(checked)</span>']
            ].map(([k,label])=>`<label class="f"><span>${label}</span>
            <select data-a="matchMap" data-k="${k}">
              <option value="">— none —</option>
              ${m.headers.map((h,i)=>'<option value="'+i+'"'+(m.map[k]===i?' selected':'')+'>'+
                esc(h || ('column '+(i+1)))+'</option>').join('')}
            </select>
            <span class="tiny dim" style="display:block;margin-top:3px">${esc(colTaste(m, m.map[k]))}</span></label>`).join('')}
        </div>
        <div class="pb" style="padding-top:0"><div class="hint">The grey line under each is what is actually in that
          column, so you can see at a glance whether it is the right one.</div></div>
        ${yearColumns(m.headers).length?`<div class="pb" style="padding-top:0">
          <label class="check"><input type="checkbox" data-a="matchYearCols" ${m.useYearCols?'checked':''}>
            <span>Let the season columns override the base salary for those years</span></label>
          <div class="row" style="margin-top:6px">${yearColumns(m.headers).map(c=>'<span class="chip">'+esc(c.head)+
            ' <span class="dim">→ '+c.year+'</span></span>').join('')}</div>
        </div>`:''}
      </div>

      <div class="grid g3" style="margin-bottom:14px">
        <div class="tile"><div class="k">Found in your league</div><div class="v good">${plan?plan.rows.length:0}</div>
          <div class="s">of ${m.rows.length} rows</div></div>
        <div class="tile"><div class="k">Prices that change</div><div class="v">${changed.length}</div>
          <div class="s">the rest already match</div></div>
        <div class="tile"><div class="k">Not recognised</div><div class="v ${plan&&plan.missed.length?'bad':''}">${plan?plan.missed.length:0}</div>
          <div class="s">nobody by that name</div></div>
      </div>

      <div class="panel" style="margin-bottom:14px"><div class="ph"><h3>What would change</h3><div class="spacer"></div>
        <span class="tiny dim">${changed.length} of ${plan?plan.rows.length:0} matched \u2014 only the ones that move are listed</span></div>
        <div class="pb tight scrollx" style="max-height:52vh;overflow:auto"><table>
        <thead><tr><th>In the file</th><th>Matched to</th>
          ${previewYears.map(y=>'<th class="right">'+y+'</th>').join('')}
          <th class="right">Total</th></tr></thead>
        <tbody>${changed.slice(0,400).map(r=>{
          const oldTotal = r.p.contract ? fixCents(sum((r.p.contract.salaries||[]).slice(0, r.p.contract.years))) : null;
          return `<tr>
          <td class="tiny">${esc(r.file)}</td>
          <td>${esc(r.p.name)} ${posTag(r.p.pos)}
            ${r.how!=='name'?'<span class="pill warn" title="matched on '+esc(r.how)+'">loose</span>':''}
            ${r.ambiguous?'<span class="pill live" title="more than one player fits that name">check</span>':''}
            <div class="tiny dim">${r.p.contract?esc(teamName(r.p.contract.teamId)):'free agent'}</div></td>
          ${previewYears.map(y=>{
            const a = nowFor(r.p, y), b = newFor(r, y);
            const same = (a==null&&b==null) || (a!=null&&b!=null&&Math.abs(a-b)<=0.004);
            if(a==null && b==null) return '<td class="right dim">\u2014</td>';
            if(same) return '<td class="right num dim">'+money(a)+'</td>';
            return '<td class="right num"><span class="dim" style="text-decoration:line-through">'+
              (a==null?'\u2014':money(a))+'</span><br><b class="'+((b||0)>(a||0)?'bad':'good')+'">'+
              (b==null?'\u2014':money(b))+'</b></td>';
          }).join('')}
          <td class="right num"><span class="dim">${oldTotal==null?'\u2014':money(oldTotal)}</span><br>
            <b>${money(r.want)}</b></td>
        </tr>`;}).join('') || '<tr><td colspan="'+(previewYears.length+3)+'" class="dim center" style="padding:18px">Nothing differs \u2014 the file matches your league.</td></tr>'}
        </tbody></table></div>
      </div>

      ${plan && plan.missed.length?`<div class="panel" style="margin-bottom:14px"><div class="ph">
        <h3>Not recognised</h3></div><div class="pb">
        <p class="muted tiny" style="margin-top:0">These names are in the file but nobody in your league answers to them.
          Usually a spelling difference, or somebody you do not have.</p>
        <div class="row">${plan.missed.slice(0,60).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')}

      </div></div>`:''}

          <button class="btn ghost" data-a="matchReset">Cancel</button>
        </div>

    ${sub==='load'?`<div class="grid g2">

        <textarea id="impText" data-k="imptext" placeholder="Player,Position,NFL,Fantasy Team,Salary,Years&#10;Ja'Marr Chase,WR,CIN,Prairie Wolves,64,3" style="min-height:200px">${esc(im.text)}</textarea>

        <div class="hint">CSV, TSV, or a JSON array of objects. Most sites export something close enough — Sleeper, MFL, Fleaflicker, ESPN, or a spreadsheet you keep yourself. Column names do not have to match; you line them up on the next tab.</div>
      </div></div>
      <div class="panel"><div class="ph"><h3>What comes across</h3></div><div class="pb">
        <div class="kv">
          <dt>Rows found</dt><dd>${im.rows.length||'—'}</dd>
          <dt>Columns</dt><dd>${im.headers.length||'—'}</dd>
          <dt>Teams detected</dt><dd>${im.map.team?new Set(im.rows.map(r=>r[im.headers.indexOf(im.map.team)]).filter(Boolean)).size:'—'}</dd>
        </div>
        <div class="hr"></div>
        <label class="check"><input type="checkbox" ${im.replace?'checked':''} data-a="impFlag" data-f="replace">
          <span>Replace what is here now. Uncheck to add these players to the league already loaded.</span></label>
        <div class="hint">Nothing is written until you press Import on tab 2. Your current league stays put until then.</div>
      </div></div>
    </div>`:''}

    ${sub==='map'?`
      ${(()=>{ const cols = yearColumns(im.headers);
        return cols.length ? `<div class="panel" style="margin-bottom:14px;border-color:#5C4526">
          <div class="ph"><h3>Your file has a column per season</h3></div><div class="pb">

/* A Google Sheets link, turned into something fetchable. The gviz endpoint
   answers with CSV and, unlike the download link, allows a browser to read it.
   gid is the tab: it is in the address bar when that tab is open. */
function sheetUrl(link, gid){
  const t = String(link||'').trim();
  const id = (/\/spreadsheets\/d\/(?:e\/)?([a-zA-Z0-9-_]+)/.exec(t)||[])[1];
  if(!id) return null;
  const g = String(gid==null?'':gid).trim() ||
            (/[#&?]gid=([0-9]+)/.exec(t)||[])[1] || '0';
  return {id, gid:g,
    csv:'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&gid='+encodeURIComponent(g)};
}
/* Real sheets often have a title above the headings. Find the row that looks
   most like a heading row rather than assuming it is the first. */
function guessHeaderRow(grid){
  const wanted = ['player','name','price','salary','pos','team','cap','value','aav','cost'];
  let best = 0, bestScore = -1;
  grid.slice(0, 12).forEach((row, i)=>{
    const cells = row.map(c=> String(c||'').trim().toLowerCase());
    const filled = cells.filter(Boolean).length;
    if(filled < 2) return;
    const hits = cells.filter(c=> wanted.some(w=> c.includes(w))).length;
    const numeric = cells.filter(c=> c && !isNaN(parseFloat(c))).length;
    const score = hits*3 + filled - numeric*2;   // headings are words, not numbers
    if(score > bestScore){ bestScore = score; best = i; }
  });
  return best;
}
function matchDefault(text, headerRow){
  let grid;
  const t = String(text||'').trim();
  if(t.startsWith('[') || t.startsWith('{')){
    let parsed;
    try{ parsed = parseAny(t); }catch(e){ return null; }
    grid = [parsed.headers].concat(parsed.rows||[]);
  } else {
    try{ grid = parseCSV(t); }catch(e){ return null; }
  }
  grid = (grid||[]).filter(r=> r.some(c=> String(c||'').trim()));
  if(grid.length < 2) return null;

  const hr = (headerRow==null) ? guessHeaderRow(grid) : clamp(+headerRow, 0, grid.length-2);
  return remap({grid, headerRow:hr, onlyDiff:true, mode:'aav', doFA:true});
}
/* Re-read the grid against whichever row is being treated as the headings. */
function remap(m, keepMap){
  const hr = m.headerRow;
  m.headers = (m.grid[hr]||[]).map(h=> String(h||'').trim());
  m.rows = m.grid.slice(hr+1).filter(r=> r.some(c=> String(c||'').trim()));
  const find = (...words)=>{
    for(let i=0;i<m.headers.length;i++){
      const h = m.headers[i].toLowerCase();
      if(h && words.some(w=> h.includes(w))) return i;
    }
    return null;
  };
  if(!keepMap){
    m.map = { name:find('player','name'), pos:find('pos'),
              price:find('price','salary','cap','value','aav','cost','$'),
              total:find('total contract','contract total','total value','deal total','total'),
              years:find('contract years','years left','yrs left','years','term','length') };
    // Nothing obvious in the headings? Guess from the shape of the data.
    if(m.map.name==null) m.map = Object.assign(m.map, {name:guessNameCol(m)});
    if(m.map.price==null) m.map.price = guessMoneyCol(m, m.map.name);
  }
  m.useYearCols = yearColumns(m.headers).length>0;
  return m;
}
/* The column with the most two-word text in it is almost certainly the names. */
function guessNameCol(m){
  let best=null, bestScore=0;
  const n = Math.max.apply(null, m.rows.slice(0,40).map(r=>r.length).concat([0]));
  for(let c=0;c<n;c++){
    let score=0;
    m.rows.slice(0,40).forEach(r=>{
      const v = String(r[c]||'').trim();
      if(v && isNaN(parseFloat(v)) && v.split(/\s+/).length>=2) score++;
    });
    if(score>bestScore){ bestScore=score; best=c; }
  }
  return bestScore>2 ? best : null;
}
function guessMoneyCol(m, skip){
  let best=null, bestScore=0;
  const n = Math.max.apply(null, m.rows.slice(0,40).map(r=>r.length).concat([0]));
  for(let c=0;c<n;c++){
    if(c===skip) continue;
    let score=0;
    m.rows.slice(0,40).forEach(r=>{
      const v = String(r[c]||'').replace(/[$,]/g,'').trim();
      if(v && !isNaN(parseFloat(v))) score++;
    });
    if(score>bestScore){ bestScore=score; best=c; }
  }
  return bestScore>2 ? best : null;
}
/* A few real values from a column, so nobody has to guess what they picked. */
function colTaste(m, i){
  if(i==null) return '';
  const vals = m.rows.slice(0,4).map(r=> String(r[i]||'').trim()).filter(Boolean);
  return vals.length ? vals.join(' · ') : 'nothing in it';
}

  im.rows.forEach(r=>{
    const name = get(r,'name'); if(!name) return;
    const posRaw = (get(r,'pos')||'').toUpperCase().replace(/[^A-Z/]/g,'');
    const pos = /^(QB|RB|WR|TE|K)$/.test(posRaw) ? posRaw : (/D/.test(posRaw)?'DEF':'WR');
    const teamNm = get(r,'team');
    const t = teamNm ? mk(teamNm, get(r,'owner')) : null;
    const sal = parseFloat(String(get(r,'salary')).replace(/[^0-9.\-]/g,''));
    const yrsRaw = parseInt(get(r,'years'),10);
    const years = im.yearsMode==='fixed' ? im.yearsFixed : clamp(isNaN(yrsRaw)?im.yearsFixed:yrsRaw, 1, S.settings.contracts.maxYears);
    /* A sheet may carry an annual figure, a total, or both. A mapped total wins,
       because it is the number the deal was actually written for. */
    const totRaw = parseFloat(String(get(r,'total')).replace(/[^0-9.\-]/g,''));
    const haveTotal = !isNaN(totRaw);
    let annual = haveTotal ? (totRaw/years)
      : (!isNaN(sal) ? (im.salaryIs==='total' ? sal/years : sal)
      : (im.priceMode==='flat' ? im.flat : 1));
    const p = {id:uid('p'), name, pos, nfl:(get(r,'nfl')||'').toUpperCase().slice(0,4), age:parseInt(get(r,'age'),10)||0,
      value:Math.max(1, Math.round(annual)), contract:null};
    if(t){
      const cols = im.useYearCols ? yearColumns(im.headers) : [];
      const perYear = cols.map(cc=>{
        const v = parseFloat(String(r[cc.i]==null?'':r[cc.i]).replace(/[^0-9.\-]/g,''));
        return isNaN(v) ? 0 : v;
      });
      // Trailing blanks mean the deal simply ends there.
      while(perYear.length && !perYear[perYear.length-1]) perYear.pop();
      /* Leading blanks mean the deal has not started yet. Drop them and begin at
         the first season that actually carries money, otherwise a deal running
         2027-2029 was being written as 2026-2029 with a $0 first year. */
      let lead = 0;
      while(lead < perYear.length && !perYear[lead]) lead++;
      if(lead){ perYear.splice(0, lead); }
      if(perYear.length){
        /* The season columns are the truth for those years — taken exactly as
           written. The sheet's total and years are then checked against them,
           and anything that does not reconcile is flagged rather than quietly
           adjusted. */
        const startY = cols[Math.min(lead, cols.length-1)].year;
        const yearsFromCols = perYear.length;
        const sumFromCols = fixCents(sum(perYear));
        p.contract = makeContract(t.id, sumFromCols, yearsFromCols, im.structId, startY);
        p.contract.salaries = perYear.map(v=> fixCents(v));
        p.contract.total = fixCents(sum(p.contract.salaries));
        p.contract.byYear = true;
        p.value = Math.max(1, Math.round(p.contract.total / p.contract.years));
        const notes = [];
        if(haveTotal && Math.abs(totRaw - sumFromCols) > 0.011)
          notes.push('the seasons add to '+money(sumFromCols)+' but the total column says '+money(totRaw));
        if(!isNaN(yrsRaw) && yrsRaw !== yearsFromCols)
          notes.push('the seasons cover '+yearsFromCols+' year'+(yearsFromCols===1?'':'s')+
            ' but the years column says '+yrsRaw);
        if(notes.length) flags.push({name, team:t.name, why:notes.join('; '),
          used:money(sumFromCols)+' over '+yearsFromCols+' yr from '+startY});
        exact++;
      } else {
        /* The total drives it, and the chosen shape (even, front or back loaded)
           decides how it lands across the years. */
        const dealTotal = haveTotal ? totRaw : annual*years;
        p.contract = makeContract(t.id, Math.max(0, fixCents(dealTotal)), years, im.structId, S.league.season);
      }
    }
    S.players.push(p); added++;
  });
  if(!S.league.myTeamId && S.teams[0]) { S.league.myTeamId = S.teams[0].id; S.league.commishTeamId = S.teams[0].id; }
  if(!S.picks.length) for(let y=S.league.season+1; y<=S.league.season+3; y++) for(let rd=1; rd<=4; rd++)
    S.teams.forEach(t=> S.picks.push({id:uid('pk'), year:y, round:rd, ownerTeamId:t.id, originTeamId:t.id}));
  if(im.priceMode==='target') fitToCap(im.targetPct);
  logIt('Imported '+added+' players across '+S.teams.length+' teams'+
    (exact?', '+exact+' with salaries taken year by year':'')+
    (flags.length?' — '+flags.length+' did not reconcile':''), {type:'admin'});
  ui.tmp.impFlags = flags;
  ui.sub='price'; ui.tmp.imp = impDefault(); save(true); render();
  if(flags.length) return ACT.impFlags();
  toast('Imported '+added+' players'+(exact?' — '+exact+' contracts copied exactly':''),'good');
};
function fitToCap(target){
  const y = S.league.season;
  const avg = sum(S.teams.map(t=> teamCharged(t.id,y)))/Math.max(1,S.teams.length);
  if(avg<=0) return;
  const k = (S.settings.cap.base*(target/100))/avg;
  S.players.forEach(p=>{
    if(!p.contract) return;
    p.contract = makeContract(p.contract.teamId, Math.max(1, roundInc(p.contract.total*k)), p.contract.years, p.contract.structId, p.contract.startYear);
    p.value = Math.max(1, Math.round(p.contract.total/p.contract.years));
  });
}
ACT.bulkApply = ()=>{
  const mul = parseFloat(($('#bulkmul')||{}).value), set = parseFloat(($('#bulkset')||{}).value);
  const yrs = parseInt(($('#bulkyears')||{}).value,10), st = ($('#bulkstruct')||{}).value;
  S.players.forEach(p=>{
    const c = p.contract; if(!c) return;
    let years = !isNaN(yrs) ? clamp(yrs,1,S.settings.contracts.maxYears) : c.years;
    let total = c.total;
    if(!isNaN(set)) total = set*years;
    else if(!isNaN(mul) && mul>0) total = c.total*mul;
    else if(years!==c.years) total = (c.total/c.years)*years;
    p.contract = makeContract(c.teamId, Math.max(1, roundInc(total)), years, st||c.structId, c.startYear);
    p.value = Math.max(1, Math.round(p.contract.total/p.contract.years));
  });
  save(); render(); toast('Prices updated','good');
};

/* Bring contracts across from another copy of the league WITHOUT replacing
   anything else. Loading a whole league file overwrites teams, members and
   settings; this only copies each player's deal onto the matching player here,
   so the live league keeps its rosters and everyone who has signed in. */
function normName(x){
  return String(x||'').toLowerCase().replace(/[^a-z]/g,'');
}
function mergeContractsFrom(j){
  if(!j || !Array.isArray(j.players)) throw new Error('that is not a league file');
  /* Match on id first; fall back to name + position, since ids differ between
     copies that were imported separately. */
  const byIdHere = {}, byNameHere = {};
  S.players.forEach(p=>{
    byIdHere[p.id] = p;
    byNameHere[normName(p.name)+'|'+String(p.pos||'').toUpperCase()] = p;
  });
  /* Their team names, so a contract can be pointed at the same team here. */
  const theirTeam = {};
  (j.teams||[]).forEach(t=> theirTeam[t.id] = t);
  const teamHereByName = {};
  S.teams.forEach(t=>{
    teamHereByName[normName(t.name)] = t;
    if(t.abbr) teamHereByName['abbr:'+normName(t.abbr)] = t;
  });

  let matched=0, copied=0, noPlayer=0, noTeam=0;
  (j.players||[]).forEach(src=>{
    if(!src || !src.contract) return;
    const hit = byIdHere[src.id] || byNameHere[normName(src.name)+'|'+String(src.pos||'').toUpperCase()];
    if(!hit){ noPlayer++; return; }
    matched++;
    const c = deep(src.contract);
    if(c.teamId){
      /* Point the deal at the same team in THIS league, by name. */
      const t = theirTeam[c.teamId];
      const here = t ? (teamHereByName[normName(t.name)] || teamHereByName['abbr:'+normName(t.abbr||'')]) : byId(S.teams, c.teamId);
      if(here) c.teamId = here.id;
      else { c.teamId = null; noTeam++; }     /* keep the deal, cut loose */
    }
    hit.contract = c;
    if(src.nflPractice!=null) hit.nflPractice = src.nflPractice;
    copied++;
  });
  return {matched, copied, noPlayer, noTeam};
}
/* Contracts whose years finish before the current season. They keep a correct
   total but read $0 in every year on the cap ladder, because a year only counts
   when it falls inside startYear..startYear+years-1. A sheet import produces
   these whenever its first year column is an older season. */
function staleContracts(){
  const y = S.league.season;
  const out = [];
  S.players.forEach(p=>{
    const c = p.contract;
    if(!c || !(c.years > 0)) return;
    const sal = Array.isArray(c.salaries) ? c.salaries : null;
    const paid = sal ? sum(sal.slice(0, c.years).map(v=> +v||0)) : 0;
    if((c.startYear + c.years - 1) < y){ out.push({p, why:'past'}); return; }
    /* Right years, but nothing set against them — the total is stored on its own
       so it still reads correctly while every year shows $0. */
    if(!sal || sal.length < c.years || paid <= 0){ out.push({p, why:'blank'}); return; }
  });
  return out;
}

ACT.fixStaleYearsGo = ()=>{
  const list = staleContracts(), y = S.league.season;
  let moved=0, filled=0;
  list.forEach(x=>{
    const c = x.p.contract;
    if(x.why==='past'){ c.startYear = y; moved++; }
    else {
      /* Spread the total across the years the deal actually runs. */
      c.salaries = salariesFor(c.total, c.years, c.structId);
      c.byYear = false;
      filled++;
    }
  });
  const bits = [];
  if(moved) bits.push(moved+' moved onto '+y);
  if(filled) bits.push(filled+' given year-by-year figures');
  logIt('Repaired deals showing $0 — '+bits.join(', '), {type:'admin'});
  closeModal(); save(); render();
  toast(bits.join(' · '),'good');
};

/* This app has been through a rename of its server functions. A project set up
   by an older copy has join_open()/assign_team(); a newer one has
   join_league()/redeem_code()/league_lobby(). Rather than demand everyone
   rebuild their database, call whichever is actually there. */
const RPC_MISSING = /does not exist|could not find|schema cache|not find the function/i;
async function rpcTry(list){
  let last = null;
  for(const [fn, args] of list){
    try{
      const r = await Supa.client.rpc(fn, args);
      if(r && r.error && RPC_MISSING.test(r.error.message||'')){ last = r.error; continue; }
      return r;
    }catch(e){
      if(RPC_MISSING.test(e.message||'')){ last = e; continue; }
      throw e;
    }
  }
  throw last || new Error('The server does not have the function this needs.');
}
/* Put the signed-in person into the league with no team, so the commissioner can
   see them waiting. join_open() is the open-door version older projects have. */
async function joinOpenLeague(){
  const id = Supa.cfg().leagueId;
  if(!id || !Supa.user) return false;
  try{
    const r = await rpcTry([
      ['join_open',   {p_league:id, p_label:Supa.user.email}],
      ['join_open',   {p_league:id, p_label:null}],
      ['join_league', {p_code:id, p_label:Supa.user.email}]
    ]);
    if(r && r.error) throw r.error;
    await Supa.loadMember();
    return !!Supa.member;
  }catch(e){
    S.meta.seatSelfAdd = e.message;
    return false;
  }
}
ACT.serverReport = async ()=>{
  modal('Checking the server','<div class="hint">Asking your project what it supports\u2026</div>',
    '<button class="btn ghost" data-a="closeModal">Close</button>');
  const L = [];
  const c = S.settings.supa || {};
  L.push('build: '+APP_BUILD);
  L.push('league in file: '+(HOME_LEAGUE.leagueId||'(none)'));
  L.push('league in use: '+(c.leagueId||'(none)'));
  L.push('signed in: '+(Supa.user? (Supa.user.email||'yes') : 'no'));
  L.push('my member row: '+(Supa.member? ('team='+(Supa.member.team_id||'none')+' role='+(Supa.member.role||'?')) : 'NONE'));
  if(!Supa.client){ L.push('not connected'); }
  else {
    /* Reading the league row proves the id and the security rules. */
    try{
      const r = await Supa.client.from('leagues').select('id').eq('id', c.leagueId).maybeSingle();
      L.push('read league row: '+(r.error? 'ERROR '+r.error.message : (r.data? 'yes' : 'not visible')));
    }catch(e){ L.push('read league row: ERROR '+e.message); }
    /* Which server functions exist. A "does not exist" here is the answer when
       people cannot join: the database was built by a different version. */
    const probes = [
      ['league_lobby',   {p_code:'x'}],
      ['join_league',    {p_code:'x', p_label:'x'}],
      ['join_open',      {p_league:c.leagueId, p_label:'x'}],
      ['redeem_code',    {p_code:'x'}],
      ['set_member',     {p_league:c.leagueId, p_user:'00000000-0000-0000-0000-000000000000', p_team:null, p_role:'owner'}],
      ['assign_team',    {p_league:c.leagueId, p_user:'00000000-0000-0000-0000-000000000000', p_team:null}],
      ['league_roster',  {p_league:c.leagueId}]
    ];
    for(const [fn,args] of probes){
      try{
        const r = await Supa.client.rpc(fn, args);
        const msg = r.error ? r.error.message : '';
        if(/does not exist|could not find|schema cache/i.test(msg)) L.push('fn '+fn+': MISSING');
        else L.push('fn '+fn+': present'+(msg? ' ('+msg.slice(0,40)+')':''));
      }catch(e){
        L.push('fn '+fn+': '+(/does not exist|could not find/i.test(e.message)?'MISSING':'error '+e.message.slice(0,40)));
      }
    }
  }

    '<pre class="num" id="srvReport" style="white-space:pre-wrap;word-break:break-all;background:#0F1B24;'+
    'border:1px solid #22384A;border-radius:8px;padding:10px;font-size:12px">'+esc(txt)+'</pre>'+
    '<div class="hint">Send this to your commissioner \u2014 it says exactly what the server does and does not have.</div>',

/* The link carries the project, the key, the league and the code, so opening it
   on a phone that has never seen this app lands straight on the sign-up screen
   with the code already in the box. The key is public by design. */
/* btoa refuses anything above Latin-1, and league and team names are typed by
   people — one curly quote and the whole invitation would fail to build. */
function packBundle(o){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
  catch(e){ return ''; }
}
function unpackBundle(str){
  try{ return JSON.parse(decodeURIComponent(escape(atob(str)))); }
  catch(e){ try{ return JSON.parse(atob(str)); }catch(e2){ return null; } }
}
/* Why a link cannot be built, in words, rather than an empty string that the
   caller quietly papers over. */
function inviteLinkProblem(){
  const cfg = Supa.cfg();
  const loc = (typeof location==='object' && location) ? location : {};
  const here = (typeof loc.origin==='string' && loc.origin!=='null' ? loc.origin : '');
  if(!here) return 'This copy of the app is not being served from a web address, so there is no link to give out. Put it on the web first.';
  if(!cfg.url || !cfg.anonKey) return 'The league is not connected to its server yet — fill in Settings › Server.';
  if(!cfg.leagueId) return 'This league has not been created on the server yet — do that under Settings › Server.';
  return '';
}
function inviteLink(code, teamId){
  if(inviteLinkProblem()) return '';
  const cfg = Supa.cfg();
  const loc = location;
  const here = loc.origin + (typeof loc.pathname==='string' ? loc.pathname : '');
  const inv = code ? (Supa.invites||[]).find(x=> x.code===code) : null;
  const tid = teamId || (inv && inv.team_id) || '';
  const bundle = packBundle({c:code||'', u:cfg.url, k:cfg.anonKey, l:cfg.leagueId, n:S.league.name,
    t: tid ? teamName(tid) : '', ti: tid || ''});
  return bundle ? here + '#invite=' + encodeURIComponent(bundle) : '';
}

/* An id that exists on the page and again inside a modal resolves to the page
   one, because that is what comes first in the document — so a box the person
   is looking at gets ignored in favour of an empty one behind it. Always read
   through here: the modal wins when it is open. */
function boxVal(id){
  const inModal = $('#modalBox [id="'+id+'"]');
  const el = inModal || $('#'+id);
  return el ? String(el.value==null?'':el.value) : '';
}
/* Keep the digits and a leading +, throw away whatever else people type —
   brackets, dashes, spaces, dots. Nothing here judges whether the result is a
   real number: country formats vary more than any rule of thumb survives, and
   being told a correct number is wrong is worse than the messages app opening
   on a wrong one. If there are digits, we hand it over. */
function tidyPhone(v){
  const raw = String(v||'').trim();
  const plus = raw.charAt(0)==='+';
  const digits = raw.replace(/\D/g,'');
  return digits ? (plus?'+':'')+digits : '';
}
function hasPhone(v){ return !!tidyPhone(v); }
/* iOS wants the body after &, Android after ?. Getting it wrong opens the
   Messages app with the number and an empty message, which looks like the
   feature is broken when it is only punctuation. */
function smsHref(number, body){
  const ua = String((navigator||{}).userAgent||'');
  const apple = /iPhone|iPad|iPod|Macintosh/i.test(ua);
  return 'sms:'+tidyPhone(number)+(apple?'&':'?')+'body='+encodeURIComponent(body);
}
/* A text is not an email. Long bodies get cut off by some handlers, and the
   link is the only part that actually matters. */
function inviteSms(c){
  const link = inviteLink(c.code, c.team);

/* One link for the whole league. Whoever opens it picks a team, says the
   password, makes an account, and is in — no per-person codes to hand out. */
function lobbyLink(){
  const c = Supa.cfg();
  if(!c.url || !c.anonKey || !c.leagueId) return '';
  const bundle = packBundle({u:c.url, k:c.anonKey, l:c.leagueId, n:S.league.name});
  const loc = (typeof location==='object' && location) ? location : {};
  const here = (typeof loc.origin==='string' && loc.origin!=='null' ? loc.origin : '') +
               (typeof loc.pathname==='string' ? loc.pathname : '');
  return here + '#lobby=' + encodeURIComponent(bundle);
}

ACT.jGo = async ()=>{
  const j = ui.tmp.join2 = ui.tmp.join2 || {};
  j.code = String(($('#jCode')||{}).value || j.code || '').trim().toUpperCase();
  j.user = String(($('#jUser')||{}).value || j.user || '').trim();
  j.pw   = String(($('#jPw')||{}).value || j.pw || '');
  j.err = null;

  if(!j.code) { j.err='Put in the code you were sent.'; return joinModal2(); }
  if(!/.+@.+\..+/.test(j.user)) { j.err='That does not look like an email address.'; return joinModal2(); }
  if(j.pw.length < 6) { j.err='Six characters or more for the password.'; return joinModal2(); }

  if(!Supa.client) await Supa.init(true);
  if(!Supa.client){ j.err='Could not reach the league. Try again in a moment.'; return joinModal2(); }

  const email = j.user.toLowerCase();
  try{
    if(!Supa.user){
      let r;
      if(j.mode==='old'){
        r = await signInTolerant(email, j.pw);
        if(r.error) throw new Error(/Invalid login/i.test(r.error.message)
          ? badLoginHelp(email, j.pw) : r.error.message);
      } else {
        r = await Supa.client.auth.signUp({email, password:j.pw});
        if(r.error && /already|registered/i.test(r.error.message)){
          r = await Supa.client.auth.signInWithPassword({email, password:j.pw});
          if(r.error) throw new Error('There is already an account on that email. '+
            'Switch to "I already have one" and use its password.');
        } else if(r.error) throw r.error;
        if(!r.data.session){
          j.err = 'Your commissioner needs to switch off "Confirm email" in Supabase under '+
                  'Authentication → Sign In / Providers → Email. Then try this again.';
          return joinModal2();
        }
      }
      Supa.user = (r.data.session && r.data.session.user) || r.data.user || null;
    }
    const {data, error} = await rpcTry([['redeem_code',{p_code:j.code, p_label:null}],
                                        ['join_league',{p_code:j.code, p_label:(Supa.user||{}).email||null}],
                                        ['join_open',{p_league:Supa.cfg().leagueId, p_label:(Supa.user||{}).email||null}]]);
    if(error) throw error;

    S.settings.supa.leagueId = data.league_id;
    S.settings.supa.on = true;
    save(true);
    await Supa.loadMember();
    await Supa.pull(true);
    if(Supa.member && Supa.member.team_id){ S.league.myTeamId = Supa.member.team_id; Store.set(KEY, S); }
    Supa.listen();
    j.done = true;
    j.leagueName = data.league_name || S.league.name;
    j.teamName = data.team_id ? teamName(data.team_id) : '';
    j.who = email;
    joinModal2(); render();
  }catch(e){
    j.err = e.message;
    joinModal2();
  }
};

/* ============================================================
   INVITING PEOPLE
   A link carries the address and the league code so nobody has to retype
   them. The password never goes in it — that gets sent separately, or it is
   not really a password.
   ============================================================ */
function joinLink(){
  const c = S.settings.sync;
  if(!c.url || !c.leagueId) return '';
  const payload = btoa(JSON.stringify({u:c.url, l:c.leagueId, n:S.league.name}));
  const loc = (typeof location==='object' && location) ? location : {};
  const here = (typeof loc.origin==='string' ? loc.origin : '') +
               (typeof loc.pathname==='string' ? loc.pathname : '');
  return (here || (typeof loc.href==='string' ? loc.href.split('#')[0] : '')) +
         '#join=' + encodeURIComponent(payload);
}
function readJoinLink(){
  const m = /[#&]join=([^&]+)/.exec(location.hash || '');
  if(!m) return null;
  try{ return JSON.parse(atob(decodeURIComponent(m[1]))); }catch(e){ return null; }
}

ACT.rollSeasonGo = ()=>{
  keepBackup(S, 'before rolling the season over');
  foldWeekIntoSeason(); foldWeekIntoDvp();
  const old = S.league.season;
  S.history = S.history || {};
  S.history[old] = (S.season||{}).byPlayer || {};
  if(S.settings.cap.rollover.on){
    S.teams.forEach(t=>{
      const amt = rolloverInto(t.id, old+1);
      if(amt>0){ t.adj = t.adj||[]; t.adj.push({year:old+1, amount:-amt, note:'Rolled over from '+old}); }
    });
  }
  S.league.season = old+1;
  clearCapCache(); dppCache = null;
  let dropped = 0, tagged = 0;
  S.players.forEach(p=>{
    if(!p.contract) return;
    if(p.contract.waiver && S.settings.waivers.clearAtRollover){ p.lastTeam = p.contract.teamId; p.contract=null; dropped++; return; }
    if(!p.contract.teamId){
      // Cut free and never picked up — the deal simply lapses.
      p.lastTeam = p.contract.freedBy || null;
      p.contract = null; dropped++;
      return;
    }
    if(p.contract.startYear + p.contract.years <= S.league.season){
      if(p.tag && p.tag.year===S.league.season){
        p.contract = makeContract(p.tag.byTeam, p.tag.price, 1, S.settings.contracts.defaultStruct, S.league.season);
        p.contract.tagged = true;
        tagged++;
        return;
      }
      p.lastTeam = p.contract.teamId; p.lastAav = fixInc(p.contract.total / Math.max(1,p.contract.years));
      p.contract=null; dropped++;
    }
  });
  S.players.forEach(p=>{ if(p.age) p.age++; });
  S.teams.forEach(t=>{ t.dues.paid=false; t.dues.paidOn=null; });
  S.season = {year:S.league.season, byPlayer:{}};
  S.dvp = {};
  S.bbd = {status:'idle', round:1, clock:null, bids:[], rounds:[]};
  S.taxiClaims = [];
  (S.pending||[]).forEach(q=>{ if(q.status==='open') applyTerms(q, true); });
  S.pending = [];
  S.teams.forEach(t=>{ t.record = {w:0,l:0,t:0,pf:0,pa:0}; t.eff = {weeks:0,got:0,best:0}; t.phantomW = 0; });
  S.h2h = {}; S.schedule = []; S.lineups = {};
  S.bracketResults = {playoff:{}, loser:{}};
  S.settings.rookie.baseSeason = S.settings.rookie.baseSeason || S.league.season;
  S.players.forEach(p=>{ if(p.ir){ delete p.ir; if(playerSlot(p)==='ir') p.slot='active'; } });
  S.teams.forEach(t=>{ if(S.settings.fa.resetEachSeason) t.faSpent = 0; });
  S.live = {week:1, games:[], stats:{}, feed:[], matchups:[], talk:[], lastTick:0};
  S.auctions = S.auctions.filter(a=> a.status==='open'||a.status==='running');
  S.faAuctions = [];
  if(S.settings.waivers.deadline) S.settings.waivers.deadline = String(S.league.season)+S.settings.waivers.deadline.slice(4);
  if(S.settings.dues.dueDate) S.settings.dues.dueDate = String(S.league.season)+S.settings.dues.dueDate.slice(4);
  for(let r=1;r<=4;r++) S.teams.forEach(t=> S.picks.push({id:uid('pk'), year:S.league.season+3, round:r, ownerTeamId:t.id, originTeamId:t.id}));
  S.picks = S.picks.filter(k=> k.year > S.league.season - 1);
  S.tagOffers = [];
  S.players.forEach(p=>{ if(p.tag && p.tag.year < S.league.season) delete p.tag; });
  logIt('Season rolled over to '+S.league.season+' — '+dropped+' contracts expired'+
    (tagged?', '+tagged+' held on the franchise tag':''), {type:'admin'});
  notify('New season', S.league.season+' is open. '+dropped+' players are back in the pool.','good');
  buildWeek(1);
  closeModal(); save(true); go('dash'); toast(S.league.season+' is live','good');
};
