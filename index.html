ACT.impCommit = ()=>{
  const im = ui.tmp.imp, H = im.headers, get = (r,k)=> im.map[k] ? String(r[H.indexOf(im.map[k])]||'').trim() : '';
  if(!im.map.name) return toast('Point at the column with player names','bad');
  if(im.replace){
    S.teams=[]; S.players=[]; S.picks=[]; S.auctions=[]; S.trades=[]; S.live={week:1,games:[],stats:{},feed:[],matchups:[],lastTick:0};
  }
  const teamByName = {};
  S.teams.forEach(t=> teamByName[t.name.toLowerCase()] = t);
  const mk = (nm, owner)=>{
    const key = nm.toLowerCase();
    if(teamByName[key]) return teamByName[key];
    const t = {id:uid('t'), name:nm, abbr:nm.slice(0,3).toUpperCase(), owner:owner||'', email:'', dead:[], adj:[],
      dues:{paid:false, paidOn:null, amount:null, method:'', note:''}};
    S.teams.push(t); teamByName[key]=t; return t;
  };
  let added=0;
  let exact = 0;
  im.rows.forEach(r=>{
    const name = get(r,'name'); if(!name) return;
    const posRaw = (get(r,'pos')||'').toUpperCase().replace(/[^A-Z/]/g,'');
    const pos = /^(QB|RB|WR|TE|K)$/.test(posRaw) ? posRaw : (/D/.test(posRaw)?'DEF':'WR');
    const teamNm = get(r,'team');
    const t = teamNm ? mk(teamNm, get(r,'owner')) : null;
    const sal = parseFloat(String(get(r,'salary')).replace(/[^0-9.\-]/g,''));
    const yrsRaw = parseInt(get(r,'years'),10);
    const years = im.yearsMode==='fixed' ? im.yearsFixed : clamp(isNaN(yrsRaw)?im.yearsFixed:yrsRaw, 1, S.settings.contracts.maxYears);
    let annual = !isNaN(sal) ? (im.salaryIs==='total' ? sal/years : sal) : (im.priceMode==='flat' ? im.flat : 1);
    const p = {id:uid('p'), name, pos, nfl:(get(r,'nfl')||'').toUpperCase().slice(0,4), age:parseInt(get(r,'age'),10)||0,
      value:Math.max(1, Math.round(annual)), contract:null};
    if(t){
      const cols = im.useYearCols ? yearColumns(im.headers) : [];
      const perYear = cols.map(cc=>{
        const v = parseFloat(String(r[cc.i]==null?'':r[cc.i]).replace(/[^0-9.\-]/g,''));
        return isNaN(v) ? 0 : v;
      });
      // Trailing blanks mean the deal simply ends there.
      while(perYear.length && !perYear[perYear.length-1]) perYear.pop();
      if(perYear.length){
        const startY = cols[0].year;
        p.contract = makeContract(t.id, Math.max(1, roundInc(sum(perYear))), perYear.length, im.structId, startY);
        p.contract.salaries = perYear.map(v=> roundInc(v));
        p.contract.total = fixInc(sum(p.contract.salaries));
        p.contract.byYear = true;
        p.value = Math.max(1, Math.round(p.contract.total / p.contract.years));
        exact++;
      } else {
        p.contract = makeContract(t.id, Math.max(1, roundInc(annual*years)), years, im.structId, S.league.season);
      }
    }
    S.players.push(p); added++;
  });
  if(!S.league.myTeamId && S.teams[0]) { S.league.myTeamId = S.teams[0].id; S.league.commishTeamId = S.teams[0].id; }
  if(!S.picks.length) for(let y=S.league.season+1; y<=S.league.season+3; y++) for(let rd=1; rd<=4; rd++)
    S.teams.forEach(t=> S.picks.push({id:uid('pk'), year:y, round:rd, ownerTeamId:t.id, originTeamId:t.id}));
  if(im.priceMode==='target') fitToCap(im.targetPct);
  logIt('Imported '+added+' players across '+S.teams.length+' teams'+
    (exact?', '+exact+' with salaries taken year by year':''), {type:'admin'});
  ui.sub='price'; ui.tmp.imp = impDefault(); save(true); render();
  toast('Imported '+added+' players'+(exact?' — '+exact+' contracts copied exactly':''),'good');
};
function fitToCap(target){
  const y = S.league.season;
  const avg = sum(S.teams.map(t=> teamCommitted(t.id,y)))/Math.max(1,S.teams.length);
  if(avg<=0) return;
  const k = (S.settings.cap.base*(target/100))/avg;
  S.players.forEach(p=>{
    if(!p.contract) return;
    p.contract = makeContract(p.contract.teamId, Math.max(1, roundInc(p.contract.total*k)), p.contract.years, p.contract.structId, p.contract.startYear);
    p.value = Math.max(1, Math.round(p.contract.total/p.contract.years));
  });
}
ACT.bulkApply = ()=>{
  const mul = parseFloat(($('#bulkmul')||{}).value), set = parseFloat(($('#bulkset')||{}).value);
  const yrs = parseInt(($('#bulkyears')||{}).value,10), st = ($('#bulkstruct')||{}).value;
  S.players.forEach(p=>{
    const c = p.contract; if(!c) return;
    let years = !isNaN(yrs) ? clamp(yrs,1,S.settings.contracts.maxYears) : c.years;
    let total = c.total;
    if(!isNaN(set)) total = set*years;
    else if(!isNaN(mul) && mul>0) total = c.total*mul;
    else if(years!==c.years) total = (c.total/c.years)*years;
    p.contract = makeContract(c.teamId, Math.max(1, roundInc(total)), years, st||c.structId, c.startYear);
    p.value = Math.max(1, Math.round(p.contract.total/p.contract.years));
  });
  save(); render(); toast('Prices updated','good');
};
ACT.fitCap = ()=>{ fitToCap(80); save(); render(); toast('Scaled to 80% of the cap','good'); };

document.addEventListener('change', e=>{
  const p = e.target.closest('[data-a="pvLen"]'); if(p){ ui.tmp.pvLen = +p.value; render(); }
  const t = e.target.closest('[data-a="teamField"]');
  if(t){ const tm=byId(S.teams,t.dataset.id); if(tm){ tm[t.dataset.f]=t.value; save(); } }
  const lp = e.target.closest('[data-a="ladderPos"]');
  if(lp){ ui.tmp.ladPos = lp.value; render(); return; }
  const sa = e.target.closest('[data-a="slotAdd"]');
  if(sa && sa.value){
    const t = SLOT_TYPES[sa.value];
    S.settings.roster.slots.push({id:uid('s'), code:sa.value, label:t.label, count:1, eligible:t.eligible.slice()});
    save(); render(); return;
  }
  const s = e.target.closest('[data-a="slotField"]');
  if(s){
    const sl = S.settings.roster.slots[+s.dataset.i]; if(!sl) return;
    if(s.dataset.f==='count') sl.count = clamp(+s.value||0,0,10);
    else if(s.dataset.f==='eligible') sl.eligible = s.value.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
    else sl.label = s.value;
    save(); render();
  }
  const st = e.target.closest('[data-a="structField"]');
  if(st){
    const S2 = S.settings.contracts.structures[+st.dataset.i]; if(!S2) return;
    if(st.dataset.f==='ratio') S2.ratio = clamp(parseFloat(st.value)||1, 1, 3);
    else if(st.dataset.f==='mode'){ S2.mode = st.value; if(st.value==='even') S2.ratio=1; }
    else S2.name = st.value;
    save(); render();
  }
  const ov = e.target.closest('[data-a="ovField"]');
  if(ov){
    const s2 = S.settings.contracts.structures[+ov.dataset.i], len = +ov.dataset.len;
    s2.overrides = s2.overrides || {};
    if(!s2.overrides[len]) s2.overrides[len] = structPct(s2, len).map(x=>Math.round(x*10)/10);
    s2.overrides[len][+ov.dataset.y] = Math.max(0, parseFloat(ov.value)||0);
    save(); render();
  }
});

ACT.ovNorm = (d)=>{
  const s = S.settings.contracts.structures[+d.i], len=+d.len;

   A link carries the address and the league code so nobody has to retype
   them. The password never goes in it — that gets sent separately, or it is
   not really a password.

function joinLink(){
  const c = S.settings.sync;
  if(!c.url || !c.leagueId) return '';
  const payload = btoa(JSON.stringify({u:c.url, l:c.leagueId, n:S.league.name}));
  const loc = (typeof location==='object' && location) ? location : {};
  const here = (typeof loc.origin==='string' ? loc.origin : '') +
               (typeof loc.pathname==='string' ? loc.pathname : '');
  return (here || (typeof loc.href==='string' ? loc.href.split('#')[0] : '')) +
         '#join=' + encodeURIComponent(payload);
}
function readJoinLink(){
  const m = /[#&]join=([^&]+)/.exec(location.hash || '');
  if(!m) return null;
  try{ return JSON.parse(atob(decodeURIComponent(m[1]))); }catch(e){ return null; }
}

  const text = 'Join the '+S.league.name+' front office.\n\n'+

    '2. Type in the league password I sent you separately.\n'+
    '3. Pick your team from the list.\n\n'+
    'Everything else is already filled in.';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> toast('Invitation copied','good'),
      ()=> toast('Could not copy — select it by hand','bad'));
  } else toast('Select the text and copy it by hand');
};

ACT.rollSeasonGo = ()=>{
  foldWeekIntoSeason(); foldWeekIntoDvp();
  const old = S.league.season;
  S.history = S.history || {};
  S.history[old] = (S.season||{}).byPlayer || {};
  if(S.settings.cap.rollover.on){
    S.teams.forEach(t=>{
      const amt = rolloverInto(t.id, old+1);
      if(amt>0){ t.adj = t.adj||[]; t.adj.push({year:old+1, amount:-amt, note:'Rolled over from '+old}); }
    });
  }
  S.league.season = old+1;
  clearCapCache(); dppCache = null;
  let dropped = 0, tagged = 0;
  S.players.forEach(p=>{
    if(!p.contract) return;
    if(p.contract.waiver && S.settings.waivers.clearAtRollover){ p.lastTeam = p.contract.teamId; p.contract=null; dropped++; return; }
    if(p.contract.startYear + p.contract.years <= S.league.season){
      if(p.tag && p.tag.year===S.league.season){
        p.contract = makeContract(p.tag.byTeam, p.tag.price, 1, S.settings.contracts.defaultStruct, S.league.season);
        p.contract.tagged = true;
        tagged++;
        return;
      }
      p.lastTeam = p.contract.teamId; p.lastAav = fixInc(p.contract.total / Math.max(1,p.contract.years));
      p.contract=null; dropped++;
    }
  });
  S.players.forEach(p=>{ if(p.age) p.age++; });
  S.teams.forEach(t=>{ t.dues.paid=false; t.dues.paidOn=null; });
  S.season = {year:S.league.season, byPlayer:{}};
  S.dvp = {};
  S.bbd = {status:'idle', round:1, clock:null, bids:[], rounds:[]};
  S.taxiClaims = [];
  (S.pending||[]).forEach(q=>{ if(q.status==='open') applyTerms(q, true); });
  S.pending = [];
  S.teams.forEach(t=>{ t.record = {w:0,l:0,t:0,pf:0,pa:0}; t.eff = {weeks:0,got:0,best:0}; });
  S.h2h = {}; S.schedule = []; S.lineups = {};
  S.settings.rookie.baseSeason = S.settings.rookie.baseSeason || S.league.season;
  S.players.forEach(p=>{ if(p.ir){ delete p.ir; if(playerSlot(p)==='ir') p.slot='active'; } });
  S.teams.forEach(t=>{ if(S.settings.fa.resetEachSeason) t.faSpent = 0; });
  S.live = {week:1, games:[], stats:{}, feed:[], matchups:[], talk:[], lastTick:0};
  S.auctions = S.auctions.filter(a=> a.status==='open'||a.status==='running');
  S.faAuctions = [];
  if(S.settings.waivers.deadline) S.settings.waivers.deadline = String(S.league.season)+S.settings.waivers.deadline.slice(4);
  if(S.settings.dues.dueDate) S.settings.dues.dueDate = String(S.league.season)+S.settings.dues.dueDate.slice(4);
  for(let r=1;r<=4;r++) S.teams.forEach(t=> S.picks.push({id:uid('pk'), year:S.league.season+3, round:r, ownerTeamId:t.id, originTeamId:t.id}));
  S.picks = S.picks.filter(k=> k.year > S.league.season - 1);
  S.tagOffers = [];
  S.players.forEach(p=>{ if(p.tag && p.tag.year < S.league.season) delete p.tag; });
  logIt('Season rolled over to '+S.league.season+' — '+dropped+' contracts expired'+
    (tagged?', '+tagged+' held on the franchise tag':''), {type:'admin'});
  notify('New season', S.league.season+' is open. '+dropped+' players are back in the pool.','good');
  buildWeek(1);
  closeModal(); save(true); go('dash'); toast(S.league.season+' is live','good');
};

/* ============================================================
   SYNC — one shared league on a server everyone can reach
   Contract (see server/worker.js):
     GET  {url}/league/{id}            -> { rev, state }
     PUT  {url}/league/{id}            -> { rev } | 409 { rev, state }
     GET  {url}/stats?week=N           -> { games, stats }  (normalised)
   ============================================================ */
const Sync = {
  status:'off', msg:'', busy:false, lastPull:0, lastPush:0, pending:false,
  cfg(){ return S.settings.sync || (S.settings.sync={on:false,url:'',leagueId:'',key:'',everySec:20}); },
  base(){ return String(this.cfg().url||'').replace(/\/+$/,''); },
  ready(){ const c=this.cfg(); return !!(c.on && this.base() && c.leagueId); },
  url(){ return this.base()+'/league/'+encodeURIComponent(this.cfg().leagueId); },
  head(){ const h={'content-type':'application/json'}; if(this.cfg().key) h['x-league-key']=this.cfg().key; return h; },
  set(st,msg){ this.status=st; this.msg=msg||''; if(route==='settings' && ui.sub==='server') render(); else renderShell(); },
  async pull(loud){
    if(!this.ready() || this.busy) return;
    this.busy=true;
    try{
      const r = await fetch(this.url(), {headers:this.head()});
      if(!r.ok) throw new Error('server said '+r.status);
      const j = await r.json();
      this.lastPull = Date.now();
      if(j && j.state && (+j.rev||0) > (+S.rev||0)){
        adoptRemote(j.state, +j.rev||0);
        this.set('ok','Pulled revision '+j.rev);
        render(); toast('League updated from the server','good');
      } else {
        this.set('ok', j && j.state ? 'Up to date' : 'No league on the server yet');
        if(loud) toast(j && j.state ? 'Already up to date' : 'Nothing on the server yet — push to create it');
      }
    }catch(e){ this.set('bad', e.message); if(loud) toast('Pull failed — '+e.message,'bad'); }
    this.busy=false;
  },
  async push(loud){
    if(!this.ready()){ if(loud) toast('Fill in the server address and league code first','bad'); return; }
    if(this.busy){ this.pending=true; return; }
    this.busy=true;
    try{
      const body = JSON.stringify({rev:+S.rev||0, state:S});
      const r = await fetch(this.url(), {method:'PUT', headers:this.head(), body});
      const j = await r.json().catch(()=>({}));
      if(r.status===409){
        adoptRemote(j.state, +j.rev||0);
        this.set('warn','Someone saved first — took their copy');
        render(); toast('Someone else saved first. Their version is loaded, redo your change.','bad');
      } else if(!r.ok){ throw new Error(j.error || ('server said '+r.status)); }
      else { S.rev = +j.rev||((+S.rev||0)+1); this.lastPush=Date.now(); this.set('ok','Saved revision '+S.rev); if(loud) toast('Pushed to the server','good'); }
    }catch(e){ this.set('bad', e.message); if(loud) toast('Push failed — '+e.message,'bad'); }
    this.busy=false;
    if(this.pending){ this.pending=false; setTimeout(()=>this.push(), 300); }
  }
};
/* The server holds the league; the seat at the table is local to each device. */
/* Everything about *how this device connects* is local and must survive a pull.
   Adopting somebody else's copy of those would wipe the league code off this
   phone, and then there would be nothing to pull next time it opened. */
function adoptRemote(state, rev){
  const keepSync = deep(S.settings.sync||{});
  const keepSupa = deep(S.settings.supa||{});
  const keepLive = deep(S.settings.live||{});
  const keepMe   = S.league.myTeamId;
  S = migrate(state);
  S.rev = rev;
  S.settings.sync = keepSync;
  if(keepSupa && (keepSupa.url || keepSupa.leagueId)) S.settings.supa = keepSupa;
  S.settings.live = Object.assign({}, S.settings.live, keepLive);
  if(keepMe && byId(S.teams, keepMe)) S.league.myTeamId = keepMe;
  Store.set(KEY, S);
}
let pushT=null;
function syncPush(){
  if(!Sync.ready()) return;
  clearTimeout(pushT);
  pushT = setTimeout(()=> Sync.push(), 1200);
}
ACT.syncPull = ()=> Sync.pull(true);
ACT.syncPush = ()=> Sync.push(true);

/* ============================================================
   SUPABASE — real accounts, and a database that enforces the rules
   The shared-password server trusts whoever holds the password. This does
   not: you sign in, the database knows which team is yours, and it refuses
   writes it should not accept rather than hoping the app asked nicely.
   ============================================================ */
const Supa = {
  client:null, user:null, member:null, roster:[], status:'off', msg:'',
  busy:false, pending:false, channel:null, lastPush:0, booting:false,

  cfg(){ return S.settings.supa || (S.settings.supa = {on:false, url:'', anonKey:'', leagueId:''}); },
  configured(){ const c=this.cfg(); return !!(c.on && c.url && c.anonKey); },
  ready(){ return !!(this.client && this.user && this.cfg().leagueId); },
  seated(){ return this.ready() && this.member && this.member.team_id; },
  boss(){ return !!(this.member && this.member.role==='commish'); },
  set(st,msg){ this.status=st; this.msg=msg||''; renderShell(); },

  async init(loud){
    const c = this.cfg();
    if(!this.configured()) return false;
    if(this.client) return true;
    if(this.booting) return false;
    this.booting = true;
    try{
      const mod = await import('https://esm.sh/@supabase/supabase-js@2');
      this.client = mod.createClient(c.url.replace(/\/+$/,''), c.anonKey, {
        auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
      });
      const {data} = await this.client.auth.getSession();
      this.user = (data && data.session && data.session.user) || null;
      this.client.auth.onAuthStateChange((_e, sess)=>{
        this.user = sess ? sess.user : null;
        if(this.user) this.afterSignIn(); else { this.member=null; this.roster=[]; render(); }
      });
      this.set(this.user?'ok':'warn', this.user?('Signed in as '+this.user.email):'Not signed in');
      if(this.user) await this.afterSignIn();
      this.booting = false;
      return true;
    }catch(e){
      this.booting = false;
      this.set('bad','Could not load the Supabase client — '+e.message);
      if(loud) toast('Could not reach Supabase — '+e.message,'bad');
      return false;
    }
  },

  async afterSignIn(){
    await this.loadMember();
    if(this.cfg().leagueId){ await this.pull(); this.listen(); }
    render();
  },

  async loadMember(){
    const c = this.cfg();
    if(!this.client || !this.user || !c.leagueId){ this.member=null; return; }
    try{
      const {data, error} = await this.client
        .from('league_members').select('*')
        .eq('league_id', c.leagueId).eq('user_id', this.user.id).maybeSingle();
      if(error) throw error;
      this.member = data || null;
      if(this.member && this.member.team_id){
        S.league.myTeamId = this.member.team_id;   // your seat travels with your account
      }
      await this.loadRoster();
    }catch(e){ this.set('bad', e.message); }
  },

  async loadRoster(){
    try{
      const {data, error} = await this.client.rpc('league_roster', {p_league:this.cfg().leagueId});
      if(!error) this.roster = data || [];
    }catch(e){ /* a non-member simply sees nobody */ }
  },

  /* Where Supabase should send them back to. It has to be on the allow-list in
     the project, or the sign-in is refused before an email is ever sent. */
  redirectUrl(){
    const o = (typeof location==='object' && location) ? location : {};
    const origin = typeof o.origin==='string' ? o.origin : '';
    if(!origin || origin==='null') return '';        // opened from a file, not a site
    return origin + (typeof o.pathname==='string' ? o.pathname : '');
  },
  /* Ask the project itself what is wrong, rather than reading tea leaves in an
     error message. Each step reports separately so the failing one is obvious. */
  async diagnose(){
    const c = this.cfg();
    const out = [];
    const url = String(c.url||'').trim().replace(/\/+$/,'');
    const key = String(c.anonKey||'').trim();

    // 1. does the address even look like a project API endpoint
    if(!url) out.push({ok:false, t:'Project URL', m:'Nothing filled in.'});
    else if(/supabase\.com\/dashboard|\/project\//.test(url))
      out.push({ok:false, t:'Project URL', m:'That is the dashboard address, not the API one. '+
        'You want the short one that looks like https://abcdefgh.supabase.co — it is on Settings › Data API, '+
        'or behind the Connect button.'});
    else if(!/^https:\/\//.test(url))
      out.push({ok:false, t:'Project URL', m:'It has to start with https://'});
    else if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in|red)$/i.test(url) && !/^https:\/\/[^\/]+$/.test(url))
      out.push({ok:false, t:'Project URL', m:'There is a path on the end. It should stop after the host: '+url.split('/').slice(0,3).join('/')});
    else out.push({ok:true, t:'Project URL', m:url});

    // 2. is anything actually listening there
    if(url && /^https:\/\//.test(url)){
      try{
        const r = await fetch(url+'/auth/v1/health', {headers:{apikey:key}});
        const txt = await r.text();
        if(r.ok) out.push({ok:true, t:'Reaching the project', m:'Answered — '+txt.slice(0,80)});
        else out.push({ok:false, t:'Reaching the project',
          m:'Answered '+r.status+' — '+txt.slice(0,120)+
            (r.status===404?' · that usually means the address is not a Supabase project':'')});
      }catch(e){ out.push({ok:false, t:'Reaching the project', m:'Could not reach it at all — '+e.message}); }
    }

    // 3. does the key work
    if(url && key){
      try{
        const r = await fetch(url+'/rest/v1/', {headers:{apikey:key, Authorization:'Bearer '+key}});
        if(r.status===401 || r.status===403){
          const t = await r.text();
          out.push({ok:false, t:'The key', m:'Refused — '+t.slice(0,120)});
        } else out.push({ok:true, t:'The key', m:'Accepted'});
      }catch(e){ out.push({ok:false, t:'The key', m:e.message}); }
    } else if(!key) out.push({ok:false, t:'The key', m:'Nothing filled in.'});

    // 4. where sign-in would send people back to
    const back = this.redirectUrl();
    out.push(back
      ? {ok:true, t:'Sign-in returns to', m:back, note:'This exact address has to be on the allow-list in '+
          'Authentication › URL Configuration, and add it again under Redirect URLs with /** on the end.'}
      : {ok:false, t:'Sign-in returns to', m:'Nowhere — the app is open from a file rather than a web address.'});
    return out;
  },
  async signIn(email){
    if(!await this.init(true)) return;
    const back = this.redirectUrl();
    if(!back){
      this.set('bad','Open the app from its web address, not from a file on your computer');
      return toast('Sign-in only works from your deployed address, not a local file','bad');
    }
    const {error} = await this.client.auth.signInWithOtp({
      email, options:{ emailRedirectTo: back }
    });
    if(error){
      this.set('bad', error.message);
      ui.tmp.redirectUrl = back;
      ACT.supaCheck(null, null, error.message);
      return;
    }
    toast('Check your email — the link signs you straight in','good');
    this.set('warn','Sign-in link sent to '+email);
  },
  async signInPassword(email, pw, makeAccount){
    if(!await this.init(true)) return;
    try{
      let res;
      if(makeAccount){
        res = await this.client.auth.signUp({email, password:pw});
        if(res.error) throw res.error;
        if(!res.data.session){
          // The project still wants people to confirm by email.
          this.set('warn','Account made — confirm it from your email, then sign in');
          return modal('One more step',
            '<p>The account exists, but this project is set to make people confirm their address before they can sign in. '+
            'There is a confirmation email on its way.</p>'+
            '<div class="hint">To skip that for a private league: in Supabase go to <b>Authentication → Sign In / Providers → Email</b> '+
            'and turn off <b>Confirm email</b>. Then come back and press Sign in.</div>',
            '<button class="btn ghost" data-a="closeModal">Close</button>');
        }
      } else {
        res = await this.client.auth.signInWithPassword({email, password:pw});
        if(res.error) throw res.error;
      }
      this.user = res.data.user || (res.data.session && res.data.session.user) || null;
      this.set('ok','Signed in as '+(this.user? this.user.email : email));
      await this.afterSignIn();
      toast('Signed in','good');
      if(ui.tmp.pendingCode && !this.member) setTimeout(()=> joinModal(), 200);
    }catch(e){
      this.set('bad', e.message);
      toast(e.message,'bad');
      render();
    }
  },
  async signOut(){
    if(!this.client) return;
    await this.client.auth.signOut();
    this.user=null; this.member=null; this.roster=[];
    if(this.channel){ this.client.removeChannel(this.channel); this.channel=null; }
    this.set('warn','Signed out'); render();
  },

  async pull(loud){
    if(!this.ready() || this.busy) return;
    this.busy = true;
    try{
      const {data, error} = await this.client.from('leagues')
        .select('rev,state').eq('id', this.cfg().leagueId).maybeSingle();
      if(error) throw error;
      if(!data){ this.set('warn','No league on the server under that code'); this.busy=false; return; }
      if((+data.rev||0) > (+S.rev||0)){
        adoptRemote(data.state, +data.rev||0);
        if(this.member && this.member.team_id) S.league.myTeamId = this.member.team_id;
        this.set('ok','Up to date at revision '+data.rev);
        render();
        if(loud) toast('League updated','good');
      } else {
        this.set('ok','Up to date');
        if(loud) toast('Already up to date');
      }
    }catch(e){ this.set('bad', e.message); if(loud) toast('Pull failed — '+e.message,'bad'); }
    this.busy = false;
  },

  async push(loud, note){
    if(!this.ready()){ if(loud) toast('Sign in and pick a league first','bad'); return; }
    if(this.busy){ this.pending = true; return; }
    this.busy = true;
    try{
      const {data, error} = await this.client.rpc('push_league', {
        p_id:this.cfg().leagueId, p_rev:+S.rev||0, p_state:S, p_note: note || null
      });
      if(error) throw error;
      if(data && data.conflict){
        adoptRemote(data.state, +data.rev||0);
        this.set('warn','Somebody saved first — took their copy');
        render(); toast('Someone else saved first. Their version is loaded, redo your change.','bad');
      } else {
        S.rev = +(data && data.rev) || ((+S.rev||0)+1);
        this.lastPush = Date.now();
        this.set('ok','Saved revision '+S.rev);
        if(loud) toast('Saved','good');
      }
    }catch(e){
      this.set('bad', e.message);
      toast(e.message,'bad');
    }
    this.busy = false;
    if(this.pending){ this.pending=false; setTimeout(()=> this.push(), 300); }
  },

  listen(){
    if(!this.client || this.channel) return;
    const id = this.cfg().leagueId;
    this.channel = this.client.channel('league:'+id)
      .on('postgres_changes',
        {event:'UPDATE', schema:'public', table:'leagues', filter:'id=eq.'+id},
        (payload)=>{
          const row = payload.new;
          if(!row || (+row.rev||0) <= (+S.rev||0)) return;
          adoptRemote(row.state, +row.rev||0);
          if(this.member && this.member.team_id) S.league.myTeamId = this.member.team_id;
          this.set('ok','Updated live to revision '+row.rev);
          render();
          toast('League updated','good');
        })
      .subscribe();
  }
};

  clearTimeout(supaT);
  supaT = setTimeout(()=> Supa.push(), 1200);

/* Rebuild an object-shaped setting from defaults, keeping whatever the saved
   file legitimately had. `carry` converts an old non-object value. */
function reshape(parent, key, def, carry){
  if(!parent) return;
  const cur = parent[key];
  if(cur && typeof cur==='object' && !Array.isArray(cur)){ parent[key] = Object.assign({}, def, cur); return; }
  parent[key] = Object.assign({}, def, (carry && cur!==undefined) ? carry(cur) : {});
}
function migrate(j){
  const d = defaultState();
  const out = Object.assign({}, d, j);
  out.settings = Object.assign({}, d.settings, j.settings||{});
  Object.keys(d.settings).forEach(k=>{ out.settings[k] = Object.assign({}, d.settings[k], (j.settings||{})[k]||{}); });
  out.settings.trades.quiet = Object.assign({}, d.settings.trades.quiet, ((j.settings||{}).trades||{}).quiet||{});
  out.settings.trades.counters = Object.assign({}, d.settings.trades.counters, ((j.settings||{}).trades||{}).counters||{});
  out.settings.contracts.structures = (j.settings&&j.settings.contracts&&j.settings.contracts.structures)||defaultStructures();
  /* Settings that started as a plain value and later grew into an object have
     to be rebuilt, or every field inside them is unreachable. */
  reshape(out.settings.cap, 'rollover', d.settings.cap.rollover, (old)=> ({on: old===true}));
  reshape(out.settings, 'waivers', d.settings.waivers, (old)=> ({on: old===true}));
  ['taxi','rookie','playoffs','fa','bbd','value','comp','players','tag']
    .forEach(k=> reshape(out.settings, k, d.settings[k], null));
  reshape(out.settings.tag, 'counts', d.settings.tag.counts, null);
  reshape(out.settings.comp, 'tiers', d.settings.comp.tiers, null);
  reshape(out.settings.comp, 'byRound', {}, null);
  reshape(out.settings.comp, 'overrides', {}, null);
  reshape(out.settings.rookie, 'roundYears', d.settings.rookie.roundYears, null);
  reshape(out.settings.rookie, 'overrides', {}, null);
  reshape(out.settings.contracts, 'limits', {}, null);
  out.settings.scoring = migrateScoring((j.settings||{}).scoring);
  const slots = ((j.settings||{}).roster||{}).slots;
  out.settings.roster.slots = (Array.isArray(slots) && slots.length) ? slots : slotsFromCodes(ROSTER_PRESETS['Sleeper default']);
  out.league = Object.assign({}, d.league, j.league||{});
  out.live = Object.assign({}, d.live, j.live||{});
  out.meta = Object.assign({}, d.meta, j.meta||{});
  ['teams','players','picks','auctions','trades','rules','notices','log','faAuctions','taxiClaims','pending','signings']
    .forEach(k=> out[k] = Array.isArray(j[k]) ? j[k] : []);
  out.dvp = (j.dvp && typeof j.dvp==='object') ? j.dvp : {};
  out.news = (j.news && Array.isArray(j.news.items)) ? j.news : {at:0, items:[]};
  out.league.coCommishIds = Array.isArray((j.league||{}).coCommishIds) ? j.league.coCommishIds : [];
  out.h2h = (j.h2h && typeof j.h2h==='object') ? j.h2h : {};
  out.lineups = (j.lineups && typeof j.lineups==='object') ? j.lineups : {};
  out.schedule = Array.isArray(j.schedule) ? j.schedule : [];
  if(!Array.isArray(out.settings.playoffs.chain) || !out.settings.playoffs.chain.length)
    out.settings.playoffs.chain = ['h2h','opp','pf','eff'];
  out.bbd = (j.bbd && typeof j.bbd==='object') ? j.bbd : {status:'idle', round:1, clock:null, bids:[], rounds:[]};
  out.bbd.bids = Array.isArray(out.bbd.bids) ? out.bbd.bids : [];
  out.bbd.rounds = Array.isArray(out.bbd.rounds) ? out.bbd.rounds : [];
  out.log.forEach(l=>{ if(!l.type || !TX_TYPES[l.type]) l.type='admin'; l.teams=l.teams||[]; l.players=l.players||[]; });
  out.season = (j.season && j.season.byPlayer) ? j.season : {year:out.league.season, byPlayer:{}};
  out.history = j.history && typeof j.history==='object' ? j.history : {};
  out.settings.contracts.limits = (j.settings&&j.settings.contracts&&j.settings.contracts.limits) || {};
  const mk = Object.keys(MASCOTS);
  out.teams.forEach((t,i)=>{
    t.dead=t.dead||[]; t.adj=t.adj||[]; t.dues=t.dues||{paid:false,paidOn:null,amount:null};
    if(!t.color) t.color = TEAM_COLORS[i%TEAM_COLORS.length];
    if(!t.mascot) t.mascot = mk[i%mk.length];
  });
  out.live.talk = Array.isArray(out.live.talk) ? out.live.talk : [];
  return out;
}
/* Leagues saved before the Sleeper categories went in used shorter names. */
const OLD_SCORING = {passYd:'pass_yd', passTd:'pass_td', passInt:'pass_int', pass2pt:'pass_2pt',
  pass300:'bonus_pass_yd_300', passSack:'pass_sack', rushYd:'rush_yd', rushTd:'rush_td',
  rush2pt:'rush_2pt', rush100:'bonus_rush_yd_100', rec:'rec', recTE:'bonus_rec_te', recYd:'rec_yd',
  recTd:'rec_td', rec100:'bonus_rec_yd_100', rec2pt:'rec_2pt', fumLost:'fum_lost',
  fg39:'fgm_30_39', fg49:'fgm_40_49', fg50:'fgm_50p', fgMiss:'fgmiss', xp:'xpm', xpMiss:'xpmiss',
  dstSack:'sack', dstInt:'int', dstFum:'fum_rec', dstTd:'def_td', dstSaf:'safe'};
function migrateScoring(old){
  const out = defaultScoring();
  if(!old || typeof old!=='object') return out;
  const looksNew = ('pass_yd' in old) || ('rec_yd' in old);
  Object.keys(old).forEach(k=>{
    if(k==='dstPaTiers' || k==='dstShutout') return;
    const key = looksNew ? k : (OLD_SCORING[k] || null);
    if(key && key in out) out[key] = +old[k]||0;
  });
  return out;
}
let lastPoll = 0, liveBeat = 0;
function tickAll(){
  let dirty = false, needsRender = false;

  S.auctions.forEach(a=>{
    if(a.status!=='running' || !a.clock) return;
    const before = a.clock.remain;
    tickClock(a.clock);
    if(a.clock.remain !== before) dirty = true;
    if(a.clock.remain<=0){ settleAuction(a); needsRender = true; }
  });
  (S.tagOffers||[]).forEach(o=>{
    if(o.status!=='open' || !o.clock) return;
    const before = o.clock.remain;
    tickClock(o.clock);
    if(o.clock.remain !== before) dirty = true;
    if(o.clock.remain<=0){ settleTagOffer(o); needsRender = true; }
  });
  (S.pending||[]).forEach(q=>{
    if(q.status!=='open' || !q.clock) return;
    const before = q.clock.remain;
    tickClock(q.clock);
    if(q.clock.remain !== before) dirty = true;
    if(q.clock.remain<=0){ settlePending(q); needsRender = true; }
  });
  (S.taxiClaims||[]).forEach(c=>{
    if(c.status!=='open' || !c.clock) return;
    const before = c.clock.remain;
    tickClock(c.clock);
    if(c.clock.remain !== before) dirty = true;
    if(c.clock.remain<=0){ settleTaxiClaim(c); needsRender = true; }
  });
  if(S.bbd && S.bbd.status==='open' && S.bbd.clock){
    const before = S.bbd.clock.remain;
    tickClock(S.bbd.clock);
    if(S.bbd.clock.remain !== before) dirty = true;
    if(S.bbd.clock.remain<=0){ resolveRound(); needsRender = true; }
  }
  (S.faAuctions||[]).forEach(a=>{
    if(a.status!=='open' || !a.clock) return;
    const before = a.clock.remain;
    tickClock(a.clock);
    if(a.clock.remain !== before) dirty = true;
    if(a.clock.remain<=0){ settleFA(a); needsRender = true; }
  });
  S.trades.forEach(t=>{
    if(t.status!=='review' || !t.clock) return;
    const before = t.clock.remain;
    tickClock(t.clock);
    if(t.clock.remain !== before) dirty = true;
    if(t.clock.remain<=0){ processTrade(t); needsRender = true; }
  });

  liveBeat++;
  if(route==='live' && S.live.taunt && Date.now()-S.live.taunt.at < TAUNT_MS+1500 && liveBeat%2===0) needsRender = true;
  if(S.settings.live.running && S.settings.live.mode==='demo'){
    simTick(); dirty = true;
    if(route==='live' && liveBeat % 2 === 0) needsRender = true;
  }
  if(S.settings.live.mode==='endpoint' && statsUrl()){
    const gap = Math.max(10, +S.settings.live.pollSec||30)*1000;
    if(Date.now()-lastPoll > gap){ lastPoll = Date.now(); pollEndpoint(); }
  }
  if(Sync.ready() && !Supa.ready()){
    const gap = Math.max(5, +S.settings.sync.everySec||20)*1000;
    if(Date.now()-Sync.lastPull > gap && !Sync.busy){ Sync.lastPull = Date.now(); Sync.pull(); }
  }

  // paint the countdowns without rebuilding the page
  $$('[data-clock]').forEach(el=>{
    const [kind,id] = el.dataset.clock.split(':');
    const o = kind==='bbd' ? S.bbd : kind==='auc' ? byId(S.auctions,id)
            : kind==='fa' ? byId(S.faAuctions,id) : kind==='tc' ? byId(S.taxiClaims,id)
            : kind==='pd' ? byId(S.pending,id) : kind==='to' ? byId(S.tagOffers,id)
            : byId(S.trades,id);
    if(!o || !o.clock) return;
    el.textContent = hhmm(o.clock.remain);
    const near = o.clock.remain <= snipeMs(S.settings.trades.antiSnipeWithinMin);
    el.className = 'clock ' + (isQuietNow() ? 'paused' : near ? '' : 'calm');
  });

  if(needsRender) render();
  else if(dirty && Date.now()-(S.meta.savedAt||0) > 8000) save();
}

    if(!S.live.games.length) buildWeek(S.live.week||1);

}
/* A link can carry a Supabase invitation code, or the older address-and-code
   pair for leagues on the shared-password server. Both land here. */
function greetInvites(){
  // The full invitation: project, key, league and code, all in one link.
  const full = /[#&]join2=([^&]+)/.exec(location.hash||'');
  if(full){
    let inv = null;
    try{ inv = JSON.parse(atob(decodeURIComponent(full[1]))); }catch(e){}
    if(inv && inv.u && inv.k && inv.c){
      S.settings.supa = Object.assign({}, S.settings.supa, {on:true, url:inv.u, anonKey:inv.k, leagueId:inv.l||''});
      save(true);
      ui.tmp.pendingCode = inv.c;
      history.replaceState(null,'',location.pathname);
      setTimeout(()=> Supa.init().then(()=> joinModal(inv.n)), 350);
      return;
    }
  }
  const codeIn = /[#&]code=([^&]+)/.exec(location.hash||'');
  if(codeIn){
    ui.tmp.pendingCode = decodeURIComponent(codeIn[1]);
    setTimeout(()=>{
      if(!S.settings.supa.on || !S.settings.supa.url){
        modal('You have been invited',
          '<p>This link carries an invitation code, but this copy of the app has not been pointed at a Supabase project yet.</p>'+
          '<div class="kv" style="margin:12px 0"><dt>Your code</dt><dd class="num">'+esc(ui.tmp.pendingCode)+'</dd></div>'+
          '<div class="hint">Ask whoever invited you for the project URL and anon key, put them in under Settings › Server, '+
          'then paste this code into Join.</div>',
          '<button class="btn ghost" data-a="closeModal">Close</button>'+
          '<button class="btn pri" data-a="go" data-r="settings" data-s="server">Take me there</button>');
      } else {
        Supa.init().then(()=>{
          modal('You have been invited',
            (Supa.user
              ? '<p>Signed in as <b>'+esc(Supa.user.email)+'</b>. Say the word and you are in.</p>'
              : '<p>Put in your email and we will send you a sign-in link. Once you are in, this code adds you to the league.</p>'+
                '<div class="row" style="margin:10px 0"><input type="email" id="supaEmail" placeholder="you@example.com" style="flex:1">'+
                '<button class="btn pri" data-a="supaSignIn">Email me a link</button></div>')+
            '<label class="f"><span>Invitation code</span><input type="text" id="supaCode" value="'+esc(ui.tmp.pendingCode)+'"></label>',
            '<button class="btn ghost" data-a="closeModal">Later</button>'+
            (Supa.user?'<button class="btn pri" data-a="supaJoin">Join the league</button>':''));
        });
      }
    }, 500);
    return;
  }
  const invite = readJoinLink();
  if(invite && invite.u && invite.l){
    ui.tmp.join = invite;
    setTimeout(()=> modal('Join '+(invite.n || 'the league'),
      '<p>This link carries the server address and the league code. You just need the password the commissioner sent you.</p>'+
      '<div class="kv" style="margin:12px 0"><dt>Server</dt><dd class="tiny">'+esc(invite.u)+'</dd>'+
      '<dt>League code</dt><dd class="tiny">'+esc(invite.l)+'</dd></div>'+
      '<label class="f"><span>League password</span><input type="text" id="joinKey" placeholder="leave blank if there is not one"></label>'+
      '<div class="hint">This replaces whatever is loaded here now. If you have a league of your own on this device, '+
      'download it first under Settings › Data.</div>',
      '<button class="btn ghost" data-a="closeModal">Not now</button>'+
      '<button class="btn pri" data-a="joinGo">Join it</button>'), 500);
  }
}
