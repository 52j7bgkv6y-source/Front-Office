/* Everything that only reads state. Safe to rebuild on any keystroke, because
   nothing in here is typed into. */
function contractSummary(){
  const cd = ui.tmp.cd, sal = cdSalaries(), st = structById(cd.structId);
  const other = S.players.filter(x=> x.contract && x.contract.teamId===cd.teamId && x.id!==cd.pid);
  const total = cd.byYear ? fixInc(sum(sal)) : cd.total;
  const max = cdMaxTotal();
  return `
    <div class="scrollx"><table><thead><tr><th>Year</th>${sal.map((_,i)=>'<th class="right">'+(cd.startYear+i)+'</th>').join('')}</tr></thead>
      <tbody><tr><td class="dim">Salary</td>${sal.map(s=>'<td class="right money">'+money(s)+'</td>').join('')}</tr>
      ${cd.byYear?'':'<tr><td class="dim">Share</td>'+structPct(st,cd.years,cd.total).map(x=>'<td class="right num dim">'+pct(x)+'</td>').join('')+'</tr>'}
      <tr><td class="dim">Space after</td>${sal.map((s,i)=>{
        const yy=cd.startYear+i;
        if(yy<S.league.season) return '<td class="right dim">—</td>';
        const committed = sum(other.map(x=>capHit(x,yy))) + teamDead(cd.teamId,yy) + teamAdj(cd.teamId,yy) + teamRetained(cd.teamId,yy) + s;
        const sp = teamCapForYear(cd.teamId,yy)-committed;
        return '<td class="right num '+(sp<0?'bad':'good')+'">'+money(sp,{plus:true})+'</td>';
      }).join('')}</tr></tbody></table></div>
    ${max==null ? '' : `<div class="hint ${total>max?'bad':''}">Over ${cd.years} year${cd.years===1?'':'s'} shaped like this,
      the most ${esc(teamName(cd.teamId))} can pay him is <b>${money(max)}</b> — ${money(fixInc(max/cd.years))} a year.
      ${total>max ? 'This deal is '+money(fixInc(total-max))+' past that.' : ''}</div>`}
    <div class="hint">${cd.byYear
      ? 'Every figure is yours to set, so an existing league can be copied across exactly. Shorten the deal and the extra years are put aside, not thrown away — lengthen it again and they come back.'
      : 'Bars show the shape of the deal. Change the structure to move money between years — the total never changes.'}</div>
    ${Math.min.apply(null, sal) < (+S.settings.contracts.minSalary||0)
      ? '<div class="hint '+(isCommish()?'warn':'bad')+'">At least one year falls under the league minimum of '+
        money(S.settings.contracts.minSalary)+'. '+(isCommish()
          ? 'You can save it anyway \u2014 you will be asked to confirm.'
          : 'Raise the total or shorten the deal.')+'</div>' : ''}
    ${(()=>{
      const why = loadingBlocked(cd.total, cd.years);
      const st2 = structById(cd.structId);
      if(why && st2 && st2.mode!=='even')
        return '<div class="hint warn">'+esc(why)+' The '+esc(st2.name)+' shape is ignored here \u2014 it will be paid evenly.</div>';
      return '';
    })()}
    ${(()=>{
      /* A deal is only counted in the years it actually covers. If its window
         ends before this season, every year on the cap ladder reads $0 even
         though the total looks right — which is what a sheet import does when
         its first year column is an older season. */
      const last = cd.startYear + cd.years - 1;
      if(last < S.league.season)
        return '<div class="hint bad">This deal runs '+cd.startYear+'\u2013'+last+', which is over before '+
          S.league.season+'. It will show <b>$0 in every year</b> on the cap ladder however you set the figures. '+
          'Change <b>First year</b> above to '+S.league.season+' to have it count.</div>';
      if(cd.startYear > S.league.season)
        return '<div class="hint warn">This deal does not begin until '+cd.startYear+
          ', so it shows nothing before then.</div>';
      return '';
    })()}`;
}

function applyExtension(p, addYears, aav, structId){
  const c = p.contract;

  c.salaries = c.salaries.concat(ext);
  c.years += addYears;

function actingTeam(){ return viewAsTeam() || ui.tmp.actAs || S.league.myTeamId || (S.teams[0]||{}).id; }
function actAsBar(){

}
function pickValue(pk){
  const base = (+S.settings.cap.base||250)/250;
  return Math.round(({1:25,2:12,3:6,4:3}[(pk&&pk.round)||0]||2)*base);
}
/* A want that names a shape rather than a name: "a WR", "a 2027 first". */
function specLabel(sp){
  if(sp.kind==='pos') return 'any ' + sp.pos + (sp.min ? ' worth ' + money(sp.min) + '+' : '');
  if(sp.kind==='pick') return (sp.year||'any year') + ' ' + (sp.round ? 'round ' + sp.round : 'any round');
  return '?';
}
function specValue(sp){
  if(sp.kind==='pos') return +sp.min||0;
  if(sp.kind==='pick') return pickValue({round:+sp.round||3});
  return 0;
}
function askValue(ask){ return fixInc(assetValue(ask) + sum((ask.specs||[]).map(specValue))); }
/* Does an offer actually contain the shapes that were asked for? */
function meetsSpecs(offer, ask){
  const specs = (ask && ask.specs) || [];
  if(!specs.length) return true;
  const players = (offer.players||[]).map(id=>byId(S.players,id)).filter(Boolean);
  const picks = (offer.picks||[]).map(id=>byId(S.picks,id)).filter(Boolean);
  const usedP = {}, usedK = {};
  return specs.every(sp=>{
    if(sp.kind==='pos'){
      const hit = players.find(x=> !usedP[x.id] && x.pos===sp.pos && (!sp.min || (x.value||0) >= +sp.min));
      if(hit){ usedP[hit.id]=1; return true; }
      return false;
    }
    if(sp.kind==='pick'){
      const hit = picks.find(k=> !usedK[k.id] && (!sp.round || k.round===+sp.round) && (!sp.year || k.year===+sp.year));
      if(hit){ usedK[hit.id]=1; return true; }
      return false;
    }
    return true;
  });
}
function assetValue(o){
  return fixInc(
    sum((o.players||[]).map(id=>{ const p=byId(S.players,id); return p ? (p.value || (p.contract&&p.contract.total) || 1) : 0; })) +
    sum((o.picks||[]).map(id=>{ const k=byId(S.picks,id); return k ? pickValue(k) : 0; })) + (+o.cash||0));
}
function specChips(ask, rm){
  return ((ask.specs)||[]).map((sp,i)=>'<span class="chip" style="border-style:dashed">'+esc(specLabel(sp))+
    (rm?'<button data-a="'+rm+'" data-i="'+i+'">×</button>':'')+'</span>').join('');
}
/* If this player's game has kicked off, what he has scored this week so far —
   final if the game is over, live otherwise. Blank before kickoff and on a bye,
   so a chip only ever carries a number once there is a real one to show. */
function weekPointsChip(p){
  const g = gameForPlayer(p);
  if(!g || g.status==='pre') return '';
  const pts = fpts(p.id);
  const tag = g.status==='final' ? 'final' : 'live';
  return ' <span class="pill '+(tag==='live'?'live':'')+'" title="what he has put up this week">'+
    pts.toFixed(1)+' '+tag+'</span>';
}
function assetChips(o, opts){
  const rm = opts && opts.rm;
  const bits = (o.players||[]).map(id=>{ const p=byId(S.players,id); return p?'<span class="chip">'+posTag(p.pos)+' '+esc(p.name)+weekPointsChip(p)+(rm?'<button data-a="'+rm+'" data-kind="players" data-id="'+id+'" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>':''; })
    .concat((o.picks||[]).map(id=>{ const k=byId(S.picks,id); return k?'<span class="chip">'+esc(pickLabel(k))+(rm?'<button data-a="'+rm+'" data-kind="picks" data-id="'+id+'" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>':''; }))
    .filter(Boolean);
  if(+o.cash) bits.push('<span class="chip money">'+money(+o.cash)+' cap'+
    (rm?'<button data-a="'+rm+'" data-kind="cash" data-id="cash" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>');
  return bits.join('') || '<span class="dim tiny">nothing yet</span>';
}
/* A trade with more than two teams in it is just a list of hand-overs. */
function legTeams(tr){
  const set = {};
  (tr.legs||[]).forEach(l=>{ if(l.from) set[l.from]=1; if(l.to) set[l.to]=1; });
  return Object.keys(set);
}
function legValue(l){ return assetValue({players:l.players, picks:l.picks, cash:l.cash}); }
/* How much cap ROOM each team gains or loses if the whole thing goes through.
   Room, not committed money — the two move in opposite directions, and both
   callers add this straight onto capSpace(). Sending a salary away frees room;
   taking one on eats it. This was once written in committed terms, which made
   the board show every team's after figure backwards. */
function tradeCapDelta(tr, teamId, year){
  let d = 0;
  (tr.legs||[]).forEach(l=>{
    (l.players||[]).forEach(pid=>{
      const p = byId(S.players,pid); if(!p || !p.contract) return;
      const gross = fixInc(Math.max(0, grossHit(p,year) - retainedOn(p,year)));
      const keep  = Math.min(gross, fixInc(+(((l.retain||{})[pid]||{}).byYear||{})[year] || 0));
      if(l.from===teamId) d += (gross - keep);   // frees up his salary, less the part you keep paying
      if(l.to===teamId)   d -= (gross - keep);   // costs them his salary, less the part you keep paying
    });
    const cash = +l.cash||0;                     // sending cap dollars leaves you poorer, them richer
    if(cash){ if(l.from===teamId) d -= cash; if(l.to===teamId) d += cash; }
  });
  return fixInc(d);
}
/* Trades are usually let through, but the roster still ought to say plainly
   that it has gone past what the league would normally allow. */
function limitAfterTrade(tr){
  const notes = [];
  (tr.legs||[]).forEach(l=>{
    (l.players||[]).forEach(pid=>{
      const p = byId(S.players,pid); if(!p || !p.contract) return;
      const lp = limitProblem(l.to, p.contract.years, null);
      if(lp) notes.push({team:l.to, player:p.name, length:lp.length, have:lp.have, allow:lp.allow});
    });
  });
  return notes;
}
function multiLegal(tr){
  const bad = [];
  legTeams(tr).forEach(t=>{
    projYears().forEach(y=>{
      const after = capSpace(t, y) + tradeCapDelta(tr, t, y);
      if(after < 0) bad.push({team:t, year:y, over:fixInc(-after)});
    });
  });
  return bad;
}
/* Hand everything over. Used both for real and for the dry run below, so the
   two can never drift apart. */
function applyMultiLegs(tr){
  (tr.legs||[]).forEach(l=>{
    (l.players||[]).forEach(pid=>{
      const p = byId(S.players,pid); if(!p || !p.contract) return;
      p.contract.teamId = l.to;
      const r = (l.retain||{})[pid];
      if(r && r.byYear && Object.keys(r.byYear).length) applyRetentionYears(pid, l.from, r.byYear);
    });
    (l.picks||[]).forEach(kid=>{ const k = byId(S.picks,kid); if(k) k.ownerTeamId = l.to; });
    const cash = +l.cash||0;
    if(cash){
      const f = byId(S.teams,l.from), t = byId(S.teams,l.to);
      if(f){ f.adj=f.adj||[]; f.adj.push({year:S.league.season, amount:cash, note:'Cap sent to '+teamName(l.to)}); }
      if(t){ t.adj=t.adj||[]; t.adj.push({year:S.league.season, amount:-cash, note:'Cap from '+teamName(l.from)}); }
    }
  });
}
/* Would anybody be over once this lands? Measured, not calculated — we hand
   the assets over for real, read everybody's books, then put it all back. The
   arithmetic version of this ran with its signs reversed for months without
   anyone noticing, which is survivable in a table and is not in a gate.
   Same year as the two-team check, so a three-way is held to the same standard
   as the two-way it could otherwise be split into. */
function multiCapProblem(tr){
  const snap = tradeSnapshot(tr);
  applyMultiLegs(tr);
  let worst = null;
  legTeams(tr).forEach(t=>{
    const sp = capSpace(t, S.league.season);
    if(sp < 0 && (!worst || sp < worst.space)) worst = {team:t, space:sp, over:fixInc(-sp)};
  });
  restoreSnapshot(snap);
  return worst;
}
function processMulti(tr){
  if(tr.status!=='review') return;
  if(limitBinds('trades')){
    const lim = limitAfterTrade(tr);
    if(lim.length){
      tr.status='rejected';
      tr.reason = teamName(lim[0].team)+' would be past the contract length limits';
      tr.log.unshift({at:Date.now(), text:'Blocked — '+tr.reason});
      notify('Trade blocked', teamName(lim[0].team)+' cannot hold that many long deals.','bad');
      logIt('Multi-team trade rejected — '+tr.reason, {type:'trade', teams:legTeams(tr)});
      return;
    }
  }
  if(S.settings.trades.capMustBeLegal){
    const bad = multiCapProblem(tr);
    if(bad){
      tr.status='rejected';
      tr.reason = 'Would put '+teamName(bad.team)+' '+money(bad.over)+' over the '+S.league.season+' cap';
      tr.log.unshift({at:Date.now(), text:'Blocked — '+tr.reason});
      notify('Trade blocked', tr.reason, 'bad');
      logIt('Multi-team trade rejected — '+tr.reason, {type:'trade', teams:legTeams(tr)});
      return;
    }
  }
  tr.undo = tradeSnapshot(tr);
  applyMultiLegs(tr);
  tr.status='approved'; tr.processedAt=Date.now();
  tr.log.unshift({at:Date.now(), text:'Processed'});
  logIt('Multi-team trade processed — '+legTeams(tr).map(teamName).join(', '),
    {type:'trade', teams:legTeams(tr), players:[].concat.apply([], (tr.legs||[]).map(l=>l.players||[]))});
  notify('Trade processed', legTeams(tr).length+' teams, '+
    (tr.legs||[]).reduce((a,l)=>a+(l.players||[]).length+(l.picks||[]).length,0)+' assets.','good');
}
function moveAssets(fromTeam, toTeam, o){
  (o.players||[]).forEach(id=>{
    const p=byId(S.players,id); if(!p || !p.contract) return;
    p.contract.teamId = toTeam;
    const r = (o.retain||{})[id];
    if(isOldRetain(r)) applyRetention(id, fromTeam, +r.pct, +r.through||S.league.season, 'pct');
    else if(r && r.byYear && Object.keys(r.byYear).length) applyRetentionYears(id, fromTeam, r.byYear);
  });
  (o.picks||[]).forEach(id=>{ const k=byId(S.picks,id); if(k) k.ownerTeamId=toTeam; });
  const cash = +o.cash||0;
  if(cash){
    const f=byId(S.teams,fromTeam), t=byId(S.teams,toTeam);
    if(f){ f.adj=f.adj||[]; f.adj.push({year:S.league.season, amount:cash, note:'Cap sent to '+teamName(toTeam)}); }
    if(t){ t.adj=t.adj||[]; t.adj.push({year:S.league.season, amount:-cash, note:'Cap from '+teamName(fromTeam)}); }
    logIt(money(cash)+' of cap moved from '+teamName(fromTeam)+' to '+teamName(toTeam),
      {type:'cap', teams:[fromTeam,toTeam]});
  }
}

/* ============================================================
   FREE AGENT AUCTIONS
   A bid is not play money. Whatever you win at becomes the man's salary,
   it comes off your cap, and it comes out of the budget you get for the year.
   ============================================================ */
/* 'cap' means there is no separate pot at all — you bid against the room you
   actually have, and winning simply spends it. */
function faBudget(teamId){
  const f = S.settings.fa;
  if(f.budgetMode==='cap') return fixInc(Math.max(0, capSpace(teamId, S.league.season)));
  return f.budgetMode==='pct'
    ? roundInc(capForYear(S.league.season) * (+f.budget||0)/100)
    : fixInc(+f.budget||0);
}
/* Auction bids call it `aav`, draft bids call it `amount`. Same money either
   way, and getting this wrong silently prices everything at zero. */
function faYearOne(bid){
  if(!bid) return 0;
  const perYear = +(bid.aav != null ? bid.aav : bid.amount) || 0;
  const years = clamp(+bid.years || 1, 1, 20);
  return salariesFor(roundInc(perYear*years), years, bid.structId)[0] || 0;
}
function faSpent(teamId){ const t = byId(S.teams,teamId); return fixInc(+((t||{}).faSpent) || 0); }
function faCommitted(teamId, exceptId){
  return fixInc(sum((S.faAuctions||[])
    .filter(a=> a.status==='open' && a.id!==exceptId && a.leading && a.leading.teamId===teamId)
    .map(a=> faYearOne(a.leading))));
}
function faLeft(teamId, exceptId){
  // Bidding on the cap, what has already been spent is off the books — taking
  // it off again would charge for the same signing twice.
  if(S.settings.fa.budgetMode==='cap')
    return fixInc(faBudget(teamId) - faCommitted(teamId, exceptId));
  return fixInc(faBudget(teamId) - faSpent(teamId) - faCommitted(teamId, exceptId));
}
function faOpenFor(playerId){ return (S.faAuctions||[]).find(a=> a.playerId===playerId && a.status==='open'); }
function settleFA(a){
  if(a.status!=='open') return;
  if(!a.leading){
    a.status='cancelled';
    a.log.unshift({at:Date.now(), text:'Closed with nobody in'});
    return;
  }
  const p = byId(S.players, a.playerId), b = a.leading;
  if(!p) { a.status='cancelled'; return; }
  const acc = willAccept(p, b.teamId, b.aav, b.years);
  if(!acc.ok){
    a.status='refused'; a.settledAt=Date.now();
    a.log.unshift({at:Date.now(), text:p.name+' will not sign for '+money(b.aav)+' — he wants '+money(acc.want)});
    logIt(p.name+' refused '+money(b.aav)+' a year from '+teamName(b.teamId)+' and stayed a free agent',
      {type:'admin', teams:[b.teamId], players:[p.id]});
    notify('Refused', p.name+' turned down '+teamName(b.teamId)+' and is back in the pool.','warn');
    return;
  }
  recordSigning(p.id, b.teamId, b.aav, 'free agent auction');
  awardContract(p.id, b.teamId, b.aav, {years:b.years, maxYears:S.settings.fa.maxYears,
    structId:b.structId, source:'free agent auction'});
  const t = byId(S.teams, b.teamId);
  if(t) t.faSpent = fixInc(faSpent(b.teamId) + faYearOne(b));
  a.status='signed'; a.settledAt=Date.now();
  a.log.unshift({at:Date.now(), text:teamName(b.teamId)+' wins him at '+money(b.aav)+' a year for '+b.years});
  logIt(teamName(b.teamId)+' signed '+p.name+' out of the auction — '+money(b.aav)+' a year for '+b.years+
    ' ('+money(faYearOne(b))+' of budget)', {type:'add', teams:[b.teamId], players:[p.id]});
  notify('Free agent signed', p.name+' goes to '+teamName(b.teamId)+' at '+money(b.aav)+' a year.','good');
}

/* ============================================================
   BLIND BID DRAFT
   Everyone bids at once and nobody sees anything. When the round closes it
   all reveals together and the board settles in one pass.
   ============================================================ */
function bbdMode(){
  const b = S.settings.bbd;
  if(b.budgetMode) return b.budgetMode;
  return b.separateBudget ? 'own' : 'fa';        // older leagues used a tickbox
}
function bbdBudget(teamId){
  const m = bbdMode();
  if(m==='cap') return fixInc(Math.max(0, capSpace(teamId, S.league.season)));
  if(m==='own') return fixInc(+S.settings.bbd.budget||0);
  return faBudget(teamId);
}
function bbdSpent(teamId){
  if(bbdMode()==='cap') return 0;                // the cap has already taken it
  if(bbdMode()==='fa') return faSpent(teamId);
  return fixInc(sum((S.bbd.rounds||[]).map(r=>
    sum((r.awards||[]).filter(a=> a.teamId===teamId).map(a=> +a.yearOne||0)))));
}
function bbdLeft(teamId){ return fixInc(bbdBudget(teamId) - bbdSpent(teamId)); }
function myBids(teamId){ return (S.bbd.bids||[]).filter(b=> b.teamId===teamId).sort((a,b)=> a.rank-b.rank); }
function bbdExposure(teamId){ return fixInc(sum(myBids(teamId).map(faYearOne))); }
function bbdOrder(){
  const tie = S.settings.bbd.tiebreak;
  return (x,y)=> (y.amount - x.amount)
    || (tie==='leastSpent' ? (bbdSpent(x.teamId) - bbdSpent(y.teamId)) : (x.at - y.at))
    || (x.rank - y.rank);
}
/* Highest live bid on the board is settled first, then the next, because one
   award can put the team behind it out of money. */
function resolveRound(){
  const cmp = bbdOrder();
  const byPlayer = {};
  (S.bbd.bids||[]).forEach(b=>{ (byPlayer[b.playerId] = byPlayer[b.playerId] || []).push(b); });
  Object.keys(byPlayer).forEach(k=> byPlayer[k].sort(cmp));

  const awards = [], spent = {}, won = {}, settled = {}, refused = [];
  const cap = +S.settings.bbd.maxPerRound || 0;
  const left = (t)=> bbdLeft(t) - (spent[t]||0);
  const room = (t)=> (teamPlayers(t).length + (won[t]||0)) < (+S.settings.roster.maxRoster||999);
  const under = (t)=> !cap || (won[t]||0) < cap;

  let guard = 0;
  while(guard++ < 3000){
    let best = null;
    Object.keys(byPlayer).forEach(pid=>{
      if(settled[pid]) return;
      for(const b of byPlayer[pid]){
        const y1 = faYearOne(b);
        if(y1 > left(b.teamId) || !room(b.teamId) || !under(b.teamId)) continue;
        if(!best || cmp(b, best.bid) < 0) best = {pid, bid:b, y1};
        break;                                   // only a player's top live bid competes
      }
    });
    if(!best) break;
    const pl = byId(S.players, best.pid);
    const acc = willAccept(pl, best.bid.teamId, best.bid.amount, best.bid.years);
    if(!acc.ok){
      // He will not sign it. Drop that bid and let the next in line have a go.
      byPlayer[best.pid] = byPlayer[best.pid].filter(x=> x!==best.bid);
      refused.push({playerId:best.pid, teamId:best.bid.teamId, amount:best.bid.amount, want:acc.want});
      if(!byPlayer[best.pid].length) settled[best.pid] = true;
      continue;
    }
    settled[best.pid] = true;
    spent[best.bid.teamId] = (spent[best.bid.teamId]||0) + best.y1;
    won[best.bid.teamId] = (won[best.bid.teamId]||0) + 1;
    awards.push({playerId:best.pid, teamId:best.bid.teamId, amount:best.bid.amount,
                 years:best.bid.years, structId:best.bid.structId, yearOne:best.y1});
  }

  awards.forEach(a=>{
    const p = byId(S.players, a.playerId); if(!p) return;
    recordSigning(p.id, a.teamId, a.amount, 'blind bid draft');
    awardContract(p.id, a.teamId, a.amount, {years:a.years, maxYears:S.settings.bbd.maxYears,
      structId:a.structId, source:'blind bid draft'});
    if(!S.settings.bbd.separateBudget){
      const t = byId(S.teams, a.teamId);
      if(t) t.faSpent = fixInc(faSpent(a.teamId) + a.yearOne);
    }
    logIt(teamName(a.teamId)+' won '+p.name+' on a blind bid — '+money(a.amount)+' a year for '+a.years,
      {type:'add', teams:[a.teamId], players:[p.id]});
  });

  const board = Object.keys(byPlayer).map(pid=>({
    playerId: pid,
    bids: byPlayer[pid].map(b=>({teamId:b.teamId, amount:b.amount, years:b.years})),
    winner: (awards.find(a=> a.playerId===pid) || null)
  })).sort((a,b)=> (b.bids[0]?b.bids[0].amount:0) - (a.bids[0]?a.bids[0].amount:0));

  S.bbd.rounds.unshift({ round:S.bbd.round, at:Date.now(), awards, board, refused,
    bidders: Array.from(new Set((S.bbd.bids||[]).map(b=>b.teamId))).length });
  refused.forEach(r=> logIt(playerName(r.playerId)+' refused '+money(r.amount)+' from '+teamName(r.teamId),
    {type:'admin', teams:[r.teamId], players:[r.playerId]}));
  S.bbd.bids = [];
  S.bbd.status = 'revealed';
  S.bbd.clock = null;
  notify('Round '+S.bbd.round+' is open', awards.length+' player'+(awards.length===1?'':'s')+' went. Every bid is on the board.','good');
  logIt('Blind bid round '+S.bbd.round+' resolved — '+awards.length+' signed', {type:'admin'});
  return awards;
}

        <div class="tiny dim">${esc(p.nfl||'')} · age ${p.age||'—'} · model ${money(marketPrice(p,0))}</div></td>
        <td class="right"><button class="btn sm" data-a="bbPick" data-id="${p.id}">Bid</button></td></tr>`).join('')
        || '<tr><td class="dim center" style="padding:20px">Nobody matches that.</td></tr>'}
      </tbody></table></div>`}`,
    '<button class="btn ghost" data-a="closeModal">Cancel</button>'+
    (chosen?'<button class="btn pri" data-a="bbSave">Seal it</button>':''));
}
ACT.bbPick = (d)=>{
  ui.tmp.bb.playerId = d.id || '';
  if(d.id){
    const p = byId(S.players,d.id);
    ui.tmp.bb.amount = Math.max(+S.settings.bbd.minBid||1, marketPrice(p,0));
  }
  bbdBidModal();
};
ACT.bbField = (d,el)=>{
  const v = ui.tmp.bb;
  if(d.f==='amount') v.amount = Math.max(0, +el.value||0);
  else if(d.f==='years') v.years = clamp(+el.value||1, 1, +S.settings.bbd.maxYears||1);
  else if(d.f==='q'){ v.q = el.value; bbdBidModal(); return; }
  else v.structId = el.value;
  bbdBidModal();
};
ACT.bbSave = ()=>{
  const v = ui.tmp.bb, me = actingTeam();
  if(!v.playerId) return;
  if(v.amount < (+S.settings.bbd.minBid||0)) return toast('The floor is '+money(S.settings.bbd.minBid),'bad');
  S.bbd.bids.push({id:uid('bb'), teamId:me, playerId:v.playerId, amount:fixInc(v.amount),
    years:v.years, structId:v.structId, rank:myBids(me).length+1, at:Date.now()});
  closeModal(); save(); render(); toast('Sealed','good');
};
ACT.bbRm = (d)=>{
  S.bbd.bids = S.bbd.bids.filter(x=> x.id!==d.id);
  myBids(actingTeam()).forEach((x,i)=> x.rank=i+1);
  save(); render();
};
ACT.bbMove = (d)=>{
  const mine = myBids(actingTeam()), i = mine.findIndex(x=>x.id===d.id), j = i + (+d.d);
  if(i<0 || j<0 || j>=mine.length) return;
  const a = mine[i].rank; mine[i].rank = mine[j].rank; mine[j].rank = a;
  save(); render();
};

function bbdSection(me){

        <th class="right">Years</th><th class="right">Costs now</th><th></th></tr></thead><tbody>
      ${mine.map((x,i)=>{

/* ============================================================
   STANDARD TRADES + THIRD-PARTY COUNTERS
   ============================================================ */
function txMeta(tr){
  if(tr.type==='multi') return {type:'trade', teams:tr.teams||[],
    players:[].concat.apply([], (tr.legs||[]).map(l=>l.players||[]))};
  const cash = (+tr.a.cash||0) + (+tr.b.cash||0);
  const players = [].concat(tr.a.players||[], tr.b.players||[]);
  return { type: (cash && !players.length) ? 'cap' : 'trade',
           teams:[tr.a.teamId, tr.b.teamId], players, cash: cash>0 };
}
/* Trades come in two shapes now, so nothing may reach for .a or .b directly. */
function tradeTeams(tr){
  return tr.type==='multi' ? (tr.teams||[]) : [tr.a && tr.a.teamId, tr.b && tr.b.teamId].filter(Boolean);
}
function tradeAwaits(tr, teamId){
  if(tr.status!=='proposed') return false;
  return tr.type==='multi'
    ? (tr.teams||[]).indexOf(teamId)>=0 && (tr.accepted||[]).indexOf(teamId)<0
    : !!(tr.b && tr.b.teamId===teamId);
}
/* Retention is easy to miss on a trade card, and it is the whole difference
   between a deal that fits and one that does not. */
function retainNote(o){
  const kept = Object.keys(o.retain||{}).filter(pid=>{
    const r = o.retain[pid];
    return isOldRetain(r) || (r && r.byYear && Object.keys(r.byYear).some(y=> +r.byYear[y]>0));
  });
  if(!kept.length) return '';
  return '<div class="tiny good" style="margin-top:5px">'+ kept.map(pid=>{
    const r = o.retain[pid];
    return esc(teamName(o.teamId))+' keeps paying '+ (isOldRetain(r)
      ? r.pct+'% of '+esc(playerName(pid))+' through '+r.through
      : money(sum(Object.keys(r.byYear).map(y=> +r.byYear[y]||0)))+' of '+esc(playerName(pid)));
  }).join(' · ') +'</div>';
}
function tradeLine(tr){
  if(tr.type==='multi') return (tr.teams||[]).map(teamName).join(' ⇄ ');
  const l = (o)=> ((o.players||[]).map(playerName).concat((o.picks||[]).map(id=>{const k=byId(S.picks,id);return k?pickLabel(k):'';})).filter(Boolean).join(', ') || 'nothing') + ((+o.cash)?' + '+money(o.cash):'');
  return esc(teamName(tr.a.teamId)+' sends '+l(tr.a)+' · '+teamName(tr.b.teamId)+' sends '+l(tr.b));
}
function originalAssets(tr){
  const s = {};
  [].concat(tr.a.players, tr.b.players, tr.a.picks, tr.b.picks).forEach(id=> s[id]=1);
  return s;
}
function sideAssetsAfter(tr, side){
  const other = side==='a' ? 'b' : 'a', teamId = tr[side].teamId;
  const out = {}; tr[side].players.forEach(id=>out[id]=1); tr[side].picks.forEach(id=>out[id]=1);
  return {
    players: teamPlayers(teamId).filter(p=>!out[p.id]).map(p=>p.id).concat(tr[other].players),
    picks: S.picks.filter(k=>k.ownerTeamId===teamId && !out[k.id]).map(k=>k.id).concat(tr[other].picks)
  };
}
/* Enough of a snapshot to put a trade back the way it was. */
function tradeSnapshot(tr){
  const ids = {}, kids = {};
  const ct = (tr.counters||[]).find(c=> c.status==='accepted' || c.status==='processed');
  if(tr.type==='multi'){
    (tr.legs||[]).forEach(l=>{ (l.players||[]).forEach(i=>ids[i]=1); (l.picks||[]).forEach(i=>kids[i]=1); });
  } else
  [tr.a, tr.b].forEach(sd=>{ (sd.players||[]).forEach(i=>ids[i]=1); (sd.picks||[]).forEach(i=>kids[i]=1); });
  if(ct) [ct.wants, ct.gives].forEach(sd=>{ (sd.players||[]).forEach(i=>ids[i]=1); (sd.picks||[]).forEach(i=>kids[i]=1); });
  return {
    players: Object.keys(ids).map(id=>{ const p=byId(S.players,id); return p&&p.contract ? {id, t:p.contract.teamId, r:deep(p.contract.retained||[])} : null; }).filter(Boolean),
    picks: Object.keys(kids).map(id=>{ const k=byId(S.picks,id); return k ? {id, t:k.ownerTeamId} : null; }).filter(Boolean),
    adj: S.teams.map(t=>({id:t.id, n:(t.adj||[]).length}))
  };
}
function restoreSnapshot(sn){
  if(!sn) return false;
  (sn.players||[]).forEach(x=>{ const p=byId(S.players,x.id); if(p&&p.contract){ p.contract.teamId=x.t; p.contract.retained=deep(x.r||[]); }});
  (sn.picks||[]).forEach(x=>{ const k=byId(S.picks,x.id); if(k) k.ownerTeamId=x.t; });
  (sn.adj||[]).forEach(x=>{ const t=byId(S.teams,x.id); if(t&&t.adj&&t.adj.length>x.n) t.adj.length=x.n; });
  return true;
}
function undoWindowLeft(tr){
  const h = +S.settings.trades.undoHours||0;
  if(!h || tr.status!=='approved' || !tr.processedAt) return 0;
  return Math.max(0, tr.processedAt + h*3600000 - Date.now());
}
/* ---- Trades still in review ------------------------------------------------
   A trade sitting in review has not moved anybody yet, but it is going to. Any
   other deal a team does in the meantime has to allow for it, or two trades that
   are each fine on their own can put a team over the cap between them. */
function tradesInReview(teamId){
  return (S.trades||[]).filter(tr=>{
    if(tr.status!=='review') return false;
    if(!teamId) return true;
    if(tr.type==='multi') return (tr.teams||[]).indexOf(teamId) >= 0;
    return tr.a.teamId===teamId || tr.b.teamId===teamId;
  });
}
/* What the trades in review would do to this team's cap in a given year.
   Positive means it takes salary ON. */
function pendingCapEffect(teamId, year){
  const list = tradesInReview(teamId);
  if(!list.length) return 0;
  const y = year || S.league.season;
  let delta = 0;
  const hitOf = (pid)=>{ const p = byId(S.players, pid); return p ? grossHit(p, y) : 0; };
  list.forEach(tr=>{
    if(tr.type==='multi'){
      (tr.legs||[]).forEach(leg=>{
        if(leg.fromTeam===teamId) (leg.players||[]).forEach(pid=> delta -= hitOf(pid));
        if(leg.toTeam===teamId)   (leg.players||[]).forEach(pid=> delta += hitOf(pid));
      });
    } else {
      const mine = tr.a.teamId===teamId ? tr.a : tr.b.teamId===teamId ? tr.b : null;
      const other = tr.a.teamId===teamId ? tr.b : tr.b.teamId===teamId ? tr.a : null;
      if(!mine || !other) return;
      (mine.players||[]).forEach(pid=> delta -= hitOf(pid));
      (other.players||[]).forEach(pid=> delta += hitOf(pid));
    }
  });
  return fixCents(delta);
}
/* Space once everything already agreed has gone through. This is what a new
   trade is judged against. */
function capSpaceAfterPending(teamId, year){
  return fixCents(capSpace(teamId, year) - pendingCapEffect(teamId, year));
}
function capRoomAfterPending(teamId, year){
  return fixCents(capSpaceAfterPending(teamId, year) - capFloor());
}
function processTrade(tr){
  if(tr.type==='multi') return processMulti(tr);
  if(tr.status!=='review') return;
  if(S.settings.trades.capMustBeLegal){
    const test = ()=>{
      const snap = deep({p:S.players.map(p=>p.contract?{id:p.id,t:p.contract.teamId}:null), k:S.picks.map(k=>({id:k.id,t:k.ownerTeamId}))});
      moveAssets(tr.a.teamId, tr.b.teamId, {players:tr.a.players, picks:tr.a.picks});
      moveAssets(tr.b.teamId, tr.a.teamId, {players:tr.b.players, picks:tr.b.picks});
      const bad = [tr.a.teamId, tr.b.teamId].find(id=> capSpace(id, S.league.season) < 0);
      snap.p.forEach(x=>{ if(x){ const p=byId(S.players,x.id); if(p&&p.contract) p.contract.teamId=x.t; }});
      snap.k.forEach(x=>{ const k=byId(S.picks,x.id); if(k) k.ownerTeamId=x.t; });
      return bad;
    };
    const bad = test();
    if(bad){
      tr.status='rejected'; tr.reason='Would put '+teamName(bad)+' over the '+S.league.season+' cap';
      notify('Trade rejected', tr.reason, 'bad'); logIt('Trade rejected — '+tr.reason); return;
    }
  }
  tr.undo = tradeSnapshot(tr);
  moveAssets(tr.a.teamId, tr.b.teamId, tr.a);
  moveAssets(tr.b.teamId, tr.a.teamId, tr.b);
  tr.status='approved'; tr.processedAt=Date.now();
  logIt('Trade processed — '+tradeLine(tr), txMeta(tr));
  notify('Trade processed', teamName(tr.a.teamId)+' and '+teamName(tr.b.teamId)+' are done.','good');
  const ch = (tr.counters||[]).find(c=> c.status==='accepted');
  if(ch){
    const target = tr[ch.side].teamId;
    moveAssets(ch.byTeamId, target, ch.gives);
    moveAssets(target, ch.byTeamId, ch.wants);
    ch.status='processed';
    logIt('Follow-on counter processed — '+teamName(ch.byTeamId)+' ⇄ '+teamName(target),
      {type:'trade', teams:[ch.byTeamId, target], players:[].concat(ch.wants.players||[], ch.gives.players||[])});
    notify('Counter processed', teamName(ch.byTeamId)+' picked up assets out of that trade.','good');
  }
}

/* Both builders now keep per-year figures. Anything proposed before that change
   still carries {pct, through} and has to keep working — an old shape is one
   with no byYear on it at all. */
function isOldRetain(r){ return !!(r && !r.byYear && +r.pct); }
function retainToYears(side){
  const out = {};
  Object.keys(side.retain||{}).forEach(pid=>{
    const r = side.retain[pid]; if(!r) return;
    const p = byId(S.players,pid); if(!p || !p.contract) return;
    if(isOldRetain(r)){
      const byYear = {};
      contractYears(p).forEach(x=>{ if(x.year <= (+r.through||S.league.season)) byYear[x.year] = fixInc(x.salary*(+r.pct||0)/100); });
      out[pid] = {byYear};
      return;
    }
    const byYear = {};
    Object.keys(r.byYear||{}).forEach(y=>{ if(+r.byYear[y]>0) byYear[y] = fixInc(+r.byYear[y]); });
    if(Object.keys(byYear).length) out[pid] = {byYear};
  });
  return out;
}
/* Everybody's room, before and after, for every year on the board. */
function capBoard(tr){
  const teams = legTeams(tr).filter(Boolean);
  if(!teams.length) return '';
  const yrs = projYears().slice(0, 5);
  return `<div class="panel" style="margin-top:12px"><div class="ph"><h3>Where this leaves everyone</h3><div class="spacer"></div>
    <span class="tiny dim">updates as you build it</span></div>

      <tr><th></th>${yrs.map(()=>'<th class="right tiny dim">now</th><th class="right tiny dim">after</th>').join('')}</tr></thead>
    <tbody>${teams.map(t=>`<tr><td>${esc(teamName(t))}${
        pendingCapEffect(t, S.league.season) ? ' <span class="tiny warn">deal in review</span>' : ''}</td>
      ${yrs.map(y=>{
        /* "Now" allows for anything already agreed and waiting to go through,
           so two trades cannot quietly stack a team over the cap. */
        const now = capSpaceAfterPending(t,y), after = fixCents(now + tradeCapDelta(tr,t,y));
        const moved = Math.abs(after-now) > 0.004;
        return '<td class="right num dim">'+money(now,{plus:true})+'</td>'+
               '<td class="right num '+(after<0?'bad':moved?'good':'dim')+'">'+money(after,{plus:true})+'</td>';
      }).join('')}</tr>`).join('')}
    </tbody></table></div>
    ${(()=>{
      const pend = teams.filter(t=> pendingCapEffect(t, S.league.season));
      if(!pend.length) return '';
      return '<div class="pb"><div class="hint warn">'+pend.map(t=>{
        const d = pendingCapEffect(t, S.league.season);
        return esc(teamName(t))+' already has a trade in review worth '+money(Math.abs(d))+
          (d>0?' coming on':' coming off')+' the '+S.league.season+' cap';
      }).join('; ')+'. The figures above allow for it.</div></div>';
    })()}
    ${(()=>{ const bad = multiLegal(tr), lim = limitAfterTrade(tr);
      return (bad.length
        ? '<div class="pb"><div class="hint bad">'+bad.slice(0,4).map(b=>
            esc(teamName(b.team))+' would be '+money(b.over)+' over in '+b.year).join(' · ')+
            (bad.length>4?' and more':'')+'</div></div>'
        : '<div class="pb"><div class="hint good">Everybody stays under the cap in every year shown.</div></div>')
        + (lim.length
          ? '<div class="pb" style="padding-top:0"><div class="hint '+(limitBinds('trades')?'bad':'')+'">'+

              '+ years, against an allowance of '+x.allow+' — taking on '+esc(x.player)).join(' · ')+
            (limitBinds('trades')
              ? '. Trades are held to the limits, so this will not process.'
              : '. Trades are allowed past the limits, so it goes through — but they cannot then extend or sign anybody until it comes back down.')+
            '</div></div>'
          : '');
    })()}
  </div>`;
}

/* Cap dollars are one figure per side, not a list — so this always REPLACES
   what is there rather than adding to it. Typing 0 clears it, same as the ×
   on the chip. An empty box is treated as "changed my mind", not as zero. */
function setCashFrom(sel, put, form){
  const box = $(sel); if(!box) return;
  const raw = String(box.value==null?'':box.value).trim();
  if(raw==='') return;
  put(Math.max(0, fixInc(+raw||0)));
  $('#modalBox .mb').innerHTML = (form||tradeForm)();
}
/* Redraw a modal without throwing the cursor out of whatever box is being
   typed in. The main view has done this since forever inside render(); modals
   never got it, which is why a percentage could not be typed past its first
   digit — the redraw after "1" destroyed the input before "00" arrived.
   Fields opt in by carrying a data-k. */
/* Replaces the board and nothing else. Rebuilding the whole form on every
   keystroke is what made these fields untypeable: an <input type="number">
   does not support setSelectionRange, so once the element is destroyed the
   caret cannot be put back and the next digit lands somewhere else — or
   nowhere. The percentage box has always worked precisely because it redraws
   nothing. Now none of them do. */
function refreshCapBoard(){
  const box = $('#capBoardBox');
  if(box) box.innerHTML = capBoard(builderTrade());
  else remodal(tradeForm());
}
function remodal(html){
  const box = $('#modalBox .mb'); if(!box) return;
  const ae = document.activeElement;
  const k = ae && ae.dataset ? (ae.dataset.k || null) : null;
  let ss=null, se=null;
  try{ ss = ae.selectionStart; se = ae.selectionEnd; }catch(e){}
  box.innerHTML = html;
  if(!k) return;
  const el = $('#modalBox .mb [data-k="'+k+'"]');
  if(el){ el.focus(); try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} }
}
/* "12." and "-" are half-typed, not numbers. Redrawing on them rewrites the box
   and eats the next keystroke, so we wait until it settles. */
function midNumber(v){ const t=String(v==null?'':v); return t==='' || /[.\-+eE]$/.test(t); }

      by:actingTeam(),

/* Who put this offer up. Older trades did not record it, so fall back to the
   side that is giving — that is always the proposer on a standard trade. */
function tradeProposer(tr){ return tr && (tr.by || (tr.a && tr.a.teamId) || null); }
/* An offer has to be accepted by the other side. */
function canAcceptTrade(tr){
  if(!tr) return 'that offer has gone';
  const me = actingTeam();
  if(me === tradeProposer(tr)) return 'you put this offer up — '+
    (tr.type==='multi' ? 'the other teams' : teamName((tr.b||{}).teamId)) + ' has to accept it';
  if(tr.type!=='multi' && tr.b && tr.b.teamId && me !== tr.b.teamId)
    return 'only '+teamName(tr.b.teamId)+' can accept this one';
  return null;
}

    const incoming = tr[ct.side==='a'?'b':'a'];
    const bad = [].concat(ct.wants.players, ct.wants.picks).some(id=> incoming.players.indexOf(id)>=0 || incoming.picks.indexOf(id)>=0);
    if(bad) return toast('That asset only arrives if the original trade goes through — switch counters to follow-on mode in Settings','bad');
  }
  tr.counters.unshift({id:uid('c'), byTeamId:actingTeam(), side:ct.side, wants:deep(ct.wants), gives:deep(ct.gives), at:Date.now(), status:'pending'});
  tr.log.unshift({at:Date.now(), text:teamName(actingTeam())+' countered '+teamName(tr[ct.side].teamId)});
  notify('Counter filed', teamName(actingTeam())+' is trying to break into the '+teamName(tr.a.teamId)+'/'+teamName(tr.b.teamId)+' trade.','warn');
  closeModal(); save(); render(); toast('Counter filed','good');
};
ACT.acceptCounter = (d)=>{

    tr.status='replaced'; tr.log.unshift({at:Date.now(), text:'Voided — replaced by '+teamName(ct.byTeamId)+"'s counter"});
    const nt = {id:uid('tr'), type:'standard',

      status:'review', createdAt:Date.now(), acceptedAt:Date.now(), clock:newClock(S.settings.trades.reviewHours), counters:[],
      log:[{at:Date.now(), text:'Created from a counter that replaced an earlier trade'}]};

/* Pictures and clips are held inside the league, so they count against the
   browser's allowance. Keep the most recent and drop the pictures off older
   messages — the words always stay. */
const CHAT_MEDIA_BUDGET = 1200000;   /* about 1.2MB of pictures and clips */
function trimChatMedia(){
  const withMedia = (S.chat||[]).filter(m=> m.media && m.media.src);
  let total = 0;
  withMedia.forEach(m=> total += String(m.media.src).length);
  if(total <= CHAT_MEDIA_BUDGET) return 0;
  let dropped = 0;
  for(let i=0; i<withMedia.length && total > CHAT_MEDIA_BUDGET; i++){
    const m = withMedia[i];                       /* oldest first */
    total -= String(m.media.src).length;
    m.media = null;
    m.mediaGone = true;
    dropped++;
  }
  return dropped;
}
ACT.chatSend = ()=>{

  const notify = c.notify || 'none';
  S.chat = S.chat || [];
  S.chat.push({id:uid('c'), at:Date.now(), teamId:me.id, text:text.trim().slice(0,1000), media, notify});
  trimChatMedia();
  if(S.chat.length>500) S.chat.splice(0, S.chat.length-500);
  /* By default a message just posts to the chat and notifies no one. It only
     pushes a notification if the sender picked one — and that still respects each
     recipient's own chat-notification preference. */
  if(notify && notify!=='none'){
    const preview = text.trim().slice(0,80) || (media? (media.kind==='video'?'sent a video':media.kind==='gif'?'sent a GIF':'sent a photo'):'');

      S.teams.forEach(t=>{ if(t.id!==me.id) maybeNotify('chat', me.name, preview, 'info', t.id); });
    } else {

    }

  ui.tmp.chat = {text:'', media:null, notify, gifOpen:false, gifUrl:''};   /* keep the notify choice */
  save(); render();

};

/* Who you play and when, across the season. */
function scheduleRows(teamId){
  const weeks = fixtureWeeks();
  const list = weeks.length ? weeks : Array.from({length:seasonWeeks()},(_,i)=>i+1);
  return list.map(w=>{
    const set = fixturesFor(w);
    const g = set.find(x=> x.home===teamId || x.away===teamId);
    const played = (S.schedule||[]).find(x=> +x.week===+w && (x.home===teamId || x.away===teamId));
    if(!g && !played) return {week:w, opp:null};
    const home = g ? g.home===teamId : played.home===teamId;
    const opp  = g ? (home? g.away : g.home) : (home? played.away : played.home);
    let mine=null, theirs=null;
    if(played){
      mine   = home ? played.hp : played.ap;
      theirs = home ? played.ap : played.hp;
    }
    return {week:w, opp, home, mine, theirs, done:!!played};
  });
}

              <div class="tiny dim" style="margin:5px 0 3px">and sends</div>${assetChips(ct.gives)}</div>
            <div class="right">${ct.status==='pending' ? ((me===tr[ct.side].teamId||isCommish())
                ? '<button class="btn sm pri" data-a="acceptCounter" data-id="'+tr.id+'" data-cid="'+ct.id+'">Accept</button> <button class="btn sm ghost" data-a="declineCounter" data-id="'+tr.id+'" data-cid="'+ct.id+'">Decline</button>'
                : '<span class="pill">Pending</span>')
              : '<span class="pill '+(ct.status==='declined'?'':'ok')+'">'+ct.status+'</span>'}</div>
          </div></div>`).join('')}`:''}
        <div class="hr"></div><div class="log">${(tr.log||[]).slice(0,5).map(l=>'<div><span class="dim">'+dstr(l.at)+'</span> — '+esc(l.text)+'</div>').join('')}</div>
      </div></div>`;
  };

  return `
  <div class="section">
    <header><div><div class="eyebrow">${review.length} in review · ${inbox.length} waiting on an answer</div><h1>Trades</h1></div>
      <div class="spacer"></div>${actAsBar()}<button class="btn pri" data-a="newTrade">Propose a trade</button></header>

    <div class="tabs">
      <button class="${sub==='review'?'on':''}" data-a="sub" data-s="review">In review (${review.length})</button>
      <button class="${sub==='inbox'?'on':''}" data-a="sub" data-s="inbox">Offers (${inbox.length})</button>
      <button class="${sub==='hist'?'on':''}" data-a="sub" data-s="hist">History</button>
      <button class="${sub==='rules'?'on':''}" data-a="sub" data-s="rules">Timing rules</button>
    </div>

    ${sub==='review' ? '<div class="stack">'+(review.map(card).join('') ||
      '<div class="panel"><div class="empty-state"><h3>Nothing in review</h3><p>Accepted trades wait here while the rest of the league gets a look.</p></div></div>')+'</div>' : ''}
    ${sub==='inbox' ? '<div class="stack">'+(inbox.map(card).join('') ||
      '<div class="panel"><div class="empty-state"><h3>No open offers</h3></div></div>')+'</div>' : ''}
    ${sub==='hist' ? '<div class="stack">'+(hist.map(card).join('') ||
      '<div class="panel"><div class="empty-state"><h3>No completed trades yet</h3></div></div>')+'</div>' : ''}
    ${sub==='rules' ? `<div class="grid g2">
      <div class="panel"><div class="ph"><h3>Clocks</h3></div><div class="pb grid g2">
        <label class="f"><span>Review window (hours)</span><input type="number" min="0" data-set="settings.trades.reviewHours" value="${c.reviewHours}"></label>
        <label class="f"><span>Auction clock (hours)</span><input type="number" min="0" data-set="settings.trades.auctionHours" value="${c.auctionHours}"></label>
        <label class="check" style="grid-column:1/-1"><input type="checkbox" data-set="settings.trades.antiSnipeOn" ${c.antiSnipeOn?'checked':''}>
          <span>Reset the clock when an offer lands near the end</span></label>
        <label class="f"><span>Counts as “near the end”</span>
          <input type="number" min="0" data-set="settings.trades.antiSnipeWithinMin" value="${c.antiSnipeWithinMin}"></label>
        <label class="f"><span>Reset the clock to</span>
          <input type="number" min="0" data-set="settings.trades.antiSnipeExtendMin" value="${c.antiSnipeExtendMin}"></label>
        <label class="f" style="grid-column:1/-1"><span>Those two numbers are in</span>
          <select data-set="settings.trades.antiSnipeUnit">

        <label class="f" style="grid-column:1/-1"><span>Reverse a processed trade within (hours, 0 for never)</span>

          <span>Stop every countdown overnight. Offers, acceptances and counters still work — the clock just holds.</span></label>
        <div class="grid g2">
          <label class="f"><span>Clocks stop at</span><input type="time" data-set="settings.trades.quiet.from" value="${esc(c.quiet.from)}"></label>

        </div>
        <div class="hint">${c.quiet.on?'Right now the clocks are '+(isQuietNow()?'paused, resuming at '+fmtHM(c.quiet.to):'running, and will pause at '+fmtHM(c.quiet.from))+'.':'Clocks run around the clock.'}</div>
      </div></div>
      <div class="panel"><div class="ph"><h3>Auction behaviour</h3></div><div class="pb stack">
        <label class="check"><input type="checkbox" data-set="settings.trades.allowCompeting" ${c.allowCompeting?'checked':''}>
          <span>Let other teams keep bidding after the ask has been met</span></label>
        <label class="check"><input type="checkbox" data-set="settings.trades.ownerMustAccept" ${c.ownerMustAccept?'checked':''}>
          <span>An offer only takes the lead when the posting owner accepts it</span></label>
        <label class="check"><input type="checkbox" data-set="settings.trades.mustMeetAsk" ${c.mustMeetAsk?'checked':''}>
          <span>Reject offers valued below the asking price</span></label>
        <label class="check"><input type="checkbox" data-set="settings.trades.capMustBeLegal" ${c.capMustBeLegal?'checked':''}>

      </div></div>
      <div class="panel"><div class="ph"><h3>Counters</h3></div><div class="pb stack">
        <label class="check"><input type="checkbox" data-set="settings.trades.counters.on" ${c.counters.on?'checked':''}>
          <span>Allow other teams to counter a trade during its review window</span></label>
        <label class="check"><input type="checkbox" data-set="settings.trades.counters.mustIncludeOriginal" ${c.counters.mustIncludeOriginal?'checked':''}>

        <label class="f"><span>Which side can be countered</span>
          <select data-set="settings.trades.counters.side">
            <option value="either"${c.counters.side==='either'?' selected':''}>Either side</option>
            <option value="a"${c.counters.side==='a'?' selected':''}>Only the team that proposed</option>
            <option value="b"${c.counters.side==='b'?' selected':''}>Only the team that accepted</option></select></label>
        <label class="f"><span>When a counter is accepted</span>
          <select data-set="settings.trades.counters.outcome">
            <option value="chain"${c.counters.outcome==='chain'?' selected':''}>Original processes first, then the counter</option>
