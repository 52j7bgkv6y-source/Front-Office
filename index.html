<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1A24">
<title>Front Office — Dynasty Cap Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1A24;          /* deep ink navy field */
  --ink-2:#16232F;        /* panel */
  --ink-3:#1D2E3D;        /* raised */
  --rule:#2A3F52;         /* hairline */
  --rule-soft:#213445;
  --bone:#E9EFF4;         /* primary text */
  --mute:#8CA3B6;         /* secondary text */
  --dim:#5F7387;          /* tertiary */
  --brass:#E5A13C;        /* money / primary accent */
  --brass-dim:#8A6A22;
  --signal:#FF5C39;       /* clock, over cap, danger */
  --sage:#5BC496;         /* under cap, paid, good */
  --chalk:#7FB2D9;        /* info / links */
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  --r:4px;
  --nav-w:232px;
  --disp:"Barlow Condensed", "Oswald", "Arial Narrow", sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--bone);
  font:400 15px/1.5 var(--body);
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
body::before{ /* ledger rule texture, very quiet */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.014) 0 1px, transparent 1px 34px);
}
a{color:var(--chalk);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}

/* ── type ─────────────────────────────────────────────── */
.eyebrow{font:600 12px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
h2{font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:16px;line-height:1.2;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass)}
.muted{color:var(--mute)}
.dim{color:var(--dim)}
.good{color:var(--sage)}
.bad{color:var(--signal)}
.tiny{font-size:12px}
.center{text-align:center}
.right{text-align:right}
.nowrap{white-space:nowrap}

/* ── layout ───────────────────────────────────────────── */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
#rail{
  width:var(--nav-w);flex:0 0 var(--nav-w);border-right:1px solid var(--rule);
  background:linear-gradient(180deg,#132030,#0F1A24 60%);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--rule)}
.brand .mark{display:flex;align-items:baseline;gap:8px}
.brand .mark b{font:700 22px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.brand .mark span{font:600 11px/1 var(--disp);letter-spacing:.2em;color:var(--brass);text-transform:uppercase}
.brand .leaguename{margin-top:8px;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railscroll{overflow-y:auto;flex:1;padding:8px 0 16px}
.navgroup{padding:12px 16px 4px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--mute);
  font-size:14px;border-left:2px solid transparent;
}
.nav a .ic{width:18px;text-align:center;font-size:14px;opacity:.85;flex:0 0 18px}
.nav a:hover{background:rgba(255,255,255,.035);color:var(--bone);text-decoration:none}
.nav a.on{color:var(--bone);background:rgba(229,161,60,.09);border-left-color:var(--brass)}
.nav a .badge{margin-left:auto}
.badge{
  font:500 11px/1 var(--mono);padding:3px 6px;border-radius:999px;
  background:var(--signal);color:#fff;
}
.badge.q{background:var(--rule);color:var(--mute)}
.railfoot{padding:12px 16px;border-top:1px solid var(--rule);font-size:12px;color:var(--dim)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 22px;border-bottom:1px solid var(--rule);
  background:rgba(15,26,36,.93);backdrop-filter:blur(10px);
}
#topbar .spacer{flex:1}
.capchip{display:flex;flex-direction:column;gap:2px;padding:2px 12px;border-left:1px solid var(--rule)}
.capchip .k{font:600 10px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.capchip .v{font:500 15px/1.1 var(--mono)}
#view{padding:22px;max-width:1480px;width:100%}
.section{margin-bottom:30px}
.section>header{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section>header .spacer{flex:1}
.hr{height:1px;background:var(--rule);margin:18px 0}

/* ── panels & grids ───────────────────────────────────── */
.panel{background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--rule-soft)}
.panel>.ph .spacer{flex:1}
.panel>.pb{padding:14px}
.panel>.pb.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

/* ── stat tiles ───────────────────────────────────────── */
.tile{background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);padding:13px 14px}
.tile .k{font:600 10px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tile .v{margin-top:7px;font:500 24px/1 var(--mono);letter-spacing:-.02em}
.tile .s{margin-top:6px;font-size:12px;color:var(--mute)}

/* ── controls ─────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 13px;border:1px solid var(--rule);background:var(--ink-3);color:var(--bone);
  border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:500;
  transition:background .12s,border-color .12s,transform .06s;white-space:nowrap;
}
.btn:hover{background:#25394B;border-color:#375168}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#231704;font-weight:600}
.btn.pri:hover{background:#F2AE49;border-color:#F2AE49}
.btn.danger{background:transparent;border-color:#5C3227;color:var(--signal)}
.btn.danger:hover{background:#3A1E17}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{border-color:var(--brass);color:var(--brass)}

label.f{display:block}
label.f>span, .flabel{
  display:block;margin-bottom:5px;
  font:600 10.5px/1 var(--disp);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{
  width:100%;padding:8px 10px;background:#101C27;border:1px solid var(--rule);
  border-radius:var(--r);color:var(--bone);
}
input[type=number],input.num,td input{font-family:var(--mono)}
textarea{min-height:90px;resize:vertical;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--brass);outline:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brass);margin:0}
.check{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;line-height:1.35}
.check input{margin-top:2px;flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{padding:6px 11px;background:transparent;border:0;border-right:1px solid var(--rule);cursor:pointer;font-size:12.5px;color:var(--mute)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brass);color:#231704;font-weight:600}
.hint{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.45}

/* ── tables ───────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
th{
  font:600 10.5px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--ink-2);
}
td{padding:8px 10px;border-bottom:1px solid var(--rule-soft);font-size:13.5px;vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.022)}
tr.tot td{border-top:1px solid var(--rule);border-bottom:0;font-weight:600}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pos{
  display:inline-block;min-width:34px;text-align:center;padding:2px 5px;border-radius:3px;
  font:600 10.5px/1.5 var(--disp);letter-spacing:.09em;border:1px solid;
}
.pos.QB{color:#F27E7E;border-color:#5E2F2F;background:#2A1A1A}
.pos.RB{color:#7FD48F;border-color:#2E5537;background:#16281B}
.pos.WR{color:#78B6E8;border-color:#2C4A66;background:#152431}
.pos.TE{color:#E3B05E;border-color:#5C4526;background:#2A2113}
.pos.K{color:#B39CE0;border-color:#453963;background:#1F1B2C}
.pos.DEF,.pos.DST{color:#8FA3B6;border-color:#33475A;background:#1A2532}

/* ── cap ladder (signature) ───────────────────────────── */
.ladder{--yc:6;font-family:var(--mono)}
.ladder .lhead{display:grid;grid-template-columns:190px repeat(var(--yc),minmax(74px,1fr));gap:2px;position:sticky;top:0;background:var(--ink-2);z-index:2}
.ladder .lhead div{padding:8px 6px;font:600 11px/1 var(--disp);letter-spacing:.12em;color:var(--dim);text-align:center;border-bottom:1px solid var(--rule)}
.ladder .lhead div:first-child{text-align:left}
.ladder .lrow{display:grid;grid-template-columns:190px repeat(var(--yc),minmax(74px,1fr));gap:2px;align-items:stretch;border-bottom:1px solid var(--rule-soft)}
.ladder .lname{padding:7px 8px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.ladder .lname .pn{font:500 13px/1.15 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder .lname .pm{font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}
.cell{position:relative;display:flex;align-items:flex-end;padding:4px 3px;min-height:44px}
.cell .bar{
  width:100%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#E5A13C,#B87C22);
  position:relative;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.3,1);
}
.cell.void .bar{background:linear-gradient(180deg,#4A5F72,#33475A)}
.cell .amt{position:absolute;inset:auto 0 4px 0;text-align:center;font-size:10.5px;color:#231704;font-weight:600}
.cell.small .amt{color:var(--brass);bottom:auto;top:2px}
.cell.empty{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.022) 6px 12px)}
.capline{display:grid;grid-template-columns:190px repeat(var(--yc),minmax(74px,1fr));gap:2px;border-top:1px solid var(--rule);margin-top:2px}
.capline>div{padding:8px 6px;text-align:center;font-size:12px}
.capline>div:first-child{text-align:left;font:600 11px/1 var(--disp);letter-spacing:.12em;color:var(--dim);display:flex;align-items:center}
.meter{height:5px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--sage);border-radius:3px;transition:width .4s}
.meter i.over{background:var(--signal)}
.meter i.warn{background:var(--brass)}

/* ── structure sparkline ──────────────────────────────── */
.spark{display:flex;align-items:flex-end;gap:2px;height:26px}
.spark i{flex:1;background:var(--brass);opacity:.85;border-radius:1px 1px 0 0;min-height:2px}
.spark.back i{background:var(--chalk)}
.spark.even i{background:var(--sage)}

/* ── clock ────────────────────────────────────────────── */
.clock{font:600 26px/1 var(--mono);letter-spacing:.02em;color:var(--signal);font-variant-numeric:tabular-nums}
.clock.calm{color:var(--brass)}
.clock.paused{color:var(--dim);position:relative}
.clock.paused::after{content:"";position:absolute;left:0;right:0;top:52%;height:1px;background:repeating-linear-gradient(to right,var(--dim) 0 4px,transparent 4px 8px)}
.pauseflag{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;
  border:1px dashed var(--rule);color:var(--mute);font-size:11.5px;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--rule);font:600 10.5px/1.6 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
}
.pill.live{border-color:#5C3227;color:var(--signal)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal);animation:blink 1.4s infinite}
.pill.ok{border-color:#2E5537;color:var(--sage)}
.pill.warn{border-color:#5C4526;color:var(--brass)}
.pill.waiver{border-color:#4A5F72;color:#9DB4C8;background:#1A2532;letter-spacing:.1em;font-weight:700}
.pill.waiver.dim{opacity:.55}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── misc ─────────────────────────────────────────────── */
.assetbox{border:1px solid var(--rule-soft);border-radius:var(--r);padding:9px 11px;background:#101C27}
.assetbox+.assetbox{margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;background:var(--ink-3);border:1px solid var(--rule);border-radius:999px;font-size:12px;margin:2px 3px 2px 0}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.chip button:hover{color:var(--signal)}
.empty-state{padding:30px 18px;text-align:center;color:var(--dim)}
.empty-state h3{color:var(--mute);margin-bottom:8px}
.log{font-family:var(--mono);font-size:12px;color:var(--mute);max-height:230px;overflow-y:auto}
.log div{padding:4px 0;border-bottom:1px solid var(--rule-soft)}
.feed div{padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:13px}
.feed b{color:var(--bone);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right;font-family:var(--mono)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto;margin-bottom:16px}
.tabs button{
  padding:9px 14px;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--mute);cursor:pointer;font:600 12px/1 var(--disp);letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
}
.tabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.tabs button:hover{color:var(--bone)}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,11,16,.72)}
#modal.on{display:flex}
#modal .box{background:var(--ink-2);border:1px solid var(--rule);border-radius:6px;max-width:760px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
#modal .mh{position:sticky;top:0;background:var(--ink-2);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule);z-index:1}
#modal .mb{padding:16px}
#modal .mf{position:sticky;bottom:0;background:var(--ink-2);display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--rule)}

/* toast */
#toasts{position:fixed;z-index:200;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
.toast{
  background:var(--ink-3);border:1px solid var(--rule);border-left:3px solid var(--brass);
  border-radius:var(--r);padding:11px 13px;font-size:13.5px;box-shadow:var(--shadow);animation:tin .22s ease-out;
}
.toast.bad{border-left-color:var(--signal)}
.toast.good{border-left-color:var(--sage)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── mascot brawl ─────────────────────────────────────── */
.arena{position:relative;border-radius:var(--r);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 8%, #1E3145 0%, #14202C 55%, #0E1721 100%)}
.arena svg{display:block;width:100%;height:auto}
.arena .floor{fill:#0B131B}
.fo-anim{transform-box:fill-box;transform-origin:50% 100%}
/* The parent only carries the weight shift. Everything with character in it
   happens at the joints below, so the two never fight each other. */
.fo-idle{animation:foBob 3.4s ease-in-out infinite}
.fo-win{animation:foStrut 1.6s ease-in-out infinite}
.fo-lose{animation:foTrudge 4s ease-in-out infinite}
.fo-out{animation:foSag 4.5s ease-in-out infinite}
@keyframes foBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes foStrut{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}}
@keyframes foTrudge{0%,100%{transform:translateY(1px)}50%{transform:translateY(3px)}}
@keyframes foSag{0%,100%{transform:translateY(4px)}50%{transform:translateY(6px)}}
/* Joints. Arms swing from the shoulder, legs from the hip, the torso folds at
   the waist and the head turns on the neck. */
.m-armL,.m-armR,.m-legL,.m-legR,.m-torso,.m-head{transform-box:fill-box}
.m-armL{transform-origin:100% 42%}
.m-armR{transform-origin:0% 42%}
.m-legL,.m-legR{transform-origin:50% 4%}
.m-torso{transform-origin:50% 100%}
.m-head{transform-origin:50% 96%}

/* breathing, so nobody stands like a shop dummy */
.fo-idle .m-torso{animation:brTorso 3.4s ease-in-out infinite}
.fo-idle .m-armL{animation:brArmL 3.4s ease-in-out infinite}
.fo-idle .m-armR{animation:brArmR 3.4s ease-in-out infinite}
.fo-idle .m-head{animation:brHead 5.2s ease-in-out infinite}
@keyframes brTorso{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes brArmL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}
@keyframes brArmR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes brHead{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}

/* winning: a bit of a strut, arms pumping */
.fo-win .m-armL{animation:winArmL 1.6s ease-in-out infinite}
.fo-win .m-armR{animation:winArmR 1.6s ease-in-out infinite}
.fo-win .m-legL{animation:winLegL 1.6s ease-in-out infinite}
.fo-win .m-legR{animation:winLegR 1.6s ease-in-out infinite}
.fo-win .m-head{animation:winHead 1.6s ease-in-out infinite}
@keyframes winArmL{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-42deg)}}
@keyframes winArmR{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(42deg)}}
@keyframes winLegL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg)}}
@keyframes winLegR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(9deg)}}
@keyframes winHead{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-5deg) translateY(-3px)}}

/* losing: shoulders drop, head hangs */
.fo-lose .m-torso{animation:loseTorso 4s ease-in-out infinite}
.fo-lose .m-head{animation:loseHead 4s ease-in-out infinite}
.fo-lose .m-armL{animation:loseArmL 4s ease-in-out infinite}
.fo-lose .m-armR{animation:loseArmR 4s ease-in-out infinite}

/* ============================================================
   CONTRACT + CAP MATH
   ============================================================ */
function structById(id){ const a=S.settings.contracts.structures; return byId(a,id) || a[0]; }

/* Percentage of total value paid in each year of a contract. */
function structPct(st, years){
  years = clamp(years|0, 1, 20);
  const ov = st.overrides && st.overrides[years];
  let w;
  if(ov && ov.length === years && sum(ov) > 0){ w = ov.map(x=> Math.max(0, +x||0)); }
  else{
    w = [];
    for(let i=0;i<years;i++){
      if(st.mode==='even') w.push(1);
      else if(st.mode==='front') w.push(Math.pow(st.ratio, years-1-i));
      else w.push(Math.pow(st.ratio, i));
    }
  }
  const t = sum(w) || 1;
  return w.map(x=> x/t*100);
}

/* Split a total into per-year salaries; largest-remainder keeps the sum exact. */
function salariesFor(total, years, structId){
  years = clamp(years|0, 1, 20);
  const p = structPct(structById(structId), years);
  const inc = +S.settings.cap.increment || 1;
  const rule = +S.settings.contracts.minSalary || 0;
  // The league minimum can't be honoured if the whole deal is worth less than
  // one minimum per year — in that case the total wins and the UI flags it.
  const min = total >= years*rule ? rule : 0;
  const raw = p.map(x=> total*x/100);
  const base = raw.map(x=> Math.max(min, Math.floor(x/inc+1e-9)*inc));
  let left = Math.round((total - sum(base))/inc);
  const order = raw.map((x,i)=>({i, r:x-base[i]})).sort((a,b)=> b.r-a.r);
  let k=0;
  while(left>0 && order.length){ base[order[k%order.length].i]+=inc; left--; k++; if(k>4000) break; }
  let guard=0;
  while(left<0 && guard++<4000){
    const big = base.map((v,i)=>({i,v})).sort((a,b)=> b.v-a.v);
    const hit = big.find(o=> base[o.i]-inc >= min);
    if(!hit) break;
    base[hit.i]-=inc; left++;
  }
  return base.map(fixInc);
}
function makeContract(teamId,total,years,structId,startYear){
  return { teamId, total:fixInc(total), years:clamp(years|0,1,20), structId,
           startYear:startYear|0, salaries:salariesFor(total,years,structId), signedAt:Date.now() };
}
/* Where a player is sitting. Taxi and practice squad are off the cap
   entirely; injured reserve is not, except for the part a season-ending
   designation gives back. */
function playerSlot(p){ return (p && p.slot) || 'active'; }
function onTaxi(p){ return playerSlot(p)==='taxi'; }
function onIR(p){ return playerSlot(p)==='ir'; }
function onPractice(p){ return playerSlot(p)==='practice'; }
function offCap(p){ return onTaxi(p) || onPractice(p); }
function isRetired(p){ return !!(p && p.retired); }
const SLOT_LABEL = {active:'Active', taxi:'Taxi', ir:'IR', practice:'Practice squad'};
function slotTag(p){

  if(sl==='active') return '';
  const cls = sl==='ir' ? 'live' : '';

function seasonWeeks(){ return clamp(+S.settings.roster.seasonWeeks||17, 1, 25); }
function weeksLeft(){ return clamp(seasonWeeks() - (+S.live.week||1) + 1, 0, seasonWeeks()); }
function irRelief(p, year){

/* What the deal is worth in that year before anyone eats any of it. */
function grossHit(p, year){
  const c = p && p.contract; if(!c) return 0;
  const i = year - c.startYear;
  return (i>=0 && i<c.years) ? (+c.salaries[i]||0) : 0;
}
/* Salary a former team agreed to keep paying, for a year. */
function retainedOn(p, year){
  const c = p && p.contract; if(!c || !c.retained) return 0;
  return fixInc(sum(c.retained.filter(r=> r.teamId !== c.teamId).map(r=> +((r.amounts||{})[year])||0)));
}
/* What the team that owns him now actually carries. */
function capHit(p, year){
  if(offCap(p)) return 0;
  return fixInc(Math.max(0, grossHit(p,year) - retainedOn(p,year) - irRelief(p,year)));
}
function teamRetained(teamId, year){
  let t = 0;
  S.players.forEach(p=>{
    const c = p.contract; if(!c || c.teamId===teamId || !c.retained) return;
    c.retained.forEach(r=>{ if(r.teamId===teamId) t += +((r.amounts||{})[year])||0; });
  });
  return fixInc(t);
}
function retainedList(teamId){
  const out = [];
  S.players.forEach(p=>{
    const c = p.contract; if(!c || c.teamId===teamId || !c.retained) return;
    c.retained.forEach(r=>{ if(r.teamId===teamId) out.push({player:p, r}); });
  });
  return out;
}
/* Eating salary: the sending team keeps a slice of every remaining year
   through the year they agreed to. */
function applyRetention(playerId, payerTeamId, pctOrAmt, throughYear, mode){
  const p = byId(S.players, playerId), c = p && p.contract;
  if(!c || !pctOrAmt) return;
  const amounts = {};
  for(let i=0;i<c.years;i++){
    const y = c.startYear+i;
    if(y < S.league.season || y > throughYear) continue;
    const gross = +c.salaries[i]||0;
    const amt = mode==='amt' ? Math.min(gross, +pctOrAmt||0) : gross*(+pctOrAmt||0)/100;
    if(amt>0) amounts[y] = fixInc(amt);
  }
  if(!Object.keys(amounts).length) return;
  c.retained = (c.retained||[]).filter(r=> r.teamId!==payerTeamId);
  c.retained.push({teamId:payerTeamId, pct:(mode==='amt'?null:+pctOrAmt), mode:mode||'pct', through:throughYear, amounts, at:Date.now()});
}
function capForYear(year){
  const c = S.settings.cap;
  const ov = c.overrides && c.overrides[year];
  if(ov!=null && ov!=='' && !isNaN(+ov)) return fixInc(+ov);
  const n = Math.max(0, year - S.league.season);
  return fixInc(c.growthMode==='pct' ? c.base*Math.pow(1+(+c.growthValue||0)/100, n) : (+c.base||0) + (+c.growthValue||0)*n);
}
function teamPlayers(teamId){ return S.players.filter(p=> p.contract && p.contract.teamId===teamId); }
function slotPlayers(teamId, slot){ return teamPlayers(teamId).filter(p=> playerSlot(p)===slot); }
function activeCount(teamId){ return slotPlayers(teamId,'active').length; }
function slotRoom(teamId, slot){
  const cap = slot==='taxi' ? +S.settings.roster.taxi||0
            : slot==='ir' ? +S.settings.roster.ir||0
            : slot==='practice' ? +S.settings.roster.practice||0
            : +S.settings.roster.maxRoster||0;

}
function teamDead(teamId,year){ const t=byId(S.teams,teamId); return t? fixInc(sum((t.dead||[]).filter(d=>d.year===year).map(d=>d.amount))) : 0; }
function teamAdj(teamId,year){ const t=byId(S.teams,teamId); return t? fixInc(sum((t.adj||[]).filter(d=>d.year===year).map(d=>d.amount))) : 0; }
function teamCommitted(teamId, year){
  return fixInc(sum(teamPlayers(teamId).map(p=> capHit(p,year)))

/* Unused cap can be carried forward, within whatever limit the league voted. */
let capCache = {}, dppCache = null;
function clearCapCache(){ capCache = {}; }
function rolloverInto(teamId, year){
  const r = S.settings.cap.rollover;
  if(!r || !r.on || year <= S.league.season) return 0;
  const k = teamId+':'+year;
  if(capCache[k]!=null) return capCache[k];
  capCache[k] = 0;                                  // guards against a loop
  const prev = year-1;
  const unused = teamCapForYear(teamId, prev) - teamCommitted(teamId, prev);
  let out = 0;
  if(unused > 0){
    const cap = capForYear(prev);
    const lim = r.mode==='all' ? unused : r.mode==='pct' ? cap*(+r.value||0)/100 : (+r.value||0);
    let carry = Math.min(unused, Math.max(0, lim));
    if(r.max!=='' && r.max!=null && !isNaN(+r.max)) carry = Math.min(carry, Math.max(0, +r.max));
    out = fixInc(carry);
  }
  capCache[k] = out;
  return out;
}
function teamCapForYear(teamId, year){ return fixInc(capForYear(year) + rolloverInto(teamId, year)); }
function capSpace(teamId, year){ return fixInc(teamCapForYear(teamId,year) - teamCommitted(teamId,year)); }
// A projection can never run past the longest contract the league allows —
// there would be nothing on the books to show.
function maxProjYears(){ return clamp(+S.settings.contracts.maxYears||10, 1, 10); }
function projYears(){
  const n = clamp(+S.settings.cap.projectYears||6, 1, maxProjYears()), out=[];
  for(let i=0;i<n;i++) out.push(S.league.season+i);
  return out;
}
function releasePlayer(pid){
  const p = byId(S.players,pid), c = p && p.contract; if(!c) return;
  const tm = byId(S.teams, c.teamId); if(!tm) { p.contract=null; return; }
  tm.dead = tm.dead||[];
  const rate = (+S.settings.cap.deadCapPct||0)/100;
  const rows=[];
  for(let i=0;i<c.years;i++){ const y=c.startYear+i; if(y>=S.league.season) rows.push({y, amt:+c.salaries[i]||0}); }
  if(!rows.length){ p.contract=null; return; }
  if(S.settings.cap.deadCapSpread) rows.forEach(r=> { if(r.amt*rate>0) tm.dead.push({year:r.y, amount:fixInc(r.amt*rate), playerId:pid, name:p.name}); });
  else tm.dead.push({year:S.league.season, amount:fixInc(sum(rows.map(r=>r.amt))*rate), playerId:pid, name:p.name});
  p.contract = null;
  logIt(tm.name+' released '+p.name+' — '+money(fixInc(sum(rows.map(r=>r.amt))*rate))+' dead cap',
    {type:'drop', teams:[tm.id], players:[pid]});

/* ============================================================
   CLOCK MATH — countdowns that stop during quiet hours
   ============================================================ */
function parseHM(s){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'')); return m ? (+m[1])*60 + (+m[2]) : 0; }
function fmtHM(s){
  const t=parseHM(s), h=Math.floor(t/60), m=t%60, ap=h>=12?'PM':'AM', h12=(h%12)||12;
  return h12+':'+String(m).padStart(2,'0')+' '+ap;
}
/* Milliseconds of *counting* time between two instants, excluding the nightly pause. */
function activeMsBetween(a, b, q){
  if(!q || !q.on || b<=a) return Math.max(0, b-a);
  const from=parseHM(q.from), to=parseHM(q.to);
  if(from===to) return Math.max(0, b-a);
  let quiet=0, guard=0;
  const start=new Date(a); start.setHours(0,0,0,0); start.setDate(start.getDate()-1);
  for(let d=new Date(start); d.getTime() <= b+86400000 && guard<1200; d.setDate(d.getDate()+1), guard++){
    const qs=new Date(d); qs.setHours(Math.floor(from/60), from%60, 0, 0);
    const qe=new Date(d); qe.setHours(Math.floor(to/60), to%60, 0, 0);
    let s=qs.getTime(), e=qe.getTime();
    if(e<=s) e += 86400000;
    quiet += Math.max(0, Math.min(b,e) - Math.max(a,s));
  }
  return Math.max(0, (b-a) - quiet);
}
/* The wall-clock instant reached after `activeMs` of counting time. */
function addActiveMs(from, activeMs, q){
  if(!q || !q.on) return from + activeMs;
  let lo = from, hi = from + activeMs*3 + 86400000*2;
  for(let i=0;i<52;i++){ const mid=(lo+hi)/2; if(activeMsBetween(from,mid,q) < activeMs) lo=mid; else hi=mid; }
  return Math.round(hi);
}
function isQuietNow(q){
  q = q || S.settings.trades.quiet;
  if(!q || !q.on) return false;
  const from=parseHM(q.from), to=parseHM(q.to); if(from===to) return false;
  const d=new Date(), m=d.getHours()*60+d.getMinutes();
  return from<to ? (m>=from && m<to) : (m>=from || m<to);
}
function quietResumesAt(){
  const q=S.settings.trades.quiet, to=parseHM(q.to), d=new Date();
  const r=new Date(d); r.setHours(Math.floor(to/60), to%60, 0, 0);
  if(r.getTime() <= d.getTime()) r.setDate(r.getDate()+1);
  return r.getTime();
}
function newClock(hours){ return { remain: Math.max(0, (+hours||0)*3600000), lastAt: Date.now() }; }
function tickClock(c){
  if(!c) return 0;
  const now = Date.now();
  if(now > c.lastAt) c.remain = Math.max(0, c.remain - activeMsBetween(c.lastAt, now, S.settings.trades.quiet));
  c.lastAt = now;
  return c.remain;
}
function clockEta(c){ return addActiveMs(Date.now(), c.remain, S.settings.trades.quiet); }
function snipeMs(v){ return (+v||0) * (S.settings.trades.antiSnipeUnit==='hr' ? 3600000 : 60000); }
function antiSnipe(c){
  const t = S.settings.trades;
  if(!t.antiSnipeOn || !c) return false;
  if(c.remain <= snipeMs(t.antiSnipeWithinMin)){
    c.remain = Math.max(c.remain, snipeMs(t.antiSnipeExtendMin));
    return true;
  }
  return false;
}
function snipeLabel(){ return S.settings.trades.antiSnipeExtendMin+' '+(S.settings.trades.antiSnipeUnit==='hr'?'hours':'minutes'); }

function seedLeague(teamCount){
  const st = defaultState();
  const n = clamp(teamCount||10, 4, 20);
  st.teams = [];
  for(let i=0;i<n;i++){
    st.teams.push({
      id:'t'+(i+1), name:TEAM_NAMES[i%TEAM_NAMES.length] + (i>=TEAM_NAMES.length?' '+(i+1):''),
      abbr:(TEAM_NAMES[i%TEAM_NAMES.length].match(/\b[A-Z]/g)||['T','M']).join('').slice(0,3).toUpperCase(),
      owner:OWNERS[i%OWNERS.length], email:'', dead:[], adj:[],
      color:TEAM_COLORS[i%TEAM_COLORS.length], mascot:Object.keys(MASCOTS)[i%Object.keys(MASCOTS).length],
      dues:{paid:i%4!==1, paidOn:i%4!==1 ? Date.now()-86400000*(3+i) : null, amount:null, method:'', note:''}
    });
  }
  st.league.myTeamId = st.teams[0].id;
  st.league.commishTeamId = st.teams[0].id;

  const rows = SEED_PLAYERS.trim().split(';').map(s=>s.trim()).filter(Boolean);
  const posBase = {QB:38, RB:52, WR:56, TE:32, K:4, DEF:5};
  const seen = {};
  st.players = rows.map(r=>{
    const [name,pos,nfl,age] = r.split('|');
    seen[pos] = (seen[pos]||0);
    const val = Math.max(1, Math.round((posBase[pos]||10) * Math.pow(0.935, seen[pos])));
    seen[pos]++;
    return { id:uid('p'), name, pos, nfl, age:+age||0, value:val, contract:null };
  });

  // snake assignment by value
  const pool = st.players.slice().sort((a,b)=> b.value-a.value);
  let idx=0, dir=1, ti=0;
  const S0 = S; S = st; // math helpers read the live state
  pool.forEach(p=>{
    p.contract = makeContract(st.teams[ti].id, p.value, 1, 'ev', st.league.season);
    ti += dir; if(ti>=n){ ti=n-1; dir=-1; } else if(ti<0){ ti=0; dir=1; }
    idx++;
  });
  // give the contracts real length + structure, then scale so year one lands near 80% of cap
  const structs = st.settings.contracts.structures.map(s=>s.id);
  pool.forEach((p,i)=>{
    const yrs = p.pos==='K'||p.pos==='DEF' ? 1 : clamp(1 + Math.floor(Math.pow(Math.random(),1.6)*5) + (p.age && p.age<25 ? 1 : 0), 1, 7);
    const sid = p.pos==='K'||p.pos==='DEF' ? 'ev' : structs[Math.floor(Math.random()*structs.length)];
    const startBack = Math.random()<0.45 ? 1 : 0;
    p.contract = makeContract(p.contract.teamId, p.value*yrs, yrs, sid, st.league.season - startBack);
  });
  const y1 = st.league.season;
  st.teams.forEach((t,ti)=>{
    const mine = st.players.filter(p=> p.contract && p.contract.teamId===t.id);
    const spend = sum(mine.map(p=> capHit(p,y1))) || 1;
    const scale = (st.settings.cap.base*(0.74 + (ti%5)*0.03))/spend;
    mine.forEach(p=>{
      p.value = Math.max(1, Math.round(p.value*scale));
      p.contract = makeContract(t.id, Math.max(1, roundInc(p.contract.total*scale)), p.contract.years, p.contract.structId, p.contract.startYear);
    });
  });

  // draft picks, 3 future years x 4 rounds
  st.picks = [];
  for(let y=st.league.season+1; y<=st.league.season+3; y++)
    for(let r=1;r<=4;r++)
      st.teams.forEach(t=> st.picks.push({id:uid('pk'), year:y, round:r, ownerTeamId:t.id, originTeamId:t.id}));

  st.rules = [
    {id:uid('r'), title:'Salary cap', body:'Every roster must be cap compliant at the moment of any transaction. The cap rises each offseason by the growth rate set in Settings. Teams over the cap cannot add salary until they clear space.'},
    {id:uid('r'), title:'Contracts', body:'Contracts run 1 to 10 years. Choose a structure at signing: front loaded, even, or back loaded. The structure fixes the yearly percentages for the life of the deal and cannot be changed later.'},
    {id:uid('r'), title:'Releases and dead cap', body:'Releasing a player leaves dead cap equal to the percentage set in Settings, charged against the remaining years of the deal.'},
    {id:uid('r'), title:'Trade block auctions', body:'An owner may post a player with an asking price. The first team to meet the ask starts the clock. Competing offers must be accepted by the posting owner to take the lead. The leading offer at zero is processed.'},
    {id:uid('r'), title:'Trade review and counters', body:'Accepted trades sit in a review window before they process. Any other team may counter during that window. The clock stops overnight and picks back up in the morning.'},
    {id:uid('r'), title:'League dues', body:'Dues are payable before the season opener. Rosters are locked for teams with unpaid dues.'}
  ];
  st.log = [{at:Date.now(), type:'admin', teams:[], players:[],
    text:'League created with '+n+' teams and '+st.players.length+' players under contract'}];
  S = S0;
  return st;
}

function setPath(path, v){
  const parts = path.split('.'); let o = S;
  for(let i=0;i<parts.length-1;i++){
    // A setting that used to be a plain true/false can still be sitting in an
    // old league file. Descending into it throws and kills the whole handler,
    // so quietly upgrade it instead.
    if(o[parts[i]]==null || typeof o[parts[i]]!=='object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = v;
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]');
  if(!t) return;
  // form controls carry data-a too, but they are driven by change/input —
  // swallowing their click would stop a select from opening at all
  if(/^(SELECT|INPUT|TEXTAREA|OPTION)$/.test(t.tagName)) return;
  const fn = ACT[t.dataset.a];
  if(fn){ e.preventDefault(); fn(t.dataset, t, e); }
});
document.addEventListener('change', e=>{
  const t = e.target.closest('[data-set]');
  if(!t) return;
  // comp overrides are keyed "round.index", which would otherwise be read as
  // two levels of nesting
  if(/^settings\.supa\.(url|anonKey|on)$/.test(t.dataset.set)){
    setPath(t.dataset.set, val(t));
    save();
    // Nothing to press: as soon as both strings are there, connect.
    if(S.settings.supa.on && S.settings.supa.url && S.settings.supa.anonKey && !Supa.client){
      Supa.init(true).then(ok=>{ render(); if(ok) toast('Connected to Supabase','good'); });

    return;
  }
  const m = /^settings\.comp\.overrides\.(\d+)\.(\d+)$/.exec(t.dataset.set);
  if(m){
    S.settings.comp.overrides = S.settings.comp.overrides || {};
    const v = val(t);
    if(v==='' || v==null) delete S.settings.comp.overrides[m[1]+'.'+m[2]];
    else S.settings.comp.overrides[m[1]+'.'+m[2]] = v;

/* ============================================================
   LIVE SCORING — pluggable feed (demo sim / HTTP endpoint / paste)
   ============================================================ */
function nflCodes(){ return Array.from(new Set(S.players.map(p=>p.nfl).filter(Boolean))).sort(); }
function rosterOf(code){ return S.players.filter(p=> p.nfl===code && p.pos!=='DEF'); }
function defOf(code){ return S.players.find(p=> p.pos==='DEF' && p.nfl===code); }
function stat(pid){ return (S.live.stats[pid] = S.live.stats[pid] || {}); }
function bump(pid,k,v){ const s=stat(pid); s[k]=Math.round(((s[k]||0)+v)*100)/100; }
function pickOne(a){ return a.length ? a[Math.floor(Math.random()*a.length)] : null; }
function weighted(list){
  const tot = sum(list.map(x=>x.w)); let r = Math.random()*tot;
  for(const x of list){ if((r-=x.w) <= 0) return x.v; }
  return list.length ? list[list.length-1].v : null;
}

function buildWeek(week){
  const ids = S.teams.map(t=>t.id).slice();
  if(ids.length % 2) ids.push(null);
  const n = ids.length, arr = ids.slice();
  for(let i=0; i<((week-1) % Math.max(1,n-1)); i++){ const fixed=arr.shift(); arr.unshift(arr.pop()); arr.unshift(fixed); arr.splice(1,0,arr.splice(1,1)[0]); }
  const rot = arr.slice(1); const shift = (week-1) % Math.max(1,rot.length);
  const ordered = [arr[0]].concat(rot.slice(shift), rot.slice(0,shift));
  const m=[];
  for(let i=0;i<n/2;i++){ const a=ordered[i], b=ordered[n-1-i]; if(a&&b) m.push({home:a, away:b}); }
  S.live.matchups = m;

  const codes = nflCodes().slice();
  for(let i=codes.length-1;i>0;i--){ const j=(i*7+week*3)%(i+1); const t=codes[i]; codes[i]=codes[j]; codes[j]=t; }
  const g=[];
  for(let i=0;i+1<codes.length;i+=2)
    g.push({id:'g'+(i/2), home:codes[i+1], away:codes[i], hs:0, as:0, q:1, clock:900, status:'pre', poss:codes[i]});
  S.live.games=g; S.live.stats={}; S.live.feed=[]; S.live.week=week;
}
function addScore(g, side, pts){
  if(side==='home'){ g.hs+=pts; const d=defOf(g.away); if(d) bump(d.id,'pts_allow',pts); }
  else { g.as+=pts; const d=defOf(g.home); if(d) bump(d.id,'pts_allow',pts); }
}
function feed(g, text){
  S.live.feed.unshift({at:Date.now(), g:g.id, text});
  if(S.live.feed.length>90) S.live.feed.length=90;
}
function playEvent(g){
  const off = g.poss, def = off===g.home ? g.away : g.home;
  const side = off===g.home ? 'home' : 'away';
  const R = rosterOf(off);
  const qb = pickOne(R.filter(p=>p.pos==='QB'));
  const rbs = R.filter(p=>p.pos==='RB'), tgts = R.filter(p=>p.pos==='WR'||p.pos==='TE');
  const k = pickOne(R.filter(p=>p.pos==='K'));
  const dst = defOf(def);
  const r = Math.random();

  if(r < .045 && qb){                                   // interception
    bump(qb.id,'pass_int',1); bump(qb.id,'pass_att',1); bump(qb.id,'pass_inc',1);
    if(dst) bump(dst.id,'int',1);
    if(Math.random()<.12 && dst){
      bump(dst.id,'def_td',1); bump(qb.id,'pass_int_td',1);
      addScore(g, side==='home'?'away':'home', 7); feed(g, dst.name+' pick six');
    } else feed(g, qb.name+' intercepted');
    g.poss = def; return;
  }
  if(r < .085){                                          // sack
    if(dst){ bump(dst.id,'sack',1); bump(dst.id,'sack_yd',3+Math.floor(Math.random()*7)); }
    if(qb) bump(qb.id,'pass_sack',1);
    if(qb && Math.random()<.14){
      bump(qb.id,'fum',1); bump(qb.id,'fum_lost',1);
      if(dst) bump(dst.id,'fum_rec',1);
      feed(g, qb.name+' strip-sacked'); g.poss=def;
    }
    return;
  }
  if(r < .12 && k){                                      // field goal
    const dist = 20+Math.floor(Math.random()*38);
    const band = dist>=50?'50p' : dist>=40?'40_49' : dist>=30?'30_39' : dist>=20?'20_29' : '0_19';
    if(Math.random() < (dist>50 ? .62 : dist>40 ? .8 : .93)){
      bump(k.id,'fgm_'+band,1); bump(k.id,'fgm',1);
      bump(k.id,'fgm_yds',dist); if(dist>30) bump(k.id,'fgm_yds_over_30',dist-30);
      addScore(g, side, 3); feed(g, k.name+' '+dist+'-yd field goal good');
    } else { bump(k.id,'fgmiss_'+band,1); bump(k.id,'fgmiss',1); feed(g, k.name+' misses from '+dist); }
    g.poss = def; return;
  }
  if(r < .42 && rbs.length){                             // run
    const rb = weighted(rbs.map((p,i)=>({v:p, w:Math.max(1, 10-i*4)})));
    const yd = Math.max(-4, Math.round((Math.random()*Math.random()*26) - 1));
    bump(rb.id,'rush_yd',yd); bump(rb.id,'rush_att',1);
    if(yd>=10) bump(rb.id,'rush_fd',1);
    if(yd>=40) bump(rb.id,'rush_40p',1);
    if(Math.random()<.055){
      bump(rb.id,'rush_td',1); if(yd>=40) bump(rb.id,'rush_td_40p',1);
      addScore(g, side, 7); if(k) bump(k.id,'xpm',1);
      feed(g, rb.name+' '+Math.max(1,yd)+'-yd rushing TD'); g.poss=def;
    } else if(Math.random()<.012){
      bump(rb.id,'fum',1); bump(rb.id,'fum_lost',1); if(dst) bump(dst.id,'fum_rec',1);
      feed(g, rb.name+' fumbles'); g.poss=def;
    }
    return;
  }
  if(qb && tgts.length){                                 // pass
    bump(qb.id,'pass_att',1);
    if(Math.random()<.32){ bump(qb.id,'pass_inc',1); return; }
    const tg = weighted(tgts.map((p,i)=>({v:p, w:Math.max(1, 12-i*3) * (p.pos==='TE'?.7:1)})));
    const yd = Math.max(-3, Math.round(Math.random()*Math.random()*44));
    bump(qb.id,'pass_yd',yd); bump(qb.id,'pass_cmp',1);
    bump(tg.id,'rec',1); bump(tg.id,'rec_yd',yd);
    const band = yd<5?'rec_0_4' : yd<10?'rec_5_9' : yd<20?'rec_10_19' : yd<30?'rec_20_29' : yd<40?'rec_30_39' : 'rec_40p';
    bump(tg.id, band, 1);
    if(yd>=10){ bump(qb.id,'pass_fd',1); bump(tg.id,'rec_fd',1); }
    if(yd>=40) bump(qb.id,'pass_cmp_40p',1);
    if(Math.random()<.062){
      bump(qb.id,'pass_td',1); bump(tg.id,'rec_td',1);
      if(yd>=40){ bump(qb.id,'pass_td_40p',1); bump(tg.id,'rec_td_40p',1); }
      addScore(g, side, 7); if(k) bump(k.id,'xpm',1);
      feed(g, qb.name+' → '+tg.name+' '+Math.max(1,yd)+'-yd TD');
      g.poss = def;
    }
    return;
  }
  g.poss = def;
}
function simTick(){
  const sp = clamp(+S.settings.live.speed||1, 1, 30);
  let changed=false;
  S.live.games.forEach(g=>{
    if(g.status==='final') return;
    if(g.status==='pre') g.status='live';
    for(let i=0;i<sp;i++){
      g.clock -= 16 + Math.random()*30;
      if(Math.random()<.6) playEvent(g);
      if(g.clock<=0){ g.clock=900; g.q++; if(g.q>4){ g.q=4; g.clock=0; g.status='final'; break; } }
    }
    changed=true;
  });
  S.live.lastTick=Date.now();
  return changed;
}
/* Points allowed and yards allowed are banded — a defense only ever collects
   from the one band it lands in. Same for the yardage game bonuses. */
function ptsAllowKey(pa){
  return pa<=0?'pts_allow_0' : pa<=6?'pts_allow_1_6' : pa<=13?'pts_allow_7_13' : pa<=20?'pts_allow_14_20'
       : pa<=27?'pts_allow_21_27' : pa<=34?'pts_allow_28_34' : 'pts_allow_35p';
}
function ydsAllowKey(y){
  return y<100?'yds_allow_0_100' : y<200?'yds_allow_100_199' : y<300?'yds_allow_200_299'
       : y<350?'yds_allow_300_349' : y<400?'yds_allow_350_399' : y<450?'yds_allow_400_449'
       : y<500?'yds_allow_450_499' : y<550?'yds_allow_500_549' : 'yds_allow_550p';
}
const BAND_KEYS = {};
['pts_allow_0','pts_allow_1_6','pts_allow_7_13','pts_allow_14_20','pts_allow_21_27','pts_allow_28_34','pts_allow_35p',
 'yds_allow_0_100','yds_allow_100_199','yds_allow_200_299','yds_allow_300_349','yds_allow_350_399',
 'yds_allow_400_449','yds_allow_450_499','yds_allow_500_549','yds_allow_550p',
 'bonus_pass_yd_300','bonus_pass_yd_400','bonus_rush_yd_100','bonus_rush_yd_200','bonus_rec_yd_100','bonus_rec_yd_200',
 'bonus_rush_rec_yd_100','bonus_rush_rec_yd_200','bonus_pass_cmp_25','bonus_rush_att_20',
 'bonus_rec_rb','bonus_rec_wr','bonus_rec_te'].forEach(k=> BAND_KEYS[k]=1);

function fpts(pid){
  const s = S.live.stats[pid]; if(!s) return 0;
  const p = byId(S.players,pid), c = S.settings.scoring;
  let t = 0;
  /* Straight rate categories: the stat and the setting share a name. */
  for(const k in c){
    if(BAND_KEYS[k]) continue;
    const rate = +c[k]||0; if(!rate) continue;
    const n = +s[k]||0; if(n) t += n*rate;
  }
  const has = (k)=> s[k]!=null;
  if(p && p.pos==='DEF'){
    if(has('pts_allow')) t += +c[ptsAllowKey(+s.pts_allow||0)]||0;
    if(has('yds_allow')) t += +c[ydsAllowKey(+s.yds_allow||0)]||0;
  }
  const py=+s.pass_yd||0, ry=+s.rush_yd||0, rey=+s.rec_yd||0;
  if(py>=400) t += +c.bonus_pass_yd_400||0; else if(py>=300) t += +c.bonus_pass_yd_300||0;
  if(ry>=200) t += +c.bonus_rush_yd_200||0; else if(ry>=100) t += +c.bonus_rush_yd_100||0;
  if(rey>=200) t += +c.bonus_rec_yd_200||0; else if(rey>=100) t += +c.bonus_rec_yd_100||0;
  if(ry+rey>=200) t += +c.bonus_rush_rec_yd_200||0; else if(ry+rey>=100) t += +c.bonus_rush_rec_yd_100||0;
  if((+s.pass_cmp||0)>=25) t += +c.bonus_pass_cmp_25||0;
  if((+s.rush_att||0)>=20) t += +c.bonus_rush_att_20||0;
  const recs = +s.rec||0;
  if(recs && p){
    if(p.pos==='RB') t += recs*(+c.bonus_rec_rb||0);
    else if(p.pos==='WR') t += recs*(+c.bonus_rec_wr||0);
    else if(p.pos==='TE') t += recs*(+c.bonus_rec_te||0);
  }
  return Math.round(t*100)/100;
}
const LINE_LABELS = [
  ['pass_yd','pass yd'],['pass_td','pass TD'],['pass_int','INT'],['pass_cmp','cmp'],
  ['rush_yd','rush yd'],['rush_td','rush TD'],['rush_att','car'],
  ['rec','rec'],['rec_yd','rec yd'],['rec_td','rec TD'],
  ['fum_lost','fum lost'],['xpm','XP'],
  ['sack','sack'],['int','INT'],['fum_rec','fum rec'],['def_td','def TD'],
  ['tkl','tkl'],['idp_tkl','tkl'],['idp_sack','sack'],['idp_int','INT']
];
function statLine(p){
  const s = S.live.stats[p.id]; if(!s) return '<span class="dim">—</span>';
  const bits = [];
  LINE_LABELS.forEach(([k,l])=>{ if(s[k]) bits.push(s[k]+' '+l); });
  const fg = (+s.fgm||0)+(+s.fgm_0_19||0)+(+s.fgm_20_29||0)+(+s.fgm_30_39||0)+(+s.fgm_40_49||0)+(+s.fgm_50p||0);
  if(fg) bits.splice(0,0, fg+' FG');
  if(p.pos==='DEF' && s.pts_allow!=null) bits.push((+s.pts_allow||0)+' allowed');
  return bits.length ? '<span class="muted tiny">'+esc(bits.join(' · '))+'</span>' : '<span class="dim">—</span>';
}
function bestLineup(teamId){
  const pool = teamPlayers(teamId).map(p=>({p, pts:fpts(p.id)})).sort((a,b)=> b.pts-a.pts);
  const used = {}, starters=[];
  S.settings.roster.slots.forEach(sl=>{
    for(let i=0;i<sl.count;i++){
      const c = pool.find(x=> !used[x.p.id] && sl.eligible.indexOf(x.p.pos)>=0);
      starters.push({slot:sl.label, p:c?c.p:null, pts:c?c.pts:0});
      if(c) used[c.p.id]=1;
    }
  });
  return { starters, total:Math.round(sum(starters.map(s=>s.pts))*100)/100, bench:pool.filter(x=>!used[x.p.id]) };
}
/* Blank endpoint means "use the league server", which is where the
   provider adapter and its API key live. */
function statsUrl(){
  const cfg = S.settings.live;
  if(cfg.endpoint) return cfg.endpoint;
  const b = Sync.base();
  return b ? b+'/stats?week='+(S.live.week||1) : '';
}
async function pollEndpoint(){
  const u = statsUrl();
  if(S.settings.live.mode!=='endpoint' || !u) return;
  try{
    const r = await fetch(u, {headers:{accept:'application/json'}});
    if(!r.ok) throw new Error('server said '+r.status);
    applyFeed(await r.json());
  }catch(e){ toast('Live feed unreachable — '+e.message,'bad'); }
}
function applyFeed(j){
  if(!j || typeof j!=='object') throw new Error('expected a JSON object');
  if(Array.isArray(j.games)) S.live.games = j.games;
  if(j.stats && typeof j.stats==='object'){
    Object.keys(j.stats).forEach(k=>{
      const p = byId(S.players,k) || S.players.find(x=> x.name.toLowerCase()===String(k).toLowerCase());
      if(p) S.live.stats[p.id] = Object.assign({}, S.live.stats[p.id], j.stats[k]);
    });
  }
  S.live.lastTick = Date.now(); save(); render();
}

const TEAM_COLORS = ['#E5A13C','#5BC496','#7FB2D9','#FF5C39','#B39CE0','#E3B05E','#78B6E8','#F27E7E','#7FD48F','#8FA3B6','#D98CC0','#6FD3C7'];
function teamPaint(t){
  const main = (t && t.color) || TEAM_COLORS[Math.abs(hashStr((t&&t.id)||'x')) % TEAM_COLORS.length];
  return { main, dark: shade(main,-32), light: shade(main,34), accent: shade(main,-12) };
}
function hashStr(x){ let h=0; for(let i=0;i<String(x).length;i++) h=(h*31 + String(x).charCodeAt(i))|0; return h; }
function shade(hex, d){
  const n = parseInt(String(hex).slice(1),16);
  const c = [(n>>16)&255, (n>>8)&255, n&255].map(v=> clamp(Math.round(v + d), 0, 255));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

const TAUNT_MS = 9000;
function activeTaunt(teamId){
  const t = S.live.taunt;
  if(!t || t.teamId!==teamId) return null;
  return (Date.now() - t.at < TAUNT_MS) ? t.key : null;
}
function mascotSVG(key, paint, stage, cls, kit){
  const m = MASCOTS[key] || MASCOTS.wolf;
  const k = kit || {};
  const part = (which)=> Object.keys(KIT)
    .filter(x=> k[x] && (KIT[x].part||'head')===which)
    .map(x=> KIT[x].draw(paint)).join('');
  return '<g class="fo-anim '+(cls||'')+'">'+
    part('back')+
    foLegs(paint)+
    foArmL(paint)+
    foTorso(paint, part('torso'))+
    '<g class="m-head">'+m.head(paint)+foEyes(stage)+part('head')+'</g>'+
    foArmR(paint)+
    foDamage(stage)+
  '</g>';
}
/* Damage is read off the deficit, not the health bar, so the steps land where
   a fantasy manager expects them: a touchdown behind stings, five is a mauling. */
function brawlSide(pts, oppPts){
  const behind = Math.max(0, oppPts - pts);
  return {
    hp: clamp(Math.round(100 - behind*2.4), 3, 100),
    stage: behind < 8 ? 0 : behind < 20 ? 1 : behind < 35 ? 2 : 3,
    ahead: pts > oppPts,
    behind
  };
}
function hpColor(hp){ return hp>60 ? 'var(--sage)' : hp>30 ? 'var(--brass)' : 'var(--signal)'; }
function lastTalk(teamId){
  return (S.live.talk||[]).filter(t=> t.teamId===teamId)[0] || null;
}
function brawlPanel(myId, oppId, myPts, oppPts){
  const A = byId(S.teams,myId), B = byId(S.teams,oppId);
  if(!A || !B) return '';
  const pa = teamPaint(A), pb = teamPaint(B);
  const sa = brawlSide(myPts, oppPts), sb = brawlSide(oppPts, myPts);
  const cls = (side, other, team)=>{
    const t = activeTaunt(team.id);
    if(t) return 'fo-t-'+t;
    return side.hp<=8 ? 'fo-out' : side.ahead ? 'fo-win' : (other.ahead ? 'fo-lose' : 'fo-idle');
  };
  const margin = Math.abs(myPts-oppPts);
  const ta = lastTalk(myId), tb = lastTalk(oppId);
  const blurb = margin<3 ? 'Nobody has landed anything yet.'
    : margin<10 ? esc((myPts>oppPts?A:B).name)+' is getting the better of it.'
    : margin<25 ? esc((myPts>oppPts?A:B).name)+' is winning this on points.'
    : margin<45 ? 'Somebody should stop this.'

  return `<div class="panel" style="margin-bottom:14px">

      <button class="btn ghost sm" data-a="pickMascot">Customise</button></div>
    <div class="pb">
      <div class="row" style="gap:14px;align-items:flex-start;margin-bottom:10px">
        <div class="corner"><div class="who"><b style="color:${pa.main}">${esc(A.name)}</b><span class="num">${myPts.toFixed(1)}</span></div>
          <div class="hpbar"><i style="width:${sa.hp}%;background:${hpColor(sa.hp)}"></i></div></div>
        <div class="corner r"><div class="who"><b style="color:${pb.main}">${esc(B.name)}</b><span class="num">${oppPts.toFixed(1)}</span></div>
          <div class="hpbar"><i style="width:${sb.hp}%;background:${hpColor(sb.hp)}"></i></div></div>
      </div>
      <div class="bubs">
        ${ta?`<div class="bub l"><span class="who">${esc(A.mascotName||A.name)}</span>${esc(ta.text)}</div>`:''}
        ${tb?`<div class="bub r"><span class="who">${esc(B.mascotName||B.name)}</span>${esc(tb.text)}</div>`:''}
      </div>
      <div class="arena">
        <svg viewBox="0 0 460 200" role="img" aria-label="${esc(A.name)} versus ${esc(B.name)}">
          <rect class="floor" x="0" y="168" width="460" height="32"/>
          <ellipse cx="90" cy="170" rx="46" ry="7" fill="#000" opacity=".35"/>
          <ellipse cx="370" cy="170" rx="46" ry="7" fill="#000" opacity=".35"/>
          <g transform="translate(30,55)">${mascotSVG(A.mascot||'wolf', pa, sa.stage, cls(sa,sb,A), A.kit)}</g>
          <g transform="translate(430,55) scale(-1,1)">${mascotSVG(B.mascot||'bear', pb, sb.stage, cls(sb,sa,B), B.kit)}</g>
          ${margin>=6?`<g class="pow" transform="translate(230,95)">
            <path d="M0-26 7-9 25-13 13 1 26 14 8 12 4 30-4 13-22 17-11 2-24-12-6-9z" fill="var(--brass)"/>
            <text x="0" y="6" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700"
              font-size="15" fill="#231704">${margin>=45?'DONE':margin>=25?'CRUNCH':'POW'}</text></g>`:''}
        </svg>
      </div>
      <div class="row" style="margin-top:10px;gap:5px">
        ${Object.keys(TAUNTS).map(k=>`<button class="btn sm ${activeTaunt(myId)===k?'on':''}" data-a="taunt" data-k="${k}"
          title="${esc(TAUNTS[k].line)}">${esc(TAUNTS[k].name)}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="talkbox" data-k="talkbox" maxlength="140" placeholder="Say something to ${esc(B.name)}" style="flex:1;min-width:150px">

      </div>`:''}
    </div></div>`;
}
ACT.sendTalk = ()=>{

}</pre>

ACT.simToggle = ()=>{
  if(!S.live.games.length) buildWeek(S.live.week||1);
  S.settings.live.running = !S.settings.live.running; save(); render();
};
ACT.simReset = ()=>{
  recordWeek(); foldWeekIntoSeason(); foldWeekIntoDvp();
  buildWeek((S.live.week||1)+1);
  S.settings.live.running=true; save(); render();
  toast('Week '+S.live.week+' kicked off — last week is in the books');
};
ACT.setLiveMode = (d)=>{ S.settings.live.mode=d.m; S.settings.live.running=false; save(); render(); };
ACT.pollNow = ()=> pollEndpoint();
ACT.closeWeek = ()=>{
  recordWeek(); foldWeekIntoSeason(); foldWeekIntoDvp();
  const done = Object.keys((S.season||{}).byPlayer||{}).length;
  S.live.week = (S.live.week||1)+1;
  S.live.stats = {}; S.live.feed = [];
  buildWeek(S.live.week);
  logIt('Week '+(S.live.week-1)+' closed out — '+done+' players have season totals', {type:'admin'});
  save(); render(); toast('Week '+(S.live.week-1)+' is in the books','good');
};
ACT.applyPaste = ()=>{
  try{ applyFeed(JSON.parse($('#feedpaste').value)); toast('Stats applied','good'); }
  catch(e){ toast('Could not read that payload — '+e.message,'bad'); }
};

ACT.setSlot = (d)=>{
  const p = byId(S.players, d.id), slot = d.s;
  if(!p || !p.contract) return;
  const tid = p.contract.teamId;
  if(slot!=='active' && slotRoom(tid, slot) <= 0)
    return toast('No '+SLOT_LABEL[slot].toLowerCase()+' room left','bad');
  if(slot==='active'){
    if(p.ir && p.ir.seasonEnding && p.ir.year===S.league.season && !isCommish())
      return toast('Season-ending IR holds until the year turns over','bad');
    const was = playerSlot(p);
    p.slot = 'active'; delete p.ir;
    if(S.settings.trades.capMustBeLegal && capSpace(tid, S.league.season) < 0){
      p.slot = was; return toast('His salary does not fit under the cap','bad');
    }
    if(slotRoom(tid,'active') < 0){ p.slot = was; return toast('No room on the active roster','bad'); }
    logIt(teamName(tid)+' activated '+p.name+(was==='taxi'?' off the taxi squad — '+money(capHit(p,S.league.season))+' now counts':''),
      {type:'admin', teams:[tid], players:[p.id]});
  } else {
    p.slot = slot;
    if(slot!=='ir') delete p.ir;
    logIt(teamName(tid)+' moved '+p.name+' to '+SLOT_LABEL[slot].toLowerCase(), {type:'admin', teams:[tid], players:[p.id]});

  save(); render();
};

/* ============================================================
   TAXI CLAIMS
   Anyone can put a claim on somebody else's taxi player. The owner has a
   window to promote him or work a trade; let it run out and the claim lands
   for nothing.
   ============================================================ */
function openClaimFor(playerId){ return (S.taxiClaims||[]).find(c=> c.playerId===playerId && c.status==='open'); }
function claimBlocked(c){
  const p = byId(S.players, c.playerId);
  if(!p || !p.contract) return 'he is no longer under contract';
  if(p.contract.teamId !== c.fromTeam) return 'he has already been traded';
  if(!onTaxi(p)) return 'he was promoted to the active roster';
  const pending = S.trades.some(t=> (t.status==='proposed' || t.status==='review') &&
    [].concat(t.a.players||[], t.b.players||[]).indexOf(p.id) >= 0);
  if(pending) return 'there is a trade on the table for him';
  return null;
}
function claimCanLand(c){
  const p = byId(S.players, c.playerId);
  if(slotRoom(c.toTeam,'active') <= 0) return 'no room on the active roster';
  const hit = fixInc(Math.max(0, grossHit(p, S.league.season) - retainedOn(p, S.league.season)));
  if(S.settings.trades.capMustBeLegal && hit > capSpace(c.toTeam, S.league.season))
    return 'cannot fit the '+money(hit)+' salary under the cap';
  return null;
}
function settleTaxiClaim(c){
  if(c.status!=='open') return;
  const p = byId(S.players, c.playerId);
  const blocked = claimBlocked(c);
  if(blocked){
    c.status='defended'; c.reason=blocked;
    c.log.unshift({at:Date.now(), text:'Claim failed — '+blocked});
    notify('Claim defended', teamName(c.fromTeam)+' kept '+playerName(c.playerId)+' — '+blocked+'.');
    return;
  }
  const cannot = claimCanLand(c);
  if(cannot){
    c.status='withdrawn'; c.reason=cannot;
    c.log.unshift({at:Date.now(), text:'Claim lapsed — '+teamName(c.toTeam)+' '+cannot});
    notify('Claim lapsed', teamName(c.toTeam)+' could not take '+playerName(c.playerId)+' — '+cannot+'.','bad');
    return;
  }
  p.contract.teamId = c.toTeam;
  p.slot = 'active';
  c.status='awarded'; c.at2=Date.now();
  c.log.unshift({at:Date.now(), text:teamName(c.toTeam)+' takes him, straight onto the active roster'});
  logIt(teamName(c.toTeam)+' claimed '+p.name+' off '+teamName(c.fromTeam)+"'s taxi squad — "+
    money(capHit(p,S.league.season))+' now counts', {type:'add', teams:[c.toTeam, c.fromTeam], players:[p.id]});
  notify('Taxi claim awarded', p.name+' goes to '+teamName(c.toTeam)+' for nothing.','good');
}
ACT.taxiClaim = (d)=>{
  const p = byId(S.players, d.id), me = actingTeam();

ACT.cdField = (d, el)=>{
  const cd = ui.tmp.cd, f = d.f;
  let v = el.value;
  if(f==='total') v = +v||0;
  if(f==='years') v = clamp(+v||1, S.settings.contracts.minYears, S.settings.contracts.maxYears);
  if(f==='startYear') v = +v || S.league.season;
  cd[f] = v;
  if(f==='years' && cd.byYear){
    while(cd.byYear.length < cd.years) cd.byYear.push(cd.byYear[cd.byYear.length-1] || 0);
    cd.byYear.length = cd.years;
    cd.total = fixInc(sum(cd.byYear));
  }
  const el2 = $('#cdPreview'); if(el2) el2.innerHTML = contractPreview();
};

  const cd = ui.tmp.cd;
  cd.byYear = d.m==='exact' ? salariesFor(cd.total, cd.years, cd.structId) : null;

  const cd = ui.tmp.cd, i = +d.i;

ACT.cdFlat = ()=>{
  const cd = ui.tmp.cd;
  const each = roundInc(cd.total / cd.years);
  cd.byYear = Array.from({length:cd.years}, ()=> each);
  cd.total = fixInc(sum(cd.byYear));
  const el2 = $('#cdPreview'); if(el2) el2.innerHTML = contractPreview();
};
/* What the deal actually pays, whichever way it was built. */
function cdSalaries(){
  const cd = ui.tmp.cd;
  if(cd.byYear){
    const out = cd.byYear.slice(0, cd.years);
    while(out.length < cd.years) out.push(0);
    return out.map(v=> roundInc(+v||0));
  }
  return salariesFor(cd.total, cd.years, cd.structId);
}
function contractPreview(){

ACT.claimWaiver = (d)=>{
  const p = byId(S.players,d.id);

  p.lastTeam = null;                                    // a waiver move breaks the chain
  logIt(teamName(d.team)+' claimed '+p.name+' off waivers at '+money(S.settings.waivers.salary),
    {type:'waiver', teams:[d.team], players:[p.id]});
  notify('Waiver claim', teamName(d.team)+' picked up '+p.name+'.');
  closeModal(); save(); render(); toast('Claimed','good');
};
ACT.liftWaiver = (d)=>{
  const p = byId(S.players,d.id);
  if(p.contract) delete p.contract.waiver;
  logIt('Waiver tag lifted from '+p.name, {type:'waiver', teams:[p.contract?p.contract.teamId:null].filter(Boolean), players:[p.id]});
  closeModal(); save(); render(); toast('Tag lifted');

ACT.saveContract = ()=>{
  const cd = ui.tmp.cd, p = byId(S.players,cd.pid);
  if(cd.total<=0) return toast('Give the deal a value','bad');
  const lp = limitProblem(cd.teamId, cd.years, p.id);
  if(lp) return toast(teamName(cd.teamId)+' already has '+lp.have+' deals of '+lp.length+' years or longer and is allowed '+lp.allow,'bad');
  const c = makeContract(cd.teamId, cd.total, cd.years, cd.structId, cd.startYear);
  if(cd.byYear){                       // exact figures beat any structure
    c.salaries = cdSalaries();
    c.total = fixInc(sum(c.salaries));
    c.byYear = true;
  }
  const before = p.contract; p.contract = c;
  if(S.settings.trades.capMustBeLegal){
    const bad = projYears().find(y=> capSpace(cd.teamId,y) < 0);
    if(bad){ p.contract = before; return toast('That puts '+teamName(cd.teamId)+' over the cap in '+bad,'bad'); }
  }
  logIt(teamName(cd.teamId)+' signed '+p.name+' — '+money(c.total)+' over '+c.years+' yr ('+
    (c.byYear?'set year by year':structById(c.structId).name)+')',
    {type: before?'admin':'add', teams:[cd.teamId], players:[p.id]});
  closeModal(); save(); render(); toast('Contract saved','good');
};
function applyExtension(p, addYears, aav, structId){
  const c = p.contract;
  const ext = salariesFor(roundInc(aav*addYears), addYears, structId);
  c.salaries = c.salaries.concat(ext);
  c.years += addYears;
  c.total = fixInc(sum(c.salaries));
  c.extensions = (c.extensions||[]).concat([{at:Date.now(), years:addYears, aav:fixInc(aav), structId}]);
}
/* With players not given a say, the ladder sets the number outright. */
function ladderMode(){
  return !S.settings.players.on && S.settings.contracts.ladder.on;
}
function ladderQuote(p){
  const g = canExtend(p);
  if(!g.ok || !g.rank) return null;
  return {price: ladderPrice(p.pos, g.rank.rank), gate:g,
          work: ladderWorking(p.pos, g.rank.rank)};
}
ACT.extend = (d)=>{
  const p = byId(S.players,d.id), c = p.contract;
  if(!c) return toast('He has to be under contract first','bad');
  if(isWaiver(p) && S.settings.waivers.blockExtensions)
    return toast('Waiver players cannot be extended while the tag is on','bad');
  const g = canExtend(p);
  if(!g.ok){
    return modal('Not yet — '+p.name,
      '<p>'+esc(g.why)+'</p>'+
      '<div class="kv" style="margin-top:12px"><dt>Played this season</dt><dd>'+(g.games||0)+'</dd>'+
      '<dt>Needed</dt><dd>'+minGames()+'</dd></div>'+
      '<div class="hint">Change the threshold under Settings › Contracts, or wait until he has played.</div>',
      '<button class="btn ghost" data-a="closeModal">Close</button>');
  }
  const offset = Math.max(0, c.startYear + c.years - S.league.season);
  const lq = ladderMode() ? ladderQuote(p) : null;
  const q = extensionQuote(p, 2, offset);
  ui.tmp.ext = {pid:p.id, years:2, aav: lq ? lq.price : q.aav, structId:c.structId, offset};
  extModal();
};

ACT.extGo = ()=>{

VIEWS.cap = function(){
  if(!S.teams.length) return '<div class="empty-state"><h3>No league loaded</h3></div>';
  const tid = currentTeamId(), yrs = projYears();
  const roster = teamPlayers(tid).slice().sort((a,b)=> (b.contract.startYear+b.contract.years)-(a.contract.startYear+a.contract.years) || capHit(b,yrs[0])-capHit(a,yrs[0]));
  const dead = (byId(S.teams,tid).dead||[]);
  const mx = Math.max(1, ...roster.map(p=> Math.max(...yrs.map(y=>capHit(p,y)))));
  const c = S.settings.cap;

  const rows = roster.map(p=>{
    const ct=p.contract;
    return `<div class="lrow">
      <div class="lname"><span class="pn">${esc(p.name)}</span>
        <span class="pm">${posTag(p.pos)} <span>${ct.years} yr</span> <span>${money(ct.total)}</span></span></div>
      ${yrs.map(y=>{
        const h=capHit(p,y);
        if(!h) return '<div class="cell empty"></div>';
        const pctH = clamp(h/mx*100, 6, 100);
        return '<div class="cell'+(pctH<34?' small':'')+'" title="'+esc(p.name)+' '+y+': '+money(h)+'"><div class="bar" style="height:'+pctH+'%"><span class="amt">'+money(h)+'</span></div></div>';
      }).join('')}
    </div>`;
  }).join('');

  const deadRow = dead.length ? `<div class="lrow"><div class="lname"><span class="pn bad">Dead cap</span><span class="pm">${dead.length} charge${dead.length>1?'s':''}</span></div>
    ${yrs.map(y=>{ const h=teamDead(tid,y); if(!h) return '<div class="cell empty"></div>';
      const pctH=clamp(h/mx*100,6,100);
      return '<div class="cell void'+(pctH<34?' small':'')+'"><div class="bar" style="height:'+pctH+'%"><span class="amt">'+money(h)+'</span></div></div>';}).join('')}</div>` : '';

  return `
  <div class="section">
    <header>
      <div><div class="eyebrow">${esc(teamName(tid))} · ${yrs[0]}–${yrs[yrs.length-1]}</div><h1>Cap ladder</h1></div>
      <div class="spacer"></div>
      <select data-a="pickTeamView" style="max-width:220px">${S.teams.map(x=>'<option value="'+x.id+'"'+(x.id===tid?' selected':'')+'>'+esc(x.name)+'</option>').join('')}</select>
      <div class="seg"><button class="${(ui.tmp.capMode||'team')==='team'?'on':''}" data-a="capMode" data-m="team">One team</button>
        <button class="${ui.tmp.capMode==='league'?'on':''}" data-a="capMode" data-m="league">Whole league</button></div>
    </header>

    ${(ui.tmp.capMode||'team')==='team' ? `
    <div class="panel"><div class="pb scrollx">
      <div class="ladder" style="--yc:${yrs.length};min-width:${190+yrs.length*84}px">
        <div class="lhead"><div>Player</div>${yrs.map(y=>'<div>'+y+'</div>').join('')}</div>
        ${rows || '<div class="empty-state">No contracts on the books.</div>'}
        ${deadRow}
        <div class="capline"><div>Committed</div>${yrs.map(y=>{
          const u=teamCommitted(tid,y), cp=teamCapForYear(tid,y), s=cp-u;
          return '<div><span class="num">'+money(u)+'</span>'+meter(u,cp)+
            '<span class="tiny '+(s<0?'bad':'good')+'">'+money(s,{plus:true})+'</span></div>';
        }).join('')}</div>
        <div class="capline"><div>Cap</div>${yrs.map(y=>'<div class="money">'+money(teamCapForYear(tid,y))+
          (S.settings.cap.rollover.on&&rolloverInto(tid,y)?'<div class="tiny good">+'+money(rolloverInto(tid,y))+' carried</div>':'')+'</div>').join('')}</div>
      </div>
    </div></div>
    <div class="hint">Each bar is one year of one contract, scaled against the biggest single-year hit on the roster. A front loaded deal steps down, a back loaded deal steps up. Hatched cells are years the contract does not cover.</div>
    ` : `
    <div class="panel"><div class="pb scrollx"><table>
      <thead><tr><th>Team</th>${yrs.map(y=>'<th class="right">'+y+'</th>').join('')}<th class="right">Avg space</th></tr></thead><tbody>
      ${S.teams.map(t=>{
        const sp = yrs.map(y=> capSpace(t.id,y));
        return `<tr><td><b style="font-weight:500">${esc(t.name)}</b><div class="tiny dim">${teamPlayers(t.id).length} contracts</div></td>
        ${yrs.map((y,i)=>`<td class="right"><span class="num ${sp[i]<0?'bad':''}">${money(sp[i],{plus:true})}</span>${meter(teamCommitted(t.id,y),teamCapForYear(t.id,y))}</td>`).join('')}

      </tbody></table></div></div>`}

    <div class="grid g3" style="margin-top:16px">
      <div class="panel"><div class="ph"><h3>Cap growth</h3></div><div class="pb">
        <div class="seg" style="margin-bottom:10px">

        ${yrs.map(y=>`<div class="row"><span class="eyebrow" style="width:52px">${y}</span>

      </div></div>
      <div class="panel"><div class="ph"><h3>Release rules</h3></div><div class="pb stack">

          <input type="number" min="1" max="${maxProjYears()}" data-set="settings.cap.projectYears" value="${clamp(c.projectYears,1,maxProjYears())}"></label>
        <div class="hint">Up to ten, capped at your longest allowed contract (${S.settings.contracts.maxYears} years). Raise the contract limit in Settings to see further out.</div>
      </div></div>
    </div>
  </div>`;
};

function pickValue(pk){
  const base = (+S.settings.cap.base||250)/250;
  return Math.round(({1:25,2:12,3:6,4:3}[(pk&&pk.round)||0]||2)*base);
}
/* A want that names a shape rather than a name: "a WR", "a 2027 first". */
function specLabel(sp){
  if(sp.kind==='pos') return 'any ' + sp.pos + (sp.min ? ' worth ' + money(sp.min) + '+' : '');
  if(sp.kind==='pick') return (sp.year||'any year') + ' ' + (sp.round ? 'round ' + sp.round : 'any round');
  return '?';
}
function specValue(sp){
  if(sp.kind==='pos') return +sp.min||0;
  if(sp.kind==='pick') return pickValue({round:+sp.round||3});
  return 0;
}
function askValue(ask){ return fixInc(assetValue(ask) + sum((ask.specs||[]).map(specValue))); }
/* Does an offer actually contain the shapes that were asked for? */
function meetsSpecs(offer, ask){
  const specs = (ask && ask.specs) || [];
  if(!specs.length) return true;
  const players = (offer.players||[]).map(id=>byId(S.players,id)).filter(Boolean);
  const picks = (offer.picks||[]).map(id=>byId(S.picks,id)).filter(Boolean);
  const usedP = {}, usedK = {};
  return specs.every(sp=>{
    if(sp.kind==='pos'){
      const hit = players.find(x=> !usedP[x.id] && x.pos===sp.pos && (!sp.min || (x.value||0) >= +sp.min));
      if(hit){ usedP[hit.id]=1; return true; }
      return false;
    }
    if(sp.kind==='pick'){
      const hit = picks.find(k=> !usedK[k.id] && (!sp.round || k.round===+sp.round) && (!sp.year || k.year===+sp.year));
      if(hit){ usedK[hit.id]=1; return true; }
      return false;
    }
    return true;
  });
}
function assetValue(o){
  return fixInc(
    sum((o.players||[]).map(id=>{ const p=byId(S.players,id); return p ? (p.value || (p.contract&&p.contract.total) || 1) : 0; })) +
    sum((o.picks||[]).map(id=>{ const k=byId(S.picks,id); return k ? pickValue(k) : 0; })) + (+o.cash||0));
}
function specChips(ask, rm){
  return ((ask.specs)||[]).map((sp,i)=>'<span class="chip" style="border-style:dashed">'+esc(specLabel(sp))+
    (rm?'<button data-a="'+rm+'" data-i="'+i+'">×</button>':'')+'</span>').join('');
}
function assetChips(o, opts){
  const rm = opts && opts.rm;
  const bits = (o.players||[]).map(id=>{ const p=byId(S.players,id); return p?'<span class="chip">'+posTag(p.pos)+' '+esc(p.name)+(rm?'<button data-a="'+rm+'" data-kind="players" data-id="'+id+'" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>':''; })
    .concat((o.picks||[]).map(id=>{ const k=byId(S.picks,id); return k?'<span class="chip">'+esc(pickLabel(k))+(rm?'<button data-a="'+rm+'" data-kind="picks" data-id="'+id+'" data-side="'+(opts.side||'')+'">×</button>':'')+'</span>':''; }))
    .filter(Boolean);
  if(+o.cash) bits.push('<span class="chip money">'+money(+o.cash)+' cap</span>');
  return bits.join('') || '<span class="dim tiny">nothing yet</span>';
}
function moveAssets(fromTeam, toTeam, o){
  (o.players||[]).forEach(id=>{
    const p=byId(S.players,id); if(!p || !p.contract) return;
    p.contract.teamId = toTeam;
    const r = (o.retain||{})[id];
    if(r && +r.pct) applyRetention(id, fromTeam, +r.pct, +r.through||S.league.season, 'pct');
  });
  (o.picks||[]).forEach(id=>{ const k=byId(S.picks,id); if(k) k.ownerTeamId=toTeam; });
  const cash = +o.cash||0;
  if(cash){
    const f=byId(S.teams,fromTeam), t=byId(S.teams,toTeam);
    if(f){ f.adj=f.adj||[]; f.adj.push({year:S.league.season, amount:cash, note:'Cap sent to '+teamName(toTeam)}); }
    if(t){ t.adj=t.adj||[]; t.adj.push({year:S.league.season, amount:-cash, note:'Cap from '+teamName(fromTeam)}); }
    logIt(money(cash)+' of cap moved from '+teamName(fromTeam)+' to '+teamName(toTeam),
      {type:'cap', teams:[fromTeam,toTeam]});
  }
}
function ownedPlayers(teamId){ return teamPlayers(teamId).slice().sort((a,b)=> capHit(b,S.league.season)-capHit(a,S.league.season)); }
function ownedPicks(teamId){ return S.picks.filter(p=> p.ownerTeamId===teamId).sort((a,b)=>a.year-b.year||a.round-b.round); }

function retainYearOptions(playerId, sel){
  const p = byId(S.players, playerId), c = p && p.contract;
  const last = c ? c.startYear + c.years - 1 : S.league.season;
  const out = [];
  for(let y=S.league.season; y<=last; y++) out.push('<option value="'+y+'"'+(+sel===y?' selected':'')+'>'+y+'</option>');
  return out.join('') || '<option value="'+S.league.season+'">'+S.league.season+'</option>';
}
function retainPreview(playerId, pct, through){
  const p = byId(S.players, playerId); if(!p || !p.contract) return 0;
  const y = S.league.season;
  return (through==null || +through>=y) ? fixInc(grossHit(p,y)*(+pct||0)/100) : 0;
}

/* In a full auction the bar rises: first the ask, then whatever is leading. */
function auctionFloor(auc){
  return Math.max(askValue(auc.ask), auc.leading ? assetValue(auc.leading.offer) : 0);
}

ACT.submitOffer = ()=>{
  const o = ui.tmp.offer, auc = byId(S.auctions,o.aucId), me = actingTeam();
  const t = S.settings.trades;
  const floor = auctionFloor(auc);
  if(t.mustMeetAsk && assetValue(o) < floor)
    return toast(auc.leading ? 'That does not beat the leading offer of '+money(floor) : 'That falls short of the ask','bad');
  if(t.mustMeetAsk && !meetsSpecs(o, auc.ask))
    return toast('The ask names '+(auc.ask.specs||[]).map(specLabel).join(' and ')+' — your offer does not cover that','bad');
  const offer = {id:uid('o'), teamId:me, offer:{players:o.players,picks:o.picks,cash:+o.cash||0}, at:Date.now(), status:'pending'};
  auc.offers.unshift(offer);
  if(auc.status==='open'){
    auc.status='running'; auc.clock = newClock(t.auctionHours);
    offer.status='accepted'; auc.leading = {teamId:me, offer:offer.offer, at:Date.now()};
    auc.log.unshift({at:Date.now(), text:teamName(me)+' met the ask — clock started at '+t.auctionHours+'h'});
    notify('Clock started', teamName(me)+' met the ask for '+playerName(auc.playerId)+'. '+t.auctionHours+' hours to beat it.','warn');
    logIt(teamName(me)+' met the ask for '+playerName(auc.playerId),
      {type:'auction', teams:[me, auc.sellerTeamId], players:[auc.playerId]});
  } else {
    auc.log.unshift({at:Date.now(), text:teamName(me)+' put in a competing offer'});
    notify('Competing offer', teamName(me)+' is in on '+playerName(auc.playerId)+'. '+teamName(auc.sellerTeamId)+' has to accept it for it to take the lead.');
  }
  closeModal(); save(); render(); toast('Offer in','good');
};
ACT.acceptOffer = (d)=>{
  const auc = byId(S.auctions,d.id), off = byId(auc.offers,d.oid);
  if(S.settings.trades.ownerMustAccept && actingTeam()!==auc.sellerTeamId && !isCommish())
    return toast('Only '+teamName(auc.sellerTeamId)+' can accept','bad');
  auc.offers.forEach(o=>{ if(o.status==='accepted') o.status='superseded'; });
  off.status='accepted';
  auc.leading = {teamId:off.teamId, offer:off.offer, at:Date.now()};
  if(!auc.clock){ auc.status='running'; auc.clock=newClock(S.settings.trades.auctionHours); }
  const bumped = antiSnipe(auc.clock);
  auc.log.unshift({at:Date.now(), text:teamName(auc.sellerTeamId)+' accepted '+teamName(off.teamId)+"'s offer"+(bumped?' — clock reset to '+snipeLabel():'')});
  if(bumped) notify('Clock reset', 'A late offer on '+playerName(auc.playerId)+' pushed the clock back to '+snipeLabel()+'.','warn');
  save(); render(); toast(bumped?'Accepted — clock reset':'Accepted — now leading','good');
};
ACT.declineOffer = (d)=>{
  const auc = byId(S.auctions,d.id), off = byId(auc.offers,d.oid);
  off.status='declined'; auc.log.unshift({at:Date.now(), text:'Declined '+teamName(off.teamId)});
  save(); render();
};
function settleAuction(auc){
  if(auc.status!=='running') return;
  if(!auc.leading){ auc.status='cancelled'; auc.log.unshift({at:Date.now(), text:'Expired with no offer'}); return; }
  const buyer = auc.leading.teamId, seller = auc.sellerTeamId, p = byId(S.players, auc.playerId);
  if(p && p.contract){
    p.contract.teamId = buyer;
    if(auc.retain && +auc.retain.pct) applyRetention(p.id, seller, +auc.retain.pct, +auc.retain.through, 'pct');
  }
  moveAssets(buyer, seller, auc.leading.offer);
  auc.status='settled'; auc.settledAt=Date.now();
  auc.log.unshift({at:Date.now(), text:'Processed — '+playerName(auc.playerId)+' to '+teamName(buyer)});
  logIt('Auction closed: '+playerName(auc.playerId)+' → '+teamName(buyer),
    {type:'auction', teams:[buyer, seller], players:[auc.playerId].concat(auc.leading.offer.players||[])});
  notify('Auction closed', playerName(auc.playerId)+' goes to '+teamName(buyer)+'.','good');
}
ACT.cancelAuction = (d)=>{
  const auc = byId(S.auctions,d.id);
  auc.status='cancelled'; auc.log.unshift({at:Date.now(), text:'Pulled off the block'});
  save(); render(); toast('Pulled off the block');
};
ACT.forceSettle = (d)=>{ const auc=byId(S.auctions,d.id); auc.clock.remain=0; settleAuction(auc); save(); render(); };
ACT.setActAs = (d,el)=>{ ui.tmp.actAs = el.value; render(); };
